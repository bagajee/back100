<script>
let userName = "";
let selectedCategory = "";
let currentSubTitle = "";
let correctCount = 0;
const totalQuestions = 20;
let startTime, endTime;
let qData = {};

function goHome() {
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById('explanation-modal').classList.add('hidden');
  document.getElementById('home-screen').classList.remove('hidden');
}

function openSetup(catKey, subTitle) {
  selectedCategory = catKey;
  currentSubTitle = subTitle;
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById('explanation-modal').classList.add('hidden');
  document.getElementById('setup-screen').classList.remove('hidden');
  document.getElementById('setup-title').innerText = subTitle;
}

function startCountDown() {
  userName = document.getElementById("username").value.trim();
  if(!userName) { alert("이름을 입력해주세요!"); return; }
  
  correctCount = 0;
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById("countdown-screen").classList.remove("hidden");
  
  let count = 3;
  document.getElementById("countdown-text").innerText = count;
  let timer = setInterval(() => {
    count--;
    if(count > 0) {
      document.getElementById("countdown-text").innerText = count;
    } else {
      clearInterval(timer);
      document.getElementById("countdown-screen").classList.add("hidden");
      document.getElementById("quiz-screen").classList.remove("hidden");
      startTime = new Date().getTime();
      loadNextQuestion();
    }
  }, 1000);
}

function rand(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function shuffleAndPick(arr, correctAns, count = 4) {
  let filtered = arr.filter(item => item !== correctAns);
  filtered = [...new Set(filtered)];
  filtered.sort(() => Math.random() - 0.5);
  let result = [correctAns, ...filtered.slice(0, count - 1)];
  result.sort(() => Math.random() - 0.5);
  return result;
}

// 아날로그 시계 SVG 생성
function drawClockSVG(hour, minute) {
  let hAngle = ((hour % 12) + minute / 60) * 30;
  let mAngle = minute * 6;

  let hRad = (hAngle - 90) * Math.PI / 180;
  let mRad = (mAngle - 90) * Math.PI / 180;

  let hX = 100 + 42 * Math.cos(hRad);
  let hY = 100 + 42 * Math.sin(hRad);
  let mX = 100 + 65 * Math.cos(mRad);
  let mY = 100 + 65 * Math.sin(mRad);

  let numbersHTML = "";
  for(let i = 1; i <= 12; i++) {
    let nRad = (i * 30 - 90) * Math.PI / 180;
    let nx = 100 + 70 * Math.cos(nRad);
    let ny = 100 + 70 * Math.sin(nRad);
    numbersHTML += `<text x="${nx}" y="${ny + 5}" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">${i}</text>`;
  }

  return `
    <svg width="160" height="160" viewBox="0 0 200 200" style="margin: 10px auto 0 auto; display: block;">
      <circle cx="100" cy="100" r="92" fill="#ffffff" stroke="#047857" stroke-width="6"/>
      ${numbersHTML}
      <line x1="100" y1="100" x2="${hX}" y2="${hY}" stroke="#ef4444" stroke-width="7" stroke-linecap="round"/>
      <line x1="100" y1="100" x2="${mX}" y2="${mY}" stroke="#3b82f6" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="100" cy="100" r="6" fill="#1e293b"/>
    </svg>
  `;
}

function getNumKorean(n) {
  const tensSino = ["", "십", "이십", "삼십", "사십", "오십", "육십", "칠십", "팔십", "구십"];
  const onesSino = ["", "일", "이", "삼", "사", "오", "육", "칠", "팔", "구"];
  const tensNative = ["", "열", "스물", "서른", "마흔", "쉰", "예순", "일흔", "여덟", "아흔"];
  const onesNative = ["", "하나", "둘", "셋", "넷", "다섯", "여섯", "일곱", "여덟", "아홉"];

  let t = Math.floor(n / 10);
  let o = n % 10;
  
  let sino = tensSino[t] + onesSino[o];
  let native = tensNative[t] + onesNative[o];
  return { sino, native };
}

/* 문제 생성 엔진 (줄바꿈 정리) */
function generateSingleQuestion(cat) {
  let q = "", answer = "", options = [], exp = "";

  // ===== 1학년 1학기 =====
  if (cat === '1_1_1_1') {
    let type = rand(1, 2);
    if (type === 1) {
      let a = rand(1, 4);
      let b = rand(1, 5);
      let ans = a + b;
      q = `<div class="q-line">${a}와(과) ${b}를 모으면 얼마일까요?</div>`;
      answer = `${ans}`;
      exp = `${a}와 ${b}를 합치면 ${ans}가 됩니다.`;
      options = shuffleAndPick([answer, `${ans+1}`, `${ans-1 <= 0 ? ans+2 : ans-1}`, `${ans+2}`], answer, 4);
    } else {
      let total = rand(3, 9);
      let a = rand(1, total - 1);
      let ans = total - a;
      q = `<div class="q-line">${total}을 ${a}와(과) [  ](으)로 가를 수 있습니다.</div><div class="q-line">[  ]에 알맞은 수는?</div>`;
      answer = `${ans}`;
      exp = `${total}에서 ${a}를 빼면 ${ans}가 남습니다.`;
      options = shuffleAndPick([answer, `${ans+1}`, `${ans-1 <= 0 ? ans+2 : ans-1}`, `${ans+2}`], answer, 4);
    }

  } else if (cat === '1_1_1_2') {
    let a = rand(1, 4);
    let b = rand(1, 5);
    let ans = a + b;
    q = `<div class="q-line">다음 덧셈의 답은 얼마일까요?</div><div class="q-formula">${a} + ${b} = ?</div>`;
    answer = `${ans}`;
    exp = `${a}에 ${b}를 더하면 ${ans}가 됩니다.`;
    options = shuffleAndPick([answer, `${ans+1}`, `${ans-1 <= 0 ? ans+2 : ans-1}`, `${ans+2}`], answer, 4);

  } else if (cat === '1_1_1_3') {
    let a = rand(2, 9);
    let b = rand(1, a);
    let ans = a - b;
    q = `<div class="q-line">다음 뺄셈의 답은 얼마일까요?</div><div class="q-formula">${a} - ${b} = ?</div>`;
    answer = `${ans}`;
    exp = `${a}에서 ${b}를 빼면 ${ans}가 됩니다.`;
    options = shuffleAndPick([answer, `${ans+1}`, `${ans-1 < 0 ? ans+2 : ans-1}`, `${ans+2}`], answer, 4);

  } 
  // ===== 1학년 2학기 =====
  else if (cat === '1_2_1_1') {
    let num = rand(10, 99);
    let readObj = getNumKorean(num);
    let isSino = rand(0, 1) === 1;
    let correctRead = isSino ? readObj.sino : readObj.native;
    
    q = `<div class="q-line">숫자 <b>${num}</b>을(를) 바르게 읽은 것은?</div>`;
    answer = correctRead;
    exp = `${num}은(는) '${readObj.sino}' 또는 '${readObj.native}'(으)로 읽습니다.`;
    
    let w1 = getNumKorean((num + 10) % 90 + 10).sino;
    let w2 = getNumKorean((num + 1) % 90 + 10).native;
    let w3 = getNumKorean((num + 5) % 90 + 10).sino;
    options = shuffleAndPick([answer, w1, w2, w3], answer, 4);

  } else if (cat === '1_2_1_2') {
    let type = rand(1, 3);
    let num = rand(15, 95);
    if (type === 1) {
      q = `<div class="q-line">${num} 바로 <b>다음</b> 수는 무엇일까요?</div>`;
      answer = `${num + 1}`;
      exp = `${num}보다 1 큰 수는 ${num + 1}입니다.`;
    } else if (type === 2) {
      q = `<div class="q-line">${num} 바로 <b>앞</b>의 수는 무엇일까요?</div>`;
      answer = `${num - 1}`;
      exp = `${num}보다 1 작은 수는 ${num - 1}입니다.`;
    } else {
      q = `<div class="q-line">${num - 1}과 ${num + 1} <b>사이</b>에 있는 수는?</div>`;
      answer = `${num}`;
      exp = `${num - 1}과 ${num + 1} 사이의 수는 ${num}입니다.`;
    }
    options = shuffleAndPick([answer, `${parseInt(answer)+1}`, `${parseInt(answer)-1}`, `${parseInt(answer)+2}`], answer, 4);

  } else if (cat === '1_2_1_3') {
    let n1 = rand(10, 98);
    let n2 = rand(10, 99);
    while (n1 === n2) n2 = rand(10, 99);
    let isBig = rand(0, 1) === 1;
    let target = isBig ? Math.max(n1, n2) : Math.min(n1, n2);

    q = `<div class="q-line">두 수 (${n1}, ${n2}) 중</div><div class="q-line">더 <b>${isBig ? '큰' : '작은'}</b> 수는 무엇일까요?</div>`;
    answer = `${target}`;
    exp = `${n1}과 ${n2} 중 더 ${isBig ? '큰' : '작은'} 수는 ${target}입니다.`;
    options = shuffleAndPick([`${n1}`, `${n2}`], answer, 2);

  } else if (cat === '1_2_1_4') {
    let isEven = rand(0, 1) === 1;
    let correct = isEven ? rand(1, 20) * 2 : rand(0, 19) * 2 + 1;
    let wrong1 = isEven ? rand(0, 19) * 2 + 1 : rand(1, 20) * 2;
    let wrong2 = isEven ? rand(0, 19) * 2 + 1 : rand(1, 20) * 2;
    let wrong3 = isEven ? rand(0, 19) * 2 + 1 : rand(1, 20) * 2;

    q = `<div class="q-line">다음 중 <b>${isEven ? '짝수' : '홀수'}</b>는 어느 것일까요?</div>`;
    answer = `${correct}`;
    exp = `짝수는 2, 4, 6, 8, 10... 처럼 짝을 지을 수 있고, 홀수는 1, 3, 5, 7, 9... 처럼 1이 남습니다.`;
    options = shuffleAndPick([answer, `${wrong1}`, `${wrong2}`, `${wrong3}`], answer, 4);

  } else if (cat === '1_2_2_1') {
    let a = rand(1, 3), b = rand(1, 3), c = rand(1, 3);
    let ans = a + b + c;
    q = `<div class="q-line">세 수의 덧셈을 해보세요.</div><div class="q-formula">${a} + ${b} + ${c} = ?</div>`;
    answer = `${ans}`;
    exp = `앞에서부터 순서대로 더합니다. (${a} + ${b} = ${a+b}, ${a+b} + ${c} = ${ans})`;
    options = shuffleAndPick([answer, `${ans+1}`, `${ans-1 <= 0 ? ans+2 : ans-1}`, `${ans+2}`], answer, 4);

  } else if (cat === '1_2_2_2') {
    let a = rand(6, 9), b = rand(1, 3);
    let c = rand(1, a - b - 1);
    let ans = a - b - c;
    q = `<div class="q-line">세 수의 뺄셈을 해보세요.</div><div class="q-formula">${a} - ${b} - ${c} = ?</div>`;
    answer = `${ans}`;
    exp = `앞에서부터 순서대로 뺍니다. (${a} - ${b} = ${a-b}, ${a-b} - ${c} = ${ans})`;
    options = shuffleAndPick([answer, `${ans+1}`, `${ans-1 < 0 ? ans+2 : ans-1}`, `${ans+2}`], answer, 4);

  } else if (cat === '1_2_2_3') {
    let a = rand(1, 9);
    let ans = 10 - a;
    q = `<div class="q-line">10이 되도록 빈칸에 알맞은 수를 구하세요.</div><div class="q-formula">${a} + [  ] = 10</div>`;
    answer = `${ans}`;
    exp = `${a}와 ${ans}를 모으면 10이 됩니다.`;
    options = shuffleAndPick([answer, `${ans+1}`, `${ans-1 <= 0 ? ans+2 : ans-1}`, `${ans+2}`], answer, 4);

  } else if (cat === '1_2_2_4') {
    let a = rand(1, 9);
    let ans = 10 - a;
    q = `<div class="q-line">10에서 뺄셈을 해보세요.</div><div class="q-formula">10 - ${a} = ?</div>`;
    answer = `${ans}`;
    exp = `10에서 ${a}를 빼면 ${ans}가 됩니다.`;
    options = shuffleAndPick([answer, `${ans+1}`, `${ans-1 <= 0 ? ans+2 : ans-1}`, `${ans+2}`], answer, 4);

  } else if (cat === '1_2_2_5') {
    let a = rand(6, 9);
    let need = 10 - a;
    let b = rand(need + 1, 9);
    let rest = b - need;
    q = `<div class="q-line">${a} + ${b} 를 10을 만들어 계산합니다.</div><div class="q-formula">${a} + <b>[  ]</b> + ${rest} = 10 + ${rest} = ${10+rest}</div>`;
    answer = `${need}`;
    exp = `${a}에 ${need}를 더하면 10이 만들어집니다.`;
    options = shuffleAndPick([answer, `${need+1}`, `${need-1 <= 0 ? need+2 : need-1}`, `${need+2}`], answer, 4);

  } else if (cat === '1_2_2_6') {
    let a = rand(5, 9);
    let b = rand(10 - a + 1, 9);
    let ans = a + b;
    q = `<div class="q-line">다음 덧셈을 해보세요.</div><div class="q-formula">${a} + ${b} = ?</div>`;
    answer = `${ans}`;
    exp = `${a}와 ${b}를 더하면 ${ans}가 됩니다.`;
    options = shuffleAndPick([answer, `${ans+1}`, `${ans-1}`, `${ans+2}`], answer, 4);

  } else if (cat === '1_2_2_7') {
    let a = rand(1, 9), b = rand(1, a);
    let num1 = 10 + a;
    let ans = num1 - b;
    q = `<div class="q-line">다음 뺄셈을 해보세요.</div><div class="q-formula">${num1} - ${b} = ?</div>`;
    answer = `${ans}`;
    exp = `일의 자리끼리 빼면 (${a} - ${b} = ${a-b})이므로 답은 ${ans}입니다.`;
    options = shuffleAndPick([answer, `${ans+1}`, `${ans-1}`, `${ans+2}`], answer, 4);

  } else if (cat === '1_2_2_8') {
    let t1 = rand(1, 4), o1 = rand(0, 4);
    let t2 = rand(1, 4), o2 = rand(0, 4);
    let n1 = t1 * 10 + o1, n2 = t2 * 10 + o2;
    let ans = n1 + n2;
    q = `<div class="q-line">두 자리 수의 덧셈을 해보세요.</div><div class="q-formula">${n1} + ${n2} = ?</div>`;
    answer = `${ans}`;
    exp = `십의 자리는 십의 자리끼리, 일의 자리는 일의 자리끼리 더합니다.`;
    options = shuffleAndPick([answer, `${ans+10}`, `${ans-10}`, `${ans+1}`], answer, 4);

  } else if (cat === '1_2_2_9') {
    let t1 = rand(1, 8), o1 = rand(1, 9);
    let b = rand(1, o1);
    let n1 = t1 * 10 + o1;
    let ans = n1 - b;
    q = `<div class="q-line">다음 뺄셈을 해보세요.</div><div class="q-formula">${n1} - ${b} = ?</div>`;
    answer = `${ans}`;
    exp = `십의 자리는 그대로 두고 일의 자리끼리 뺍니다.`;
    options = shuffleAndPick([answer, `${ans+10}`, `${ans-1}`, `${ans+1}`], answer, 4);

  } else if (cat === '1_2_2_10') {
    let t1 = rand(2, 8), o1 = rand(1, 9);
    let t2 = rand(1, t1), o2 = rand(0, o1);
    let n1 = t1 * 10 + o1, n2 = t2 * 10 + o2;
    let ans = n1 - n2;
    q = `<div class="q-line">두 자리 수의 뺄셈을 해보세요.</div><div class="q-formula">${n1} - ${n2} = ?</div>`;
    answer = `${ans}`;
    exp = `십의 자리는 십의 자리끼리, 일의 자리는 일의 자리끼리 뺍니다.`;
    options = shuffleAndPick([answer, `${ans+10}`, `${ans-10}`, `${ans+1}`], answer, 4);

  } else if (cat === '1_2_3_1') {
    let h = rand(1, 12);
    let clockSVG = drawClockSVG(h, 0);
    q = `<div class="q-line">시계가 나타내는 시각은 몇 시일까요?</div>${clockSVG}`;
    answer = `${h}시`;
    exp = `짧은 바늘이 ${h}를 가리키고, 긴 바늘이 12를 가리키므로 ${h}시입니다.`;
    let hNext = (h % 12) + 1;
    let hPrev = h - 1 <= 0 ? 12 : h - 1;
    options = shuffleAndPick([answer, `${hNext}시`, `${hPrev}시`, `${h}시 30분`], answer, 4);

  } else if (cat === '1_2_3_2') {
    let h = rand(1, 12);
    let nextH = (h % 12) + 1;
    let clockSVG = drawClockSVG(h, 30);
    q = `<div class="q-line">시계가 나타내는 시각은 몇 시 몇 분일까요?</div>${clockSVG}`;
    answer = `${h}시 30분`;
    exp = `짧은 바늘이 ${h}와 ${nextH} 사이를 가리키고, 긴 바늘이 6을 가리키므로 ${h}시 30분입니다.`;
    options = shuffleAndPick([answer, `${nextH}시 30분`, `${h}시`, `${nextH}시`], answer, 4);
  }

  return { q, answer, opts: options, exp };
}

function generateQuestion(cat) {
  if (cat === '1_1_1_all') return generateSingleQuestion(`1_1_1_${rand(1, 3)}`);
  if (cat === '1_2_1_all') return generateSingleQuestion(`1_2_1_${rand(1, 4)}`);
  if (cat === '1_2_2_all') return generateSingleQuestion(`1_2_2_${rand(1, 10)}`);
  if (cat === '1_2_3_all') return generateSingleQuestion(`1_2_3_${rand(1, 2)}`);
  return generateSingleQuestion(cat);
}

function loadNextQuestion() {
  if (correctCount >= totalQuestions) {
    endTime = new Date().getTime();
    let totalTime = ((endTime - startTime) / 1000).toFixed(1);
    let now = new Date().toLocaleString('ko-KR');
    
    document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
    document.getElementById("result-screen").classList.remove("hidden");
    
    document.getElementById("result-text").innerHTML = `
      <b>[${currentSubTitle}]</b><br><br>
      👤 <b>이름:</b> ${userName}<br>
      ⏱️ <b>걸린 시간:</b> <span style="color:#10b981; font-size:1.2rem; font-weight:bold;">${totalTime}초</span><br>
      📅 <b>완료 시각:</b> <span style="font-size:0.85rem; color:#64748b;">${now}</span>
    `;
    return;
  }
  
  document.getElementById("progress").innerText = correctCount;
  document.getElementById("progress-fill").style.width = (correctCount / totalQuestions * 100) + "%";
  
  qData = generateQuestion(selectedCategory);
  
  document.getElementById("question-text").innerHTML = qData.q;
  
  let optsBox = document.getElementById("options-box");
  optsBox.innerHTML = "";
  optsBox.style.gridTemplateColumns = (qData.opts.length === 2) ? "1fr 1fr" : "1fr 1fr";
  
  qData.opts.forEach(val => {
    let btn = document.createElement("button");
    btn.innerHTML = val;
    btn.onclick = () => checkAnswer(val);
    optsBox.appendChild(btn);
  });
}

function checkAnswer(selected) {
  if (selected === qData.answer) {
    correctCount++;
    loadNextQuestion();
  } else {
    document.getElementById("explanation-text").innerHTML = `
      <div><b>💡 정답:</b> ${qData.answer}</div>
      <div style="margin-top:6px;">${qData.exp}</div>
    `;
    let nextBtn = document.getElementById("modal-next-btn");
    nextBtn.disabled = false;
    nextBtn.innerText = "다음";
    document.getElementById("explanation-modal").classList.remove("hidden");
  }
}

function triggerModalCountdown() {
  let nextBtn = document.getElementById("modal-next-btn");
  if(nextBtn.disabled) return;
  nextBtn.disabled = true;
  
  let count = 3;
  nextBtn.innerText = `3초 후 다음 문제... (${count})`;
  
  let timer = setInterval(() => {
    count--;
    if(count > 0) {
      nextBtn.innerText = `3초 후 다음 문제... (${count})`;
    } else {
      clearInterval(timer);
      document.getElementById("explanation-modal").classList.add("hidden");
      loadNextQuestion();
    }
  }, 1000);
}
</script>
