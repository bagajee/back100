<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>6학년 1학기 사회 - 민주화와 산업화</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      padding: 28px 20px;
      text-align: center;
      position: relative;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      background-color: #f1f5f9;
      color: #475569;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      background-color: #e2e8f0;
      color: #0f172a;
    }

    h1 {
      font-size: 20px;
      color: #1e293b;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .badge {
      display: inline-block;
      background-color: #e0f2fe;
      color: #0369a1;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 10px;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: all 0.2s ease;
      background-color: #fff;
    }

    input[type="text"]:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    .btn-primary {
      width: 100%;
      padding: 15px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .btn-primary:hover {
      background-color: #0369a1;
    }

    .btn-secondary {
      width: 100%;
      padding: 14px;
      background-color: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .btn-secondary:hover {
      background-color: #e2e8f0;
      color: #0f172a;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
    }

    .hidden {
      display: none !important;
    }

    #countdown-screen h2 {
      font-size: 80px;
      color: #0284c7;
      margin: 24px 0;
      font-weight: 800;
    }

    .question-box {
      font-size: 17px;
      font-weight: 700;
      color: #0f172a;
      margin: 16px 0 20px 0;
      word-break: keep-all;
      line-height: 1.5;
      text-align: left;
      background-color: #f8fafc;
      padding: 18px;
      border-radius: 14px;
      border-left: 5px solid #0284c7;
      min-height: 90px;
      display: flex;
      align-items: center;
    }

    .question-box u {
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-thickness: 2px;
      color: #e11d48;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .option-btn {
      width: 100%;
      padding: 14px 16px;
      background-color: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      color: #334155;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:hover {
      background-color: #f0f9ff;
      border-color: #38bdf8;
      color: #0369a1;
    }

    .explanation-box {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 18px;
      margin: 18px 0;
      text-align: left;
      font-size: 15px;
    }

    .explanation-box p {
      margin-bottom: 8px;
    }

    .explanation-box p:last-child {
      margin-bottom: 0;
    }

    .result-card {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 18px;
      margin: 20px 0;
      text-align: left;
    }

    .result-card p {
      font-size: 15px;
      color: #334155;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .result-card p:last-child {
      margin-bottom: 0;
    }

    .result-card strong {
      color: #0f172a;
    }

    .type-badge {
      font-size: 12px;
      background-color: #e2e8f0;
      color: #475569;
      padding: 2px 8px;
      border-radius: 6px;
      margin-left: 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 1. 시작 화면 -->
    <div id="start-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>
      
      <div class="badge">[사회 6-1] 민주화와 산업화</div>
      <h1>사회 퀴즈 도전</h1>

      <div class="form-group">
        <label for="user-name">이름</label>
        <input type="text" id="user-name" placeholder="이름을 입력하세요" autocomplete="off">
      </div>

      <div class="btn-group">
        <button class="btn-primary" onclick="prepareQuiz()">🚀 시작</button>
        <a href="social.html" class="btn-secondary">📚 단원선택</a>
      </div>
    </div>

    <!-- 2. 카운트다운 화면 -->
    <div id="countdown-screen" class="hidden">
      <p id="countdown-title" style="font-size: 18px; color: #64748b; font-weight: 600; margin-top: 10px;">준비하세요!</p>
      <h2 id="countdown-number">3</h2>
    </div>

    <!-- 3. 퀴즈 실행 화면 -->
    <div id="quiz-screen" class="hidden">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
        <span id="progress-display" style="font-size: 14px; font-weight: 700; color: #0284c7;">1 / 10</span>
      </div>

      <div class="question-box">
        <div>
          <span id="question-type-tag" class="type-badge">객관식</span>
          <div id="question-text" style="margin-top: 6px;"></div>
        </div>
      </div>

      <!-- 객관식 보기 영역 -->
      <div id="mc-container" class="options-grid"></div>

      <!-- 단답식 입력 영역 -->
      <div id="sa-container" class="hidden">
        <div class="form-group">
          <input type="text" id="user-answer" placeholder="정답을 입력하세요" autocomplete="off">
        </div>
        <button class="btn-primary" onclick="submitShortAnswer()">정답 제출</button>
      </div>
    </div>

    <!-- 4. 해설 화면 (오답 발생 시) -->
    <div id="explanation-screen" class="hidden">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
        <a href="social.html" class="nav-btn">📚 단원선택</a>
      </div>
      <h2 style="color: #e11d48; margin-bottom: 10px; font-size: 20px;">❌ 아쉽네요! 오답입니다.</h2>
      <div class="explanation-box">
        <p><strong>내가 입력한 답:</strong> <span id="exp-user-ans" style="color: #e11d48;"></span></p>
        <p><strong>정답:</strong> <span id="exp-correct-ans" style="color: #16a34a; font-weight: bold;"></span></p>
        <hr style="margin: 10px 0; border: none; border-top: 1px dashed #cbd5e1;">
        <p><strong>💡 [간단 해설]</strong></p>
        <p id="exp-text" style="margin-top: 6px; line-height: 1.5; color: #475569;"></p>
      </div>
      <button class="btn-primary" onclick="resetQuiz()">처음 단계로 돌아가기</button>
    </div>

    <!-- 5. 성공 결과 화면 -->
    <div id="result-screen" class="hidden">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>

      <h1 style="color: #16a34a; margin-bottom: 8px;">🎉 축하합니다! 🎉</h1>
      <p style="color: #475569; font-size: 16px; font-weight: 600;">10문제를 모두 올바르게 맞추셨습니다!</p>
      
      <div class="result-card">
        <p><strong>이름:</strong> <span id="res-name"></span></p>
        <p><strong>총 걸린시간:</strong> <span id="res-time"></span>초</p>
        <p><strong>현재 시간:</strong> <span id="res-date"></span></p>
      </div>

      <div class="btn-group">
        <button class="btn-primary" onclick="resetQuiz()">🔄 다시 도전</button>
        <a href="social.html" class="btn-secondary">📚 단원선택</a>
      </div>
    </div>
  </div>

  <script>
    // ----------------------------------------------------
    // 문제 데이터베이스 (총 40문항)
    // ----------------------------------------------------

    // 1. 지정 단답식 문제 (15문항)
    const quizDataSA = [
      {
        question: "1960년 3·15 부정 선거에 항거하여 서울과 전국에서 학생과 시민들이 일으킨 민주화 운동의 이름은 무엇인가요?",
        answer: ["4.19 혁명", "4.19혁명", "4·19 혁명", "4·19혁명", "419혁명"],
        explanation: "3·15 부정 선거에 항의하여 시민과 학생들의 힘으로 이승만 정권을 무너뜨린 민주화 운동은 4·19 혁명입니다."
      },
      {
        question: "1960년 3월 15일, 당시 정부가 집권 연장을 위해 불법적인 방법으로 치른 선거를 3·15 (     )라고 합니다. 빈칸에 들어갈 알맞은 말은 무엇인가요?",
        answer: ["부정 선거", "부정선거"],
        explanation: "1960년 3월 15일 정부는 정권을 연장하기 위해 불법적인 부정 선거를 저질렀습니다."
      },
      {
        question: "4·19 혁명과 5·18 민주화 운동은 우리나라의 (     ) 발전에 결정적인 밑거름이 되었습니다. 빈칸에 들어갈 알맞은 용어는 무엇인가요?",
        answer: ["민주주의"],
        explanation: "시민들과 학생들의 숭고한 희생과 노력은 대한민국 민주주의 발전의 밑거름이 되었습니다."
      },
      {
        question: "헌법을 바꿔 가며 세 차례나 대통령에 당선되었으나, 4·19 혁명으로 인해 대통령 자리에서 물러난 인물은 누구인가요?",
        answer: ["이승만"],
        explanation: "대한민국의 첫 번째 대통령이었던 이승만은 장기 집권을 이어가다 4·19 혁명으로 물러났습니다."
      },
      {
        question: "군사 정변을 일으켜 정권을 잡은 후 장기 집권을 하다가 부하에게 암살당하면서 막을 내린 대통령은 누구인가요?",
        answer: ["박정희"],
        explanation: "박정희는 정변으로 정권을 잡고 장기 집권을 이어가다가 부하에게 암살당하면서 막을 내렸습니다."
      },
      {
        question: "박정희 대통령 사후 또다시 정변을 일으켜 권력을 장악하고, 간선제로 대통령이 되어 언론을 통제했던 인물은 누구인가요?",
        answer: ["전두환"],
        explanation: "전두환과 일부 군인들은 또다시 정변을 일으켜 권력을 장악하고 민주화 운동을 탄압했습니다."
      },
      {
        question: "1980년 5월 전라남도 광주에서 시민과 학생들이 계엄군에 맞서 대규모로 벌인 민주화 운동의 이름은 무엇인가요?",
        answer: ["5.18 민주화 운동", "5.18민주화운동", "5·18 민주화 운동", "5·18민주화운동", "518민주화운동"],
        explanation: "1980년 5월 광주에서 계엄군의 폭력 진압에 맞서 민주주의를 지키기 위해 일어난 운동은 5·18 민주화 운동입니다."
      },
      {
        question: "1980년 5·18 민주화 운동 당시 전두환이 광주에 보내 시민과 학생들을 폭력적으로 진압했던 군대를 무엇이라고 하나요?",
        answer: ["계엄군"],
        explanation: "전두환은 계엄군을 광주에 보내 시민과 학생들을 폭력적으로 진압하고 도로와 신문·방송을 통제했습니다."
      },
      {
        question: "1987년 6월, 박종철 고문 사망 사건 등을 계기로 대통령 직선제를 요구하며 전국에서 일어난 민주화 항쟁은 무엇인가요?",
        answer: ["6월 민주 항쟁", "6월민주항쟁", "6월 민주항쟁"],
        explanation: "1987년 6월, 정부의 독재에 반대하고 대통령 직선제를 요구하며 전국에서 6월 민주 항쟁이 일어났습니다."
      },
      {
        question: "국민이 직접 투표를 통해 대통령을 뽑는 선거 제도를 무엇이라고 하나요?",
        answer: ["직선제", "대통령 직선제", "대통령직선제"],
        explanation: "국민이 직접 대통령을 선출하는 제도를 '직선제'라고 합니다."
      },
      {
        question: "우리나라 산업 발달 과정 중, 미국을 중심으로 식량과 물자를 지원받아 밀가루, 설탕, 면직물 산업이 발달했던 시기는 몇 년대인가요?",
        answer: ["1950년대", "1950년 대", "1950"],
        explanation: "1950년대에는 원조 물자를 바탕으로 밀가루, 설탕, 면직물 등 생활에 필요한 물건을 만드는 산업이 발달했습니다."
      },
      {
        question: "경제 개발 5개년 계획을 추진하고 신발, 가발, 의류 등 경공업 제품을 만들어 수출했던 시기는 몇 년대인가요?",
        answer: ["1960년대", "1960년 대", "1960"],
        explanation: "1960년대에는 경제 개발 5개년 계획과 함께 풍부한 노동력을 바탕으로 한 경공업 제품 수출이 활발했습니다."
      },
      {
        question: "철강, 조선, 석유 화학 등 중화학 공업을 집중적으로 발전시키고 대규모 공업 단지를 건설했던 시기는 몇 년대인가요?",
        answer: ["1970년대", "1970년 대", "1970"],
        explanation: "1970년대에는 높은 기술력이 필요한 철강, 조선, 석유 화학 등 중화학 공업이 발달했습니다."
      },
      {
        question: "자동차, 정밀 기계, 전자 제품 관련 산업이 발달하며 수출 규모가 크게 커졌던 시기는 몇 년대인가요?",
        answer: ["1980년대", "1980년 대", "1980"],
        explanation: "1980년대에는 자동차, 정밀 기계, 전자 제품 관련 산업이 발달하고 기술 연구 개발이 활발해졌습니다."
      },
      {
        question: "공업과 제조업을 중심으로 산업이 발달하여 경제가 성장하고 사회 구조 및 사람들의 생활 모습이 변화한 과정을 무엇이라고 하나요?",
        answer: ["산업화"],
        explanation: "공업 중심의 경제 성장과 생활 방식의 변화를 이끈 과정을 '산업화'라고 합니다."
      }
    ];

    // 2. 객관식 문제 (25문항)
    const quizDataMC = [
      {
        question: "4·19 혁명의 전개 과정에 대한 설명으로 <u>옳지 않은</u> 것은 무엇인가요?",
        options: ["마산 시위에 참여했던 고등학생 김주열의 시신이 발견되었다.", "서울을 비롯한 여러 도시에서 많은 학생과 시민이 시위를 벌였다.", "초등학생과 대학 교수까지 시위에 참여하였다.", "전두환이 계엄군을 보내 폭력적으로 진압하였다."],
        answer: 3,
        explanation: "계엄군을 보내 폭력적으로 진압한 것은 1980년 5·18 민주화 운동 당시입니다."
      },
      {
        question: "1960년 2월 28일, 정부의 부정 선거 움직임 및 통제에 항의하여 학생 시위가 처음 일어난 지역은 어디인가요?",
        options: ["대구", "광주", "부산", "대전"],
        answer: 0,
        explanation: "1960년 2월 28일 대구에서 정부에 항의하는 학생 시위가 가장 먼저 일어났습니다."

      document.getElementById('user-answer').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') submitShortAnswer();
      });
      
      document.getElementById('user-name').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') prepareQuiz();
      });

    function prepareQuiz() {
      userName = document.getElementById('user-name').value.trim();

      if (!userName) {
        alert("이름을 입력해주세요.");
        return;
      }

      // 1~7번: 객관식 25문제 중 랜덤 7개 추출
      const shuffledMC = [...quizDataMC].sort(() => Math.random() - 0.5);
      const selectedMC = shuffledMC.slice(0, 7);

      // 8~10번: 단답식 15문제 중 랜덤 3개 추출
      const shuffledSA = [...quizDataSA].sort(() => Math.random() - 0.5);
      const selectedSA = shuffledSA.slice(0, 3);

      // 총 10문항 조합
      currentQuestions = [...selectedMC, ...selectedSA];
      currentQuestionIndex = 0;

      showScreen('countdown-screen');
      document.getElementById('countdown-title').textContent = "준비하세요!";
      startCountdown(() => startQuiz());
    }

    function startCountdown(callback) {
      let count = 3;
      const countEl = document.getElementById('countdown-number');
      countEl.textContent = count;

      if (countdownTimer) clearInterval(countdownTimer);

      countdownTimer = setInterval(() => {
        count--;
        if (count > 0) {
          countEl.textContent = count;
        } else {
          clearInterval(countdownTimer);
          callback();
        }
      }, 1000);
    }

    function startQuiz() {
      showScreen('quiz-screen');
      startTime = new Date().getTime();
      loadQuestion();
    }

    function loadQuestion() {
      const q = currentQuestions[currentQuestionIndex];
      document.getElementById('progress-display').textContent = `${currentQuestionIndex + 1} / 10`;
      
      document.getElementById('question-text').innerHTML = q.question;

      const mcContainer = document.getElementById('mc-container');
      const saContainer = document.getElementById('sa-container');
      const tagEl = document.getElementById('question-type-tag');

      if (currentQuestionIndex < 7) {
        // 객관식
        tagEl.textContent = "객관식";
        tagEl.style.backgroundColor = "#e0f2fe";
        tagEl.style.color = "#0369a1";

        mcContainer.classList.remove('hidden');
        saContainer.classList.add('hidden');
        mcContainer.innerHTML = "";

        q.options.forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = `${idx + 1}. ${opt}`;
          btn.onclick = () => checkAnswer(idx);
          mcContainer.appendChild(btn);
        });
      } else {
        // 단답식
        tagEl.textContent = "단답식";
        tagEl.style.backgroundColor = "#fef3c7";
        tagEl.style.color = "#b45309";

        mcContainer.classList.add('hidden');
        saContainer.classList.remove('hidden');

        const inputEl = document.getElementById('user-answer');
        inputEl.value = "";
        inputEl.focus();
      }
    }

      } else {
        const userAnsStr = `${userChoice + 1}. ${q.options[userChoice]}`;
        const correctAnsStr = `${q.answer + 1}. ${q.options[q.answer]}`;
        handleIncorrect(userAnsStr, correctAnsStr, q.explanation);
      }
    }

    function submitShortAnswer() {
      const inputEl = document.getElementById('user-answer');
      const userAnsRaw = inputEl.value.trim();

      if (!userAnsRaw) {
        alert("정답을 입력해주세요.");
        return;
      }

      const q = currentQuestions[currentQuestionIndex];
      const normalizedUser = normalizeStr(userAnsRaw);
      
      const isCorrect = q.answer.some(ans => normalizeStr(ans) === normalizedUser);

      if (isCorrect) {
        nextQuestion();
      } else {
        const correctStr = q.answer[0];
        handleIncorrect(userAnsRaw, correctStr, q.explanation);
      }
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < 10) {
        loadQuestion();
      } else {
        showSuccess();
      }
    }

    function handleIncorrect(userAns, correctAns, exp) {
      document.getElementById('exp-user-ans').textContent = userAns;
      document.getElementById('exp-correct-ans').textContent = correctAns;
      document.getElementById('exp-text').textContent = exp || "해설이 없습니다.";
      showScreen('explanation-screen');
    }

    function showSuccess() {
      const endTime = new Date().getTime();
      const timeTaken = ((endTime - startTime) / 1000).toFixed(1);
      const now = new Date();
      
      const timeString = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

      document.getElementById('res-name').textContent = userName;
      document.getElementById('res-time').textContent = timeTaken;
      document.getElementById('res-date').textContent = timeString;

      showScreen('result-screen');
    }

    function resetQuiz() {
      if (countdownTimer) clearInterval(countdownTimer);
      document.getElementById('user-answer').value = "";
      showScreen('start-screen');
    }

    function showScreen(screenId) {
      const screens = ['start-screen', 'countdown-screen', 'quiz-screen', 'explanation-screen', 'result-screen'];
      screens.forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(screenId).classList.remove('hidden');
    }
  </script>
</body>
</html>
