<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>6학년 1학기 과학 - 1. 산과 염기</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #f0f9ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
      color: #1e3a8a;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
      position: relative;
    }
    .top-nav {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #f1f5f9;
      color: #334155;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
      border: 1px solid #cbd5e1;
    }
    .nav-btn:active {
      background-color: #e2e8f0;
    }
    h1 {
      font-size: 22px;
      color: #1d4ed8;
      margin-bottom: 8px;
    }
    .sub-title {
      font-size: 14px;
      color: #475569;
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #334155;
      font-size: 15px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #2563eb;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      box-sizing: border-box;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
    }
    .btn-secondary {
      background-color: #64748b;
      color: #ffffff;
    }
    .btn-success {
      background-color: #16a34a;
      color: #ffffff;
    }

    /* 퀴즈 화면 */
    #quiz-screen {
      display: none;
      text-align: left;
    }
    .progress-bar-container {
      width: 100%;
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #2563eb;
      transition: width 0.3s ease;
    }
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 14px;
      font-weight: bold;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    .badge-mcq { background: #dbeafe; color: #1e40af; }
    .badge-sa { background: #fef3c7; color: #92400e; }

    .question-box {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
      color: #0f172a;
      margin-bottom: 20px;
      min-height: 60px;
    }
    .question-box u {
      color: #dc2626;
      text-decoration-thickness: 2px;
    }
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      width: 100%;
      padding: 14px 16px;
      background-color: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      color: #334155;
      cursor: pointer;
      line-height: 1.4;
      transition: all 0.2s;
    }
    .option-btn:active {
      background-color: #dbeafe;
      border-color: #2563eb;
      color: #1e40af;
    }

    .sa-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 오답 화면 */
    #wrong-screen {
      display: none;
      background-color: #fef2f2;
      border: 2px solid #fca5a5;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .wrong-title {
      color: #dc2626;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .explanation-box {
      background: #ffffff;
      padding: 15px;
      border-radius: 10px;
      border-left: 4px solid #dc2626;
      text-align: left;
      font-size: 14px;
      color: #334155;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    /* 성공 화면 */
    #success-screen {
      display: none;
    }
    .trophy {
      font-size: 60px;
      margin-bottom: 10px;
    }
    .success-title {
      font-size: 22px;
      color: #15803d;
      font-weight: bold;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .result-info {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      margin-bottom: 20px;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .result-item:last-child {
      margin-bottom: 0;
    }
    .result-label {
      color: #475569;
      font-weight: bold;
    }
    .result-value {
      color: #16a34a;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- 1. 시작 화면 -->
    <div id="start-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>
      <h1>6학년 과학 퀴즈</h1>
      <p class="sub-title">1. 산과 염기</p>

      <div class="input-group">
        <label for="userName">이름을 입력하세요</label>
        <input type="text" id="userName" placeholder="예: 홍길동" autocomplete="off">
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="startQuiz()">시작</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

    <!-- 2. 퀴즈 진행 화면 -->
    <div id="quiz-screen">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      
      <div class="quiz-header">
        <span id="question-number">문제 1 / 10</span>
        <span id="question-type-badge" class="badge badge-mcq">객관식</span>
      </div>

      <div class="question-box" id="question-text"></div>

      <!-- 객관식 영역 -->
      <div class="options-container" id="options-container"></div>

      <!-- 단답식 영역 -->
      <div class="sa-container" id="sa-container" style="display: none;">
        <input type="text" id="sa-input" placeholder="정답 입력" onkeydown="if(event.key==='Enter') submitSAAnswer()">
        <button class="btn btn-primary" onclick="submitSAAnswer()">정답 제출</button>
      </div>
    </div>

    <!-- 3. 오답 화면 -->
    <div id="wrong-screen">
      <div class="wrong-title">❌ 틀렸습니다!</div>
      <div class="explanation-box">
        <strong>💡 간단 해설:</strong>
        <p id="explanation-text" style="margin-top: 6px;"></p>
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="returnToStart()">계속</button>
    </div>

    <!-- 4. 성공 축하 화면 -->
    <div id="success-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>

      <div class="trophy">🏆</div>
      <div class="success-title">축하합니다!<br>10문제를 모두 맞추셨습니다!</div>
      
      <div class="result-info">
        <div class="result-item">
          <span class="result-label">이름</span>
          <span class="result-value" id="result-name">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">총 걸린시간</span>
          <span class="result-value" id="result-time">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">현재 시간</span>
          <span class="result-value" id="result-date">-</span>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-success" onclick="returnToStart()">재도전</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

  </div>

  <script>
    // ----------------------------------------------------
    // 단답식 문제 은행 (정답: 분류 기준, 지시약, 산성 용액, 염기성 용액, 산성화)
    // ----------------------------------------------------
    const saBank = [
      {
        q: "용액의 관찰 결과를 바탕으로 용액을 객관적으로 무리 지어 나누기 위해 세우는 기준을 무엇이라고 하나요?",
        ans: "분류 기준",
        exp: "용액을 관찰한 결과를 바탕으로 명확한 분류 기준을 세워 용액을 분류할 수 있습니다."
      },
      {
        q: "용액을 분류할 때 관찰자의 주관이 아닌 객관적이고 명확하게 세워야 하는 기준을 무엇이라고 하나요?",
        ans: "분류 기준",
        exp: "용액을 분류하기 위해서는 누구나 인정할 수 있는 명확한 분류 기준이 필요합니다."
      },
      {
        q: "어떤 용액을 만났을 때 그 용액의 성질에 따라 색깔 변화가 나타나는 물질을 무엇이라고 하나요?",
        ans: "지시약",
        exp: "지시약은 용액의 성질(산성, 염기성)에 따라 색깔이 변하는 물질입니다."
      },
      {
        q: "리트머스 시험지, 페놀프탈레인 용액, 붉은 양배추 용액처럼 겉보기 성질이 비슷한 용액을 분류할 때 사용하는 물질을 무엇이라고 하나요?",
        ans: "지시약",
        exp: "지시약을 이용하면 겉보기 성질이 비슷한 용액의 성질을 쉽게 분류할 수 있습니다."
      },
      {
        q: "푸른색 리트머스 시험지를 붉은색으로 변하게 하고, 달걀 껍데기와 반응하여 기포를 발생시키는 용액을 무슨 용액이라고 하나요?",
        ans: "산성 용액",
        exp: "산성 용액은 푸른색 리트머스 시험지를 붉은색으로 변하게 하며 탄산 칼슘 성분을 녹입니다."
      },
      {
        q: "식초, 레몬즙, 오렌지주스, 콜라 등과 같이 페놀프탈레인 용액의 색깔을 변화시키지 않는 용액을 무슨 용액이라고 하나요?",
        ans: "산성 용액",
        exp: "산성 용액에서는 페놀프탈레인 용액의 색깔이 변하지 않고 그대로 유지됩니다."
      },
      {
        q: "붉은색 리트머스 시험지를 푸른색으로 변하게 하고, 페놀프탈레인 용액을 붉은색으로 변하게 하는 용액을 무슨 용액이라고 하나요?",
        ans: "염기성 용액",
        exp: "염기성 용액은 붉은색 리트머스 시험지를 푸른색으로, 페놀프탈레인 용액을 붉은색으로 변하게 합니다."
      },
      {
        q: "빨랫비누 물, 석회수, 묽은 수산화 나트륨 용액처럼 삶은 달걀흰자나 닭 가슴살을 녹이는 성질을 가진 용액을 무슨 용액이라고 하나요?",
        ans: "염기성 용액",
        exp: "염기성 용액은 단백질 성분을 녹이는 성질을 가지고 있습니다."
      },
      {
        q: "어떤 물질이 기존의 성질에서 점차 산성으로 변하는 현상을 무엇이라고 하나요?",
        ans: "산성화",
        exp: "산성화란 대기 오염, 화학 비료 사용 등으로 환경이나 물질이 점차 산성으로 변하는 것을 뜻합니다."
      },
      {
        q: "대기 오염으로 내리는 산성비나 토양, 바닷물이 점차 산성으로 변하는 현상을 통틀어 무엇이라고 하나요?",
        ans: "산성화",
        exp: "대기, 토양, 해양 산성화 등 환경이 점차 산성으로 변하는 현상을 산성화라고 합니다."
      }
    ];

    // ----------------------------------------------------
    // 객관식 문제 은행 (총 30개)
    // ----------------------------------------------------
    const mcqBank = [
      {
        q: "용액의 겉보기 성질을 알아볼 때 이용하는 방법으로 알맞은 것은 무엇인가요?",
        options: ["색깔, 냄새 등 감각기관이나 간단한 도구를 이용한다.", "용액을 맛보아 신맛과 쓴맛을 비교한다.", "용액에 불을 붙여 붙는지 확인한다.", "용액을 마셔보아 몸의 반응을 본다."],
        ans: 0,
        exp: "용액의 겉보기 성질은 색깔, 냄새, 단단하기 등 감각기관이나 간단한 도구를 이용해 알아냅니다."
      },
      {
        q: "다음 중 색깔이 없는 투명한 용액으로 알맞게 짝지어진 것은 무엇인가요?",
        options: ["석회수, 묽은 염산, 묽은 수산화 나트륨 용액", "식초, 레몬즙, 빨랫비누 물", "레몬즙, 빨랫비누 물, 석회수", "식초, 붉은 염산, 오렌지주스"],
        ans: 0,
        exp: "석회수, 묽은 염산, 묽은 수산화 나트륨 용액은 색깔이 없는 용액입니다."
      },
      {
        q: "용액을 흔들었을 때 5초 이상 거품이 유지되는 용액은 무엇인가요?",
        options: ["빨랫비누 물", "식초", "석회수", "묽은 염산"],
        ans: 0,
        exp: "빨랫비누 물은 흔들었을 때 5초 이상 거품이 유지되는 특징이 있습니다."
      },
      {
        q: "다음 중 투명하지 않은 용액으로 알맞게 짝지어진 것은 무엇인가요?",
        options: ["레몬즙, 빨랫비누 물", "식초, 석회수", "묽은 염산, 묽은 수산화 나트륨 용액", "식초, 묽은 염산"],
        ans: 0,
        exp: "레몬즙과 빨랫비누 물은 투명하지 않은 용액입니다."
      },
      {
        q: "겉보기 성질이 비슷한 용액을 분류할 때 정확하게 분류하기 위해 사용하는 것은 무엇인가요?",
        options: ["지시약", "돋보기", "자", "체온계"],
        ans: 0,
        exp: "지시약을 이용하면 겉보기 성질이 비슷한 용액의 성질을 분류할 수 있습니다."
      },
      {
        q: "다음 중 지시약의 종류로 <u>옳지 않은 것</u>은 무엇인가요?",
        options: ["비누 거품", "리트머스 시험지", "페놀프탈레인 용액", "붉은 양배추 용액"],
        ans: 0,
        exp: "리트머스 시험지, 페놀프탈레인 용액, 붉은 양배추 용액은 대표적인 지시약입니다."
      },
      {
        q: "푸른색 리트머스 시험지를 붉은색으로 변하게 하는 용액은 무엇인가요?",
        options: ["식초", "빨랫비누 물", "석회수", "묽은 수산화 나트륨 용액"],
        ans: 0,
        exp: "산성 용액인 식초는 푸른색 리트머스 시험지를 붉은색으로 변하게 합니다."
      },
      {
        q: "붉은색 리트머스 시험지를 푸른색으로 변하게 하는 용액은 무엇인가요?",
        options: ["석회수", "식초", "레몬즙", "묽은 염산"],
        ans: 0,
        exp: "염기성 용액인 석회수는 붉은색 리트머스 시험지를 푸른색으로 변하게 합니다."
      },
      {
        q: "페놀프탈레인 용액을 떨어뜨렸을 때 붉은색으로 변하는 용액은 무엇인가요?",
        options: ["묽은 수산화 나트륨 용액", "식초", "레몬즙", "묽은 염산"],
        ans: 0,
        exp: "페놀프탈레인 용액은 염기성 용액인 묽은 수산화 나트륨 용액을 만나면 붉은색으로 변합니다."
      },
      {
        q: "붉은 양배추 용액 지시약에 산성 용액을 넣었을 때 나타나는 색깔 변화는 무엇인가요?",

    // ----------------------------------------------------
    // 게임 상태 변수

    let userName = "";
    let quizQueue = [];
    let currentIdx = 0;
    let startTime = null;

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const wrongScreen = document.getElementById("wrong-screen");
    const successScreen = document.getElementById("success-screen");

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startQuiz() {
      const nameInput = document.getElementById("userName").value.trim();
      if (!nameInput) {
        alert("이름을 입력해 주세요!");
        return;
      }
      userName = nameInput;

      // 1-7번: 객관식 30개 중 7개 무작위 추출 및 보기 셔플
      // 8-10번: 단답식 10개 중 3개 무작위 추출
      const selectedMCQs = shuffle(mcqBank).slice(0, 7);
      const selectedSAs = shuffle(saBank).slice(0, 3);

      const formattedMCQs = selectedMCQs.map(item => {
        const correctText = item.options[item.ans];
        const shuffledOptions = shuffle(item.options);
        const newAnsIdx = shuffledOptions.indexOf(correctText);
        return {
          type: "MCQ",
          q: item.q,
          options: shuffledOptions,
          ans: newAnsIdx,
          exp: item.exp
        };
      });

      const formattedSAs = selectedSAs.map(item => ({
        type: "SA",
        q: item.q,
        ans: item.ans,
        exp: item.exp
      }));

      quizQueue = [...formattedMCQs, ...formattedSAs];
      currentIdx = 0;
      startTime = Date.now();

      startScreen.style.display = "none";
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "block";

      renderQuestion();
    }

    function renderQuestion() {
      const qData = quizQueue[currentIdx];
      
      const progressPercent = ((currentIdx + 1) / 10) * 100;
      document.getElementById("progress-bar").style.width = progressPercent + "%";
      document.getElementById("question-number").textContent = `문제 ${currentIdx + 1} / 10`;

      const badge = document.getElementById("question-type-badge");
      const optionsBox = document.getElementById("options-container");
      const saBox = document.getElementById("sa-container");

      document.getElementById("question-text").innerHTML = `${currentIdx + 1}. ${qData.q}`;

      if (qData.type === "MCQ") {
        badge.textContent = "객관식";
        badge.className = "badge badge-mcq";
        optionsBox.style.display = "flex";
        saBox.style.display = "none";

        optionsBox.innerHTML = "";
        qData.options.forEach((optText, idx) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = `${idx + 1}. ${optText}`;
          btn.onclick = () => checkMCQAnswer(idx);
          optionsBox.appendChild(btn);
        });
      } else {
        badge.textContent = "단답식";
        badge.className = "badge badge-sa";
        optionsBox.style.display = "none";
        saBox.style.display = "flex";

        const saInput = document.getElementById("sa-input");
        saInput.value = "";
        setTimeout(() => saInput.focus(), 100);
      }
    }

    function checkMCQAnswer(selectedIdx) {
      const qData = quizQueue[currentIdx];
      if (selectedIdx === qData.ans) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function submitSAAnswer() {
      const qData = quizQueue[currentIdx];
      const userInput = document.getElementById("sa-input").value.trim().replace(/\s+/g, "");
      const targetAns = qData.ans.replace(/\s+/g, "");

      if (!userInput) {
        alert("정답을 입력해주세요.");
        return;
      }

      if (userInput === targetAns) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < 10) {
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function showWrongScreen(explanationText) {
      quizScreen.style.display = "none";
      wrongScreen.style.display = "block";
      document.getElementById("explanation-text").textContent = explanationText;
    }

    function returnToStart() {
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "none";
      startScreen.style.display = "block";
    }

    function finishQuiz() {
      const endTime = Date.now();
      const elapsedSeconds = Math.round((endTime - startTime) / 1000);

      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      const dateStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

      document.getElementById("result-name").textContent = userName;
      document.getElementById("result-time").textContent = `${elapsedSeconds}초`;
      document.getElementById("result-date").textContent = dateStr;

      quizScreen.style.display = "none";
      successScreen.style.display = "block";
    }
