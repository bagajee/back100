<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>6학년 1학기 사회 - 평화 통일을 위한 노력</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      padding: 28px 20px;
      text-align: center;
      position: relative;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 8px;
    }

    .nav-btn-group {
      display: flex;
      gap: 6px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      background-color: #f1f5f9;
      color: #475569;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      background-color: #e2e8f0;
      color: #0f172a;
    }

    h1 {
      font-size: 20px;
      color: #1e293b;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .badge {
      display: inline-block;
      background-color: #e0f2fe;
      color: #0369a1;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 10px;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: all 0.2s ease;
      background-color: #fff;
    }

    input[type="text"]:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    .btn-primary {
      width: 100%;
      padding: 15px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .btn-primary:hover {
      background-color: #0369a1;
    }

    .btn-secondary {
      width: 100%;
      padding: 14px;
      background-color: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .btn-secondary:hover {
      background-color: #e2e8f0;
      color: #0f172a;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
    }

    .hidden {
      display: none !important;
    }

    #countdown-screen h2 {
      font-size: 80px;
      color: #0284c7;
      margin: 24px 0;
      font-weight: 800;
    }

    .question-box {
      font-size: 17px;
      font-weight: 700;
      color: #0f172a;
      margin: 16px 0 20px 0;
      word-break: keep-all;
      line-height: 1.5;
      text-align: left;
      background-color: #f8fafc;
      padding: 18px;
      border-radius: 14px;
      border-left: 5px solid #0284c7;
      min-height: 90px;
      display: flex;
      align-items: center;
    }

    /* 강조 밑줄 스타일 */
    .question-box u {
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-thickness: 2px;
      color: #e11d48;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .option-btn {
      width: 100%;
      padding: 14px 16px;
      background-color: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      color: #334155;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:hover {
      background-color: #f0f9ff;
      border-color: #38bdf8;
      color: #0369a1;
    }

    .explanation-box {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 18px;
      margin: 18px 0;
      text-align: left;
      font-size: 15px;
    }

    .explanation-box p {
      margin-bottom: 8px;
    }

    .explanation-box p:last-child {
      margin-bottom: 0;
    }

    .result-card {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 18px;
      margin: 20px 0;
      text-align: left;
    }

    .result-card p {
      font-size: 15px;
      color: #334155;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .result-card p:last-child {
      margin-bottom: 0;
    }

    .result-card strong {
      color: #0f172a;
    }

    .type-badge {
      font-size: 12px;
      background-color: #e2e8f0;
      color: #475569;
      padding: 2px 8px;
      border-radius: 6px;
      margin-left: 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 1. 시작 화면 -->
    <div id="start-screen">
      <div class="top-nav">
        <div class="nav-btn-group">
          <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
        </div>
      </div>
      <div class="badge">[사회 6-1] 1. 평화 통일을 위한 노력</div>
      <h1>스피드 퀴즈 10문항</h1>
      
      <div class="form-group">
        <label for="user-name">도전자 이름</label>
        <input type="text" id="user-name" placeholder="이름을 입력하세요" autocomplete="off">
      </div>

      <div class="btn-group">
        <button class="btn-primary" onclick="prepareQuiz()">🚀 시작하기</button>
        <a href="social.html" class="btn-secondary">📚 단원선택</a>
      </div>
    </div>

    <!-- 2. 카운트다운 화면 -->
    <div id="countdown-screen" class="hidden">
      <p id="countdown-title" style="font-size: 18px; color: #64748b; font-weight: 600; margin-top: 10px;">준비하세요!</p>
      <h2 id="countdown-number">3</h2>
    </div>

    <!-- 3. 퀴즈 실행 화면 -->
    <div id="quiz-screen" class="hidden">
      <div class="top-nav">
        <div class="nav-btn-group">
          <a href="../../index.html" class="nav-btn">🏠 홈</a>
          <a href="social.html" class="nav-btn">📚 단원</a>
        </div>
        <span id="progress-display" style="font-size: 14px; font-weight: 700; color: #0284c7;">1 / 10</span>
      </div>

      <div class="question-box">
        <div>
          <span id="question-type-tag" class="type-badge">객관식</span>
          <div id="question-text" style="margin-top: 6px;"></div>
        </div>
      </div>

      <!-- 객관식 보기 영역 -->
      <div id="mc-container" class="options-grid"></div>

      <!-- 단답식 입력 영역 -->
      <div id="sa-container" class="hidden">
        <div class="form-group">
          <input type="text" id="user-answer" placeholder="정답을 입력하세요" autocomplete="off">
        </div>
        <button class="btn-primary" onclick="submitShortAnswer()">정답 제출</button>
      </div>
    </div>

    <!-- 4. 해설 화면 (오답 발생 시) -->
    <div id="explanation-screen" class="hidden">
      <div class="top-nav">
        <div class="nav-btn-group">
          <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
          <a href="social.html" class="nav-btn">📚 단원선택</a>
        </div>
      </div>
      <h2 style="color: #e11d48; margin-bottom: 10px; font-size: 20px;">❌ 아쉽네요! 오답입니다.</h2>
      <div class="explanation-box">
        <p><strong>내가 입력한 답:</strong> <span id="exp-user-ans" style="color: #e11d48;"></span></p>
        <p><strong>정답:</strong> <span id="exp-correct-ans" style="color: #16a34a; font-weight: bold;"></span></p>
        <hr style="margin: 10px 0; border: none; border-top: 1px dashed #cbd5e1;">
        <p><strong>💡 [간단 해설]</strong></p>
        <p id="exp-text" style="margin-top: 6px; line-height: 1.5; color: #475569;"></p>
      </div>
      <button class="btn-primary" onclick="startReturnCountdown()">계속 (3초 후 처음으로)</button>
    </div>

    <!-- 5. 성공 결과 화면 -->
    <div id="result-screen" class="hidden">
      <div class="top-nav">
        <div class="nav-btn-group">
          <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
          <a href="social.html" class="nav-btn">📚 단원선택</a>
        </div>
      </div>
      <h1 style="color: #16a34a; margin-bottom: 8px;">🎉 미션 성공! 🎉</h1>
      <p style="color: #64748b; font-size: 15px;">10문제를 모두 올바르게 맞추셨습니다!</p>
      
      <div class="result-card">
        <p><strong>도전자:</strong> <span id="res-name"></span></p>
        <p><strong>완료한 시각:</strong> <span id="res-date"></span></p>
        <p><strong>총 걸린 시간:</strong> <span id="res-time"></span>초</p>
      </div>

      <div class="btn-group">
        <button class="btn-primary" onclick="resetQuiz()">🔄 다시 도전하기</button>
      </div>
    </div>
  </div>

  <script>
    // ----------------------------------------------------
    // 문제 데이터 베이스 (지정된 이미지 내용 기반 30문항)
    // ----------------------------------------------------

    // 단답식 문제 6문항 (정답 지정)
    const quizDataSA = [
      {
        question: "(     ) 이후 대한민국 정부와 북한 정권이 각각 수립되며 남한과 북한으로 분단되었습니다. 빈칸에 들어갈 알맞은 말은?",
        answer: ["광복"],
        explanation: "광복 이후 대한민국 정부와 북한 정권이 각각 수립되며 남한과 북한으로 분단되었습니다."
      },
      {
        question: "우리나라의 분단이 더욱 굳어지게 만든, 1950년에 일어난 전쟁의 이름은 무엇인가요?",
        answer: ["6.25 전쟁", "6.25전쟁", "6·25 전쟁", "6·25전쟁", "625전쟁"],
        explanation: "6·25 전쟁을 겪으면서 남한과 북한의 분단이 굳어졌습니다."
      },
      {
        question: "분단으로 인해 고향에 가지 못하는 실향민과 가족과 헤어진 사람들을 무엇이라고 하나요?",
        answer: ["이산 가족", "이산가족"],
        explanation: "고향에 가지 못하는 실향민과 가족과 헤어진 이산가족이 분단의 아픔을 안고 살아가고 있습니다."
      },
      {
        question: "6·25 전쟁 이후 한반도를 가로지르도록 설치된 경계선은 무엇인가요?",
        answer: ["휴전선"],
        explanation: "6·25 전쟁 이후 한반도를 가로지르는 휴전선이 설치되었습니다."
      },
      {
        question: "남북의 국어학자들이 통일된 국어사전을 만들기 위해 함께 편찬하고 있는 사업의 이름은 무엇인가요?",
        answer: ["겨레말 큰사전", "겨레말큰사전"],
        explanation: "남북의 국어학자들이 통일된 국어사전인 『겨레말큰사전』을 함께 만들고 있습니다."
      },
      {
        question: "1998년부터 추진되었으며, 이 지역 일대를 관광할 수 있는 상품을 개발하여 운영했던 경제 협력 사업 대상지는 어디인가요?",
        answer: ["금강산"],
        explanation: "1998년부터 금강산 관광 사업을 추진하여 금강산 일대를 관광할 수 있는 상품을 개발하여 운영했습니다."
      }
    ];

    // 객관식 문제 24문항
    const quizDataMC = [
      {
        question: "분단으로 인해 나타난 문제점으로 <u>올바르지 않은</u> 것은 무엇인가요?",
        options: ["이산가족 발생", "남북 간 언어 차이 심화", "국방비 지출 감소", "한반도 전쟁 긴장감 지속"],
        answer: 2,
        explanation: "분단으로 인해 많은 국방비를 지출하게 되는 문제가 발생하고 있습니다."
      },
      {
        question: "6·25 전쟁 당시 남쪽으로 피란을 왔다가 돌아가지 못한 사람들이 모여 살면서 만들어진 마을은 어디인가요?",
        options: ["아바이 마을", "오산 마을", "만월대 마을", "죽미령 마을"],
        answer: 0,
        explanation: "아바이 마을은 남쪽으로 피란을 왔다가 돌아가지 못한 사람들이 모여 살면서 만들어졌습니다."
      },
      {
        question: "백마고지 전투에서 희생된 군인들을 기리는 기념관과 기념비가 세워진 장소는 어디인가요?",
        options: ["장사 상륙 작전 전승 기념관", "백마고지 전적지", "오산 죽미령 평화 공원", "DMZ 평화의 길"],
        answer: 1,
        explanation: "백마고지 전적지에는 백마고지 전투에서 희생된 군인들을 기리는 기념관과 기념비가 세워져 있습니다."
      },
      {
        question: "장사 상륙 작전에 참전했던 이 사람들을 추모하기 위한 전승 기념관이 세워졌습니다. 빈칸에 알맞은 신분은?",
        options: ["학생", "외국인", "상인", "농민"],
        answer: 0,
        explanation: "장사 상륙 작전 전승 기념관은 학생 신분으로 참전했던 군인들을 추모하는 기념관입니다."
      },
      {
        question: "비무장 지대(DMZ) 일부 구간을 남과 북의 합의로 개방하여 사람들이 관람할 수 있도록 만든 곳은?",
        options: ["DMZ 평화의 길", "아바이 마을", "개성 공업 단지", "오산 죽미령 평화 공원"],
        answer: 0,
        explanation: "DMZ 평화의 길은 비무장 지대 일부 구간을 남과 북의 합의로 개방하여 관람할 수 있게 만든 장소입니다."
      },
      {
        question: "6·25 전쟁 중 국제 연합군(UN군)의 첫 전투가 벌어진 곳을 알리기 위해 만든 평화 공간은?",
        options: ["백마고지 전적지", "오산 죽미령 평화 공원", "장사 상륙 작전 기념관", "아바이 마을"],
        answer: 1,
        explanation: "오산 죽미령 평화 공원은 6·25 전쟁 중 국제 연합군의 첫 전투가 벌어진 곳입니다."
      },
      {
        question: "1972년 분단 이후 처음으로 통일 원칙에 관한 합의를 담아 발표한 성명은 무엇인가요?",
        options: ["7·4 남북 공동 성명", "남북 기본 합의서", "6·15 남북 공동 선언", "10·4 정상 선언"],
        answer: 0,
        explanation: "1972년 분단 이후 처음으로 통일 원칙에 관한 합의를 담은 『7·4 남북 공동 성명』을 발표했습니다."
      },
      {
        question: "1991년 남북 화해, 평화, 교류와 협력 등의 내용이 담겨 채택된 문서의 이름은 무엇인가요?",
        options: ["7·4 남북 공동 성명", "남북 기본 합의서", "겨레말큰사전", "평화 통일 선언서"],
        answer: 1,
        explanation: "1991년 남북 화해, 평화, 교류와 협력 등의 내용이 담긴 『남북 기본 합의서』를 채택했습니다."
      },
      {
        question: "남북 정상 회담 개최 연도와 장소의 연결로 <u>올바르지 않은</u> 것은 무엇인가요?",
        options: ["2000년 - 평양", "2007년 - 평양", "2018년 - 판문점과 평양", "1991년 - 서울"],
        answer: 3,
        explanation: "남북 정상 회담은 2000년과 2007년(평양), 2018년(판문점과 평양)에서 총 다섯 차례 열렸습니다."
      },
      {
        question: "평화 통일을 위한 사회·문화적 노력의 예로 <u>올바르지 않은</u> 것은 무엇인가요?",
        options: ["개성 만월대 남북 공동 발굴", "국제 대회 단일팀 구성", "개성 공업 단지 운영", "겨레말큰사전 함께 편찬"],
        answer: 2,
        explanation: "개성 공업 단지 운영 사업은 평화 통일을 위한 '경제적' 노력에 해당합니다."
      },
      {
        question: "남북의 학자들이 북한에서 함께 발굴한 대표적인 고려 시대 문화유산은 무엇인가요?",

    // 변수 선언
    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let userName = "";
    let startTime = 0;
    let countdownTimer = null;

    window.onload = function() {
      document.getElementById('user-answer').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') submitShortAnswer();
      });
      
      document.getElementById('user-name').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') prepareQuiz();
      });
    };

    function prepareQuiz() {
      userName = document.getElementById('user-name').value.trim();

      if (!userName) {
        alert("도전자 이름을 입력해주세요.");
        return;
      }

      // 1~7번: 객관식 24문제 중 랜덤 7개 추출
      const shuffledMC = [...quizDataMC].sort(() => Math.random() - 0.5);
      const selectedMC = shuffledMC.slice(0, 7);

      // 8~10번: 단답식 6문제 중 랜덤 3개 추출
      const shuffledSA = [...quizDataSA].sort(() => Math.random() - 0.5);
      const selectedSA = shuffledSA.slice(0, 3);

      // 총 10문항 조합 (1~7: 객관식, 8~10: 단답식)
      currentQuestions = [...selectedMC, ...selectedSA];
      currentQuestionIndex = 0;

      showScreen('countdown-screen');
      document.getElementById('countdown-title').textContent = "준비하세요!";
      startCountdown(() => startQuiz());
    }

    function startCountdown(callback) {
      let count = 3;
      const countEl = document.getElementById('countdown-number');
      countEl.textContent = count;

      if (countdownTimer) clearInterval(countdownTimer);

      countdownTimer = setInterval(() => {
        count--;
        if (count > 0) {
          countEl.textContent = count;
        } else {
          clearInterval(countdownTimer);
          callback();
        }
      }, 1000);
    }

    function startQuiz() {
      showScreen('quiz-screen');
      startTime = new Date().getTime();
      loadQuestion();
    }

    function loadQuestion() {
      const q = currentQuestions[currentQuestionIndex];
      document.getElementById('progress-display').textContent = `${currentQuestionIndex + 1} / 10`;
      
      // html 태그(<u> 등)가 올바르게 렌더링되도록 innerHTML 사용
      document.getElementById('question-text').innerHTML = q.question;

      const mcContainer = document.getElementById('mc-container');
      const saContainer = document.getElementById('sa-container');
      const tagEl = document.getElementById('question-type-tag');

      if (currentQuestionIndex < 7) {
        // 객관식 (1~7번)
        tagEl.textContent = "객관식";
        tagEl.style.backgroundColor = "#e0f2fe";
        tagEl.style.color = "#0369a1";

        mcContainer.classList.remove('hidden');
        saContainer.classList.add('hidden');
        mcContainer.innerHTML = "";

        q.options.forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = `${idx + 1}. ${opt}`;
          btn.onclick = () => checkAnswer(idx);
          mcContainer.appendChild(btn);
        });
      } else {
        // 단답식 (8~10번)
        tagEl.textContent = "단답식";
        tagEl.style.backgroundColor = "#fef3c7";
        tagEl.style.color = "#b45309";

        mcContainer.classList.add('hidden');
        saContainer.classList.remove('hidden');

        const inputEl = document.getElementById('user-answer');
        inputEl.value = "";
        inputEl.focus();
      }
    }

    function normalizeStr(str) {
      return str.toString().replace(/[\s\.\·\-\_]/g, '').toLowerCase();
    }

    function checkAnswer(userChoice) {
      const q = currentQuestions[currentQuestionIndex];
      if (userChoice === q.answer) {
        nextQuestion();
      } else {
        const userAnsStr = `${userChoice + 1}. ${q.options[userChoice]}`;
        const correctAnsStr = `${q.answer + 1}. ${q.options[q.answer]}`;
        handleIncorrect(userAnsStr, correctAnsStr, q.explanation);
      }
    }

    function submitShortAnswer() {
      const inputEl = document.getElementById('user-answer');
      const userAnsRaw = inputEl.value.trim();

      if (!userAnsRaw) {
        alert("정답을 입력해주세요.");
        return;
      }

      const q = currentQuestions[currentQuestionIndex];
      const normalizedUser = normalizeStr(userAnsRaw);
      
      const isCorrect = q.answer.some(ans => normalizeStr(ans) === normalizedUser);

      if (isCorrect) {
        nextQuestion();
      } else {
        const correctStr = q.answer[0];
        handleIncorrect(userAnsRaw, correctStr, q.explanation);
      }
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < 10) {
        loadQuestion();
      } else {
        showSuccess();
      }
    }

    function handleIncorrect(userAns, correctAns, exp) {
      document.getElementById('exp-user-ans').textContent = userAns;
      document.getElementById('exp-correct-ans').textContent = correctAns;
      document.getElementById('exp-text').textContent = exp || "해설이 없습니다.";
      showScreen('explanation-screen');
    }

    function startReturnCountdown() {
      showScreen('countdown-screen');
      document.getElementById('countdown-title').textContent = "시작 화면으로 돌아갑니다...";
      startCountdown(() => resetQuiz());
    }

    function showSuccess() {
      const endTime = new Date().getTime();
      const timeTaken = ((endTime - startTime) / 1000).toFixed(1);
      const now = new Date();
      
      const timeString = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

      document.getElementById('res-name').textContent = userName;
      document.getElementById('res-date').textContent = timeString;
      document.getElementById('res-time').textContent = timeTaken;

      showScreen('result-screen');
    }

    function resetQuiz() {
      if (countdownTimer) clearInterval(countdownTimer);
      document.getElementById('user-answer').value = "";
      showScreen('start-screen');
    }

    function showScreen(screenId) {
      const screens = ['start-screen', 'countdown-screen', 'quiz-screen', 'explanation-screen', 'result-screen'];
      screens.forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(screenId).classList.remove('hidden');
    }
  </script>
