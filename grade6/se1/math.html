<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>6학년 1학기 수학</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      word-break: keep-all;
    }
    body {
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #eef2f7;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: white;
      padding: 1.8rem 1.5rem;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 480px;
      text-align: center;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }
    .hidden { display: none !important; }
    
    /* 상단 네비게이션 헤더 */
    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .btn-home {
      width: auto !important;
      padding: 6px 12px !important;
      margin: 0 !important;
      background: #eef2f7 !important;
      color: #2c3e50 !important;
      font-size: 0.85rem !important;
      border-radius: 8px !important;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      border: 1px solid #cbd5e1 !important;
      font-weight: bold;
    }
    .btn-home:active { background: #dbe3ed !important; }

    button {
      width: 100%;
      padding: 12px 10px;
      margin: 4px 0;
      border: none;
      border-radius: 10px;
      background: #4a90e2;
      color: white;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      touch-action: manipulation;
    }
    button:active { transform: scale(0.98); }
    button.btn-sub { background: #27ae60; text-align: left; padding-left: 14px; }
    button.btn-total { background: #e67e22; text-align: left; padding-left: 14px; font-weight: 800; }
    button.btn-secondary { background: #95a5a6; margin-top: 10px; }
    button.btn-retry { background: #e74c3c; margin-top: 10px; }
    
    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 1.05rem;
      text-align: center;
      outline: none;
    }
    
    .chapter-title {
      margin: 18px 0 6px 0;
      text-align: left;
      color: #2c3e50;
      font-size: 1.05rem;
      border-bottom: 2px solid #eef2f7;
      padding-bottom: 4px;
    }
    
    .question-box {
      min-height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 15px 0 20px 0;
      gap: 8px;
    }
    .question-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      background: #e8f8f0; 
      color: #27ae60; 
      border: 1px solid #27ae60;
    }
    
    .question-main-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: #2c3e50;
      line-height: 1.5;
    }
    
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .options button {
      margin: 0;
      font-size: 1.05rem;
      padding: 16px 8px;
    }
    
    .progress-bar { background: #eee; height: 10px; border-radius: 5px; margin-bottom: 15px; overflow: hidden; }
    .progress-fill { background: #4a90e2; height: 100%; width: 0%; transition: width 0.3s; }

    /* 모달 (해설창) 스타일 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      text-align: left;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: #e74c3c;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .modal-body {
      font-size: 0.95rem;
      color: #333;
      line-height: 1.5;
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .frac {
      display: inline-block;
      vertical-align: middle;
      text-align: center;
      font-size: 0.95em;
      padding: 0 2px;
    }
    .frac > span { display: block; }
    .frac span.bottom { border-top: 1px solid black; }
  </style>
</head>

  <button class="btn-sub" onclick="openSetup('3-2', '2) (자연수)÷(자연수)의 몫을 소수로')">🟢 2) (자연수)÷(자연수)의 몫을 소수로</button>

  <button class="btn-sub" onclick="openSetup('6-2', '2) 직육면체의 겉넓이')">🟢 2) 직육면체의 겉넓이</button>

<script>
let userName = "";
let selectedCategory = "";
let currentSubTitle = "";
let correctCount = 0;
const totalQuestions = 20;
let startTime, endTime;
let qData = {};

function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

function goHome() {
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById('explanation-modal').classList.add('hidden');
  document.getElementById('home-screen').classList.remove('hidden');
}

function openSetup(catKey, subTitle) {
  selectedCategory = catKey;
  currentSubTitle = subTitle;
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById('explanation-modal').classList.add('hidden');
  document.getElementById('setup-screen').classList.remove('hidden');
  document.getElementById('setup-title').innerText = subTitle;
}

function startCountDown() {
  userName = document.getElementById("username").value.trim();
  if(!userName) { alert("이름을 입력해주세요!"); return; }
  
  correctCount = 0;
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById("countdown-screen").classList.remove("hidden");
  
  let count = 3;
  document.getElementById("countdown-text").innerText = count;
  let timer = setInterval(() => {
    count--;
    if(count > 0) {
      document.getElementById("countdown-text").innerText = count;
    } else {
      clearInterval(timer);
      document.getElementById("countdown-screen").classList.add("hidden");
      document.getElementById("quiz-screen").classList.remove("hidden");
      startTime = new Date().getTime();
      loadNextQuestion();
    }
  }, 1000);
}

// 분수 UI 표현 함수
function renderFracHTML(m, n, d) {
  let fracPart = `<div class="frac"><span>${n}</span><span class="bottom">${d}</span></div>`;
  if (m > 0) return `<span>${m}</span>` + fracPart;
  return fracPart;
}

function formatFracObj(num, denom) {
  let g = gcd(num, denom);
  num /= g; denom /= g;
  if (denom === 1) return `${num}`;
  if (num > denom) {
    let m = Math.floor(num / denom);
    let r = num % denom;
    return `${m}과 ${r}/${denom}`;
  }
  return `${num}/${denom}`;
}

// 개별 문제 생성기 (6학년 1학기)
function generateSingleQuestion(cat) {
  let q = "", answer = "", options = [], exp = "";
  
  if (cat === '1-1') { // (자연수)÷(자연수)
    let a = Math.floor(Math.random() * 8) + 2;
    let b = Math.floor(Math.random() * 8) + 2;
    while(a === b) b = Math.floor(Math.random() * 8) + 2;
    q = `<b>${a} ÷ ${b}</b>의 몫을 분수로 나타내면?`;
    answer = formatFracObj(a, b);
    exp = `${a} ÷ ${b}는 나누어지는 수 ${a}를 분자로, 나누는 수 ${b}를 분모로 쓰므로 ${a}/${b}(= ${answer})가 됩니다.`;
    
    options = [answer];
    while(options.length < 4) {
      let dummyA = Math.floor(Math.random() * 9) + 1;
      let dummyB = Math.floor(Math.random() * 9) + 1;
      let dummy = formatFracObj(dummyA, dummyB);
      if(!options.includes(dummy)) options.push(dummy);
    }
  } 
  else if (cat === '1-2') { // (분수)÷(자연수)
    let d = Math.floor(Math.random() * 6) + 3;
    let n = Math.floor(Math.random() * (d - 1)) + 1;
    let k = Math.floor(Math.random() * 4) + 2;
    q = `<div style="display:flex;align-items:center;justify-content:center;gap:4px;">${renderFracHTML(0, n, d)} <span>÷ ${k} = ?</span></div>`;
    answer = formatFracObj(n, d * k);
    exp = `분수의 나눗셈은 분모에 자연수를 곱하여 계산합니다. (${n}/${d} ÷ ${k} = ${n}/(${d}×${k}) = ${answer})`;
    
    options = [answer];
    while(options.length < 4) {
      let dummy = formatFracObj(n + Math.floor(Math.random()*3)+1, d * k);
      if(!options.includes(dummy)) options.push(dummy);
    }
  }
  else if (cat === '1-3') { // 분수의 곱셈으로 나타내기
    let d = Math.floor(Math.random() * 6) + 3;
    let n = Math.floor(Math.random() * (d - 1)) + 1;
    let k = Math.floor(Math.random() * 5) + 2;
    q = `<div style="display:flex;align-items:center;justify-content:center;gap:4px;">${renderFracHTML(0, n, d)} <span>÷ ${k} 를 분수의 곱셈 식으로 바르게 나타낸 것은?</span></div>`;
    answer = `${n}/${d} × 1/${k}`;
    exp = `÷ ${k}는 곱셈 식 × 1/${k}로 바꿀 수 있습니다.`;
    
    options = [answer, `${n}/${d} × ${k}`, `${d}/${n} × 1/${k}`, `${n}/${d} ÷ 1/${k}`];
  }
  else if (cat === '1-4') { // (대분수)÷(자연수)
    let d = Math.floor(Math.random() * 4) + 2;
    let n = Math.floor(Math.random() * (d - 1)) + 1;
    let m = Math.floor(Math.random() * 2) + 1;
    let k = Math.floor(Math.random() * 3) + 2;
    let totalN = m * d + n;
    
    q = `<div style="display:flex;align-items:center;justify-content:center;gap:4px;">${renderFracHTML(m, n, d)} <span>÷ ${k} = ?</span></div>`;
    answer = formatFracObj(totalN, d * k);
    exp = `대분수 ${m}과 ${n}/${d}를 가분수 ${totalN}/${d}로 바꾼 후, ÷ ${k}를 계산하면 ${answer}이(가) 됩니다.`;
    
    options = [answer];
    while(options.length < 4) {
      let dummy = formatFracObj(totalN + options.length, d * k);
      if(!options.includes(dummy)) options.push(dummy);
    }
  }
  else if (cat === '3-1') { // (소수)÷(자연수)
    let k = Math.floor(Math.random() * 7) + 2;
    let ansVal = (Math.floor(Math.random() * 89) + 11) / 10;
    let target = (ansVal * k).toFixed(1);
    q = `<b>${target} ÷ ${k}</b> 계산 결과는?`;
    answer = ansVal.toFixed(1);
    exp = `자연수의 나눗셈과 같은 방법으로 계산한 후 소수점 위치를 맞추면 ${answer}이(가) 됩니다.`;
    
    options = [answer, (ansVal + 0.2).toFixed(1), (ansVal * 10).toFixed(0), Math.max(0.1, ansVal - 0.3).toFixed(1)];
  }
  else if (cat === '3-2') { // (자연수)÷(자연수) 소수 몫
    let bList = [2, 4, 5, 8];
    let b = bList[Math.floor(Math.random() * bList.length)];
    let a = Math.floor(Math.random() * 15) + 1;
    while (a % b === 0) a = Math.floor(Math.random() * 15) + 1;
    
    q = `<b>${a} ÷ ${b}</b>의 몫을 소수로 나타내면?`;
    let ansVal = a / b;
    answer = ansVal.toString();
    exp = `${a}를 ${b}로 나누면 딱 떨어지지 않으므로 소수점 뒤에 0을 붙여 계속 나누면 ${answer}이(가) 됩니다.`;
    
    options = [answer, (ansVal + 0.15).toFixed(2), (ansVal + 1).toString(), Math.max(0.1, ansVal - 0.25).toFixed(2)];
  }
  else if (cat === '4-1') { // 비
    let a = Math.floor(Math.random() * 8) + 2;
    let b = Math.floor(Math.random() * 8) + 2;
    while(a === b) b = Math.floor(Math.random() * 8) + 2;
    
    let type = Math.floor(Math.random() * 3);
    if(type === 0) {
      q = `<b>${a} 대 ${b}</b>를 비로 나타내면?`;
      answer = `${a} : ${b}`;
    } else if(type === 1) {
      q = `<b>${b}에 대한 ${a}의 비</b>를 나타내면?`;
      answer = `${a} : ${b}`;
    } else {
      q = `<b>${a}와 ${b}의 비</b>를 나타내면?`;
      answer = `${a} : ${b}`;
    }
    exp = `'~에 대한' 수(기준량)가 뒤로 가고, 비교하는 양이 앞에 위치하여 ${answer}가 됩니다.`;
    options = [`${a} : ${b}`, `${b} : ${a}`, `${a} + ${b}`, `${a} × ${b}`];
  }
  else if (cat === '4-2') { // 비율
    let b = Math.floor(Math.random() * 5) + 2;
    let a = Math.floor(Math.random() * (b - 1)) + 1;
    q = `비 <b>${a} : ${b}</b>의 비율을 분수로 나타내면?`;
    answer = formatFracObj(a, b);
    exp = `비율 = (비교하는 양) ÷ (기준량) 이므로 ${a}/${b}(= ${answer})입니다.`;
    
    options = [answer, formatFracObj(b, a), formatFracObj(a, a+b), formatFracObj(b-a, b)];
  }
  else if (cat === '4-3') { // 백분율
    let pList = [10, 20, 25, 30, 40, 50, 60, 75, 80];
    let p = pList[Math.floor(Math.random() * pList.length)];
    let fracVal = p / 100;
    
    q = `비율 <b>${fracVal}</b>을 백분율(%)로 나타내면?`;
    answer = `${p}%`;
    exp = `백분율은 비율에 100을 곱한 값입니다. (${fracVal} × 100 = ${p}%)`;
    
    options = [`${p}%`, `${p/10}%`, `${p*10}%`, `${p+10}%`];
  }
  else if (cat === '6-1') { // 직육면체 부피
    let w = Math.floor(Math.random() * 5) + 2;
    let h = Math.floor(Math.random() * 5) + 2;
    let d = Math.floor(Math.random() * 5) + 2;
    
    q = `가로 <b>${w}cm</b>, 세로 <b>${h}cm</b>, 높이 <b>${d}cm</b>인 직육면체의 부피는?`;
    let val = w * h * d;
    answer = `${val}cm³`;
    exp = `직육면체의 부피 = 가로 × 세로 × 높이 = ${w} × ${h} × ${d} = ${val}cm³입니다.`;
    
    options = [answer, `${val + 10}cm³`, `${w+h+d}cm³`, `${(w*h+d)*2}cm³`];
  }
  else if (cat === '6-2') { // 직육면체 겉넓이
    let w = Math.floor(Math.random() * 4) + 2;
    let h = Math.floor(Math.random() * 4) + 2;
    let d = Math.floor(Math.random() * 4) + 2;
    
    q = `가로 <b>${w}cm</b>, 세로 <b>${h}cm</b>, 높이 <b>${d}cm</b>인 직육면체의 겉넓이는?`;
    let val = 2 * (w*h + h*d + w*d);
    answer = `${val}cm²`;
    exp = `직육면체의 겉넓이 = 2 × (${w}×${h} + ${h}×${d} + ${w}×${d}) = ${val}cm²입니다.`;
    
    options = [answer, `${w*h*d}cm²`, `${val + 12}cm²`, `${(w+h+d)*2}cm²`];
  }

  options.sort(() => Math.random() - 0.5);
  return { q, answer, opts: options, exp };
}

function generateQuestion(cat) {
  if (cat === '1-all') {
    let sub = ['1-1', '1-2', '1-3', '1-4'];
    return generateSingleQuestion(sub[Math.floor(Math.random() * sub.length)]);
  } else if (cat === '3-all') {
    let sub = ['3-1', '3-2'];
    return generateSingleQuestion(sub[Math.floor(Math.random() * sub.length)]);
  } else if (cat === '4-all') {
    let sub = ['4-1', '4-2', '4-3'];
    return generateSingleQuestion(sub[Math.floor(Math.random() * sub.length)]);
  } else if (cat === '6-all') {
    let sub = ['6-1', '6-2'];
    return generateSingleQuestion(sub[Math.floor(Math.random() * sub.length)]);
  } else {
    return generateSingleQuestion(cat);
  }
}

function loadNextQuestion() {
  if (correctCount >= totalQuestions) {
    endTime = new Date().getTime();
    let totalTime = ((endTime - startTime) / 1000).toFixed(1);
    let now = new Date().toLocaleString('ko-KR');
    
    document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
    document.getElementById("result-screen").classList.remove("hidden");
    
    document.getElementById("result-text").innerHTML = `
      <b>[${currentSubTitle}]</b> 완주 성공!<br><br>
      👤 <b>이름:</b> ${userName}<br>
      ⏱️ <b>소요 시간:</b> <span style="color:#27ae60; font-size:1.3rem; font-weight:bold;">${totalTime}초</span><br>
      📅 <b>완료 시각:</b> <span style="font-size:0.85rem; color:#7f8c8d;">${now}</span>
    `;
    return;
  }
  
  document.getElementById("progress").innerText = correctCount;
  document.getElementById("progress-fill").style.width = (correctCount / totalQuestions * 100) + "%";
  
  qData = generateQuestion(selectedCategory);
  document.getElementById("question-text").innerHTML = qData.q;
  
  let optsBox = document.getElementById("options-box");
  optsBox.innerHTML = "";
  qData.opts.forEach(val => {
    let btn = document.createElement("button");
    btn.innerHTML = val;
    btn.onclick = () => checkAnswer(val);
    optsBox.appendChild(btn);
  });
}

function checkAnswer(selected) {
  if (selected === qData.answer) {
    correctCount++;
    loadNextQuestion();
  } else {
    // 틀렸을 경우 해설창 띄우기
    document.getElementById("explanation-text").innerHTML = `<b>💡 정답: ${qData.answer}</b><br><br>${qData.exp}`;
    let nextBtn = document.getElementById("modal-next-btn");
    nextBtn.disabled = false;
    nextBtn.innerText = "다음";
    document.getElementById("explanation-modal").classList.remove("hidden");
  }
}

function triggerModalCountdown() {
  let nextBtn = document.getElementById("modal-next-btn");
  if(nextBtn.disabled) return;
  nextBtn.disabled = true;
  
  let count = 3;
  nextBtn.innerText = `3초 후 다음 문제... (${count})`;
  
  let timer = setInterval(() => {
    count--;
    if(count > 0) {
      nextBtn.innerText = `3초 후 다음 문제... (${count})`;
    } else {
      clearInterval(timer);
      document.getElementById("explanation-modal").classList.add("hidden");
      loadNextQuestion(); // 카운팅 증가 없이 다른 문제 제시
    }
  }, 1000);
}
</script>
