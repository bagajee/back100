<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>6학년 1학기 과학 - 4. 지구의 운동</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
      color: #1e293b;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
      position: relative;
    }
    .top-nav {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #f1f5f9;
      color: #334155;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
      border: 1px solid #cbd5e1;
    }
    .nav-btn:active {
      background-color: #e2e8f0;
    }
    h1 {
      font-size: 22px;
      color: #0f172a;
      margin-bottom: 8px;
    }
    .sub-title {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #334155;
      font-size: 15px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #2563eb;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      box-sizing: border-box;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
    }
    .btn-secondary {
      background-color: #64748b;
      color: #ffffff;
    }
    .btn-success {
      background-color: #16a34a;
      color: #ffffff;
    }

    /* 퀴즈 화면 */
    #quiz-screen {
      display: none;
      text-align: left;
    }
    .progress-bar-container {
      width: 100%;
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #2563eb;
      transition: width 0.3s ease;
    }
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 14px;
      font-weight: bold;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    .badge-mcq { background: #dbeafe; color: #1e40af; }
    .badge-sa { background: #fef3c7; color: #92400e; }

    .question-box {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
      color: #0f172a;
      margin-bottom: 20px;
      min-height: 60px;
    }
    .question-box u {
      color: #dc2626;
      text-decoration-thickness: 2px;
    }
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      width: 100%;
      padding: 14px 16px;
      background-color: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      color: #334155;
      cursor: pointer;
      line-height: 1.4;
      transition: all 0.2s;
    }
    .option-btn:active {
      background-color: #dbeafe;
      border-color: #2563eb;
      color: #1e40af;
    }

    .sa-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 오답 화면 */
    #wrong-screen {
      display: none;
      background-color: #fef2f2;
      border: 2px solid #fca5a5;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .wrong-title {
      color: #dc2626;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .explanation-box {
      background: #ffffff;
      padding: 15px;
      border-radius: 10px;
      border-left: 4px solid #dc2626;
      text-align: left;
      font-size: 14px;
      color: #334155;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    /* 성공 화면 */
    #success-screen {
      display: none;
    }
    .trophy {
      font-size: 60px;
      margin-bottom: 10px;
    }
    .success-title {
      font-size: 22px;
      color: #15803d;
      font-weight: bold;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .result-info {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      margin-bottom: 20px;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .result-item:last-child {
      margin-bottom: 0;
    }
    .result-label {
      color: #475569;
      font-weight: bold;
    }
    .result-value {
      color: #16a34a;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- 1. 시작 화면 -->
    <div id="start-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>
      <h1>6학년 과학 퀴즈</h1>
      <p class="sub-title">4. 지구의 운동</p>

      <div class="input-group">
        <label for="userName">이름을 입력하세요</label>
        <input type="text" id="userName" placeholder="예: 홍길동" autocomplete="off">
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="startQuiz()">시작</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

    <!-- 2. 퀴즈 진행 화면 -->
    <div id="quiz-screen">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      
      <div class="quiz-header">
        <span id="question-number">문제 1 / 10</span>
        <span id="question-type-badge" class="badge badge-mcq">객관식</span>
      </div>

      <div class="question-box" id="question-text"></div>

      <!-- 객관식 영역 -->
      <div class="options-container" id="options-container"></div>

      <!-- 단답식 영역 -->
      <div class="sa-container" id="sa-container" style="display: none;">
        <input type="text" id="sa-input" placeholder="정답 입력" onkeydown="if(event.key==='Enter') submitSAAnswer()">
        <button class="btn btn-primary" onclick="submitSAAnswer()">정답 제출</button>
      </div>
    </div>

    <!-- 3. 오답 화면 -->
    <div id="wrong-screen">
      <div class="wrong-title">❌ 틀렸습니다!</div>
      <div class="explanation-box">
        <strong>💡 간단 해설:</strong>
        <p id="explanation-text" style="margin-top: 6px;"></p>
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="returnToStart()">계속</button>
    </div>

    <!-- 4. 성공 축하 화면 -->
    <div id="success-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>

      <div class="trophy">🎉</div>
      <div class="success-title">축하합니다!<br>10문제를 모두 맞추셨습니다!</div>
      
      <div class="result-info">
        <div class="result-item">
          <span class="result-label">이름</span>
          <span class="result-value" id="result-name">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">총 걸린시간</span>
          <span class="result-value" id="result-time">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">현재 시간</span>
          <span class="result-value" id="result-date">-</span>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-success" onclick="returnToStart()">재도전</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

  </div>

  <script>
    // ----------------------------------------------------
    // 단답식 문제 은행 (정답: 자전, 자전축, 공전, 태양과 별) - 총 10문제
    // ----------------------------------------------------
    const saBank = [
      {
        q: "지구의 북극과 남극을 이은 가상의 직선을 지구의 무엇이라고 하나요?",
        ans: "자전축",
        exp: "지구의 북극과 남극을 잇는 가상의 직선을 자전축이라고 합니다."
      },
      {
        q: "지구가 자전축을 중심으로 하루에 한 바퀴씩 서쪽에서 동쪽으로 회전하는 것을 무엇이라고 하나요?",
        ans: "자전",
        exp: "지구가 자전축을 중심으로 하루에 한 바퀴씩 서쪽에서 동쪽으로 회전하는 것을 자전이라고 합니다."
      },
      {
        q: "지구가 서쪽에서 동쪽으로 자전하기 때문에 하루 동안 동쪽에서 서쪽으로 위치가 달라지는 하늘의 천체 대표 두 가지는 무엇과 무엇인가요? (예: AA과 BB)",
        ans: "태양과 별",
        exp: "지구의 자전으로 인해 하루 동안 태양과 별이 동쪽에서 서쪽으로 위치가 달라집니다."
      },
      {
        q: "지구가 태양을 중심으로 일 년에 한 바퀴씩 서쪽에서 동쪽 방향으로 회전하는 것을 무엇이라고 하나요?",
        ans: "공전",
        exp: "지구가 태양을 중심으로 일 년에 한 바퀴씩 회전하는 것을 공전이라고 합니다."
      },
      {
        q: "지구가 하루에 한 바퀴씩 자전하면서 우리나라에 낮과 밤이 하루에 한 번씩 번갈아 나타나게 만드는 지구의 운동은 무엇인가요?",
        ans: "자전",
        exp: "지구가 자전하면서 태양 빛을 받는 쪽은 낮, 반대편은 밤이 됩니다."
      },
      {
        q: "지구가 자전할 때 중심이 되는 가상의 축을 무엇이라고 하나요?",
        ans: "자전축",
        exp: "지구 자전의 중심이 되는 북극과 남극을 잇는 가상의 직선은 자전축입니다."
      },
      {
        q: "지구가 태양 주위를 회전함에 따라 계절별로 밤하늘에 보이는 별자리가 달라지게 하는 지구의 운동은 무엇인가요?",
        ans: "공전",
        exp: "지구가 공전하면서 계절에 따라 지구의 위치가 달라져 보이는 별자리가 달라집니다."
      },
      {
        q: "하루 동안 동쪽 하늘에서 출발하여 남쪽 하늘을 지나 서쪽 하늘로 위치가 달라지는 대표적인 두 천체는 무엇과 무엇인가요? (예: OO과 O)",
        ans: "태양과 별",
        exp: "하루 동안 태양과 별은 동쪽에서 남쪽을 지나 서쪽으로 위치가 달라집니다."
      },
      {
        q: "지구의 자전축을 중심으로 하루에 한 바퀴씩 서쪽에서 동쪽으로 빙글빙글 도는 지구의 움직임을 무엇이라고 하나요?",
        ans: "자전",
        exp: "지구가 하루에 한 바퀴씩 스스로 도는 운동을 자전이라고 합니다."
      },
      {
        q: "지구가 태양을 중심으로 1년에 한 바퀴씩 서쪽에서 동쪽으로 도는 운동을 무엇이라고 하나요?",
        ans: "공전",
        exp: "지구가 태양 주위를 1년에 한 바퀴씩 도는 운동을 공전이라고 합니다."
      }
    ];

    // ----------------------------------------------------
    // 객관식 문제 은행 - 총 30문제
    // ----------------------------------------------------
    const mcqBank = [
      {
        q: "하루 동안 태양과 별이 움직이는 위치 변화 순서로 알맞은 것은 무엇인가요?",
        options: ["동쪽 -> 남쪽 -> 서쪽", "서쪽 -> 남쪽 -> 동쪽", "남쪽 -> 동쪽 -> 서쪽", "동쪽 -> 서쪽 -> 남쪽"],
        ans: 0,
        exp: "하루 동안 태양과 별은 동쪽 하늘에서 남쪽 하늘을 지나 서쪽 하늘로 위치가 달라집니다."
      },
      {
        q: "하루 동안 태양의 위치가 달라지는 방향과 별의 위치가 달라지는 방향은 어떠한가요?",
        options: ["서로 같다.", "서로 반대이다.", "태양은 움직이지 않는다.", "계절에 따라 무작위로 바뀐다."],
        ans: 0,
        exp: "하루 동안 태양과 별의 위치가 달라지는 방향은 '동쪽에서 서쪽'으로 같습니다."
      },
      {
        q: "지구 역할놀이 모형실험에서 지구 역할을 맡은 사람이 회전해야 하는 방향은 어디인가요?",
        options: ["서쪽에서 동쪽", "동쪽에서 서쪽", "남쪽에서 북쪽", "북쪽에서 남쪽"],
        ans: 0,
        exp: "지구 역할을 맡은 사람은 지자의 자전 방향인 서쪽에서 동쪽으로 회전합니다."
      },
      {
        q: "지구 역할놀이 모형실험에서 지구 역할을 맡은 사람이 서쪽에서 동쪽으로 회전할 때, 관찰되는 전등과 별의 위치 변화는 어떠한가요?",
        options: ["동쪽에서 서쪽으로 위치가 달라진다.", "서쪽에서 동쪽으로 위치가 달라진다.", "위치가 전혀 변하지 않는다.", "위로 올라갔다가 아래로 떨어진다."],
        ans: 0,
        exp: "지구가 서쪽에서 동쪽으로 회전하면 상대적으로 전등과 별은 동쪽에서 서쪽으로 위치가 달라져 보입니다."
      },
      {
        q: "지구의 자전 방향으로 알맞은 것은 무엇인가요?",
        options: ["서쪽에서 동쪽", "동쪽에서 서쪽", "남쪽에서 북쪽", "북쪽에서 남쪽"],
        ans: 0,
        exp: "지구의 자전 방향은 서쪽에서 동쪽입니다."
      },
      {
        q: "지구가 자전하는 데 걸리는 시간은 얼마인가요?",
        options: ["하루에 한 바퀴", "일 년에 한 바퀴", "한 달에 한 바퀴", " 한 시간에 한 바퀴"],
        ans: 0,
        exp: "지구는 하루에 한 바퀴씩 자전합니다."
      },
      {
        q: "지구가 서쪽에서 동쪽으로 자전하기 때문에 나타나는 현상으로 알맞은 것은 무엇인가요?",
        options: ["하루 동안 태양과 별이 동쪽에서 서쪽으로 위치가 달라진다.", "계절에 따라 대표적인 별자리가 달라진다.", "일 년 동안 태양이 서쪽에서 동쪽으로 움직인다.", "지구의 자전축이 계속 바뀐다."],
        ans: 0,
        exp: "지구가 서쪽에서 동쪽으로 자전하기 때문에 태양과 별이 동쪽에서 서쪽으로 이동해 보입니다."
      },
      {
        q: "낮과 밤이 생기는 까닭 모형실험에서 '카메라가 전등을 향할 때'의 상태로 알맞은 것은 무엇인가요?",
        options: ["카메라가 전등 빛을 받아 화면이 밝아지며 '낮'이 된다.", "카메라가 빛을 받지 못해 '밤'이 된다.", "화면이 어두워진다.", "전등 빛이 꺼진다."],
        ans: 0,
        exp: "카메라가 전등을 향할 때는 빛을 받아 밝아지므로 '낮'을 나타냅니다."
      },
      {
        q: "낮과 밤이 생기는 까닭 모형실험에서 '카메라가 전등 반대편을 향할 때'의 상태로 알맞은 것은 무엇인가요?",
        options: ["카메라가 전등 빛을 받지 못해 화면이 어둡고 '밤'이 된다.", "빛을 받아서 화면이 매우 밝아진다.", "태양 빛을 받아 '낮'이 된다.", "카메라의 위치가 변하지 않는다."],
        ans: 0,
        exp: "카메라가 전등 반대편을 향할 때는 빛을 받지 못하므로 '밤'을 나타냅니다."
      },
      {
        q: "지구가 자전할 때 우리나라가 '낮'이 되는 까닭으로 알맞은 것은 무엇인가요?",

    // ----------------------------------------------------

    let userName = "";
    let quizQueue = [];
    let currentIdx = 0;
    let startTime = null;

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const wrongScreen = document.getElementById("wrong-screen");
    const successScreen = document.getElementById("success-screen");

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startQuiz() {
      const nameInput = document.getElementById("userName").value.trim();
      if (!nameInput) {
        alert("이름을 입력해 주세요!");
        return;
      }
      userName = nameInput;

      // 1-7번: 객관식 30개 중 7개 무작위 추출 및 보기 셔플
      // 8-10번: 단답식 10개 중 3개 무작위 추출
      const selectedMCQs = shuffle(mcqBank).slice(0, 7);
      const selectedSAs = shuffle(saBank).slice(0, 3);

      const formattedMCQs = selectedMCQs.map(item => {
        const correctText = item.options[item.ans];
        const shuffledOptions = shuffle(item.options);
        const newAnsIdx = shuffledOptions.indexOf(correctText);
        return {
          type: "MCQ",
          q: item.q,
          options: shuffledOptions,
          ans: newAnsIdx,
          exp: item.exp
        };
      });

      const formattedSAs = selectedSAs.map(item => ({
        type: "SA",
        q: item.q,
        ans: item.ans,
        exp: item.exp
      }));

      quizQueue = [...formattedMCQs, ...formattedSAs];
      currentIdx = 0;
      startTime = Date.now();

      startScreen.style.display = "none";
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "block";

      renderQuestion();
    }

    function renderQuestion() {
      const qData = quizQueue[currentIdx];
      
      const progressPercent = ((currentIdx + 1) / 10) * 100;
      document.getElementById("progress-bar").style.width = progressPercent + "%";
      document.getElementById("question-number").textContent = `문제 ${currentIdx + 1} / 10`;

      const badge = document.getElementById("question-type-badge");
      const optionsBox = document.getElementById("options-container");
      const saBox = document.getElementById("sa-container");

      document.getElementById("question-text").innerHTML = `${currentIdx + 1}. ${qData.q}`;

      if (qData.type === "MCQ") {
        badge.textContent = "객관식";
        badge.className = "badge badge-mcq";
        optionsBox.style.display = "flex";
        saBox.style.display = "none";

        optionsBox.innerHTML = "";
        qData.options.forEach((optText, idx) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = `${idx + 1}. ${optText}`;
          btn.onclick = () => checkMCQAnswer(idx);
          optionsBox.appendChild(btn);
        });
      } else {
        badge.textContent = "단답식";
        badge.className = "badge badge-sa";
        optionsBox.style.display = "none";
        saBox.style.display = "flex";

        const saInput = document.getElementById("sa-input");
        saInput.value = "";
        setTimeout(() => saInput.focus(), 100);
      }
    }

    function checkMCQAnswer(selectedIdx) {
      const qData = quizQueue[currentIdx];
      if (selectedIdx === qData.ans) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function submitSAAnswer() {
      const qData = quizQueue[currentIdx];
      const userInput = document.getElementById("sa-input").value.trim().replace(/\s+/g, "");
      const targetAns = qData.ans.replace(/\s+/g, "");

      if (!userInput) {
        alert("정답을 입력해주세요.");
        return;
      }

      if (userInput === targetAns) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < 10) {
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function showWrongScreen(explanationText) {
      quizScreen.style.display = "none";
      wrongScreen.style.display = "block";
      document.getElementById("explanation-text").textContent = explanationText;
    }

    function returnToStart() {
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "none";
      startScreen.style.display = "block";
    }

    function finishQuiz() {
      const endTime = Date.now();
      const elapsedSeconds = Math.round((endTime - startTime) / 1000);

      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      const dateStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

      document.getElementById("result-name").textContent = userName;
      document.getElementById("result-time").textContent = `${elapsedSeconds}초`;
      document.getElementById("result-date").textContent = dateStr;

      quizScreen.style.display = "none";
      successScreen.style.display = "block";
    }
