<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>6학년 1학기 사회 - 국가기관과 권력 분립</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      padding: 28px 20px;
      text-align: center;
      position: relative;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      background-color: #f1f5f9;
      color: #475569;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      background-color: #e2e8f0;
      color: #0f172a;
    }

    h1 {
      font-size: 20px;
      color: #1e293b;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .badge {
      display: inline-block;
      background-color: #e0f2fe;
      color: #0369a1;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 10px;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: all 0.2s ease;
      background-color: #fff;
    }

    input[type="text"]:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    .btn-primary {
      width: 100%;
      padding: 15px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .btn-primary:hover {
      background-color: #0369a1;
    }

    .btn-secondary {
      width: 100%;
      padding: 14px;
      background-color: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .btn-secondary:hover {
      background-color: #e2e8f0;
      color: #0f172a;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
    }

    .hidden {
      display: none !important;
    }

    #countdown-screen h2 {
      font-size: 80px;
      color: #0284c7;
      margin: 24px 0;
      font-weight: 800;
    }

    .question-box {
      font-size: 17px;
      font-weight: 700;
      color: #0f172a;
      margin: 16px 0 20px 0;
      word-break: keep-all;
      line-height: 1.5;
      text-align: left;
      background-color: #f8fafc;
      padding: 18px;
      border-radius: 14px;
      border-left: 5px solid #0284c7;
      min-height: 90px;
      display: flex;
      align-items: center;
    }

    .question-box u {
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-thickness: 2px;
      color: #e11d48;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .option-btn {
      width: 100%;
      padding: 14px 16px;
      background-color: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      color: #334155;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:hover {
      background-color: #f0f9ff;
      border-color: #38bdf8;
      color: #0369a1;
    }

    .explanation-box {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 18px;
      margin: 18px 0;
      text-align: left;
      font-size: 15px;
    }

    .explanation-box p {
      margin-bottom: 8px;
    }

    .explanation-box p:last-child {
      margin-bottom: 0;
    }

    .result-card {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 18px;
      margin: 20px 0;
      text-align: left;
    }

    .result-card p {
      font-size: 15px;
      color: #334155;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .result-card p:last-child {
      margin-bottom: 0;
    }

    .result-card strong {
      color: #0f172a;
    }

    .type-badge {
      font-size: 12px;
      background-color: #e2e8f0;
      color: #475569;
      padding: 2px 8px;
      border-radius: 6px;
      margin-left: 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 1. 시작 화면 -->
    <div id="start-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>
      
      <div class="badge">[사회 6-1] 2. 민주주의와 시민 참여</div>
      <h1>(2) 국가기관과 권력 분립</h1>

      <div class="form-group">
        <label for="user-name">이름</label>
        <input type="text" id="user-name" placeholder="이름을 입력하세요" autocomplete="off">
      </div>

      <div class="btn-group">
        <button class="btn-primary" onclick="prepareQuiz()">🚀 시작</button>
        <a href="social.html" class="btn-secondary">📚 단원선택</a>
      </div>
    </div>

    <!-- 2. 카운트다운 화면 -->
    <div id="countdown-screen" class="hidden">
      <p id="countdown-title" style="font-size: 18px; color: #64748b; font-weight: 600; margin-top: 10px;">준비하세요!</p>
      <h2 id="countdown-number">3</h2>
    </div>

    <!-- 3. 퀴즈 실행 화면 -->
    <div id="quiz-screen" class="hidden">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
        <span id="progress-display" style="font-size: 14px; font-weight: 700; color: #0284c7;">1 / 10</span>
      </div>

      <div class="question-box">
        <div>
          <span id="question-type-tag" class="type-badge">객관식</span>
          <div id="question-text" style="margin-top: 6px;"></div>
        </div>
      </div>

      <!-- 객관식 보기 영역 -->
      <div id="mc-container" class="options-grid"></div>

      <!-- 단답식 입력 영역 -->
      <div id="sa-container" class="hidden">
        <div class="form-group">
          <input type="text" id="user-answer" placeholder="정답을 입력하세요" autocomplete="off">
        </div>
        <button class="btn-primary" onclick="submitShortAnswer()">정답 제출</button>
      </div>
    </div>

    <!-- 4. 해설 화면 (오답 발생 시) -->
    <div id="explanation-screen" class="hidden">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
        <a href="social.html" class="nav-btn">📚 단원선택</a>
      </div>
      <h2 style="color: #e11d48; margin-bottom: 10px; font-size: 20px;">❌ 아쉽네요! 오답입니다.</h2>
      <div class="explanation-box">
        <p><strong>내가 입력한 답:</strong> <span id="exp-user-ans" style="color: #e11d48;"></span></p>
        <p><strong>정답:</strong> <span id="exp-correct-ans" style="color: #16a34a; font-weight: bold;"></span></p>
        <hr style="margin: 10px 0; border: none; border-top: 1px dashed #cbd5e1;">
        <p><strong>💡 [간단 해설]</strong></p>
        <p id="exp-text" style="margin-top: 6px; line-height: 1.5; color: #475569;"></p>
      </div>
      <button class="btn-primary" onclick="resetQuiz()">계속하기</button>
    </div>

    <!-- 5. 성공 결과 화면 -->
    <div id="result-screen" class="hidden">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>

      <h1 style="color: #16a34a; margin-bottom: 8px;">🎉 축하합니다! 🎉</h1>
      <p style="color: #475569; font-size: 16px; font-weight: 600;">10문제를 모두 올바르게 맞추셨습니다!</p>
      
      <div class="result-card">
        <p><strong>이름:</strong> <span id="res-name"></span></p>
        <p><strong>총 걸린시간:</strong> <span id="res-time"></span>초</p>
        <p><strong>현재 시간:</strong> <span id="res-date"></span></p>
      </div>

      <div class="btn-group">
        <button class="btn-primary" onclick="resetQuiz()">🔄 재도전</button>
        <a href="social.html" class="btn-secondary">📚 단원선택</a>
      </div>
    </div>
  </div>

  <script>
    // ----------------------------------------------------
    // 문제 데이터베이스 (총 40문항 - 이미지 내용 기반)
    // ----------------------------------------------------

    // 1. 지정 단답식 문제 (12문항)
    const quizDataSA = [
      {
        question: "국민의 자유와 권리를 보장하고 나라의 중요한 일을 결정하거나 집행하는 국회, 행정부, 법원 등을 통틀어 무엇이라고 하나요?",
        answer: ["국가기관", "국가 기관"],
        explanation: "국가기관은 국민의 자유와 권리를 보장하고 나라의 중요한 일을 해결하기 위해 일을 나누어 처리하는 기구입니다."
      },
      {
        question: "국민의 대표인 국회의원들이 모여 법을 만드는 일을 하는 국가기관은 어디인가요?",
        answer: ["국회"],
        explanation: "국회는 국민의 뜻에 따라 법을 만들고 고치며, 나랏일이 잘 운영되는지 감시하는 국가기관입니다."
      },
      {
        question: "국회에서 만든 법을 바탕으로 나라의 살림을 맡아 하는 국가기관은 어디인가요?",
        answer: ["행정부"],
        explanation: "행정부는 국회에서 만든 법을 바탕으로 국민의 안전하고 편리한 삶을 위해 나라 일을 집행합니다."
      },
      {
        question: "사람들 사이에 다툼이 생기거나 범죄가 발생했을 때 법에 따라 판결을 내리는 국가기관은 어디인가요?",
        answer: ["법원"],
        explanation: "법원은 재판을 통해 옳고 그름을 가리고, 법을 어긴 사람을 처벌하여 사회 질서를 유지합니다."
      },
      {
        question: "우리나라 국회의원은 국민의 선거로 선출되며, 임기는 몇 년인가요? (숫자와 단위를 함께 쓰세요)",
        answer: ["4년"],
        explanation: "국회의원은 국민의 대표로서 4년마다 선거로 선출됩니다."
      },
      {
        question: "국회가 행정부가 나라를 잘 운영하는지 확인하고 감독하며, 잘못된 일이 있으면 바로잡도록 요구하는 활동을 무엇이라고 하나요?",
        answer: ["국정 감사", "국정감사"],
        explanation: "국회는 국정 감사를 통해 행정부의 나랏일 집행 상태를 감독하고 바로잡도록 합니다."
      },
      {
        question: "국가가 한 해 동안 나라 살림에 쓰겠다고 계획한 돈의 계획서로, 국회에서 심의·확정하는 이것은 무엇인가요?",
        answer: ["예산안", "예산"],
        explanation: "행정부가 제출한 한 해 나라 살림 계획서인 예산안은 국회의 심의와 확정을 거쳐 집행됩니다."
      },
      {
        question: "국회에서 고위 공무원에 임명될 사람이 그 업무를 수행하는 데 적합한 능력을 갖췄는지 살펴보는 회의를 무엇이라고 하나요?",
        answer: ["인사 청문회", "인사청문회"],
        explanation: "인사 청문회는 고위 공무원의 공직 수행 능력과 자격을 검증하는 국회의 중요한 활동입니다."
      },
      {
        question: "대통령을 보좌하고 행정 각부를 관리하며, 대통령이 임무를 수행할 수 없는 상황이 생기면 임무를 대신하는 사람은 누구인가요?",
        answer: ["국무총리"],
        explanation: "국무총리는 행정부에서 대통령 다음가는 위치로, 대통령을 보좌하고 행정 각부를 총괄 관리합니다."
      },
      {
        question: "법원은 재판을 통해 옳고 그름을 가리고 법을 어긴 사람을 처벌함으로써 무엇을 유지하나요?",
        answer: ["사회 질서", "사회질서"],
        explanation: "법원은 공정한 재판을 통해 개인의 권리를 보호하고 사회 질서를 유지하는 국가기관입니다."
      },
      {
        question: "공정한 재판을 위해 하나의 사건에 대해 세 번까지 재판을 받을 수 있도록 두고 있는 제도를 무엇이라고 하나요?",
        answer: ["삼심 제도", "삼심제도"],
        explanation: "삼심 제도는 판결에 불복할 경우 세 번까지 재판을 청구하여 억울한 피해가 없도록 하는 제도입니다."
      },
      {
        question: "국가 권력을 국회, 행정부, 법원이 나누어 맡도록 헌법으로 정해 놓은 것을 무엇이라고 하나요?",
        answer: ["권력 분립", "권력분립"],
        explanation: "권력 분립은 특정 기관이 권력을 독점하는 것을 막고 국민의 자유와 권리를 보장하기 위한 원칙입니다."
      }
    ];

    // 2. 객관식 문제 (28문항)
    const quizDataMC = [
      {
        question: "국가기관이 없을 때 일어날 수 있는 일로 <u>옳지 않은 것</u>은 무엇인가요?",
        options: [
          "우리의 일상생활이 불편해질 것이다.",
          "국민의 안전을 위협받는 일이 생길 것이다.",
          "법을 지키지 않는 사람이 생길 것이다.",
          "국민의 자유와 권리가 완벽하게 보장될 것이다."
        ],
        answer: 3,
        explanation: "국가기관이 없으면 법이 지켜지지 않고 안전이 위협받아 국민의 자유와 권리를 보호할 수 없습니다."
      },
      {
        question: "국가기관이 필요한 까닭으로 <u>옳지 않은 것</u>은 무엇인가요?",
        options: [
          "나라의 다양한 문제를 해결하기 위해서이다.",
          "나라의 중요한 일을 결정하기 위해서이다.",
          "특정 개인에게 권력을 몰아주기 위해서이다.",
          "국민의 안전과 행복을 위해서이다."
        ],
        answer: 2,
        explanation: "국가기관은 특정 개인의 권력을 위한 것이 아니라 국민의 안전과 행복, 나라의 중요한 일을 해결하기 위해 필요합니다."
      },
      {
        question: "국가기관의 종류와 역할 연결이 올바른 것은 무엇인가요?",
        options: [
          "국회 - 법에 따라 판결을 내린다.",
          "행정부 - 법을 바탕으로 나라의 일을 집행한다.",
          "법원 - 법을 만드는 일을 한다.",
          "국회 - 재판을 통해 범죄자를 처벌한다."
        ],
        answer: 1,
        explanation: "국회는 법을 만들고, 행정부는 법에 따라 일을 집행하며, 법원은 법에 따라 판결을 내립니다."
      },
      {
        question: "국회에 대한 설명으로 <u>옳지 않은 것</u>은 무엇인가요?",
        options: [
          "법을 만드는 국가기관이다.",
          "나랏일이 잘 운영되는지 감시하고 견제한다.",
          "국민을 대신해 나라의 중요한 일을 결정한다.",
          "행정 각부를 관리하고 재판을 집행한다."
        ],
        answer: 3,
        explanation: "행정 각부를 관리하는 것은 국무총리/행정부이며, 재판을 하는 곳은 법원입니다."
      },
      {
        question: "국회의원에 대한 설명으로 알맞은 것은 무엇인가요?",
        options: [
          "대통령이 직접 지명하여 뽑는다.",
          "우리나라에서는 4년마다 선거로 선출된다.",
          "법원에서 재판을 담당하는 사람들이다.",
          "행정 각부의 장을 임명하는 책임을 가진다."
        ],
        answer: 1,
        explanation: "국회의원은 국민을 대신하는 대표로, 4년마다 국민의 선거로 선출됩니다."
      },
      {
        question: "국회에서 하는 일로 <u>옳지 않은 것</u>은 무엇인가요?",

    // 상태 관리 변수
    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let userName = "";
    let startTime = 0;
    let countdownTimer = null;

    window.onload = function() {
      document.getElementById('user-answer').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') submitShortAnswer();
      });
      
      document.getElementById('user-name').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') prepareQuiz();
      });
    };

    function prepareQuiz() {
      userName = document.getElementById('user-name').value.trim();

      if (!userName) {
        alert("이름을 입력해주세요.");
        return;
      }

      // 1~7번: 객관식 28문제 중 랜덤 7개 추출
      const shuffledMC = [...quizDataMC].sort(() => Math.random() - 0.5);
      const selectedMC = shuffledMC.slice(0, 7);

      // 8~10번: 단답식 12문제 중 랜덤 3개 추출
      const shuffledSA = [...quizDataSA].sort(() => Math.random() - 0.5);
      const selectedSA = shuffledSA.slice(0, 3);

      // 총 10문항 결합
      currentQuestions = [...selectedMC, ...selectedSA];
      currentQuestionIndex = 0;

      showScreen('countdown-screen');
      document.getElementById('countdown-title').textContent = "준비하세요!";
      startCountdown(() => startQuiz());
    }

    function startCountdown(callback) {
      let count = 3;
      const countEl = document.getElementById('countdown-number');
      countEl.textContent = count;

      if (countdownTimer) clearInterval(countdownTimer);

      countdownTimer = setInterval(() => {
        count--;
        if (count > 0) {
          countEl.textContent = count;
        } else {
          clearInterval(countdownTimer);
          callback();
        }
      }, 1000);
    }

    function startQuiz() {
      showScreen('quiz-screen');
      startTime = new Date().getTime();
      loadQuestion();
    }

    function loadQuestion() {
      const q = currentQuestions[currentQuestionIndex];
      document.getElementById('progress-display').textContent = `${currentQuestionIndex + 1} / 10`;
      
      document.getElementById('question-text').innerHTML = q.question;

      const mcContainer = document.getElementById('mc-container');
      const saContainer = document.getElementById('sa-container');
      const tagEl = document.getElementById('question-type-tag');

      if (currentQuestionIndex < 7) {
        // 객관식 (1~7번)
        tagEl.textContent = "객관식";
        tagEl.style.backgroundColor = "#e0f2fe";
        tagEl.style.color = "#0369a1";

        mcContainer.classList.remove('hidden');
        saContainer.classList.add('hidden');
        mcContainer.innerHTML = "";

        q.options.forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = `${idx + 1}. ${opt}`;
          btn.onclick = () => checkAnswer(idx);
          mcContainer.appendChild(btn);
        });
      } else {
        // 단답식 (8~10번)
        tagEl.textContent = "단답식";
        tagEl.style.backgroundColor = "#fef3c7";
        tagEl.style.color = "#b45309";

        mcContainer.classList.add('hidden');
        saContainer.classList.remove('hidden');

        const inputEl = document.getElementById('user-answer');
        inputEl.value = "";
        inputEl.focus();
      }
    }

    function normalizeStr(str) {
      return str.toString().replace(/[\s\.\·\-\_]/g, '').toLowerCase();
    }

    function checkAnswer(userChoice) {
      const q = currentQuestions[currentQuestionIndex];
      if (userChoice === q.answer) {
        nextQuestion();
      } else {
        const userAnsStr = `${userChoice + 1}. ${q.options[userChoice]}`;
        const correctAnsStr = `${q.answer + 1}. ${q.options[q.answer]}`;
        handleIncorrect(userAnsStr, correctAnsStr, q.explanation);
      }
    }

    function submitShortAnswer() {
      const inputEl = document.getElementById('user-answer');
      const userAnsRaw = inputEl.value.trim();

      if (!userAnsRaw) {
        alert("정답을 입력해주세요.");
        return;
      }

      const q = currentQuestions[currentQuestionIndex];
      const normalizedUser = normalizeStr(userAnsRaw);
      
      const isCorrect = q.answer.some(ans => normalizeStr(ans) === normalizedUser);

      if (isCorrect) {
        nextQuestion();
      } else {
        const correctStr = q.answer[0];
        handleIncorrect(userAnsRaw, correctStr, q.explanation);
      }
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < 10) {
        loadQuestion();
      } else {
        showSuccess();
      }
    }

    function handleIncorrect(userAns, correctAns, exp) {
      document.getElementById('exp-user-ans').textContent = userAns;
      document.getElementById('exp-correct-ans').textContent = correctAns;
      document.getElementById('exp-text').textContent = exp || "해설이 없습니다.";
      showScreen('explanation-screen');
    }

    function showSuccess() {
      const endTime = new Date().getTime();
      const timeTaken = ((endTime - startTime) / 1000).toFixed(1);
      const now = new Date();
      
      const timeString = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

      document.getElementById('res-name').textContent = userName;
      document.getElementById('res-time').textContent = timeTaken;
      document.getElementById('res-date').textContent = timeString;

      showScreen('result-screen');
    }

    function resetQuiz() {
      if (countdownTimer) clearInterval(countdownTimer);
      document.getElementById('user-answer').value = "";
      showScreen('start-screen');
    }

    function showScreen(screenId) {
      const screens = ['start-screen', 'countdown-screen', 'quiz-screen', 'explanation-screen', 'result-screen'];
      screens.forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(screenId).classList.remove('hidden');
    }
  </script>
</body>
</html>
