<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>6학년 1학기 과학 - 2. 물체의 운동</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #f0f9ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
      color: #1e3a8a;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
      position: relative;
    }
    .top-nav {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #f1f5f9;
      color: #334155;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
      border: 1px solid #cbd5e1;
    }
    .nav-btn:active {
      background-color: #e2e8f0;
    }
    h1 {
      font-size: 22px;
      color: #1d4ed8;
      margin-bottom: 8px;
    }
    .sub-title {
      font-size: 14px;
      color: #475569;
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #334155;
      font-size: 15px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #2563eb;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      box-sizing: border-box;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
    }
    .btn-secondary {
      background-color: #64748b;
      color: #ffffff;
    }
    .btn-success {
      background-color: #16a34a;
      color: #ffffff;
    }

    /* 퀴즈 화면 */
    #quiz-screen {
      display: none;
      text-align: left;
    }
    .progress-bar-container {
      width: 100%;
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #2563eb;
      transition: width 0.3s ease;
    }
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 14px;
      font-weight: bold;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    .badge-mcq { background: #dbeafe; color: #1e40af; }
    .badge-sa { background: #fef3c7; color: #92400e; }

    .question-box {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
      color: #0f172a;
      margin-bottom: 20px;
      min-height: 60px;
    }
    .question-box u {
      color: #dc2626;
      text-decoration-thickness: 2px;
    }
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      width: 100%;
      padding: 14px 16px;
      background-color: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      color: #334155;
      cursor: pointer;
      line-height: 1.4;
      transition: all 0.2s;
    }
    .option-btn:active {
      background-color: #dbeafe;
      border-color: #2563eb;
      color: #1e40af;
    }

    .sa-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 오답 화면 */
    #wrong-screen {
      display: none;
      background-color: #fef2f2;
      border: 2px solid #fca5a5;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .wrong-title {
      color: #dc2626;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .explanation-box {
      background: #ffffff;
      padding: 15px;
      border-radius: 10px;
      border-left: 4px solid #dc2626;
      text-align: left;
      font-size: 14px;
      color: #334155;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    /* 성공 화면 */
    #success-screen {
      display: none;
    }
    .trophy {
      font-size: 60px;
      margin-bottom: 10px;
    }
    .success-title {
      font-size: 22px;
      color: #15803d;
      font-weight: bold;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .result-info {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      margin-bottom: 20px;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .result-item:last-child {
      margin-bottom: 0;
    }
    .result-label {
      color: #475569;
      font-weight: bold;
    }
    .result-value {
      color: #16a34a;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- 1. 시작 화면 -->
    <div id="start-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>
      <h1>6학년 과학 퀴즈</h1>
      <p class="sub-title">2. 물체의 운동</p>

      <div class="input-group">
        <label for="userName">이름을 입력하세요</label>
        <input type="text" id="userName" placeholder="예: 홍길동" autocomplete="off">
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="startQuiz()">시작</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

    <!-- 2. 퀴즈 진행 화면 -->
    <div id="quiz-screen">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      
      <div class="quiz-header">
        <span id="question-number">문제 1 / 10</span>
        <span id="question-type-badge" class="badge badge-mcq">객관식</span>
      </div>

      <div class="question-box" id="question-text"></div>

      <!-- 객관식 영역 -->
      <div class="options-container" id="options-container"></div>

      <!-- 단답식 영역 -->
      <div class="sa-container" id="sa-container" style="display: none;">
        <input type="text" id="sa-input" placeholder="정답 입력" onkeydown="if(event.key==='Enter') submitSAAnswer()">
        <button class="btn btn-primary" onclick="submitSAAnswer()">정답 제출</button>
      </div>
    </div>

    <!-- 3. 오답 화면 -->
    <div id="wrong-screen">
      <div class="wrong-title">❌ 틀렸습니다!</div>
      <div class="explanation-box">
        <strong>💡 간단 해설:</strong>
        <p id="explanation-text" style="margin-top: 6px;"></p>
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="returnToStart()">계속</button>
    </div>

    <!-- 4. 성공 축하 화면 -->
    <div id="success-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>

      <div class="trophy">🏆</div>
      <div class="success-title">축하합니다!<br>10문제를 모두 맞추셨습니다!</div>
      
      <div class="result-info">
        <div class="result-item">
          <span class="result-label">이름</span>
          <span class="result-value" id="result-name">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">총 걸린시간</span>
          <span class="result-value" id="result-time">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">현재 시간</span>
          <span class="result-value" id="result-date">-</span>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-success" onclick="returnToStart()">재도전</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

  </div>

  <script>
    // ----------------------------------------------------
    // 단답식 문제 은행 (정답: 물체의 운동, 걸린 시간, 위치 변화, 속력)
    // ----------------------------------------------------
    const saBank = [
      {
        q: "시간이 지나감에 따라 물체의 위치가 변하는 현상을 무엇이라고 하나요?",
        ans: "물체의 운동",
        exp: "시간이 지남에 따라 물체의 위치가 변할 때 물체가 운동한다고 합니다."
      },
      {
        q: "시간이 지남에 따라 물체의 위치가 계속해서 바뀌는 상태를 뜻하는 과학적 용어는 무엇인가요?",
        ans: "물체의 운동",
        exp: "시간이 경과함에 따라 위치에 변화가 생기는 현상을 물체의 운동이라고 합니다."
      },
      {
        q: "물체가 움직여 위치가 바뀌는 현상을 뜻하는 네 글자의 단어는 무엇인가요?",
        ans: "물체의 운동",
        exp: "물체가 시간이 지남에 따라 이동하는 상태를 '물체의 운동'이라고 합니다."
      },
      {
        q: "물체의 운동을 표현할 때 물체의 위치 변화와 함께 반드시 나타내어야 하는 요소는 무엇인가요?",
        ans: "걸린 시간",
        exp: "물체의 운동은 이동하는 데 걸린 시간과 위치 변화로 표현합니다."
      },
      {
        q: "같은 거리를 이동한 물체의 빠르기를 비교할 때 측정하여 비교하는 요소는 무엇인가요?",
        ans: "걸린 시간",
        exp: "같은 거리를 이동할 때 걸린 시간이 짧을수록 더 빠른 물체입니다."
      },
      {
        q: "물체의 운동을 표현할 때 '처음 위치'와 '나중 위치'로 나타내는 것은 무엇인가요?",
        ans: "위치 변화",
        exp: "물체의 위치 변화는 처음 위치와 나중 위치를 이용하여 나타냅니다."
      },
      {
        q: "물체의 운동을 나타낼 때 걸린 시간과 함께 꼭 필요한 요소로, 물체의 위치가 바뀌는 것을 뜻하는 용어는 무엇인가요?",
        ans: "위치 변화",
        exp: "운동 표현 시 이동하는 데 걸린 시간과 물체의 위치 변화를 함께 이용합니다."
      },
      {
        q: "1초, 1분, 1시간과 같이 일정한 시간 동안 물체가 이동한 거리를 뜻하는 것은 무엇인가요?",
        ans: "속력",
        exp: "속력이란 일정한 시간 동안 물체가 이동한 거리를 말합니다."
      },
      {
        q: "(이동 거리) ÷ (걸린 시간) 공식을 이용하여 구하는 물체의 빠르기를 나타내는 값은 무엇인가요?",
        ans: "속력",
        exp: "속력은 (이동 거리) ÷ (걸린 시간)으로 계산합니다."
      },
      {
        q: "달리는 자동차의 계기판에 표시되거나 야구 투수가 던진 공의 빠르기를 나타낼 때 사용하는 것은 무엇인가요?",
        ans: "속력",
        exp: "자동차 계기판이나 야구공의 빠르기는 속력(km/h, m/s 등)으로 나타냅니다."
      }
    ];

    // ----------------------------------------------------
    // 객관식 문제 은행 (총 30개)
    // ----------------------------------------------------
    const mcqBank = [
      {
        q: "다음 중 운동하는 물체에 해당하는 것으로 알맞은 것은 무엇인가요?",
        options: ["하늘을 날아가는 갈매기", "바닷가의 등대", "공원에 설치된 의자", "길가에 서 있는 나무"],
        ans: 0,
        exp: "갈매기는 시간이 지남에 따라 위치가 변하므로 운동하는 물체입니다."
      },
      {
        q: "다음 중 운동하지 않는 물체로 <u>옳지 않은 것</u>은 무엇인가요?",
        options: ["산책하는 강아지", "바닷가의 바위", "의자에 앉아 있는 사람", "공원에 서 있는 나무"],
        ans: 0,
        exp: "산책하는 강아지는 시간이 지남에 따라 위치가 바뀌는 운동하는 물체입니다."
      },
      {
        q: "물체의 운동을 표현하기 위해 필요한 두 가지 요소로 바르게 짝지어진 것은 무엇인가요?",
        options: ["걸린 시간, 위치 변화", "물체의 무게, 위치 변화", "걸린 시간, 물체의 크기", "이동 거리, 물체의 색깔"],
        ans: 0,
        exp: "물체의 운동은 이동하는 데 걸린 시간과 물체의 위치 변화로 표현합니다."
      },
      {
        q: "물체의 위치 변화를 나타낼 때 기준이 되는 두 위치로 알맞은 것은 무엇인가요?",
        options: ["처음 위치와 나중 위치", "높은 위치와 낮은 위치", "동쪽 위치와 서쪽 위치", "안쪽 위치와 바깥쪽 위치"],
        ans: 0,
        exp: "물체의 위치 변화는 처음 위치와 나중 위치로 나타냅니다."
      },
      {
        q: "같은 시간 동안 이동한 물체의 빠르기를 비교하는 방법으로 알맞은 것은 무엇인가요?",
        options: ["이동 거리가 길수록 더 빠르다.", "이동 거리가 짧을수록 더 빠르다.", "걸린 시간이 길수록 더 빠르다.", "물체의 크기가 클수록 더 빠르다."],
        ans: 0,
        exp: "같은 시간 동안 이동할 때는 이동 거리가 길수록 더 빠릅니다."
      },
      {
        q: "같은 거리를 이동한 물체의 빠르기를 비교하는 방법으로 알맞은 것은 무엇인가요?",
        options: ["걸린 시간이 짧을수록 더 빠르다.", "걸린 시간이 길수록 더 빠르다.", "이동 거리가 짧을수록 더 빠르다.", "물체의 무게가 가벼울수록 더 빠르다."],
        ans: 0,
        exp: "같은 거리를 이동할 때는 걸린 시간이 짧을수록 더 빠릅니다."
      },
      {
        q: "빨간색 자동차가 5초 동안 135cm를, 파란색 자동차가 5초 동안 122cm를 이동했습니다. 더 빠른 자동차는 무엇인가요?",
        options: ["빨간색 자동차", "파란색 자동차", "두 자동차의 빠르기가 같다.", "비교할 수 없다."],
        ans: 0,
        exp: "같은 시간(5초) 동안 이동 거리가 더 긴 빨간색 자동차(135cm)가 더 빠릅니다."
      },
      {
        q: "초록색 자동차가 100cm 이동하는 데 4.2초, 노란색 자동차는 5.8초가 걸렸습니다. 더 빠른 자동차는 무엇인가요?",
        options: ["초록색 자동차", "노란색 자동차", "두 자동차의 빠르기가 같다.", "비교할 수 없다."],
        ans: 0,
        exp: "같은 거리(100cm)를 이동하는 데 걸린 시간이 더 짧은 초록색 자동차(4.2초)가 더 빠릅니다."
      },
      {
        q: "속력을 구하는 공식으로 알맞은 것은 무엇인가요?",
        options: ["속력 = (이동 거리) ÷ (걸린 시간)", "속력 = (걸린 시간) ÷ (이동 거리)", "속력 = (이동 거리) × (걸린 시간)", "속력 = (이동 거리) + (걸린 시간)"],
        ans: 0,
        exp: "속력은 이동 거리를 걸린 시간으로 나누어 구합니다."
      },
      {
        q: "다음 중 속력의 단위로 <u>옳지 않은 것</u>은 무엇인가요?",
        options: ["cm (센티미터)", "km/h (킬로미터 매 시)", "m/s (미터 매 초)", "m/min (미터 매 분)"],
        ans: 0,
        exp: "cm는 거리의 단위이며, 속력은 거리와 시간의 단위를 함께 표기해야 합니다."
      },
      {
        q: "2시간 동안 120km를 이동한 자동차의 속력은 얼마인가요?",
        options: ["60 km/h", "120 km/h", "240 km/h", "60 m/s"],
        ans: 0,
        exp: "120 km ÷ 2시간 = 60 km/h 입니다."
      },
      {
        q: "4초 동안 60m를 달린 말의 속력은 얼마인가요?",
        options: ["15 m/s", "240 m/s", "15 km/h", "60 m/s"],
        ans: 0,
        exp: "60 m ÷ 4초 = 15 m/s 입니다."

    // ----------------------------------------------------
    // 게임 상태 변수
    // ----------------------------------------------------
    let userName = "";
    let quizQueue = [];
    let currentIdx = 0;
    let startTime = null;

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const wrongScreen = document.getElementById("wrong-screen");
    const successScreen = document.getElementById("success-screen");

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startQuiz() {
      const nameInput = document.getElementById("userName").value.trim();
      if (!nameInput) {
        alert("이름을 입력해 주세요!");
        return;
      }
      userName = nameInput;

      // 1-7번: 객관식 30개 중 7개 무작위 추출 및 보기 셔플
      // 8-10번: 단답식 10개 중 3개 무작위 추출
      const selectedMCQs = shuffle(mcqBank).slice(0, 7);
      const selectedSAs = shuffle(saBank).slice(0, 3);

      const formattedMCQs = selectedMCQs.map(item => {
        const correctText = item.options[item.ans];
        const shuffledOptions = shuffle(item.options);
        const newAnsIdx = shuffledOptions.indexOf(correctText);
        return {
          type: "MCQ",
          q: item.q,
          options: shuffledOptions,
          ans: newAnsIdx,
          exp: item.exp
        };
      });

      const formattedSAs = selectedSAs.map(item => ({
        type: "SA",
        q: item.q,
        ans: item.ans,
        exp: item.exp
      }));

      quizQueue = [...formattedMCQs, ...formattedSAs];
      currentIdx = 0;
      startTime = Date.now();

      startScreen.style.display = "none";
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "block";

      renderQuestion();
    }

    function renderQuestion() {
      const qData = quizQueue[currentIdx];
      
      const progressPercent = ((currentIdx + 1) / 10) * 100;
      document.getElementById("progress-bar").style.width = progressPercent + "%";
      document.getElementById("question-number").textContent = `문제 ${currentIdx + 1} / 10`;

      const badge = document.getElementById("question-type-badge");
      const optionsBox = document.getElementById("options-container");
      const saBox = document.getElementById("sa-container");

      document.getElementById("question-text").innerHTML = `${currentIdx + 1}. ${qData.q}`;

      if (qData.type === "MCQ") {
        badge.textContent = "객관식";
        badge.className = "badge badge-mcq";
        optionsBox.style.display = "flex";
        saBox.style.display = "none";

        optionsBox.innerHTML = "";
        qData.options.forEach((optText, idx) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = `${idx + 1}. ${optText}`;
          btn.onclick = () => checkMCQAnswer(idx);
          optionsBox.appendChild(btn);
        });
      } else {
        badge.textContent = "단답식";
        badge.className = "badge badge-sa";
        optionsBox.style.display = "none";
        saBox.style.display = "flex";

        const saInput = document.getElementById("sa-input");
        saInput.value = "";
        setTimeout(() => saInput.focus(), 100);
      }
    }

    function checkMCQAnswer(selectedIdx) {
      const qData = quizQueue[currentIdx];
      if (selectedIdx === qData.ans) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function submitSAAnswer() {
      const qData = quizQueue[currentIdx];
      const userInput = document.getElementById("sa-input").value.trim().replace(/\s+/g, "");
      const targetAns = qData.ans.replace(/\s+/g, "");

      if (!userInput) {
        alert("정답을 입력해주세요.");
        return;
      }

      if (userInput === targetAns) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < 10) {
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function showWrongScreen(explanationText) {
      quizScreen.style.display = "none";
      wrongScreen.style.display = "block";
      document.getElementById("explanation-text").textContent = explanationText;
    }

    function returnToStart() {
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "none";
      startScreen.style.display = "block";
    }

    function finishQuiz() {
      const endTime = Date.now();
      const elapsedSeconds = Math.round((endTime - startTime) / 1000);

      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      const dateStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

      document.getElementById("result-name").textContent = userName;
      document.getElementById("result-time").textContent = `${elapsedSeconds}초`;
      document.getElementById("result-date").textContent = dateStr;

      quizScreen.style.display = "none";
      successScreen.style.display = "block";
    }
