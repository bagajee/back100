<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>6학년 1학기 과학 - 3. 식물의 구조와 기능</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #f0f9ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
      color: #1e3a8a;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
      position: relative;
    }
    .top-nav {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #f1f5f9;
      color: #334155;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
      border: 1px solid #cbd5e1;
    }
    .nav-btn:active {
      background-color: #e2e8f0;
    }
    h1 {
      font-size: 22px;
      color: #1d4ed8;
      margin-bottom: 8px;
    }
    .sub-title {
      font-size: 14px;
      color: #475569;
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #334155;
      font-size: 15px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #2563eb;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      box-sizing: border-box;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
    }
    .btn-secondary {
      background-color: #64748b;
      color: #ffffff;
    }
    .btn-success {
      background-color: #16a34a;
      color: #ffffff;
    }

    /* 퀴즈 화면 */
    #quiz-screen {
      display: none;
      text-align: left;
    }
    .progress-bar-container {
      width: 100%;
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #2563eb;
      transition: width 0.3s ease;
    }
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 14px;
      font-weight: bold;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    .badge-mcq { background: #dbeafe; color: #1e40af; }
    .badge-sa { background: #fef3c7; color: #92400e; }

    .question-box {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
      color: #0f172a;
      margin-bottom: 20px;
      min-height: 60px;
    }
    .question-box u {
      color: #dc2626;
      text-decoration-thickness: 2px;
    }
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      width: 100%;
      padding: 14px 16px;
      background-color: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      color: #334155;
      cursor: pointer;
      line-height: 1.4;
      transition: all 0.2s;
    }
    .option-btn:active {
      background-color: #dbeafe;
      border-color: #2563eb;
      color: #1e40af;
    }

    .sa-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 오답 화면 */
    #wrong-screen {
      display: none;
      background-color: #fef2f2;
      border: 2px solid #fca5a5;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .wrong-title {
      color: #dc2626;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .explanation-box {
      background: #ffffff;
      padding: 15px;
      border-radius: 10px;
      border-left: 4px solid #dc2626;
      text-align: left;
      font-size: 14px;
      color: #334155;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    /* 성공 화면 */
    #success-screen {
      display: none;
    }
    .trophy {
      font-size: 60px;
      margin-bottom: 10px;
    }
    .success-title {
      font-size: 22px;
      color: #15803d;
      font-weight: bold;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .result-info {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      margin-bottom: 20px;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .result-item:last-child {
      margin-bottom: 0;
    }
    .result-label {
      color: #475569;
      font-weight: bold;
    }
    .result-value {
      color: #16a34a;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- 1. 시작 화면 -->
    <div id="start-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>
      <h1>6학년 과학 퀴즈</h1>
      <p class="sub-title">3. 식물의 구조와 기능</p>

      <div class="input-group">
        <label for="userName">이름을 입력하세요</label>
        <input type="text" id="userName" placeholder="예: 홍길동" autocomplete="off">
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="startQuiz()">시작</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

    <!-- 2. 퀴즈 진행 화면 -->
    <div id="quiz-screen">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      
      <div class="quiz-header">
        <span id="question-number">문제 1 / 10</span>
        <span id="question-type-badge" class="badge badge-mcq">객관식</span>
      </div>

      <div class="question-box" id="question-text"></div>

      <!-- 객관식 영역 -->
      <div class="options-container" id="options-container"></div>

      <!-- 단답식 영역 -->
      <div class="sa-container" id="sa-container" style="display: none;">
        <input type="text" id="sa-input" placeholder="정답 입력" onkeydown="if(event.key==='Enter') submitSAAnswer()">
        <button class="btn btn-primary" onclick="submitSAAnswer()">정답 제출</button>
      </div>
    </div>

    <!-- 3. 오답 화면 -->
    <div id="wrong-screen">
      <div class="wrong-title">❌ 틀렸습니다!</div>
      <div class="explanation-box">
        <strong>💡 간단 해설:</strong>
        <p id="explanation-text" style="margin-top: 6px;"></p>
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="returnToStart()">계속</button>
    </div>

    <!-- 4. 성공 축하 화면 -->
    <div id="success-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>

      <div class="trophy">🏆</div>
      <div class="success-title">축하합니다!<br>10문제를 모두 맞추셨습니다!</div>
      
      <div class="result-info">
        <div class="result-item">
          <span class="result-label">이름</span>
          <span class="result-value" id="result-name">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">총 걸린시간</span>
          <span class="result-value" id="result-time">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">현재 시간</span>
          <span class="result-value" id="result-date">-</span>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-success" onclick="returnToStart()">재도전</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

  </div>

  <script>
    // ----------------------------------------------------
    // 단답식 문제 은행 (정답: 현미경, 세포, 핵, 뿌리, 줄기, 광합성, 증산 작용, 꽃가루받이)
    // ----------------------------------------------------
    const saBank = [
      {
        q: "접안렌즈와 대물렌즈 등을 이용하여 눈으로 직접 보기 힘든 세포나 작고 세밀한 구조를 확대해서 관찰할 때 사용하는 장치는 무엇인가요?",
        ans: "현미경",
        exp: "광학 현미경은 렌즈를 이용해 매우 작은 관찰 대상의 모습을 확대해서 보여줍니다."
      },
      {
        q: "양파의 표피나 입안 세포처럼 눈에 잘 보이지 않는 미세한 생물 구조를 크게 확대하여 관찰하는 대표적인 도구는 무엇인가요?",
        ans: "현미경",
        exp: "세포와 같이 작은 대상을 관찰할 때는 광학 현미경을 이용합니다."
      },
      {
        q: "생물체를 이루는 기본 단위로, 모든 생물은 이것으로 이루어져 있습니다. 이것은 무엇인가요?",
        ans: "세포",
        exp: "세포는 생물체를 이루는 가장 기본이 되는 단위입니다."
      },
      {
        q: "세포막으로 둘러싸여 있고 내부에 핵이 존재하며, 종류에 따라 크기와 모양이 다양한 생물체의 구성 단위는 무엇인가요?",
        ans: "세포",
        exp: "생물을 구성하는 세포는 종류에 따라 크기와 모양이 다양합니다."
      },
      {
        q: "세포막 안쪽에 존재하는 둥근 모양의 구조물은 무엇인가요?",
        ans: "핵",
        exp: "세포 내부에는 세포막으로 둘러싸인 안쪽에 둥근 핵이 위치합니다."
      },
      {
        q: "땅속에서 물을 흡수하고 식물이 쓰러지지 않도록 지지하며, 때로는 양분을 저장하기도 하는 식물의 기관은 무엇인가요?",
        ans: "뿌리",
        exp: "뿌리는 물 흡수, 식물 지지, 양분 저장 등의 기능을 수행합니다."
      },
      {
        q: "뿌리에서 흡수한 물이 잎이나 꽃 등 식물의 각 기관으로 이동하는 통로가 되며 식물을 곧게 서게 지지해 주는 기관은 무엇인가요?",
        ans: "줄기",
        exp: "줄기는 물이 이동하는 통로 역할을 하며 식물을 지지해 줍니다."
      },
      {
        q: "식물이 잎에서 빛을 이용해 이산화 탄소와 물로 양분을 만드는 작용을 무엇이라고 하나요?",
        ans: "광합성",
        exp: "광합성은 잎에서 빛, 이산화 탄소, 물을 이용해 양분을 만드는 작용입니다."
      },
      {
        q: "뿌리에서 흡수한 물이 잎에 도달한 후, 잎 표면의 기공을 통해 수증기 상태로 식물 밖으로 빠져나가는 현상을 무엇이라고 하나요?",
        ans: "증산 작용",
        exp: "증산 작용은 잎의 기공을 통해 물이 수증기로 배출되는 현상입니다."
      },
      {
        q: "꽃의 수술에 있는 꽃가루가 암술에 옮겨 붙는 과정을 무엇이라고 하나요?",
        ans: "꽃가루받이",
        exp: "수술의 꽃가루가 암술로 옮겨 붙는 과정을 꽃가루받이라고 합니다."
      }
    ];

    // ----------------------------------------------------
    // 객관식 문제 은행 (총 30개)
    // ----------------------------------------------------
    const mcqBank = [
      {
        q: "광학 현미경에서 눈으로 보는 렌즈로, 관찰 대상의 모습을 확대하여 보는 부분은 무엇인가요?",
        options: ["접안렌즈", "대물렌즈", "조리개", "재물대"],
        ans: 0,
        exp: "접안렌즈는 눈으로 보는 렌즈로 대상의 모습을 확대합니다."
      },
      {
        q: "광학 현미경에서 관찰 대상에 들어오는 빛의 양을 조절하는 부분은 무엇인가요?",
        options: ["조리개", "접안렌즈", "재물대", "조동 나사"],
        ans: 0,
        exp: "조리개는 현미경으로 들어오는 빛의 양을 조절하는 구실을 합니다."
      },
      {
        q: "광학 현미경으로 세포를 관찰할 때 초점을 '대략' 맞추기 위해 사용하는 나사는 무엇인가요?",
        options: ["조동 나사", "미동 나사", "회전판", "조명 조절 나사"],
        ans: 0,
        exp: "조동 나사는 관찰 대상의 초점을 대략 맞출 때 사용합니다."
      },
      {
        q: "광학 현미경으로 세포를 관찰할 때 상이 '뚜렷하게' 보이도록 정확히 초점을 맞추는 나사는 무엇인가요?",
        options: ["미동 나사", "조동 나사", "재물대", "조리개"],
        ans: 0,
        exp: "미동 나사는 관찰 대상의 초점을 정확하고 뚜렷하게 맞출 때 사용합니다."
      },
      {
        q: "광학 현미경에서 현미경표본을 올려놓는 받침대 부분은 무엇인가요?",
        options: ["재물대", "회전판", "대물렌즈", "조명"],
        ans: 0,
        exp: "재물대는 현미경표본을 올려놓고 고정하는 위치입니다."
      },
      {
        q: "광학 현미경 사용 방법 중 <u>옳지 않은 것</u>은 무엇인가요?",
        options: ["관찰을 시작할 때 대물렌즈를 가장 높은 배율부터 맞춘다.", "회전판을 돌려 배율이 가장 낮은 대물렌즈가 중앙에 오도록 한다.", "옆에서 보면서 조동 나사로 재물대와 대물렌즈를 가깝게 한다.", "미동 나사로 상이 뚜렷해지도록 조절한다."],
        ans: 0,
        exp: "현미경 관찰 시에는 처음에는 배율이 가장 낮은 대물렌즈부터 중앙에 놓아야 합니다."
      },
      {
        q: "식물 세포에서 세포막의 바깥쪽을 둘러싸고 있는 구조는 무엇인가요?",
        options: ["세포벽", "핵", "조리개", "기공"],
        ans: 0,
        exp: "식물 세포는 세포막 바깥쪽에 단단한 세포벽이 둘러싸여 있습니다."
      },
      {
        q: "다음 중 세포에 대한 설명으로 <u>옳지 않은 것</u>은 무엇인가요?",
        options: ["모든 생물 세포의 크기와 모양은 완전히 같다.", "생물체를 이루는 기본 단위이다.", "세포막으로 둘러싸여 있고 안에는 둥근 핵이 있다.", "식물 세포는 세포막 바깥쪽에 세포벽이 있다."],
        ans: 0,
        exp: "생물을 구성하는 세포는 종류에 따라 크기와 모양이 다양합니다."
      },
      {
        q: "뿌리를 자른 파와 뿌리를 자르지 않은 파를 물이 담긴 눈금실린더에 넣었을 때의 결과로 알맞은 것은 무엇인가요?",
        options: ["뿌리를 자르지 않은 파가 있는 실린더의 물이 더 많이 줄어들었다.", "뿌리를 자른 파가 있는 실린더의 물이 더 많이 줄어들었다.", "두 실린더의 물의 양이 똑같이 줄어들었다.", "두 실린더 모두 물의 양에 변화가 없었다."],
        ans: 0,
        exp: "뿌리가 있는 파가 물을 흡수하므로 뿌리를 자르지 않은 파 쪽의 물이 더 많이 줄어듭니다."
      },
      {
        q: "다음 중 뿌리가 하는 일로 <u>옳지 않은 것</u>은 무엇인가요?",
        options: ["빛을 받아 양분을 만든다.", "흙속에서 물을 흡수한다.", "식물이 쓰러지지 않도록 지지한다.", "양분을 저장하기도 한다."],
        ans: 0,
        exp: "빛을 받아 양분을 만드는 광합성은 주로 '잎'에서 활발하게 일어납니다."
      },

    // ----------------------------------------------------
    // 게임 상태 변수
    // ----------------------------------------------------
    let userName = "";
    let quizQueue = [];
    let currentIdx = 0;
    let startTime = null;

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const wrongScreen = document.getElementById("wrong-screen");
    const successScreen = document.getElementById("success-screen");

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startQuiz() {
      const nameInput = document.getElementById("userName").value.trim();
      if (!nameInput) {
        alert("이름을 입력해 주세요!");
        return;
      }
      userName = nameInput;

      // 1-7번: 객관식 30개 중 7개 무작위 추출 및 보기 셔플
      // 8-10번: 단답식 10개 중 3개 무작위 추출
      const selectedMCQs = shuffle(mcqBank).slice(0, 7);
      const selectedSAs = shuffle(saBank).slice(0, 3);

      const formattedMCQs = selectedMCQs.map(item => {
        const correctText = item.options[item.ans];
        const shuffledOptions = shuffle(item.options);
        const newAnsIdx = shuffledOptions.indexOf(correctText);
        return {
          type: "MCQ",
          q: item.q,
          options: shuffledOptions,
          ans: newAnsIdx,
          exp: item.exp
        };
      });

      const formattedSAs = selectedSAs.map(item => ({
        type: "SA",
        q: item.q,
        ans: item.ans,
        exp: item.exp
      }));

      quizQueue = [...formattedMCQs, ...formattedSAs];
      currentIdx = 0;
      startTime = Date.now();

      startScreen.style.display = "none";
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "block";

      renderQuestion();
    }

    function renderQuestion() {
      const qData = quizQueue[currentIdx];
      
      const progressPercent = ((currentIdx + 1) / 10) * 100;
      document.getElementById("progress-bar").style.width = progressPercent + "%";
      document.getElementById("question-number").textContent = `문제 ${currentIdx + 1} / 10`;

      const badge = document.getElementById("question-type-badge");
      const optionsBox = document.getElementById("options-container");
      const saBox = document.getElementById("sa-container");

      document.getElementById("question-text").innerHTML = `${currentIdx + 1}. ${qData.q}`;

      if (qData.type === "MCQ") {
        badge.textContent = "객관식";
        badge.className = "badge badge-mcq";
        optionsBox.style.display = "flex";
        saBox.style.display = "none";

        optionsBox.innerHTML = "";
        qData.options.forEach((optText, idx) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = `${idx + 1}. ${optText}`;
          btn.onclick = () => checkMCQAnswer(idx);
          optionsBox.appendChild(btn);
        });
      } else {
        badge.textContent = "단답식";
        badge.className = "badge badge-sa";
        optionsBox.style.display = "none";
        saBox.style.display = "flex";

        const saInput = document.getElementById("sa-input");
        saInput.value = "";
        setTimeout(() => saInput.focus(), 100);
      }
    }

    function checkMCQAnswer(selectedIdx) {
      const qData = quizQueue[currentIdx];
      if (selectedIdx === qData.ans) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function submitSAAnswer() {
      const qData = quizQueue[currentIdx];
      const userInput = document.getElementById("sa-input").value.trim().replace(/\s+/g, "");
      const targetAns = qData.ans.replace(/\s+/g, "");

      if (!userInput) {
        alert("정답을 입력해주세요.");
        return;
      }

      if (userInput === targetAns) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < 10) {
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function showWrongScreen(explanationText) {
      quizScreen.style.display = "none";
      wrongScreen.style.display = "block";
      document.getElementById("explanation-text").textContent = explanationText;
    }

    function returnToStart() {
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "none";
      startScreen.style.display = "block";
    }

    function finishQuiz() {
      const endTime = Date.now();
      const elapsedSeconds = Math.round((endTime - startTime) / 1000);

      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      const dateStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

      document.getElementById("result-name").textContent = userName;
      document.getElementById("result-time").textContent = `${elapsedSeconds}초`;
      document.getElementById("result-date").textContent = dateStr;

      quizScreen.style.display = "none";
      successScreen.style.display = "block";
    }
  </script>
