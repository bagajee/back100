<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6학년 1학기 사회 학습 포털</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .menu-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 480px;
            padding: 28px 24px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .top-nav {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 16px;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 8px 14px;
            background-color: #f1f5f9;
            color: #475569;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background-color: #e2e8f0;
            color: #0f172a;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.5rem;
            color: #1b4332;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 0.9rem;
            color: #888888;
        }

        .unit-group {
            margin-bottom: 24px;
        }

        .unit-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #495057;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sub-btn {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 14px 18px;
            background: linear-gradient(135deg, #2ea055 0%, #27ae60 100%);
            color: #ffffff;
            border: none;
            border-radius: 30px;
            font-size: 0.98rem;
            font-weight: 700;
            cursor: pointer;
            text-align: left;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.25);
        }

        .sub-btn::before {
            content: '';
            display: inline-block;
            width: 14px;
            height: 14px;
            background-color: #a8e6cf;
            border-radius: 50%;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .sub-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(39, 174, 96, 0.35);
        }

        .sub-btn:active {
            transform: translateY(0);
        }

        .footer-notice {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #888888;
            text-align: center;
        }

        /* 스크롤바 디자인 */
        .menu-card::-webkit-scrollbar {
            width: 6px;
        }
        .menu-card::-webkit-scrollbar-thumb {
            background-color: #cccccc;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="menu-card">
    <!-- 상단 홈으로 버튼 -->
    <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
    </div>

    <div class="header">
        <h1>🎓 6학년 1학기 사회 교실</h1>
        <p>학습할 소단원을 선택하세요!</p>
    </div>

    <!-- 1단원 -->
    <div class="unit-group">
        <div class="unit-title">1. 평화 통일을 위한 노력, 민주화와 산업화</div>
        <div class="btn-list">
            <button class="sub-btn" onclick="selectChapter('ch1_1')">1) 평화 통일을 위한 노력</button>
            <button class="sub-btn" onclick="selectChapter('ch1_2')">2) 민주화와 산업화로 달라진 생활 모습</button>
        </div>
    </div>

    <!-- 2단원 -->
    <div class="unit-group">
        <div class="unit-title">2. 민주주의와 시민 참여</div>
        <div class="btn-list">
            <button class="sub-btn" onclick="selectChapter('ch2_1')">1) 민주주의와 선거</button>
            <button class="sub-btn" onclick="selectChapter('ch2_2')">2) 국가기관과 권력 분립</button>
            <button class="sub-btn" onclick="selectChapter('ch2_3')">3) 민주주의와 미디어</button>
        </div>
    </div>

    <!-- 3단원 -->
    <div class="unit-group">
        <div class="unit-title">3. 지구, 대륙, 그리고 국가들</div>
        <div class="btn-list">
            <button class="sub-btn" onclick="selectChapter('ch3_1')">1) 세계를 표현하는 다양한 자료</button>
            <button class="sub-btn" onclick="selectChapter('ch3_2')">2) 세계 여러 국가의 위치와 영토 모습</button>
        </div>
    </div>


<script>
function selectChapter(chapterId) {
    const pageMap = {
        "ch1_1": "so11.html",
        "ch1_2": "so12.html",
        "ch2_1": "so21.html",
        "ch2_2": "so22.html",
        "ch2_3": "so23.html",
        "ch3_1": "so31.html",
        "ch3_2": "so32.html"
    };
    const target = pageMap[chapterId];
    if (target) {
        location.href = encodeURI(target);
    } else {
        alert("연결된 파일이 없습니다: " + chapterId);
    }
}
</script>

</body>
</html>
