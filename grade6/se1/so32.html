<!DOCTYPE html>
<html lang="ko">
<head>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

    body {

      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 20px;

      text-align: center;
      position: relative;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      background-color: #f1f5f9;
      color: #475569;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      background-color: #e2e8f0;
      color: #0f172a;
    }

    h1 {
      font-size: 20px;
      color: #1e293b;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .badge {
      display: inline-block;
      background-color: #e0f2fe;
      color: #0369a1;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 10px;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: all 0.2s ease;
      background-color: #fff;
    }

    input[type="text"]:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    .btn-primary {
      width: 100%;
      padding: 15px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .btn-primary:hover {
      background-color: #0369a1;
    }

    .btn-secondary {
      width: 100%;
      padding: 14px;
      background-color: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .btn-secondary:hover {
      background-color: #e2e8f0;
      color: #0f172a;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
    }

    .hidden {
      display: none !important;
    }

    #countdown-screen h2 {
      font-size: 80px;
      color: #0284c7;
      margin: 24px 0;
      font-weight: 800;
    }

    .question-box {
      font-size: 17px;
      font-weight: 700;
      color: #0f172a;
      margin: 16px 0 20px 0;
      word-break: keep-all;
      line-height: 1.5;
      text-align: left;
      background-color: #f8fafc;
      padding: 18px;
      border-radius: 14px;
      border-left: 5px solid #0284c7;
      min-height: 90px;
      display: flex;
      align-items: center;
    }

    .question-box u {
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-thickness: 2px;
      color: #e11d48;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .option-btn {
      width: 100%;
      padding: 14px 16px;
      background-color: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      color: #334155;

      background-color: #f0f9ff;
      border-color: #38bdf8;
      color: #0369a1;
    }

      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 18px;
      margin: 18px 0;
      text-align: left;
      font-size: 15px;
    }

      margin-bottom: 8px;
    }

      margin-bottom: 0;
    }

      color: #0f172a;
    }

      background-color: #e2e8f0;
      color: #475569;
      padding: 2px 8px;

</head>
<body>

  <div class="container">
    <!-- 1. 시작 화면 -->
    <div id="start-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>

    </div>

    <!-- 2. 카운트다운 화면 -->
    <div id="countdown-screen" class="hidden">

    </div>

    <!-- 3. 퀴즈 실행 화면 -->
    <div id="quiz-screen" class="hidden">

      </div>

      <div class="question-box">
        <div>

          <input type="text" id="user-answer" placeholder="정답을 입력하세요" autocomplete="off">
        </div>
        <button class="btn-primary" onclick="submitShortAnswer()">정답 제출</button>
      </div>
    </div>

    <!-- 4. 해설 화면 (오답 발생 시) -->
    <div id="explanation-screen" class="hidden">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
        <a href="social.html" class="nav-btn">📚 단원선택</a>
      </div>
      <h2 style="color: #e11d48; margin-bottom: 10px; font-size: 20px;">❌ 아쉽네요! 오답입니다.</h2>
      <div class="explanation-box">
        <p><strong>내가 입력한 답:</strong> <span id="exp-user-ans" style="color: #e11d48;"></span></p>
        <p><strong>정답:</strong> <span id="exp-correct-ans" style="color: #16a34a; font-weight: bold;"></span></p>
        <hr style="margin: 10px 0; border: none; border-top: 1px dashed #cbd5e1;">
        <p><strong>💡 [간단 해설]</strong></p>
        <p id="exp-text" style="margin-top: 6px; line-height: 1.5; color: #475569;"></p>
      </div>
      <button class="btn-primary" onclick="resetQuiz()">계속하기</button>
    </div>

    <!-- 5. 성공 결과 화면 -->
    <div id="result-screen" class="hidden">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>

      <h1 style="color: #16a34a; margin-bottom: 8px;">🎉 축하합니다! 🎉</h1>

        <p><strong>총 걸린시간:</strong> <span id="res-time"></span>초</p>
        <p><strong>현재 시간:</strong> <span id="res-date"></span></p>

      <div class="btn-group">

        <a href="social.html" class="btn-secondary">📚 단원선택</a>
      </div>
    </div>
  </div>

    // 상태 관리 변수
    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let userName = "";
    let startTime = 0;
    let countdownTimer = null;

    window.onload = function() {
      document.getElementById('user-answer').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') submitShortAnswer();
      });
      
      document.getElementById('user-name').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') prepareQuiz();
      });
    };

    function prepareQuiz() {
      userName = document.getElementById('user-name').value.trim();

      if (!userName) {
        alert("이름을 입력해주세요.");
        return;
      }

      // 1~7번: 객관식 30문제 중 랜덤 7개 추출
      const shuffledMC = [...quizDataMC].sort(() => Math.random() - 0.5);
      const selectedMC = shuffledMC.slice(0, 7);

      // 8~10번: 단답식 10문제 중 랜덤 3개 추출
      const shuffledSA = [...quizDataSA].sort(() => Math.random() - 0.5);
      const selectedSA = shuffledSA.slice(0, 3);

      // 총 10문항 결합
      currentQuestions = [...selectedMC, ...selectedSA];
      currentQuestionIndex = 0;

      showScreen('countdown-screen');
      document.getElementById('countdown-title').textContent = "준비하세요!";
      startCountdown(() => startQuiz());
    }

    function startCountdown(callback) {
      let count = 3;
      const countEl = document.getElementById('countdown-number');
      countEl.textContent = count;

      if (countdownTimer) clearInterval(countdownTimer);

      countdownTimer = setInterval(() => {
        count--;
        if (count > 0) {
          countEl.textContent = count;
        } else {
          clearInterval(countdownTimer);
          callback();
        }
      }, 1000);
    }

    function startQuiz() {
      showScreen('quiz-screen');
      startTime = new Date().getTime();
      loadQuestion();
    }

    function loadQuestion() {
      const q = currentQuestions[currentQuestionIndex];
      document.getElementById('progress-display').textContent = `${currentQuestionIndex + 1} / 10`;
      
      document.getElementById('question-text').innerHTML = q.question;

      const mcContainer = document.getElementById('mc-container');
      const saContainer = document.getElementById('sa-container');
      const tagEl = document.getElementById('question-type-tag');

      if (currentQuestionIndex < 7) {
        // 객관식 (1~7번)
        tagEl.textContent = "객관식";
        tagEl.style.backgroundColor = "#e0f2fe";
        tagEl.style.color = "#0369a1";

        mcContainer.classList.remove('hidden');
        saContainer.classList.add('hidden');
        mcContainer.innerHTML = "";

        q.options.forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = `${idx + 1}. ${opt}`;
          btn.onclick = () => checkAnswer(idx);
          mcContainer.appendChild(btn);
        });
      } else {
        // 단답식 (8~10번)
        tagEl.textContent = "단답식";
        tagEl.style.backgroundColor = "#fef3c7";
        tagEl.style.color = "#b45309";

        mcContainer.classList.add('hidden');
        saContainer.classList.remove('hidden');

        const inputEl = document.getElementById('user-answer');
        inputEl.value = "";
        inputEl.focus();
      }
    }

    function normalizeStr(str) {
      return str.toString().replace(/[\s\.\·\-\_]/g, '').toLowerCase();
    }

    function checkAnswer(userChoice) {
      const q = currentQuestions[currentQuestionIndex];
      if (userChoice === q.answer) {
        nextQuestion();
      } else {
        const userAnsStr = `${userChoice + 1}. ${q.options[userChoice]}`;
        const correctAnsStr = `${q.answer + 1}. ${q.options[q.answer]}`;
        handleIncorrect(userAnsStr, correctAnsStr, q.explanation);
      }
    }

    function submitShortAnswer() {
      const inputEl = document.getElementById('user-answer');
      const userAnsRaw = inputEl.value.trim();

      if (!userAnsRaw) {
        alert("정답을 입력해주세요.");
        return;
      }

      const q = currentQuestions[currentQuestionIndex];
      const normalizedUser = normalizeStr(userAnsRaw);
      
      const isCorrect = q.answer.some(ans => normalizeStr(ans) === normalizedUser);

      if (isCorrect) {
        nextQuestion();
      } else {
        const correctStr = q.answer[0];
        handleIncorrect(userAnsRaw, correctStr, q.explanation);
      }
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < 10) {
        loadQuestion();
      } else {
        showSuccess();
      }
    }

    function handleIncorrect(userAns, correctAns, exp) {
      document.getElementById('exp-user-ans').textContent = userAns;
      document.getElementById('exp-correct-ans').textContent = correctAns;
      document.getElementById('exp-text').textContent = exp || "해설이 없습니다.";
      showScreen('explanation-screen');
    }

    function showSuccess() {
      const endTime = new Date().getTime();
      const timeTaken = ((endTime - startTime) / 1000).toFixed(1);
      const now = new Date();
      
      const timeString = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

      document.getElementById('res-name').textContent = userName;
      document.getElementById('res-time').textContent = timeTaken;
      document.getElementById('res-date').textContent = timeString;

      showScreen('result-screen');
    }

    function resetQuiz() {
      if (countdownTimer) clearInterval(countdownTimer);
      document.getElementById('user-answer').value = "";
      showScreen('start-screen');
    }

    function showScreen(screenId) {
      const screens = ['start-screen', 'countdown-screen', 'quiz-screen', 'explanation-screen', 'result-screen'];
      screens.forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(screenId).classList.remove('hidden');
    }
  </script>
