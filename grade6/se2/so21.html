<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>사회 6-2 우리나라 시장경제의 특징 퀴즈</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
      color: #333;
    }
    .card {
      background: white;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      position: relative;
    }
    .top-nav {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background-color: #e2e8f0;
      color: #475569;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 13px;
      transition: background-color 0.2s;
    }
    .nav-btn:active {
      background-color: #cbd5e1;
    }
    h1 {
      font-size: 22px;
      color: #2b6cb0;
      margin-bottom: 8px;
    }
    .sub-title {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #334155;
      font-size: 15px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #3182ce;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      box-sizing: border-box;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background-color: #3182ce;
      color: white;
    }
    .btn-secondary {
      background-color: #94a3b8;
      color: white;
    }
    .btn-success {
      background-color: #38a169;
      color: white;
    }

    /* 카운트다운 화면 */
    #countdown-screen {
      display: none;
      padding: 40px 0;
    }
    .countdown-number {
      font-size: 80px;
      font-weight: 900;
      color: #dd6b20;
      animation: pulse 0.8s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }

    /* 퀴즈 화면 */
    #quiz-screen {
      display: none;
      text-align: left;
    }
    .progress-bar-container {
      width: 100%;
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #3182ce;
      transition: width 0.3s ease;
    }
    .quiz-header {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 12px;
      font-weight: bold;
    }
    .badge {
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12px;
    }
    .badge-mcq { background: #ebf8ff; color: #2b6cb0; }
    .badge-sa { background: #feebc8; color: #c05621; }

    .question-box {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
      color: #1e293b;
      margin-bottom: 20px;
      min-height: 60px;
    }
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      width: 100%;
      padding: 14px 16px;
      background-color: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      color: #334155;
      cursor: pointer;
      line-height: 1.4;
      transition: all 0.2s;
    }
    .option-btn:active {
      background-color: #ebf8ff;
      border-color: #3182ce;
      color: #2b6cb0;
    }

    .sa-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 오답 화면 */
    #wrong-screen {
      display: none;
      background-color: #fff5f5;
      border: 2px solid #feb2b2;
      border-radius: 16px;
      padding: 20px;
      margin-top: 10px;
      text-align: center;
    }
    .wrong-title {
      color: #e53e3e;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .explanation-box {
      background: white;
      padding: 15px;
      border-radius: 10px;
      border-left: 4px solid #e53e3e;
      text-align: left;
      font-size: 14px;
      color: #4a5568;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    /* 성공 화면 */
    #success-screen {
      display: none;
    }
    .trophy {
      font-size: 60px;
      margin-bottom: 10px;
    }
    .success-title {
      font-size: 22px;
      color: #2f855a;
      font-weight: bold;
      margin-bottom: 15px;
      line-height: 1.4;
    }
    .result-info {
      background-color: #f0fff4;
      border: 1px solid #c6f6d5;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      margin-bottom: 20px;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .result-item:last-child {
      margin-bottom: 0;
    }
    .result-label {
      color: #4a5568;
      font-weight: bold;
    }
    .result-value {
      color: #22543d;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- 1. 처음 화면 -->
    <div id="start-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>
      <h1>사회 6-2 스피드 퀴즈</h1>
      <p class="sub-title">2-(1) 우리나라 시장경제의 특징 (10문제 도전)</p>

      <div class="input-group">
        <label for="userName">이름</label>
        <input type="text" id="userName" placeholder="이름을 입력하세요" autocomplete="off">
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="startQuizProcess()">시작</button>
        <a href="social.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

    <!-- 2. 카운트다운 화면 -->
    <div id="countdown-screen">
      <h2 style="color: #4a5568; margin-bottom: 20px;">곧 퀴즈가 시작됩니다!</h2>
      <div class="countdown-number" id="countdown-timer">3</div>
    </div>

    <!-- 3. 퀴즈 진행 화면 -->
    <div id="quiz-screen">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      
      <div class="quiz-header">
        <span id="question-number">문제 1 / 10</span>
        <span id="question-type-badge" class="badge badge-mcq">객관식</span>
      </div>

      <div class="question-box" id="question-text"></div>

      <!-- 객관식 영역 -->
      <div class="options-container" id="options-container"></div>

      <!-- 단답식 영역 -->
      <div class="sa-container" id="sa-container" style="display: none;">
        <input type="text" id="sa-input" placeholder="정답을 입력하세요" onkeydown="if(event.key==='Enter') submitSAAnswer()">
        <button class="btn btn-primary" onclick="submitSAAnswer()">정답 제출</button>
      </div>
    </div>

    <!-- 4. 오답 화면 -->
    <div id="wrong-screen">
      <div class="wrong-title">❌ 틀렸습니다!</div>
      <div class="explanation-box">
        <strong>💡 간단 해설:</strong>
        <p id="explanation-text" style="margin-top: 5px;"></p>
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="returnToStart()">계속</button>
    </div>

    <!-- 5. 성공 축하 화면 -->
    <div id="success-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>

      <div class="trophy">🎉</div>
      <div class="success-title">축하합니다!<br>10문제를 모두 맞추셨습니다!</div>
      
      <div class="result-info">
        <div class="result-item">
          <span class="result-label">이름</span>
          <span class="result-value" id="result-name">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">총 걸린시간</span>
          <span class="result-value" id="result-time">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">현재 시간</span>
          <span class="result-value" id="result-date">-</span>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-success" onclick="returnToStart()">재도전</button>
        <a href="social.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

  </div>

  <script>

          "이윤을 얻는 목적의 경제활동을 할 수 없다."
        ],
        ans: 0,
        exp: "기업은 더 많은 이윤을 얻으려고 어떤 상품을 얼마나 생산할지 자유롭게 결정할 수 있습니다."
      },
      {
        q: "근로자의 권리를 보호하기 위하여 사회 및 기업이 노력해야 하는 방법으로 옳은 것은 무엇인가요?",
        options: [
          "근로자가 안전하게 일할 수 있는 환경을 제공한다.",
          "근로자를 정당한 이유 없이 부당하게 해고한다.",
          "근로자의 권리를 보호하려는 기업에게 불이익을 준다.",
          "작업장의 안전장치를 모두 철거한다."
        ],
        ans: 0,
        exp: "근로자가 안전하게 일할 수 있는 환경을 제공하고 부당 해고를 금지해야 합니다."
      },
      {
        q: "시장경제에서 기업의 역할로 옳지 않은 것은 무엇인가요?",
        options: [
          "가계의 소득을 차압하여 몰수한다.",
          "가계에 일자리를 제공한다.",
          "근로자에게 급여를 지급한다.",
          "물건이나 서비스를 생산하고 판매하여 이윤을 얻는다."
        ],
        ans: 0,
        exp: "기업은 가계에 일자리를 제공하고 급여를 지급하며, 물건과 서비스를 생산/판매해 이윤을 얻습니다."
      },
      {
        q: "시장경제에서 가계, 기업, 시장의 관계에 대한 설명으로 알맞은 것은 무엇인가요?",
        options: [
          "가계와 기업은 다양한 형태의 시장에서 만나 밀접한 관계를 맺는다.",
          "가계와 기업은 시장에서 전혀 만날 필요가 없다.",
          "시장에서는 어떠한 물건이나 서비스도 거래되지 않는다.",
          "가계와 기업은 서로 아무런 도움도 주고받지 않는다."
        ],
        ans: 0,
        exp: "가계와 기업은 다양한 형태의 시장에서 만나 밀접한 관계를 맺으며 도움을 주고받습니다."
      },
      {
        q: "시장에서 더 많은 물건을 팔거나 더 좋은 물건을 만들려고 기업들이 노력하는 원동력은 무엇인가요?",
        options: ["자유로운 경쟁", "정부의 강제 명령", "가격의 일괄 고정", "생산의 전면 금지"],
        ans: 0,
        exp: "시장에서는 더 많은 물건을 팔거나 더 좋은 물건을 만들기 위해 자유롭게 경쟁합니다."
      },
      {
        q: "기업이 과도한 경쟁으로 인한 문제를 예방하기 위해 가져야 하는 자세로 알맞은 것은 무엇인가요?",
        options: [
          "사회에 대한 책임감을 가지고 공정하게 경쟁하려 노력한다.",
          "다른 기업의 사업 활동을 적극적으로 방해한다.",
          "소비자에게 거짓 정보를 지속적으로 제공한다.",
          "회사들끼리 약속하여 제품 가격을 크게 올린다."
        ],
        ans: 0,
        exp: "기업은 사회에 대한 책임감을 가져야 하며 환경 보전과 공정한 경쟁에 힘써야 합니다."
      },
      {
        q: "시장에서 사람들이 사려고 경쟁하는 대상으로 학습지에 제시된 것으로 알맞은 것은 무엇인가요?",
        options: ["원하는 물건", "생산 시설", "환경 오염", "육아 휴직"],
        ans: 0,
        exp: "시장에서 사람들은 원하는 물건을 사려고 다른 사람들과 경쟁합니다."
      },
      {
        q: "기업이 적은 비용으로 큰 이윤을 얻기 위해 노력하는 의사결정 방식을 무엇이라고 하나요?",
        options: ["합리적 결정", "일방적 통제", "불공정 거래", "과도한 경쟁"],
        ans: 0,
        exp: "기업은 적은 비용으로 큰 이윤을 얻을 수 있도록 합리적으로 결정하려 노력합니다."
      }
    ];

    // 단답식 문제 은행 (9문제)
    const saBank = [
      {
        q: "물건이나 서비스의 거래가 이루어지는 곳을 무엇이라고 하나요?",
        ansList: ["시장"],
        exp: "(시장)은 물건이나 서비스의 거래가 이루어지는 곳입니다."
      },
      {
        q: "시장에서 경제활동을 함께하며 살림을 꾸려 가는 생활 공동체를 무엇이라고 하나요?",
        ansList: ["가계"],
        exp: "(가계)는 시장에서 경제활동을 함께하며 살림을 꾸려 가는 생활 공동체입니다."
      },
      {
        q: "시장에서 이윤을 목적으로 물건이나 서비스를 생산하거나 판매하는 조직을 무엇이라고 하나요?",
        ansList: ["기업"],
        exp: "(기업)은 시장에서 이윤을 목적으로 물건이나 서비스를 생산하거나 판매하는 조직입니다."
      },
      {
        q: "시장에서 가계와 기업이 자유롭게 경쟁하며 경제활동을 하는 방식을 무엇이라고 하나요?",
        ansList: ["시장경제", "시장 경제"],
        exp: "(시장경제)는 시장에서 가계와 기업이 자유롭게 경쟁하며 경제활동을 하는 방식입니다."
      },
      {
        q: "시장에서 더 많은 물건을 팔거나 좋은 물건을 만들기 위해 가계나 기업이 서로 지지 않으려고 겨루는 바탕이 되는 이것은 무엇인가요?",
        ansList: ["경쟁"],
        exp: "우리나라 시장경제에서는 자유롭게 (경쟁)하며 경제활동에 참여할 수 있습니다."
      },
      {
        q: "가계에 일자리를 제공하고 근로자에게 급여를 지급하며, 생산 활동을 담당하는 경제 주체 조직은 무엇인가요?",
        ansList: ["기업"],
        exp: "(기업)은 가계에 일자리를 제공하고 급여를 지급하며 상품을 생산해 판매합니다."
      },
      {
        q: "기업이 물건이나 서비스를 생산하고 판매하여 그 대가로 얻게 되는 수입이나 목적을 무엇이라고 하나요?",
        ansList: ["이윤"],
        exp: "기업은 물건이나 서비스를 생산·판매하여 그 대가로 (이윤)을 얻습니다."
      },
      {
        q: "기업과 상호 의존 관계에 있는 근로자가 안전하게 일하고 부당해고를 당하지 않도록 법과 제도로 보장하는 이것은 무엇인가요?",
        ansList: ["근로자의 권리", "근로자의권리"],
        exp: "안전한 환경 제공, 최저 임금 제도 등을 통해 (근로자의 권리)를 보호해야 합니다."
      },
      {
        q: "기업의 경제활동이 사회에 큰 영향을 미치므로 환경 보존, 공정 경쟁 등 사회에 대해 가져야 하는 책임을 무엇이라고 하나요?",
        ansList: ["사회적 책임", "사회적책임"],
        exp: "기업이 (사회적 책임)을 다하면 경제가 성장하고 사회가 발전하게 됩니다."
      }
    ];

    // ----------------------------------------------------
    // 게임 전역 상태 관리
    // ----------------------------------------------------
    let userName = "";
    let quizQueue = [];
    let currentIdx = 0;
    let startTime = null;

    // DOM 요소
    const startScreen = document.getElementById("start-screen");
    const countdownScreen = document.getElementById("countdown-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const wrongScreen = document.getElementById("wrong-screen");
    const successScreen = document.getElementById("success-screen");

    // 배열 셔플 함수
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 퀴즈 시작 프로세스 (시작 버튼 눌렀을 때 실행)
    function startQuizProcess() {
      const nameInput = document.getElementById("userName").value.trim();
      if (!nameInput) {
        alert("이름을 입력해 주세요!");
        return;
      }
      userName = nameInput;

      // 화면 전환 -> 카운트다운
      startScreen.style.display = "none";
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      countdownScreen.style.display = "block";

      let count = 3;
      const countEl = document.getElementById("countdown-timer");
      countEl.textContent = count;

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          countEl.textContent = count;
        } else {
          clearInterval(timer);
          countdownScreen.style.display = "none";
          initQuizData();
        }
      }, 1000);
    }

    // 퀴즈 데이터 생성 (1~7번: 객관식 7개, 8~10번: 단답식 3개)
    function initQuizData() {
      const selectedMCQs = shuffleArray(mcqBank).slice(0, 7);
      const selectedSAs = shuffleArray(saBank).slice(0, 3);

      // 객관식 문제 처리 (선택지 셔플)
      const formattedMCQs = selectedMCQs.map(item => {
        const correctText = item.options[item.ans];
        const shuffledOptions = shuffleArray(item.options);
        const newAnsIdx = shuffledOptions.indexOf(correctText);
        return {
          type: "MCQ",
          q: item.q,
          options: shuffledOptions,
          ans: newAnsIdx,
          exp: item.exp
        };
      });

      // 단답식 문제 처리
      const formattedSAs = selectedSAs.map(item => ({
        type: "SA",
        q: item.q,
        ansList: item.ansList,
        exp: item.exp
      }));

      quizQueue = [...formattedMCQs, ...formattedSAs];
      currentIdx = 0;
      startTime = Date.now();

      quizScreen.style.display = "block";
      renderQuestion();
    }

    // 문제 렌더링
    function renderQuestion() {
      const qData = quizQueue[currentIdx];
      
      // 진행률 바
      const progressPercent = ((currentIdx + 1) / 10) * 100;
      document.getElementById("progress-bar").style.width = progressPercent + "%";
      document.getElementById("question-number").textContent = `문제 ${currentIdx + 1} / 10`;

      // Badge & Type
      const badge = document.getElementById("question-type-badge");
      const optionsBox = document.getElementById("options-container");
      const saBox = document.getElementById("sa-container");

      document.getElementById("question-text").textContent = `${currentIdx + 1}. ${qData.q}`;

      if (qData.type === "MCQ") {
        badge.textContent = "객관식";
        badge.className = "badge badge-mcq";
        optionsBox.style.display = "flex";
        saBox.style.display = "none";

        optionsBox.innerHTML = "";
        qData.options.forEach((optText, idx) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = `${idx + 1} ${optText}`;
          btn.onclick = () => checkMCQAnswer(idx);
          optionsBox.appendChild(btn);
        });
      } else {
        badge.textContent = "단답식";
        badge.className = "badge badge-sa";
        optionsBox.style.display = "none";
        saBox.style.display = "flex";

        const saInput = document.getElementById("sa-input");
        saInput.value = "";
        saInput.focus();
      }
    }

    // 객관식 정답 검사
    function checkMCQAnswer(selectedIdx) {
      const qData = quizQueue[currentIdx];
      if (selectedIdx === qData.ans) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    // 단답식 정답 검사
    function submitSAAnswer() {
      const qData = quizQueue[currentIdx];
      const userInput = document.getElementById("sa-input").value.trim().replace(/\s+/g, "");
      
      if (!userInput) {
        alert("정답을 입력해주세요.");
        return;
      }

      // 공백 무시 비교
      const isCorrect = qData.ansList.some(targetAns => {
        return targetAns.replace(/\s+/g, "") === userInput;
      });

      if (isCorrect) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    // 다음 문제로 이동
    function nextQuestion() {
      currentIdx++;
      if (currentIdx < 10) {
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    // 오답 화면
    function showWrongScreen(explanationText) {
      quizScreen.style.display = "none";
      wrongScreen.style.display = "block";
      document.getElementById("explanation-text").textContent = explanationText;
    }

    // 이름 입력 단계(시작 화면)로 돌아가기
    function returnToStart() {
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "none";
      startScreen.style.display = "block";
    }

    // 퀴즈 완등 (10문제 성공)
    function finishQuiz() {
      const endTime = Date.now();
      const elapsedSeconds = ((endTime - startTime) / 1000).toFixed(1);

      const now = new Date();
      const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

      document.getElementById("result-name").textContent = userName;
      document.getElementById("result-time").textContent = `${elapsedSeconds}초`;
      document.getElementById("result-date").textContent = dateStr;

      quizScreen.style.display = "none";
      successScreen.style.display = "block";
    }
  </script>
</body>
