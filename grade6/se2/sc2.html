<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>6학년 2학기 과학 - 물질의 연소 퀴즈</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
      color: #1e293b;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
      position: relative;
    }
    .top-nav {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #e2e8f0;
      color: #334155;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
    }
    .nav-btn:active {
      background-color: #cbd5e1;
    }
    h1 {
      font-size: 22px;
      color: #1e3a8a;
      margin-bottom: 8px;
    }
    .sub-title {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #334155;
      font-size: 15px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #2563eb;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      box-sizing: border-box;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
    }
    .btn-secondary {
      background-color: #64748b;
      color: #ffffff;
    }
    .btn-success {
      background-color: #16a34a;
      color: #ffffff;
    }

    /* 퀴즈 진행 화면 */
    #quiz-screen {
      display: none;
      text-align: left;
    }
    .progress-bar-container {
      width: 100%;
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #2563eb;
      transition: width 0.3s ease;
    }
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 14px;
      font-weight: bold;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    .badge-mcq { background: #dbeafe; color: #1e40af; }
    .badge-sa { background: #fef3c7; color: #92400e; }

    .question-box {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
      color: #0f172a;
      margin-bottom: 20px;
      min-height: 60px;
    }
    .question-box u {
      color: #dc2626;
      text-decoration-thickness: 2px;
    }
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      width: 100%;
      padding: 14px 16px;
      background-color: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      color: #334155;
      cursor: pointer;
      line-height: 1.4;
      transition: all 0.2s;
    }
    .option-btn:active {
      background-color: #dbeafe;
      border-color: #2563eb;
      color: #1e40af;
    }

    .sa-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 오답 화면 */
    #wrong-screen {
      display: none;
      background-color: #fef2f2;
      border: 2px solid #fca5a5;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .wrong-title {
      color: #dc2626;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .explanation-box {
      background: #ffffff;
      padding: 15px;
      border-radius: 10px;
      border-left: 4px solid #dc2626;
      text-align: left;
      font-size: 14px;
      color: #334155;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    /* 성공 화면 */
    #success-screen {
      display: none;
    }
    .trophy {
      font-size: 60px;
      margin-bottom: 10px;
    }
    .success-title {
      font-size: 22px;
      color: #16a34a;
      font-weight: bold;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .result-info {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      margin-bottom: 20px;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .result-item:last-child {
      margin-bottom: 0;
    }
    .result-label {
      color: #475569;
      font-weight: bold;
    }
    .result-value {
      color: #166534;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- 1. 시작 화면 -->
    <div id="start-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>
      <h1>6학년 과학 퀴즈</h1>
      <p class="sub-title">2단원. 물질의 연소</p>

      <div class="input-group">
        <label for="userName">이름을 입력하세요</label>
        <input type="text" id="userName" placeholder="예: 홍길동" autocomplete="off">
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="startQuiz()">시작</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

    <!-- 2. 퀴즈 진행 화면 -->
    <div id="quiz-screen">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      
      <div class="quiz-header">
        <span id="question-number">문제 1 / 10</span>
        <span id="question-type-badge" class="badge badge-mcq">객관식</span>
      </div>

      <div class="question-box" id="question-text"></div>

      <!-- 객관식 영역 -->
      <div class="options-container" id="options-container"></div>

      <!-- 단답식 영역 -->
      <div class="sa-container" id="sa-container" style="display: none;">
        <input type="text" id="sa-input" placeholder="정답 입력" onkeydown="if(event.key==='Enter') submitSAAnswer()">
        <button class="btn btn-primary" onclick="submitSAAnswer()">정답 제출</button>
      </div>
    </div>

    <!-- 3. 오답 화면 -->
    <div id="wrong-screen">
      <div class="wrong-title">❌ 틀렸습니다!</div>
      <div class="explanation-box">
        <strong>💡 간단 해설:</strong>
        <p id="explanation-text" style="margin-top: 6px;"></p>
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="returnToStart()">계속</button>
    </div>

    <!-- 4. 성공 축하 화면 -->
    <div id="success-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>

      <div class="trophy">🎉</div>
      <div class="success-title">축하합니다!<br>10문제를 모두 맞추셨습니다!</div>
      
      <div class="result-info">
        <div class="result-item">
          <span class="result-label">이름</span>
          <span class="result-value" id="result-name">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">총 걸린시간</span>
          <span class="result-value" id="result-time">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">현재 시간</span>
          <span class="result-value" id="result-date">-</span>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-success" onclick="returnToStart()">재도전</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

  </div>

  <script>
    // ----------------------------------------------------
    // 단답식 문제 은행 (지정된 7개 단답식 정답 활용)
    // 지정 정답: 물질의 성질, 빛과 열, 산소, 온도, 발화점, 연소, 이산화 탄소
    // ----------------------------------------------------
    const saBank = [
      {
        q: "식초와 밀가루를 섞었을 때처럼 섞어도 유지되거나, 식초와 탄산수소 나트륨을 섞었을 때처럼 변하기도 하는 물질 고유의 특징을 ( )(이)라고 합니다. 빈칸에 들어갈 말은 무엇인가요?",
        ans: "물질의 성질",
        exp: "서로 다른 물질을 섞으면 물질의 성질이 변하지 않기도 하고, 변하기도 합니다."
      },
      {
        q: "양초나 알코올이 탈 때 공통적으로 발생하는 두 가지 현상 요소는 ( )(이)라고 합니다. 빈칸에 들어갈 말은 무엇인가요?",
        ans: "빛과 열",
        exp: "물질이 탈 때는 주변이 밝아지고 따뜻해지며 빛과 열이 발생합니다."
      },
      {
        q: "묽은 과산화 수소수와 아이오딘화 칼륨이 만나면 발생하며, 물질이 타는 데 반드시 필요한 기체는 무엇인가요?",
        ans: "산소",
        exp: "물질이 타려면 산소가 필요하며, 과산화 수소수와 아이오딘화 칼륨이 만나면 산소가 발생합니다."
      },
      {
        q: "성냥의 머리 부분과 나무 부분은 불이 붙는 ( )(이)가 다릅니다. 빈칸에 들어갈 알맞은 말은 무엇인가요?",
        ans: "온도",
        exp: "물질이 타려면 물질의 온도가 불이 붙는 온도까지 높아져야 합니다."
      },
      {
        q: "어떤 물질이 타기 시작하는 온도를 그 물질의 ( )(이)라고 합니다. 빈칸에 들어갈 말은 무엇인가요?",
        ans: "발화점",
        exp: "어떤 물질이 타기 시작하는 온도를 발화점이라고 하며, 물질마다 불이 붙기 시작하는 온도가 다릅니다."
      },
      {
        q: "물질이 산소와 만나 빛과 열을 내면서 타는 현상을 ( )(이)라고 합니다. 빈칸에 들어갈 말은 무엇인가요?",
        ans: "연소",
        exp: "물질이 산소와 만나 빛과 열을 내면서 타는 현상을 연소라고 합니다."
      },
      {
        q: "석회수를 뿌옇게 변화시키며, 양초가 연소한 후 생성되는 기체는 무엇인가요?",
        ans: "이산화 탄소",
        exp: "양초가 연소하면 물과 이산화 탄소가 생성되며, 이산화 탄소는 석회수를 뿌옇게 만듭니다."
      }
    ];

    // ----------------------------------------------------
    // 객관식 문제 은행 (첨부 이미지 내용 100% 반영)
    // ----------------------------------------------------
    const mcqBank = [
      {
        q: "식초에 밀가루를 섞었을 때 일어나는 현상으로 올바른 것은 무엇인가요?",
        options: [
          "아무런 변화가 없고 밀가루와 식초가 그대로 있다.",
          "거품이 부풀어 오르며 기포가 발생한다.",
          "물질의 성질이 완전히 변한다.",
          "색깔이 검은색으로 변한다."
        ],
        ans: 0,
        exp: "식초와 밀가루를 섞었을 때는 아무런 변화가 없으며 물질의 성질이 변하지 않습니다."
      },
      {
        q: "식초에 탄산수소 나트륨을 섞었을 때 일어나는 변화로 <u>옳지 않은</u> 것은 무엇인가요?",
        options: [
          "고무풍선이 부풀어 오른다.",
          "삼각 플라스크 안에서 기포가 발생한다.",
          "물질의 성질이 변한다.",
          "아무런 변화가 일어나지 않는다."
        ],
        ans: 3,
        exp: "식초와 탄산수소 나트륨을 섞으면 기포가 발생하고 물질의 성질이 변합니다."
      },
      {
        q: "다음 중 서로 다른 물질을 섞었을 때 물질의 성질이 변하는 예로 올바른 것은 무엇인가요?",
        options: [
          "우유에 식초를 섞었을 때",
          "물에 설탕을 섞었을 때",
          "물에 꿀을 섞었을 때",
          "식초에 밀가루를 섞었을 때"
        ],
        ans: 0,
        exp: "우유에 식초를 섞거나 손난로 속 철 가루와 산소가 섞이면 물질의 성질이 변합니다."
      },
      {
        q: "다음 중 서로 다른 물질을 섞었을 때 물질의 성질이 변하지 않는 예로 <u>옳지 않은</u> 것은 무엇인가요?",
        options: [
          "물에 설탕을 섞었을 때",
          "물에 꿀을 섞었을 때",
          "손난로 속 철 가루와 산소가 섞였을 때",
          "식초에 밀가루를 섞었을 때"
        ],
        ans: 2,
        exp: "손난로 속 철 가루와 산소가 섞이는 것은 물질의 성질이 변하는 예입니다."
      },
      {
        q: "양초나 알코올이 탈 때 나타나는 공통적인 현상으로 <u>옳지 않은</u> 것은 무엇인가요?",
        options: [
          "불꽃 주변이 밝아진다.",
          "불꽃에 가까울수록 더 따뜻해진다.",
          "시간이 지날수록 양초와 알코올의 양이 늘어난다.",
          "물질이 탈 때 빛과 열이 발생한다."
        ],
        ans: 2,
        exp: "물질이 타면 시간이 지날수록 양초와 알코올의 양이 줄어듭니다."
      },
      {
        q: "다음 중 물질이 탈 때 주로 '빛'을 이용하는 예로 올바른 것은 무엇인가요?",
        options: [
          "강물 위의 유등",
          "벽난로의 장작불",
          "가스레인지의 불꽃",
          "화력 발전소의 열"
        ],
        ans: 0,
        exp: "강물 위의 유등과 막대 폭죽의 불꽃은 주로 빛을 이용하는 예입니다."
      },
      {
        q: "다음 중 물질이 탈 때 주로 '열'을 이용하는 예로 <u>옳지 않은</u> 것은 무엇인가요?",
        options: [
          "벽난로의 장작불",
          "가스레인지의 불꽃",
          "강물 위의 유등",
          "가스 불을 사용하여 요리하기"
        ],
        ans: 2,
        exp: "강물 위의 유등은 주로 '빛'을 이용하는 예입니다."
      },
      {
        q: "산소가 발생하는 아크릴 통 안에 양초를 넣었을 때 일어나는 현상으로 올바른 것은 무엇인가요?",
        options: [
          "양초가 더 오래 탄다.",
          "양초 불꽃이 바로 꺼진다.",
          "양초의 양이 전혀 줄어들지 않는다.",
          "아무런 변화가 없다."
        ],
        ans: 0,
        exp: "산소가 충분히 공급되면 양초가 더 오래 타게 됩니다."
      },
      {
        q: "철판 위에 성냥의 머리 부분과 나무 부분을 올리고 가열할 때 일어나는 현상으로 올바른 것은 무엇인가요?",
        options: [
          "성냥의 머리 부분에 불이 먼저 붙는다.",
          "성냥의 나무 부분에 불이 먼저 붙는다.",
          "두 부분에 동시에 불이 붙는다.",
          "철판이 먼저 타서 사라진다."
        ],
        ans: 0,
        exp: "성냥의 머리 부분과 나무 부분은 불이 붙는 온도가 다르며, 머리 부분에 불이 먼저 붙습니다."
      },
      {
        q: "물질의 발화점에 대한 설명으로 <u>옳지 않은</u> 것은 무엇인가요?",
        options: [
          "어떤 물질이 타기 시작하는 온도를 말한다.",
          "물질이 타려면 물질의 온도가 발화점 이상이 되어야 한다.",
          "모든 물질은 불이 붙기 시작하는 발화점이 서로 같다.",
          "물질마다 불이 붙기 시작하는 온도가 다르다."
        ],
        ans: 2,
        exp: "물질마다 불이 붙기 시작하는 온도(발화점)는 서로 다릅니다."
      },

    // ----------------------------------------------------
    // 게임 상태 변수
    // ----------------------------------------------------
    let userName = "";
    let quizQueue = [];
    let currentIdx = 0;
    let startTime = null;

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const wrongScreen = document.getElementById("wrong-screen");
    const successScreen = document.getElementById("success-screen");

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startQuiz() {
      const nameInput = document.getElementById("userName").value.trim();
      if (!nameInput) {
        alert("이름을 입력해 주세요!");
        return;
      }
      userName = nameInput;

      // 1-7번: 객관식 7개 무작위
      // 8-10번: 단답식 3개 무작위
      const selectedMCQs = shuffle(mcqBank).slice(0, 7);
      const selectedSAs = shuffle(saBank).slice(0, 3);

      const formattedMCQs = selectedMCQs.map(item => {
        const correctText = item.options[item.ans];
        const shuffledOptions = shuffle(item.options);
        const newAnsIdx = shuffledOptions.indexOf(correctText);
        return {
          type: "MCQ",
          q: item.q,
          options: shuffledOptions,
          ans: newAnsIdx,
          exp: item.exp
        };
      });

      const formattedSAs = selectedSAs.map(item => ({
        type: "SA",
        q: item.q,
        ans: item.ans,
        exp: item.exp
      }));

      quizQueue = [...formattedMCQs, ...formattedSAs];
      currentIdx = 0;
      startTime = Date.now();

      startScreen.style.display = "none";
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "block";

      renderQuestion();
    }

    function renderQuestion() {
      const qData = quizQueue[currentIdx];
      
      const progressPercent = ((currentIdx + 1) / 10) * 100;
      document.getElementById("progress-bar").style.width = progressPercent + "%";
      document.getElementById("question-number").textContent = `문제 ${currentIdx + 1} / 10`;

      const badge = document.getElementById("question-type-badge");
      const optionsBox = document.getElementById("options-container");
      const saBox = document.getElementById("sa-container");

      document.getElementById("question-text").innerHTML = `${currentIdx + 1}. ${qData.q}`;

      if (qData.type === "MCQ") {
        badge.textContent = "객관식";
        badge.className = "badge badge-mcq";
        optionsBox.style.display = "flex";
        saBox.style.display = "none";

        optionsBox.innerHTML = "";
        qData.options.forEach((optText, idx) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = `${idx + 1}. ${optText}`;
          btn.onclick = () => checkMCQAnswer(idx);
          optionsBox.appendChild(btn);
        });
      } else {
        badge.textContent = "단답식";
        badge.className = "badge badge-sa";
        optionsBox.style.display = "none";
        saBox.style.display = "flex";

        const saInput = document.getElementById("sa-input");
        saInput.value = "";
        setTimeout(() => saInput.focus(), 100);
      }
    }

    function checkMCQAnswer(selectedIdx) {
      const qData = quizQueue[currentIdx];
      if (selectedIdx === qData.ans) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function submitSAAnswer() {
      const qData = quizQueue[currentIdx];
      const userInput = document.getElementById("sa-input").value.trim().replace(/\s+/g, "");
      const targetAns = qData.ans.replace(/\s+/g, "");

      if (!userInput) {
        alert("정답을 입력해주세요.");
        return;
      }

      if (userInput === targetAns) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < 10) {
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function showWrongScreen(explanationText) {
      quizScreen.style.display = "none";
      wrongScreen.style.display = "block";
      document.getElementById("explanation-text").textContent = explanationText;
    }

    function returnToStart() {
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "none";
      startScreen.style.display = "block";
    }

    function finishQuiz() {
      const endTime = Date.now();
      const elapsedSeconds = Math.round((endTime - startTime) / 1000);

      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      const dateStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

      document.getElementById("result-name").textContent = userName;
      document.getElementById("result-time").textContent = `${elapsedSeconds}초`;
      document.getElementById("result-date").textContent = dateStr;

      quizScreen.style.display = "none";
      successScreen.style.display = "block";
    }
  </script>
