<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>6학년 2학기 과학 - 전기의 이용 퀴즈</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
      color: #1e293b;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
      position: relative;
    }
    .top-nav {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #e2e8f0;
      color: #334155;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
    }
    .nav-btn:active {
      background-color: #cbd5e1;
    }
    h1 {
      font-size: 22px;
      color: #1e3a8a;
      margin-bottom: 8px;
    }
    .sub-title {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #334155;
      font-size: 15px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #2563eb;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      box-sizing: border-box;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
    }
    .btn-secondary {
      background-color: #64748b;
      color: #ffffff;
    }
    .btn-success {
      background-color: #16a34a;
      color: #ffffff;
    }

    /* 퀴즈 진행 화면 */
    #quiz-screen {
      display: none;
      text-align: left;
    }
    .progress-bar-container {
      width: 100%;
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #2563eb;
      transition: width 0.3s ease;
    }
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 14px;
      font-weight: bold;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    .badge-mcq { background: #dbeafe; color: #1e40af; }
    .badge-sa { background: #fef3c7; color: #92400e; }

    .question-box {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
      color: #0f172a;
      margin-bottom: 20px;
      min-height: 60px;
    }
    .question-box u {
      color: #dc2626;
      text-decoration-thickness: 2px;
    }
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      width: 100%;
      padding: 14px 16px;
      background-color: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      color: #334155;
      cursor: pointer;
      line-height: 1.4;
      transition: all 0.2s;
    }
    .option-btn:active {
      background-color: #dbeafe;
      border-color: #2563eb;
      color: #1e40af;
    }

    .sa-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 오답 화면 */
    #wrong-screen {
      display: none;
      background-color: #fef2f2;
      border: 2px solid #fca5a5;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .wrong-title {
      color: #dc2626;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .explanation-box {
      background: #ffffff;
      padding: 15px;
      border-radius: 10px;
      border-left: 4px solid #dc2626;
      text-align: left;
      font-size: 14px;
      color: #334155;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    /* 성공 화면 */
    #success-screen {
      display: none;
    }
    .trophy {
      font-size: 60px;
      margin-bottom: 10px;
    }
    .success-title {
      font-size: 22px;
      color: #16a34a;
      font-weight: bold;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .result-info {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      margin-bottom: 20px;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .result-item:last-child {
      margin-bottom: 0;
    }
    .result-label {
      color: #475569;
      font-weight: bold;
    }
    .result-value {
      color: #166534;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- 1. 시작 화면 -->
    <div id="start-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>
      <h1>6학년 과학 퀴즈</h1>
      <p class="sub-title">3단원. 전기의 이용</p>

      <div class="input-group">
        <label for="userName">이름을 입력하세요</label>
        <input type="text" id="userName" placeholder="예: 홍길동" autocomplete="off">
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="startQuiz()">시작</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

    <!-- 2. 퀴즈 진행 화면 -->
    <div id="quiz-screen">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      
      <div class="quiz-header">
        <span id="question-number">문제 1 / 10</span>
        <span id="question-type-badge" class="badge badge-mcq">객관식</span>
      </div>

      <div class="question-box" id="question-text"></div>

      <!-- 객관식 영역 -->
      <div class="options-container" id="options-container"></div>

      <!-- 단답식 영역 -->
      <div class="sa-container" id="sa-container" style="display: none;">
        <input type="text" id="sa-input" placeholder="정답 입력" onkeydown="if(event.key==='Enter') submitSAAnswer()">
        <button class="btn btn-primary" onclick="submitSAAnswer()">정답 제출</button>
      </div>
    </div>

    <!-- 3. 오답 화면 -->
    <div id="wrong-screen">
      <div class="wrong-title">❌ 틀렸습니다!</div>
      <div class="explanation-box">
        <strong>💡 간단 해설:</strong>
        <p id="explanation-text" style="margin-top: 6px;"></p>
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="returnToStart()">계속</button>
    </div>

    <!-- 4. 성공 축하 화면 -->
    <div id="success-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>

      <div class="trophy">🎉</div>
      <div class="success-title">축하합니다!<br>10문제를 모두 맞추셨습니다!</div>
      
      <div class="result-info">
        <div class="result-item">
          <span class="result-label">이름</span>
          <span class="result-value" id="result-name">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">총 걸린시간</span>
          <span class="result-value" id="result-time">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">현재 시간</span>
          <span class="result-value" id="result-date">-</span>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-success" onclick="returnToStart()">재도전</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

  </div>

  <script>
    // ----------------------------------------------------
    // 단답식 문제 은행 (지정된 5개 정답 활용)
    // 지정 정답: 전기 회로, 도체, 부도체, 직렬 연결, 전자석
    // ----------------------------------------------------
    const saBank = [
      {
        q: "전지, 전구, 전선과 같은 전기 부품을 서로 연결해 전기가 흐르도록 한 것을 무엇이라고 하나요?",
        ans: "전기 회로",
        exp: "전지, 전구, 전선 등의 전기 부품을 서로 연결하여 전기가 흐르도록 만든 것을 '전기 회로'라고 합니다."
      },
      {
        q: "금속과 같이 전기가 잘 흐르는 물질을 무엇이라고 하나요?",
        ans: "도체",
        exp: "금속과 같이 전기가 잘 흐르는 물질을 '도체'라고 합니다."
      },
      {
        q: "플라스틱, 고무, 종이, 유리 등과 같이 전기가 잘 흐르지 않는 물질을 무엇이라고 하나요?",
        ans: "부도체",
        exp: "플라스틱, 고무, 종이, 유리처럼 전기가 잘 흐르지 않는 물질을 '부도체'라고 합니다."
      },
      {
        q: "전지를 두 개 이상 연결할 때 한 전지의 (+)극을 다른 전지의 (-)극에 연결하는 방법을 전지의 무엇이라고 하나요?",
        ans: "직렬 연결",
        exp: "한 전지의 (+)극을 다른 전지의 (-)극에 이어 붙이는 연결 방식을 전지의 '직렬 연결'이라고 합니다."
      },
      {
        q: "전기가 흐를 때만 자석의 성질이 나타나는 자석을 무엇이라고 하나요?",
        ans: "전자석",
        exp: "전기가 흐를 때만 자석의 성질을 띠고, 전기를 차단하면 자석의 성질을 잃는 자석을 '전자석'이라고 합니다."
      }
    ];

    // ----------------------------------------------------
    // 객관식 문제 은행 (총 35개 - 첨부 이미지 내용 100% 반영)
    // ----------------------------------------------------
    const mcqBank = [
      {
        q: "전구에 불이 켜지는 전기 회로를 만들 때의 조건으로 올바른 것은 무엇인가요?",
        options: [
          "전지의 (+)극부터 (-)극까지 끊어진 곳 없이 연결해야 한다.",
          "전기 부품의 전기가 흐르지 않는 부분끼리 연결해야 한다.",
          "전지를 연결하지 않고 전선과 전구만 이어야 한다.",
          "전선의 안쪽 금속 부분을 제거하고 연결해야 한다."
        ],
        ans: 0,
        exp: "전구에 불이 켜지려면 전지의 (+)극부터 (-)극까지 끊어진 곳 없이 연결하고, 전기가 흐르는 부분끼리 맞닿아야 합니다."
      },
      {
        q: "전지에 대한 설명으로 <u>옳지 않은</u> 것은 무엇인가요?",
        options: [
          "볼록 튀어나온 끝부분이 (+)극이다.",
          "평평한 끝부분이 (-)극이다.",
          "전기 회로에 전기 에너지를 공급한다.",
          "전선의 안쪽을 플라스틱으로 채워주는 역할을 한다."
        ],
        ans: 3,
        exp: "전지는 전기 회로에 전기 에너지를 공급하며, 볼록한 곳이 (+)극, 평평한 곳이 (-)극입니다."
      },
      {
        q: "전지 끼우개에 대한 설명으로 올바른 것은 무엇인가요?",
        options: [
          "전지와 전선을 쉽게 연결하게 해준다.",
          "전기가 흐르지 않도록 차단하는 역할을 한다.",
          "전구의 불빛을 더 밝게 만들어 준다.",
          "스위치 없이 전기를 끄고 켜는 장치이다."
        ],
        ans: 0,
        exp: "전지 끼우개는 전지와 전선을 쉽게 연결할 수 있도록 돕는 전기 부품입니다."
      },
      {
        q: "전선에 대한 설명으로 <u>옳지 않은</u> 것은 무엇인가요?",
        options: [
          "가늘고 긴 모양이다.",
          "안쪽에 금속 부분이 있다.",
          "전기 부품을 서로 연결해 준다.",
          "겉과 속이 모두 유리로 되어 있다."
        ],
        ans: 3,
        exp: "전선은 가늘고 길며, 안쪽에 전기가 통하는 금속 부분이 있습니다."
      },
      {
        q: "스위치를 닫거나 열었을 때 일어나는 현상으로 올바른 것은 무엇인가요?",
        options: [
          "스위치를 닫으면 전기 회로가 연결된다.",
          "스위치를 열면 전기 회로에 전기가 더 잘 흐른다.",
          "스위치를 닫으면 전기 회로의 연결이 끊어진다.",
          "스위치는 전체가 고무로만 만들어져 있다."
        ],
        ans: 0,
        exp: "스위치를 닫으면 전기 회로가 연결되어 전기가 흐르고, 스위치를 열면 연결이 끊어집니다."
      },
      {
        q: "다음 중 전기가 잘 흐르는 '도체'에 해당하는 것은 무엇인가요?",
        options: [
          "금속",
          "플라스틱",
          "고무",
          "유리"
        ],
        ans: 0,
        exp: "금속은 전기가 잘 흐르는 도체이며, 플라스틱, 고무, 유리는 부도체입니다."
      },
      {
        q: "다음 중 전기가 잘 흐르지 않는 '부도체'로만 짝지어진 것은 무엇인가요?",
        options: [
          "플라스틱, 고무, 종이, 유리",
          "철, 구리, 알루미늄, 금속",
          "금속, 유리, 철, 고무",
          "전선 안쪽 금속, 종이, 구리"
        ],
        ans: 0,
        exp: "플라스틱, 고무, 종이, 유리는 전기가 잘 흐르지 않는 부도체입니다."
      },
      {
        q: "전지 두 개를 직렬연결한 전기 회로의 특징으로 올바른 것은 무엇인가요?",
        options: [
          "전지 한 개를 연결했을 때보다 전구가 더 밝다.",
          "전지 한 개를 연결했을 때보다 전동기가 더 천천히 돌아간다.",
          "전지 한 개를 연결했을 때보다 버저 소리가 더 작다.",
          "전지 한 개를 연결했을 때와 전구 밝기가 완전히 같다."
        ],
        ans: 0,
        exp: "전지 두 개를 직렬연결하면 전지가 한 개일 때보다 전구가 더 밝고, 전동기가 더 빠르게 회전하며, 버저 소리가 더 큽니다."
      },
      {
        q: "전지 두 개를 직렬연결한 회로에서 전동기의 변화로 올바른 것은 무엇인가요?",
        options: [
          "전동기가 더 빠르게 회전한다.",
          "전동기가 회전을 멈춘다.",
          "전동기가 더 천천히 회전한다.",
          "전동기의 방향이 계속 불규칙하게 바뀐다."
        ],
        ans: 0,
        exp: "전지를 직렬연결하면 전압이 높아져 전동기가 더 빠르게 회전합니다."
      },
      {
        q: "전지 두 개를 직렬연결한 회로에서 버저의 변화로 올바른 것은 무엇인가요?",
        options: [
          "버저 소리가 더 크다.",
          "버저 소리가 더 작아진다.",
          "버저 소리가 전혀 나지 않는다.",
          "버저가 작동을 멈춘다."
        ],
        ans: 0,
        exp: "전지를 직렬연결하면 버저 소리가 더 커집니다."
      },
      {
        q: "전자석을 만드는 방법으로 올바른 것은 무엇인가요?",
        options: [
          "전선을 같은 방향으로 여러 번 감아서 만든다.",
          "전선을 여러 방향으로 무작위로 꼬아서 만든다.",
          "유리관에 플라스틱 실을 감아서 만든다.",
          "영구 자석에 전기를 통하지 않게 감싸서 만든다."
        ],
        ans: 0,
        exp: "전자석은 전선을 같은 방향으로 여러 번 감아서 만듭니다."
      },
      {
        q: "전자석의 특징에 대한 설명으로 <u>옳지 않은</u> 것은 무엇인가요?",
        options: [
          "전기가 흐를 때만 자석의 성질이 나타난다.",
          "전자석의 세기를 바꿀 수 있다.",
          "전자석의 극을 바꿀 수 있다.",
          "전기를 차단해도 자석의 성질이 영구히 유지된다."
        ],
        ans: 3,
        exp: "전자석은 전기가 흐를 때만 자석의 성질이 나타나며, 전기가 흐르지 않으면 자석의 성질을 잃습니다."
      },
      {

    // ----------------------------------------------------
    // 게임 상태 변수
    // ----------------------------------------------------
    let userName = "";
    let quizQueue = [];
    let currentIdx = 0;
    let startTime = null;

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const wrongScreen = document.getElementById("wrong-screen");
    const successScreen = document.getElementById("success-screen");

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startQuiz() {
      const nameInput = document.getElementById("userName").value.trim();
      if (!nameInput) {
        alert("이름을 입력해 주세요!");
        return;
      }
      userName = nameInput;

      // 1-7번: 객관식 7개 무작위 추출
      // 8-10번: 단답식 3개 무작위 추출
      const selectedMCQs = shuffle(mcqBank).slice(0, 7);
      const selectedSAs = shuffle(saBank).slice(0, 3);

      const formattedMCQs = selectedMCQs.map(item => {
        const correctText = item.options[item.ans];
        const shuffledOptions = shuffle(item.options);
        const newAnsIdx = shuffledOptions.indexOf(correctText);
        return {
          type: "MCQ",
          q: item.q,
          options: shuffledOptions,
          ans: newAnsIdx,
          exp: item.exp
        };
      });

      const formattedSAs = selectedSAs.map(item => ({
        type: "SA",
        q: item.q,
        ans: item.ans,
        exp: item.exp
      }));

      quizQueue = [...formattedMCQs, ...formattedSAs];
      currentIdx = 0;
      startTime = Date.now();

      startScreen.style.display = "none";
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "block";

      renderQuestion();
    }

    function renderQuestion() {
      const qData = quizQueue[currentIdx];
      
      const progressPercent = ((currentIdx + 1) / 10) * 100;
      document.getElementById("progress-bar").style.width = progressPercent + "%";
      document.getElementById("question-number").textContent = `문제 ${currentIdx + 1} / 10`;

      const badge = document.getElementById("question-type-badge");
      const optionsBox = document.getElementById("options-container");
      const saBox = document.getElementById("sa-container");

      document.getElementById("question-text").innerHTML = `${currentIdx + 1}. ${qData.q}`;

      if (qData.type === "MCQ") {
        badge.textContent = "객관식";
        badge.className = "badge badge-mcq";
        optionsBox.style.display = "flex";
        saBox.style.display = "none";

        optionsBox.innerHTML = "";
        qData.options.forEach((optText, idx) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = `${idx + 1}. ${optText}`;
          btn.onclick = () => checkMCQAnswer(idx);
          optionsBox.appendChild(btn);
        });
      } else {
        badge.textContent = "단답식";
        badge.className = "badge badge-sa";
        optionsBox.style.display = "none";
        saBox.style.display = "flex";

        const saInput = document.getElementById("sa-input");
        saInput.value = "";
        setTimeout(() => saInput.focus(), 100);
      }
    }

    function checkMCQAnswer(selectedIdx) {
      const qData = quizQueue[currentIdx];
      if (selectedIdx === qData.ans) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function submitSAAnswer() {
      const qData = quizQueue[currentIdx];
      const userInput = document.getElementById("sa-input").value.trim().replace(/\s+/g, "");
      const targetAns = qData.ans.replace(/\s+/g, "");

      if (!userInput) {
        alert("정답을 입력해주세요.");
        return;
      }

      if (userInput === targetAns) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < 10) {
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function showWrongScreen(explanationText) {
      quizScreen.style.display = "none";
      wrongScreen.style.display = "block";
      document.getElementById("explanation-text").textContent = explanationText;
    }

    function returnToStart() {
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "none";
      startScreen.style.display = "block";
    }

    function finishQuiz() {
      const endTime = Date.now();
      const elapsedSeconds = Math.round((endTime - startTime) / 1000);

      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      const dateStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

      document.getElementById("result-name").textContent = userName;
      document.getElementById("result-time").textContent = `${elapsedSeconds}초`;
      document.getElementById("result-date").textContent = dateStr;

      quizScreen.style.display = "none";
      successScreen.style.display = "block";
    }
  </script>
</body>
</html>
