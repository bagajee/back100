<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>사회 6-2 세계의 자연환경 퀴즈</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
      color: #333;
    }
    .card {
      background: white;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      position: relative;
    }
    .top-nav {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background-color: #e2e8f0;
      color: #475569;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 13px;
      transition: background-color 0.2s;
      flex: 1;
    }
    .nav-btn:active {
      background-color: #cbd5e1;
    }
    h1 {
      font-size: 22px;
      color: #2b6cb0;
      margin-bottom: 8px;
    }
    .sub-title {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 20px;
    }
    .input-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #334155;
      font-size: 15px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #3182ce;
    }
    .btn-group {
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background-color: #3182ce;
      color: white;
    }
    .btn-secondary {
      background-color: #94a3b8;
      color: white;
    }
    .btn-success {
      background-color: #38a169;
      color: white;
    }

    /* 카운트다운 화면 */
    #countdown-screen {
      display: none;
      padding: 40px 0;
    }
    .countdown-number {
      font-size: 80px;
      font-weight: 900;
      color: #dd6b20;
      animation: pulse 0.8s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }

    /* 퀴즈 화면 */
    #quiz-screen {
      display: none;
      text-align: left;
    }
    .progress-bar-container {
      width: 100%;
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #3182ce;
      transition: width 0.3s ease;
    }
    .quiz-header {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 12px;
      font-weight: bold;
    }
    .badge {
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12px;
    }
    .badge-mcq { background: #ebf8ff; color: #2b6cb0; }
    .badge-sa { background: #feebc8; color: #c05621; }

    .question-box {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
      color: #1e293b;
      margin-bottom: 20px;
      min-height: 60px;
    }
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      width: 100%;
      padding: 14px 16px;
      background-color: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      color: #334155;
      cursor: pointer;
      line-height: 1.4;
      transition: all 0.2s;
    }
    .option-btn:active {
      background-color: #ebf8ff;
      border-color: #3182ce;
      color: #2b6cb0;
    }

    .sa-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 오답 화면 */
    #wrong-screen {
      display: none;
      background-color: #fff5f5;
      border: 2px solid #feb2b2;
      border-radius: 16px;
      padding: 20px;
      margin-top: 10px;
      text-align: center;
    }
    .wrong-title {
      color: #e53e3e;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .explanation-box {
      background: white;
      padding: 15px;
      border-radius: 10px;
      border-left: 4px solid #e53e3e;
      text-align: left;
      font-size: 14px;
      color: #4a5568;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    /* 성공 화면 */
    #success-screen {
      display: none;
    }
    .trophy {
      font-size: 60px;
      margin-bottom: 10px;
    }
    .success-title {
      font-size: 24px;
      color: #2f855a;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .result-info {
      background-color: #f0fff4;
      border: 1px solid #c6f6d5;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      margin-bottom: 20px;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .result-item:last-child {
      margin-bottom: 0;
    }
    .result-label {
      color: #4a5568;
      font-weight: bold;
    }
    .result-value {
      color: #22543d;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- 1. 처음 화면 -->
    <div id="start-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
        <a href="../social.html" class="nav-btn">📚 단원 선택</a>
      </div>
      <h1>사회 6-2 스피드 퀴즈</h1>
      <p class="sub-title">1. 세계의 자연환경 (총 10문제 도전)</p>

      <div class="input-group">
        <label for="userName">도전자의 이름을 입력하세요</label>
        <input type="text" id="userName" placeholder="이름 입력 (예: 홍길동)" autocomplete="off">
      </div>

      <div class="btn-group">
        <button class="btn btn-secondary" onclick="resetForm()">재도전 (초기화)</button>
        <button class="btn btn-primary" onclick="startQuizProcess()">시작하기</button>
      </div>
    </div>

    <!-- 2. 카운트다운 화면 -->
    <div id="countdown-screen">
      <h2 style="color: #4a5568; margin-bottom: 20px;">곧 퀴즈가 시작됩니다!</h2>
      <div class="countdown-number" id="countdown-timer">3</div>
    </div>

    <!-- 3. 퀴즈 진행 화면 -->
    <div id="quiz-screen">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      
      <div class="quiz-header">
        <span id="question-number">문제 1 / 10</span>
        <span id="question-type-badge" class="badge badge-mcq">객관식</span>
      </div>

      <div class="question-box" id="question-text"></div>

      <!-- 객관식 영역 -->
      <div class="options-container" id="options-container"></div>

      <!-- 단답식 영역 -->
      <div class="sa-container" id="sa-container" style="display: none;">
        <input type="text" id="sa-input" placeholder="정답을 입력하세요" onkeydown="if(event.key==='Enter') submitSAAnswer()">
        <button class="btn btn-primary" onclick="submitSAAnswer()">정답 제출</button>
      </div>
    </div>

    <!-- 4. 오답 화면 -->
    <div id="wrong-screen">
      <div class="wrong-title">❌ 틀렸습니다!</div>
      <div class="explanation-box">
        <strong>💡 핵심 해설:</strong>
        <p id="explanation-text" style="margin-top: 5px;"></p>
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="returnToStart()">처음 단계로 돌아가기</button>
    </div>

    <!-- 5. 성공 축하 화면 -->
    <div id="success-screen">
      <div class="trophy">🏆</div>
      <div class="success-title">축하합니다! 10문제 모두 맞추셨습니다!</div>
      
      <div class="result-info">
        <div class="result-item">
          <span class="result-label">도전자 Name</span>
          <span class="result-value" id="result-name">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">총 걸린 시간</span>
          <span class="result-value" id="result-time">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">완료 시각</span>
          <span class="result-value" id="result-date">-</span>
        </div>
      </div>

      <div class="top-nav" style="margin-bottom: 12px;">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
        <a href="../social.html" class="nav-btn">📚 단원 선택</a>
      </div>
      <button class="btn btn-success" style="width: 100%;" onclick="returnToStart()">다시 도전하기</button>
    </div>

  </div>

  <script>
    // ----------------------------------------------------
    // 문제 은행 데이터 (제시된 학습지 내용 100% 반영)
    // ----------------------------------------------------

    // 객관식 문제 은행 (21문제)
    const mcqBank = [
      {
        q: "송네 피오르의 주요 지형 경관 특징으로 옳은 것은 무엇인가요?",
        options: ["가파른 산으로 둘러싸인 매우 좁고 긴 해안선이 있다.", "용암이 흐르는 화산 지형이다.", "바다 위에 우뚝 솟은 아치 모양의 바위가 있다.", "광활하게 펼쳐진 모래 언덕이 있다."],
        ans: 0,
        exp: "송네 피오르에는 가파른 산으로 둘러싸인 매우 좁고 긴 해안선이 발달해 있습니다."
      },
      {
        q: "바다 위에 우뚝 솟은 아치 모양의 바위를 볼 수 있는 유명한 지형 경관은 어디인가요?",
        options: ["엘 아르코", "마우나로아", "송네 피오르", "사하라 사막"],
        ans: 0,
        exp: "엘 아르코는 바다 위에 우뚝 솟은 아치 모양의 바위가 특징입니다."
      },
      {
        q: "용암이 흐르는 모습을 직접 볼 수 있는 대표적인 화산 지형은 무엇인가요?",
        options: ["마우나로아", "히말라야산맥", "호스슈 벤드 계곡", "포트 캠벨 국립 공원"],
        ans: 0,
        exp: "마우나로아는 용암이 흐르는 모습을 볼 수 있는 화산입니다."
      },
      {
        q: "산지의 경사가 가파른 곳에서 주로 이루어지는 농사 형태는 무엇인가요?",
        options: ["계단식 농사", "수경 재배", "대규모 기계 농사", "염전 농사"],
        ans: 0,
        exp: "바나우에처럼 산지의 경사가 가파른 곳에서는 계단식 농사를 짓습니다."
      },
      {
        q: "지하자원이 풍부한 산지 지형(예: 추키카마타)에서 크게 발달하는 산업은 무엇인가요?",
        options: ["광업", "어업", "양식업", "수상 시장"],
        ans: 0,
        exp: "지하자원이 풍부한 산지에서는 광업이 발달합니다."
      },
      {
        q: "하천 주변에 발달하는 넓고 평평한 토지를 무엇이라고 하나요?",
        options: ["평야", "갯벌", "절벽", "고원"],
        ans: 0,
        exp: "나일강 평야처럼 하천 주변에는 넓은 평야가 발달합니다."
      },
      {
        q: "콩고강과 같이 하천 지형에서 물고기를 잡으며 살아가는 대표적인 생활 모습은 무엇인가요?",
        options: ["어업", "광업", "염전", "계단식 농사"],
        ans: 0,
        exp: "하천 지형에서는 어업이 활발하게 이루어집니다."
      },
      {
        q: "일리노이강 주변 평야처럼 넓은 하천 평야를 이용해 이루어지는 생활 모습은 무엇인가요?",
        options: ["큰 규모로 농사짓기", "양식업 하기", "바닷물 말려 소금 얻기", "지하자원 채굴하기"],
        ans: 0,
        exp: "넓은 하천 평야를 이용하여 큰 규모로 농사를 짓습니다."
      },
      {
        q: "하천 지형의 풍부한 물을 이용하여 전기를 만드는 대표적인 국가로 제시된 곳은 어디인가요?",
        options: ["노르웨이", "스리랑카", "네덜란드", "프랑스"],
        ans: 0,
        exp: "노르웨이는 하천의 풍부한 물을 이용하여 전기를 만듭니다."
      },
      {
        q: "짜오프라야강처럼 하천을 따라 물건을 옮기거나 사고파는 시장을 무엇이라고 하나요?",
        options: ["수상 시장", "염전", "피오르", "해안 항구"],
        ans: 0,
        exp: "짜오프라야강에는 하천을 따라 물건을 사고파는 수상 시장이 형성되어 있습니다."
      },
      {
        q: "펀디만 갯벌, 마케나 모래사장, 포트 캠벨 국립 공원의 거대한 절벽은 모두 어떤 지형의 경관 특징인가요?",
        options: ["해안 지형", "산지 지형", "하천 지형", "사막 지형"],
        ans: 0,
        exp: "갯벌, 모래사장, 해안 절벽과 돌기둥 등은 해안 지형의 경관 특징입니다."
      },
      {
        q: "배가 드나들기에 유리하여 네덜란드 등 해안 지역에 크게 발달하는 시설은 무엇인가요?",
        options: ["항구", "수상 시장", "계단식 밭", "고원"],
        ans: 0,
        exp: "배가 드나들기 유리한 해안에는 항구가 발달합니다."
      },
      {
        q: "프랑스 게랑드 지역처럼 넓은 갯벌 해안을 활용하여 소금을 생산하는 곳은 무엇인가요?",
        options: ["염전", "항구", "계곡", "폭포"],
        ans: 0,
        exp: "갯벌이 넓게 펼쳐진 해안에는 염전이 발달합니다."
      },
      {
        q: "다음 중 '산지 지형'의 경관 특징으로 올바르지 않은 것은 무엇인가요?",
        options: ["넓은 갯벌과 염전이 발달한다.", "해발 고도가 높고 대체로 경사가 급하다.", "고원과 같이 비교적 넓고 평평한 곳도 있다.", "산 정상이 움푹 파이거나 물이 고인 화산이 있다."],
        ans: 0,
        exp: "넓은 갯벌과 염전은 산지 지형이 아니라 '해안 지형'의 특징입니다."
      },
      {
        q: "지형 경관과 생활 모습을 조사해 소개하는 방법 중 가장 먼저 해야 하는 단계는 무엇인가요?",
        options: ["조사하고 싶은 주제 정하기", "인터넷으로 조사하기", "소개 자료 내용 정리하기", "발표하기"],
        ans: 0,
        exp: "조사 소개의 1단계는 '조사하고 싶은 주제 정하기'입니다."
      },
      {
        q: "지형 경관과 생활 모습을 조사해 소개하는 단계의 마지막(⑤단계)은 무엇인가요?",
        options: ["발표하기", "인터넷으로 조사하기", "주제 정하기", "프레젠테이션 도구로 만들기"],
        ans: 0,
        exp: "조사 및 소개 자료 제작 후 마지막 5단계는 '발표하기'입니다."
      },
      {
        q: "호스슈 벤드 계곡, 나일강 평야, 빅토리아 폭포 등은 어느 지형에 속하나요?",
        options: ["하천 지형", "산지 지형", "해안 지형", "사막 지형"],
        ans: 0,
        exp: "계곡, 강 주변 평야, 폭포는 모두 '하천 지형'의 경관 특징입니다."
      },
      {
        q: "알프스산맥과 아이슬란드처럼 아름답고 독특한 산지 지형 경관을 이용하는 생활 모습은 무엇인가요?",
        options: ["관광지로 이용한다.", "염전을 조성한다.", "수상 시장을 연다.", "대규모 벼농사를 짓는다."],
        ans: 0,
        exp: "아름답거나 독특한 산지 지형 경관은 관광지로 활용됩니다."
      },
      {
        q: "바나우에에서 산지의 가파른 경사를 활용하여 이용하는 농사 형태는 무엇인가요?",
        options: ["계단식 농사", "양식업", "염전 농사", "과수원 농사"],
        ans: 0,
        exp: "바나우에는 산지의 가파른 경사를 활용해 계단식 농사를 짓습니다."
      },
      {
        q: "산지 지형 중 산 정상이 움푹 파이거나 물이 고여 있는 화산의 예로 본문에 제시된 곳은 어디인가요?",
        options: ["파리나코타 화산", "마우나로아 화산", "백두산 화산", "한라산 화산"],
        ans: 0,
        exp: "파리나코타 화산은 산 정상이 움푹 파이거나 물이 고인 산지 지형의 예시입니다."
      },
      {
        q: "멕시코 해변이나 이구아수 폭포처럼 경관이 아름다운 지형 주변에 형성되는 것은 무엇인가요?",
        options: ["관광지", "광업 단지", "수상 시장", "계단식 논"],
        ans: 0,
        exp: "경관이 아름다운 해안이나 하천(폭포)에는 관광지가 형성됩니다."
      }
    ];

    // 단답식 문제 은행 (9문제 - 지정된 정답어에 맞춤)
    const saBank = [
      {
        q: "세계에는 산지, 하천, 해안, 사막 등 땅의 다양한 모양이 있습니다. 이처럼 다양한 땅의 형태를 무엇이라고 하나요?",
        ansList: ["지형"],
        exp: "세계에는 산지, 하천, 해안, 사막 등 다양한 (지형)이 있습니다."
      },
      {
        q: "지형 경관은 그곳에서 살아가는 사람들의 의식주와 일상적인 (   )에 큰 영향을 줍니다. 빈칸에 들어갈 말은 무엇인가요?",
        ansList: ["생활 모습", "생활모습"],
        exp: "지형 경관은 그곳에서 살아가는 사람들의 (생활 모습)에 영향을 줍니다."
      },
      {
        q: "송네 피오르에서 볼 수 있는, 가파른 산으로 둘러싸인 매우 좁고 긴 육지와 바다의 경계선을 무엇이라고 하나요?",
        ansList: ["해안선"],
        exp: "송네 피오르에는 가파른 산으로 둘러싸인 매우 좁고 긴 (해안선)이 있습니다."
      },
      {
        q: "광활하게 펼쳐진 모래 언덕을 볼 수 있는 대표적인 유명 사막은 어디인가요?",
        ansList: ["사하라 사막", "사하라사막"],
        exp: "(사하라 사막)에는 광활하게 펼쳐진 모래 언덕이 있습니다."
      },
      {
        q: "황토가 섞여 색이 누런 강물이 굽이쳐 길게 흐르는 중국의 대표적인 강은 무엇인가요?",
        ansList: ["황허강"],
        exp: "(황허강)은 황토가 섞여 색이 누런 강물이 굽이쳐 흐릅니다."
      },
      {
        q: "히말라야산맥처럼 해발 고도가 높고 경사가 급하거나, 아비시니아고원처럼 넓고 평평한 곳이 포함된 지형의 종류를 무엇이라고 하나요?",
        ansList: ["산지 지형", "산지지형"],
        exp: "히말라야산맥, 아비시니아고원, 파리나코타 화산 등은 (산지 지형)에 속합니다."
      },
      {
        q: "아마존강, 호스슈 벤드 계곡, 나일강 평야, 빅토리아 폭포 등이 속하는 지형의 종류는 무엇인가요?",
        ansList: ["하천 지형", "하천지형"],
        exp: "강, 계곡, 평야, 폭포 등의 웅장한 경관이 나타나는 지형은 (하천 지형)입니다."
      },
      {
        q: "넓은 갯벌, 모래사장, 거대한 절벽과 돌기둥 등이 나타나며 항구나 염전이 발달하는 지형의 종류는 무엇인가요?",
        ansList: ["해안 지형", "해안지형"],
        exp: "갯벌, 모래사장, 절벽, 항구, 염전 등이 발달하는 지형은 (해안 지형)입니다."
      },
      {
        q: "산지 지형 중 비교적 평탄하여 가축을 기르는 생활 모습의 예로 제시된 고원의 이름은 무엇인가요?",
        ansList: ["파미르 고원", "파미르고원"],
        exp: "산지의 비교적 평탄한 곳에서 가축을 기르는 대표적 예는 (파미르 고원)입니다."
      }
    ];

    // ----------------------------------------------------
    // 게임 전역 상태 관리
    // ----------------------------------------------------
    let userName = "";
    let quizQueue = [];
    let currentIdx = 0;
    let startTime = null;

    // DOM 요소
    const startScreen = document.getElementById("start-screen");
    const countdownScreen = document.getElementById("countdown-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const wrongScreen = document.getElementById("wrong-screen");
    const successScreen = document.getElementById("success-screen");

    // 초기화 버튼
    function resetForm() {
      document.getElementById("userName").value = "";
    }

    // 배열 셔플 함수
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 퀴즈 시작 프로세스
    function startQuizProcess() {
      const nameInput = document.getElementById("userName").value.trim();
      if (!nameInput) {
        alert("이름을 입력해 주세요!");
        return;
      }
      userName = nameInput;

      // 화면 전환 -> 카운트다운
      startScreen.style.display = "none";
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      countdownScreen.style.display = "block";

      let count = 3;
      const countEl = document.getElementById("countdown-timer");
      countEl.textContent = count;

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          countEl.textContent = count;
        } else {
          clearInterval(timer);
          countdownScreen.style.display = "none";
          initQuizData();
        }
      }, 1000);
    }

    // 퀴즈 데이터 생성 (1~7번: 객관식 7개, 8~10번: 단답식 3개)
    function initQuizData() {
      const selectedMCQs = shuffleArray(mcqBank).slice(0, 7);
      const selectedSAs = shuffleArray(saBank).slice(0, 3);

      // 객관식 문제 처리 (선택지 셔플)
      const formattedMCQs = selectedMCQs.map(item => {
        const correctText = item.options[item.ans];
        const shuffledOptions = shuffleArray(item.options);
        const newAnsIdx = shuffledOptions.indexOf(correctText);
        return {
          type: "MCQ",
          q: item.q,
          options: shuffledOptions,
          ans: newAnsIdx,
          exp: item.exp
        };
      });

      // 단답식 문제 처리
      const formattedSAs = selectedSAs.map(item => ({
        type: "SA",
        q: item.q,
        ansList: item.ansList,
        exp: item.exp
      }));

      quizQueue = [...formattedMCQs, ...formattedSAs];
      currentIdx = 0;
      startTime = Date.now();

      quizScreen.style.display = "block";
      renderQuestion();
    }

    // 문제 렌더링
    function renderQuestion() {
      const qData = quizQueue[currentIdx];
      
      // 진행률 바
      const progressPercent = ((currentIdx + 1) / 10) * 100;
      document.getElementById("progress-bar").style.width = progressPercent + "%";
      document.getElementById("question-number").textContent = `문제 ${currentIdx + 1} / 10`;

      // Badge & Type
      const badge = document.getElementById("question-type-badge");
      const optionsBox = document.getElementById("options-container");
      const saBox = document.getElementById("sa-container");

      document.getElementById("question-text").textContent = `${currentIdx + 1}. ${qData.q}`;

      if (qData.type === "MCQ") {
        badge.textContent = "객관식";
        badge.className = "badge badge-mcq";
        optionsBox.style.display = "flex";
        saBox.style.display = "none";

        optionsBox.innerHTML = "";
        qData.options.forEach((optText, idx) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = `${idx + 1} ${optText}`;
          btn.onclick = () => checkMCQAnswer(idx);
          optionsBox.appendChild(btn);
        });
      } else {
        badge.textContent = "단답식";
        badge.className = "badge badge-sa";
        optionsBox.style.display = "none";
        saBox.style.display = "flex";

        const saInput = document.getElementById("sa-input");
        saInput.value = "";
        saInput.focus();
      }
    }

    // 객관식 정답 검사
    function checkMCQAnswer(selectedIdx) {
      const qData = quizQueue[currentIdx];
      if (selectedIdx === qData.ans) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    // 단답식 정답 검사
    function submitSAAnswer() {
      const qData = quizQueue[currentIdx];
      const userInput = document.getElementById("sa-input").value.trim().replace(/\s+/g, "");
      
      // 공백 무시 비교
      const isCorrect = qData.ansList.some(targetAns => {
        return targetAns.replace(/\s+/g, "") === userInput;
      });

      if (isCorrect) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    // 다음 문제로 이동
    function nextQuestion() {
      currentIdx++;
      if (currentIdx < 10) {
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    // 오답 화면
    function showWrongScreen(explanationText) {
      quizScreen.style.display = "none";
      wrongScreen.style.display = "block";
      document.getElementById("explanation-text").textContent = explanationText;
    }

    // 시작 화면으로 복귀
    function returnToStart() {
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "none";
      startScreen.style.display = "block";
    }

    // 퀴즈 완등 (성공)
    function finishQuiz() {
      const endTime = Date.now();
      const elapsedSeconds = Math.floor((endTime - startTime) / 1000);
      
      const mins = Math.floor(elapsedSeconds / 60);
      const secs = elapsedSeconds % 60;
      const timeStr = mins > 0 ? `${mins}분 ${secs}초` : `${secs}초`;

      const now = new Date();
      const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

      document.getElementById("result-name").textContent = userName;
      document.getElementById("result-time").textContent = timeStr;
      document.getElementById("result-date").textContent = dateStr;

      quizScreen.style.display = "none";
      successScreen.style.display = "block";
    }
  </script>
</body>
</html>
