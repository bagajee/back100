<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>6학년 2학기 수학</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      word-break: keep-all;
    }
    body {
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #eef2f7;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: white;
      padding: 1.8rem 1.5rem;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 480px;
      text-align: center;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }
    .hidden { display: none !important; }
    
    /* 상단 네비게이션 헤더 */
    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .btn-home {
      width: auto !important;
      padding: 6px 12px !important;
      margin: 0 !important;
      background: #eef2f7 !important;
      color: #2c3e50 !important;
      font-size: 0.85rem !important;
      border-radius: 8px !important;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      border: 1px solid #cbd5e1 !important;
      font-weight: bold;
    }
    .btn-home:active { background: #dbe3ed !important; }

    button {
      width: 100%;
      padding: 12px 10px;
      margin: 4px 0;
      border: none;
      border-radius: 10px;
      background: #4a90e2;
      color: white;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      touch-action: manipulation;
    }
    button:active { transform: scale(0.98); }
    button.btn-sub { background: #27ae60; text-align: left; padding-left: 14px; }
    button.btn-total { background: #e67e22; text-align: left; padding-left: 14px; font-weight: 800; }
    button.btn-secondary { background: #95a5a6; margin-top: 10px; }
    button.btn-retry { background: #e74c3c; margin-top: 10px; }
    
    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 1.05rem;
      text-align: center;
      outline: none;
    }
    
    .chapter-title {
      margin: 18px 0 6px 0;
      text-align: left;
      color: #2c3e50;
      font-size: 1.05rem;
      border-bottom: 2px solid #eef2f7;
      padding-bottom: 4px;
    }
    
    .question-box {
      min-height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 15px 0 20px 0;
      gap: 8px;
    }
    .question-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      background: #e8f8f0; 
      color: #27ae60; 
      border: 1px solid #27ae60;
    }
    
    .question-main-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: #2c3e50;
      line-height: 1.5;
    }
    
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .options button {
      margin: 0;
      font-size: 1.05rem;
      padding: 16px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .progress-bar { background: #eee; height: 10px; border-radius: 5px; margin-bottom: 15px; overflow: hidden; }
    .progress-fill { background: #4a90e2; height: 100%; width: 0%; transition: width 0.3s; }

    /* 모달 (해설창) 스타일 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      text-align: left;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: #e74c3c;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .modal-body {
      font-size: 0.95rem;
      color: #333;
      line-height: 1.5;
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    /* 분수 표현 스타일 */
    .frac-container {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-weight: bold;
    }
    .frac-whole {
      font-size: 1.15em;
      line-height: 1;
      padding-right: 1px;
    }
    .frac {
      display: inline-flex;
      flex-direction: column;
      vertical-align: middle;
      text-align: center;
      font-size: 0.9em;
      line-height: 1.1;
      padding: 0 3px;
    }
    .frac > span { display: block; padding: 1px 2px; }
    .frac span.bottom { border-top: 2px solid currentColor; }
    
    .eq-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <button class="btn-sub" onclick="openSetup('2-3', '3) (소수 두 자리) ÷ (소수 한 자리)')">🟢 3) (소수 두 자리) ÷ (소수 한 자리)</button>
  <button class="btn-sub" onclick="openSetup('2-4', '4) (자연수) ÷ (소수)')">🟢 4) (자연수) ÷ (소수)</button>

<script>
let userName = "";
let selectedCategory = "";
let currentSubTitle = "";
let correctCount = 0;
const totalQuestions = 20;
let startTime, endTime;
let qData = {};

function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

function goHome() {
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById('explanation-modal').classList.add('hidden');
  document.getElementById('home-screen').classList.remove('hidden');
}

function openSetup(catKey, subTitle) {
  selectedCategory = catKey;
  currentSubTitle = subTitle;
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById('explanation-modal').classList.add('hidden');
  document.getElementById('setup-screen').classList.remove('hidden');
  document.getElementById('setup-title').innerText = subTitle;
}

function startCountDown() {
  userName = document.getElementById("username").value.trim();
  if(!userName) { alert("이름을 입력해주세요!"); return; }
  
  correctCount = 0;
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById("countdown-screen").classList.remove("hidden");
  
  let count = 3;
  document.getElementById("countdown-text").innerText = count;
  let timer = setInterval(() => {
    count--;
    if(count > 0) {
      document.getElementById("countdown-text").innerText = count;
    } else {
      clearInterval(timer);
      document.getElementById("countdown-screen").classList.add("hidden");
      document.getElementById("quiz-screen").classList.remove("hidden");
      startTime = new Date().getTime();
      loadNextQuestion();
    }
  }, 1000);
}

// 분수 HTML UI 표현 함수
function formatFracHTML(num, denom) {
  let g = gcd(num, denom);
  num /= g; denom /= g;
  if (denom === 1) return `<span>${num}</span>`;
  if (num > denom) {
    let m = Math.floor(num / denom);
    let r = num % denom;
    return renderFracHTML(m, r, denom);
  }
  return renderFracHTML(0, num, denom);
}

function renderFracHTML(m, n, d) {
  let fracPart = `<div class="frac"><span>${n}</span><span class="bottom">${d}</span></div>`;
  if (m > 0) return `<div class="frac-container"><span class="frac-whole">${m}</span>${fracPart}</div>`;
  return `<div class="frac-container">${fracPart}</div>`;
}

// 6학년 2학기 문제 및 해설 생성 함수
function generateSingleQuestion(cat) {
  let q = "", answer = "", options = [], exp = "";

  // 01단원: 분수의 나눗셈
  if (cat.startsWith('1-')) {
    let n1, d1, m1 = 0, n2, d2;
    if (cat === '1-1') { // (분수) ÷ (분수)
      d1 = Math.floor(Math.random() * 6) + 3; n1 = Math.floor(Math.random() * (d1 - 1)) + 1;
      d2 = Math.floor(Math.random() * 6) + 2; n2 = Math.floor(Math.random() * (d2 - 1)) + 1;
      q = `<div class="eq-row">${renderFracHTML(0,n1,d1)} <span>÷</span> ${renderFracHTML(0,n2,d2)} <span>= ?</span></div>`;
      answer = formatFracHTML(n1 * d2, d1 * n2);
      exp = `분수의 나눗셈은 나누는 분수의 분모와 분자를 바꾸어 곱셈으로 계산합니다.`;
    } else if (cat === '1-2') { // (자연수) ÷ (분수)
      let k = Math.floor(Math.random() * 8) + 2;
      d2 = Math.floor(Math.random() * 6) + 2; n2 = Math.floor(Math.random() * (d2 - 1)) + 1;
      q = `<div class="eq-row"><span>${k} ÷ </span> ${renderFracHTML(0,n2,d2)} <span>= ?</span></div>`;
      answer = formatFracHTML(k * d2, n2);
      exp = `자연수 나누기 분수는 자연수에 나누는 분수의 분모를 곱하고 분자로 나누어 계산합니다. (${k} × ${d2}/${n2})`;
    } else if (cat === '1-3') { // (대분수) ÷ (분수)
      d1 = Math.floor(Math.random() * 4) + 2; n1 = Math.floor(Math.random() * (d1 - 1)) + 1; m1 = Math.floor(Math.random() * 2) + 1;
      d2 = Math.floor(Math.random() * 5) + 2; n2 = Math.floor(Math.random() * (d2 - 1)) + 1;
      let totalN1 = m1 * d1 + n1;
      q = `<div class="eq-row">${renderFracHTML(m1,n1,d1)} <span>÷</span> ${renderFracHTML(0,n2,d2)} <span>= ?</span></div>`;
      answer = formatFracHTML(totalN1 * d2, d1 * n2);
      exp = `대분수를 가분수로 바꾼 뒤(${totalN1}/${d1}), 나누는 분수를 역수로 바꾸어 곱해줍니다.`;
    }
    
    options = [answer];
    let dummyOffset = 1;
    while(options.length < 4) {
      let dummy = formatFracHTML((n1||2)*d2 + dummyOffset, (d1||3)*(n2||1));
      if (!options.includes(dummy)) options.push(dummy);
      dummyOffset += 2;
    }
  }

  // 02단원: 소수의 나눗셈
  else if (cat.startsWith('2-')) {
    if (cat === '2-1') { // (소수 한 자리) ÷ (소수 한 자리)
      let divisor = (Math.floor(Math.random() * 8) + 2) / 10;
      let quotient = Math.floor(Math.random() * 15) + 2;
      let dividend = Number((divisor * quotient).toFixed(1));
      q = `<b>${dividend} ÷ ${divisor.toFixed(1)}</b> 계산 결과는?`;
      answer = quotient.toString();
      exp = `나누는 수와 나누어지는 수의 소수점을 똑같이 오른쪽으로 1칸씩 이동하여 자연수의 나눗셈으로 계산합니다.`;
    } else if (cat === '2-2') { // (소수 두 자리) ÷ (소수 두 자리)
      let divisor = (Math.floor(Math.random() * 25) + 5) / 100;
      let quotient = Math.floor(Math.random() * 18) + 2;
      let dividend = Number((divisor * quotient).toFixed(2));
      q = `<b>${dividend} ÷ ${divisor.toFixed(2)}</b> 계산 결과는?`;
      answer = quotient.toString();
      exp = `나누는 수와 나누어지는 수의 소수점을 똑같이 오른쪽으로 2칸씩 이동하여 계산합니다.`;
    } else if (cat === '2-3') { // (소수 두 자리) ÷ (소수 한 자리)
      let divisor = (Math.floor(Math.random() * 8) + 2) / 10;
      let quotient = (Math.floor(Math.random() * 40) + 11) / 10;
      let dividend = Number((divisor * quotient).toFixed(2));
      q = `<b>${dividend} ÷ ${divisor.toFixed(1)}</b> 계산 결과는?`;
      answer = quotient.toString();
      exp = `나누는 수의 소수점을 1칸 이동할 때 나누어지는 수의 소수점도 1칸 이동하여 소수의 나눗셈을 합니다.`;
    } else if (cat === '2-4') { // (자연수) ÷ (소수)
      let divisor = (Math.floor(Math.random() * 8) + 2) / 10;
      let quotient = (Math.floor(Math.random() * 20) + 5) * 5;
      let dividend = Math.round(divisor * quotient);
      q = `<b>${dividend} ÷ ${divisor.toFixed(1)}</b> 계산 결과는?`;
      answer = quotient.toString();
      exp = `나누는 수의 소수점을 이동시켜 자연수로 만든 만큼 나누어지는 수에도 0을 붙여 계산합니다.`;
    }

    options = [answer];
    let numAns = parseFloat(answer);
    while(options.length < 4) {
      let diff = (options.length % 2 === 1) ? options.length : -options.length;
      let w = Number((numAns + diff * (numAns % 1 !== 0 ? 0.3 : 2)).toFixed(1)).toString();
      if (parseFloat(w) > 0 && !options.includes(w)) options.push(w);
    }
  }

  // 04단원: 비례식과 비례배분
  else if (cat.startsWith('4-')) {
    if (cat === '4-1') { // 비의 성질
      let a = Math.floor(Math.random() * 5) + 2;
      let b = Math.floor(Math.random() * 7) + 3;
      while(gcd(a,b) > 1) { b++; }
      let mult = Math.floor(Math.random() * 4) + 2;
      let isUnknownA = Math.random() < 0.5;
      
      if(isUnknownA) {
        q = `<b>${a} : ${b} = □ : ${b * mult}</b> 에서 <b>□</b>에 들어갈 수는?`;
        answer = (a * mult).toString();
      } else {
        q = `<b>${a} : ${b} = ${a * mult} : □</b> 에서 <b>□</b>에 들어갈 수는?`;
        answer = (b * mult).toString();
      }
      exp = `비의 전항과 후항에 0이 아닌 같은 수를 곱하거나 나누어도 비율은 같습니다. (외항의 곱 = 내항의 곱)`;
    } else if (cat === '4-2') { // 간단한 자연수의 비
      let baseA = Math.floor(Math.random() * 6) + 2;
      let baseB = Math.floor(Math.random() * 6) + 2;
      while(baseA === baseB || gcd(baseA, baseB) > 1) { baseB = Math.floor(Math.random() * 6) + 2; }
      let k = Math.floor(Math.random() * 5) + 2;
      
      q = `비 <b>${baseA * k} : ${baseB * k}</b>를 가장 간단한 자연수의 비로 나타내면?`;
      answer = `${baseA} : ${baseB}`;
      exp = `비의 전항과 후항을 두 수의 최대공약수(${k})로 나누어 가장 간단한 자연수의 비로 나타냅니다.`;
    } else if (cat === '4-3') { // 비례배분
      let m = Math.floor(Math.random() * 4) + 2;
      let n = Math.floor(Math.random() * 4) + 2;
      while(m === n) n++;
      let totalParts = m + n;
      let unit = (Math.floor(Math.random() * 8) + 2) * 100;
      let totalValue = unit * totalParts;

      q = `<b>${totalValue}</b>를 <b>${m} : ${n}</b>으로 비례배분할 때, 더 큰 값은?`;
      answer = (Math.max(m, n) * unit).toString();
      exp = `전체 수량을 두 비의 합(${totalParts})으로 나누어 1부분의 값(${unit})을 구한 뒤, 더 큰 비의 값(${Math.max(m, n)})을 곱해줍니다.`;
    }

    options = [answer];
    while(options.length < 4) {
      if (cat === '4-2') {
        let dummyA = Math.floor(Math.random() * 5) + 1;
        let dummyB = Math.floor(Math.random() * 5) + 1;
        let dummyStr = `${dummyA} : ${dummyB}`;
        if (!options.includes(dummyStr)) options.push(dummyStr);
      } else {
        let numAns = parseInt(answer);
        let dummyVal = numAns + (options.length * 5 - 2);
        if (dummyVal > 0 && !options.includes(dummyVal.toString())) options.push(dummyVal.toString());
      }
    }
  }

  // 05단원: 원의 둘레와 넓이
  else if (cat.startsWith('5-')) {
    let pi = 3.14;
    let r = Math.floor(Math.random() * 8) + 2;
    
    if (cat === '5-1') {
      let d = r * 2;
      q = `반지름이 <b>${r}cm</b>인 원의 둘레(원주)는 몇 cm일까요?<br><span style="font-size:0.85rem; color:#777;">(원주율: 3.14)</span>`;
      answer = (d * pi).toFixed(2);
      exp = `원주 = 지름 × 원주율 = (${r} × 2) × 3.14 = ${answer}cm 입니다.`;
    } else if (cat === '5-2') {
      q = `반지름이 <b>${r}cm</b>인 원의 넓이는 몇 cm²일까요?<br><span style="font-size:0.85rem; color:#777;">(원주율: 3.14)</span>`;
      answer = (r * r * pi).toFixed(2);
      exp = `원의 넓이 = 반지름 × 반지름 × 원주율 = ${r} × ${r} × 3.14 = ${answer}cm² 입니다.`;
    }

    options = [answer];
    let numAns = parseFloat(answer);
    while(options.length < 4) {
      let offset = (options.length % 2 === 1) ? options.length * 3.14 : -options.length * 3.14;
      let dummyVal = Number((numAns + offset).toFixed(2)).toString();
      if (parseFloat(dummyVal) > 0 && !options.includes(dummyVal)) options.push(dummyVal);
    }
  }

  options.sort(() => Math.random() - 0.5);
  return { q, answer, opts: options, exp };
}

function generateQuestion(cat) {
  if (cat === '1-all') {
    let sub = ['1-1', '1-2', '1-3'];
    return generateSingleQuestion(sub[Math.floor(Math.random() * sub.length)]);
  } else if (cat === '2-all') {
    let sub = ['2-1', '2-2', '2-3', '2-4'];
    return generateSingleQuestion(sub[Math.floor(Math.random() * sub.length)]);
  } else if (cat === '4-all') {
    let sub = ['4-1', '4-2', '4-3'];
    return generateSingleQuestion(sub[Math.floor(Math.random() * sub.length)]);
  } else if (cat === '5-all') {
    let sub = ['5-1', '5-2'];
    return generateSingleQuestion(sub[Math.floor(Math.random() * sub.length)]);
  } else {
    return generateSingleQuestion(cat);
  }
}

function loadNextQuestion() {
  if (correctCount >= totalQuestions) {
    endTime = new Date().getTime();
    let totalTime = ((endTime - startTime) / 1000).toFixed(1);
    let now = new Date().toLocaleString('ko-KR');
    
    document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
    document.getElementById("result-screen").classList.remove("hidden");
    
    document.getElementById("result-text").innerHTML = `
      <b>[${currentSubTitle}]</b> 완주 성공!<br><br>
      👤 <b>이름:</b> ${userName}<br>
      ⏱️ <b>소요 시간:</b> <span style="color:#27ae60; font-size:1.3rem; font-weight:bold;">${totalTime}초</span><br>
      📅 <b>완료 시각:</b> <span style="font-size:0.85rem; color:#7f8c8d;">${now}</span>
    `;
    return;
  }
  
  document.getElementById("progress").innerText = correctCount;
  document.getElementById("progress-fill").style.width = (correctCount / totalQuestions * 100) + "%";
  
  qData = generateQuestion(selectedCategory);
  document.getElementById("question-text").innerHTML = qData.q;
  
  let optsBox = document.getElementById("options-box");
  optsBox.innerHTML = "";
  qData.opts.forEach(val => {
    let btn = document.createElement("button");
    btn.innerHTML = val;
    btn.onclick = () => checkAnswer(val);
    optsBox.appendChild(btn);
  });
}

function checkAnswer(selected) {
  if (selected === qData.answer) {
    correctCount++;
    loadNextQuestion();
  } else {
    // 오답일 경우 해설 모달 표시
    document.getElementById("explanation-text").innerHTML = `<b>💡 정답: ${qData.answer}</b><br><br>${qData.exp}`;
    let nextBtn = document.getElementById("modal-next-btn");
    nextBtn.disabled = false;
    nextBtn.innerText = "다음";
    document.getElementById("explanation-modal").classList.remove("hidden");
  }
}

function triggerModalCountdown() {
  let nextBtn = document.getElementById("modal-next-btn");
  if(nextBtn.disabled) return;
  nextBtn.disabled = true;
  
  let count = 3;
  nextBtn.innerText = `3초 후 다음 문제... (${count})`;
  
  let timer = setInterval(() => {
    count--;
    if(count > 0) {
      nextBtn.innerText = `3초 후 다음 문제... (${count})`;
    } else {
      clearInterval(timer);
      document.getElementById("explanation-modal").classList.add("hidden");
      loadNextQuestion(); // 정답 수 카운팅 없이 다른 문제 제시
    }
  }, 1000);
}
</script>
