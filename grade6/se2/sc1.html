<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>6학년 2학기 과학 - 계절의 변화 퀴즈</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
      color: #1e293b;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
      position: relative;
    }
    .top-nav {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #e2e8f0;
      color: #334155;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
    }
    .nav-btn:active {
      background-color: #cbd5e1;
    }
    h1 {
      font-size: 22px;
      color: #1e3a8a;
      margin-bottom: 8px;
    }
    .sub-title {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #334155;
      font-size: 15px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #2563eb;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      box-sizing: border-box;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
    }
    .btn-secondary {
      background-color: #64748b;
      color: #ffffff;
    }
    .btn-success {
      background-color: #16a34a;
      color: #ffffff;
    }

    /* 퀴즈 진행 화면 */
    #quiz-screen {
      display: none;
      text-align: left;
    }
    .progress-bar-container {
      width: 100%;
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #2563eb;
      transition: width 0.3s ease;
    }
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 14px;
      font-weight: bold;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    .badge-mcq { background: #dbeafe; color: #1e40af; }
    .badge-sa { background: #fef3c7; color: #92400e; }

    .question-box {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
      color: #0f172a;
      margin-bottom: 20px;
      min-height: 60px;
    }
    .question-box u {
      color: #dc2626;
      text-decoration-thickness: 2px;
    }
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      width: 100%;
      padding: 14px 16px;
      background-color: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      color: #334155;
      cursor: pointer;
      line-height: 1.4;
      transition: all 0.2s;
    }
    .option-btn:active {
      background-color: #dbeafe;
      border-color: #2563eb;
      color: #1e40af;
    }

    .sa-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 오답 화면 */
    #wrong-screen {
      display: none;
      background-color: #fef2f2;
      border: 2px solid #fca5a5;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .wrong-title {
      color: #dc2626;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .explanation-box {
      background: #ffffff;
      padding: 15px;
      border-radius: 10px;
      border-left: 4px solid #dc2626;
      text-align: left;
      font-size: 14px;
      color: #334155;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    /* 성공 화면 */
    #success-screen {
      display: none;
    }
    .trophy {
      font-size: 60px;
      margin-bottom: 10px;
    }
    .success-title {
      font-size: 22px;
      color: #16a34a;
      font-weight: bold;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .result-info {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      margin-bottom: 20px;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .result-item:last-child {
      margin-bottom: 0;
    }
    .result-label {
      color: #475569;
      font-weight: bold;
    }
    .result-value {
      color: #166534;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- 1. 시작 화면 -->
    <div id="start-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>
      <h1>6학년 과학 퀴즈</h1>
      <p class="sub-title">1단원. 계절의 변화</p>

      <div class="input-group">
        <label for="userName">이름을 입력하세요</label>
        <input type="text" id="userName" placeholder="예: 홍길동" autocomplete="off">
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="startQuiz()">시작</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

    <!-- 2. 퀴즈 진행 화면 -->
    <div id="quiz-screen">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      
      <div class="quiz-header">
        <span id="question-number">문제 1 / 10</span>
        <span id="question-type-badge" class="badge badge-mcq">객관식</span>
      </div>

      <div class="question-box" id="question-text"></div>

      <!-- 객관식 영역 -->
      <div class="options-container" id="options-container"></div>

      <!-- 단답식 영역 -->
      <div class="sa-container" id="sa-container" style="display: none;">
        <input type="text" id="sa-input" placeholder="정답 입력" onkeydown="if(event.key==='Enter') submitSAAnswer()">
        <button class="btn btn-primary" onclick="submitSAAnswer()">정답 제출</button>
      </div>
    </div>

    <!-- 3. 오답 화면 -->
    <div id="wrong-screen">
      <div class="wrong-title">❌ 틀렸습니다!</div>
      <div class="explanation-box">
        <strong>💡 간단 해설:</strong>
        <p id="explanation-text" style="margin-top: 6px;"></p>
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="returnToStart()">계속</button>
    </div>

    <!-- 4. 성공 축하 화면 -->
    <div id="success-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>

      <div class="trophy">🎉</div>
      <div class="success-title">축하합니다!<br>10문제를 모두 맞추셨습니다!</div>
      
      <div class="result-info">
        <div class="result-item">
          <span class="result-label">이름</span>
          <span class="result-value" id="result-name">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">총 걸린시간</span>
          <span class="result-value" id="result-time">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">현재 시간</span>
          <span class="result-value" id="result-date">-</span>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-success" onclick="returnToStart()">재도전</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

  </div>

  <script>
    // ----------------------------------------------------
    // 문제 은행 데이터 (제시된 이미지 내용 100% 반영)
    // 단답식 제시 정답: 태양 고도, 남중 고도, 에너지양, 여름, 겨울, 자전축, 계절의 변화
    // ----------------------------------------------------

    const saBank = [
      {
        q: "태양이 지표면과 이루는 각을 나타낸 것을 무엇이라고 하나요?",
        ans: "태양 고도",
        exp: "태양 고도는 태양의 높이를 태양이 지표면과 이루는 각으로 나타낸 것입니다."
      },
      {
        q: "태양이 정남쪽에 위치할 때의 태양 고도를 무엇이라고 하나요?",
        ans: "남중 고도",
        exp: "태양이 정남쪽에 위치할 때를 태양이 남중했다고 하며, 이때의 태양 고도를 태양의 남중 고도라고 합니다."
      },
      {
        q: "태양 고도가 높아질수록 일정한 면적의 지표면이 받는 태양 ( )이 많아집니다. 빈칸에 들어갈 알맞은 단어는 무엇인가요?",
        ans: "에너지양",
        exp: "태양 고도가 높아질수록 일정한 면적의 지표면이 받는 태양 에너지양이 많아집니다."
      },
      {
        q: "태양의 남중 고도가 가장 높고 낮의 길이가 가장 긴 계절은 언제인가요?",
        ans: "여름",
        exp: "여름에는 태양의 남중 고도가 높고 낮의 길이가 길며 기온이 높습니다."
      },
      {
        q: "태양의 남중 고도가 가장 낮고 낮의 길이가 가장 짧은 계절은 언제인가요?",
        ans: "겨울",
        exp: "겨울에는 태양의 남중 고도가 낮고 낮의 길이가 짧으며 기온이 낮습니다."
      },
      {
        q: "지구의 ( )이 기울어진 채 태양 주위를 공전하기 때문에 계절의 변화가 일어납니다. 빈칸에 들어갈 말은 무엇인가요?",
        ans: "자전축",
        exp: "계절의 변화가 생기는 까닭은 지구의 자전축이 기울어진 채 태양 주위를 공전하기 때문입니다."
      },
      {
        q: "지구의 자전축이 기울어진 채 공전함에 따라 남중 고도, 낮의 길이, 기온 등이 주기적으로 변하는 현상을 ( )라고 합니다. 빈칸에 들어갈 말은 무엇인가요?",
        ans: "계절의 변화",
        exp: "자전축이 기울어진 채 공전하기 때문에 남중 고도와 낮의 길이, 태양 에너지양이 변하여 계절의 변화가 일어납니다."
      },
      {
        q: "태양 고도 측정기의 막대 그림자와 실이 이루는 각을 측정하여 알 수 있는 값은 무엇인가요?",
        ans: "태양 고도",
        exp: "태양 고도 측정기의 막대 그림자와 실이 이루는 각을 측정하면 태양 고도를 알 수 있습니다."
      }
    ];

    const mcqBank = [
      {
        q: "태양 고도에 대한 설명으로 <u>옳지 않은</u> 것은 무엇인가요?",
        options: [
          "태양이 지표면과 이루는 각을 나타낸 것이다.",
          "태양 고도 측정기의 막대 그림자와 실이 이루는 각으로 알 수 있다.",
          "하루 동안 태양 고도는 계속 일정하게 유지된다.",
          "태양이 가장 높이 떴을 때 태양 고도가 가장 높다."
        ],
        ans: 2,
        exp: "하루 동안 태양 고도는 점점 높아졌다가 다시 낮아집니다."
      },
      {
        q: "수수깡과 실을 이용한 태양 고도 측정기 만들기 방법으로 <u>옳지 않은</u> 것은 무엇인가요?",
        options: [
          "우드록 한쪽에 양면테이프를 이용해 자를 붙인다.",
          "수수깡을 10cm 정도 자르고 자의 '0' 위치에 수직으로 꽂는다.",
          "수수깡의 끝부분에 실을 묶는다.",
          "실의 한쪽 끝을 자의 끝부분에 테이프로 붙인다."
        ],
        ans: 3,
        exp: "실의 다른 한쪽 끝은 각도기 가운데에 있는 구멍에 끼워야 합니다."
      },
      {
        q: "하루 동안의 태양 고도, 그림자 길이, 기온의 변화 설명으로 <u>옳지 않은</u> 것은 무엇인가요?",
        options: [
          "태양 고도는 점점 높아졌다가 다시 낮아진다.",
          "그림자 길이는 점점 길어졌다가 다시 짧아진다.",
          "기온은 점점 높아졌다가 다시 낮아진다.",
          "태양 고도가 높아질수록 그림자 길이는 짧아진다."
        ],
        ans: 1,
        exp: "그림자 길이는 태양 고도가 높아짐에 따라 점점 짧아졌다가 다시 길어집니다."
      },
      {
        q: "태양 고도가 높아질 때 함께 일어나는 현상으로 올바른 것은 무엇인가요?",
        options: [
          "그림자 길이는 짧아지고, 기온은 높아진다.",
          "그림자 길이는 길어지고, 기온은 낮아진다.",
          "그림자 길이는 짧아지고, 기온은 낮아진다.",
          "그림자 길이는 길어지고, 기온은 높아진다."
        ],
        ans: 0,
        exp: "태양 고도가 높아질수록 그림자 길이는 짧아지고 기온은 높아집니다."
      },
      {
        q: "태양 고도가 가장 높은 시각과 기온이 가장 높은 시각에 대한 설명으로 올바른 것은 무엇인가요?",
        options: [
          "태양 고도가 가장 높은 시각과 기온이 가장 높은 시각에는 차이가 있다.",
          "두 시각은 항상 완전히 일치한다.",
          "기온이 가장 높은 시각이 태양 고도가 가장 높은 시각보다 더 빠르다.",
          "태양 고도가 가장 높을 때 기온이 가장 낮다."
        ],
        ans: 0,
        exp: "태양 고도가 가장 높은 시각(12:30 무렵)과 기온이 가장 높은 시각(14:30 무렵)에는 차이가 있습니다."
      },
      {
        q: "하루 중 태양이 정남쪽에 위치할 때의 설명으로 <u>옳지 않은</u> 것은 무엇인가요?",
        options: [
          "오후 12시 30분 무렵이다.",
          "하루 중 태양 고도가 가장 높다.",
          "이때의 태양 고도를 태양의 남중 고도라고 한다.",
          "이때 그림자의 길이가 하루 중 가장 길다."
        ],
        ans: 3,
        exp: "태양 고도가 가장 높은 남중 시각에는 그림자 길이가 하루 중 가장 짧습니다."
      },
      {
        q: "계절별 태양의 남중 고도와 낮의 길이에 대한 설명으로 올바른 것은 무엇인가요?",
        options: [
          "여름에는 남중 고도가 높고 낮의 길이가 길다.",
          "겨울에는 남중 고도가 높고 낮의 길이가 짧다.",
          "여름에는 남중 고도가 낮고 낮의 길이가 짧다.",
          "봄과 가을에는 여름보다 남중 고도가 더 높다."
        ],
        ans: 0,
        exp: "여름에는 태양의 남중 고도가 높고 낮의 길이가 길며, 겨울에는 남중 고도가 낮고 낮의 길이가 짧습니다."
      },
      {
        q: "봄과 가을의 태양의 남중 고도와 낮의 길이에 대한 설명으로 올바른 것은 무엇인가요?",
        options: [
          "여름과 겨울의 중간 정도이다.",
          "여름보다 남중 고도가 더 높다.",
          "겨울보다 낮의 길이가 더 짧다.",
          "여름과 완벽히 동일하다."
        ],
        ans: 0,
        exp: "봄과 가을에는 태양의 남중 고도와 낮의 길이가 모두 여름과 겨울의 중간 정도입니다."
      },
      {
        q: "손전등과 스마트 기기가 이루는 각이 클 때(막대의 그림자 길이가 짧을 때)의 특징으로 올바른 것은 무엇인가요?",
        options: [
          "빛의 세기가 더 세고 센서가 받는 에너지양이 많다.",

    // ----------------------------------------------------

    let userName = "";
    let quizQueue = [];
    let currentIdx = 0;
    let startTime = null;

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const wrongScreen = document.getElementById("wrong-screen");
    const successScreen = document.getElementById("success-screen");

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startQuiz() {
      const nameInput = document.getElementById("userName").value.trim();
      if (!nameInput) {
        alert("이름을 입력해 주세요!");
        return;
      }
      userName = nameInput;

      // 1-7번 객관식 7개 무작위, 8-10번 단답식 3개 무작위
      const selectedMCQs = shuffle(mcqBank).slice(0, 7);
      const selectedSAs = shuffle(saBank).slice(0, 3);

      const formattedMCQs = selectedMCQs.map(item => {
        const correctText = item.options[item.ans];
        const shuffledOptions = shuffle(item.options);
        const newAnsIdx = shuffledOptions.indexOf(correctText);
        return {
          type: "MCQ",
          q: item.q,
          options: shuffledOptions,
          ans: newAnsIdx,
          exp: item.exp
        };
      });

      const formattedSAs = selectedSAs.map(item => ({
        type: "SA",
        q: item.q,
        ans: item.ans,
        exp: item.exp
      }));

      quizQueue = [...formattedMCQs, ...formattedSAs];
      currentIdx = 0;
      startTime = Date.now();

      startScreen.style.display = "none";
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "block";

      renderQuestion();
    }

      const qData = quizQueue[currentIdx];
      
      const progressPercent = ((currentIdx + 1) / 10) * 100;
      document.getElementById("progress-bar").style.width = progressPercent + "%";
      document.getElementById("question-number").textContent = `문제 ${currentIdx + 1} / 10`;

      const badge = document.getElementById("question-type-badge");
      const optionsBox = document.getElementById("options-container");
      const saBox = document.getElementById("sa-container");

      document.getElementById("question-text").innerHTML = `${currentIdx + 1}. ${qData.q}`;

      if (qData.type === "MCQ") {
        badge.textContent = "객관식";
        badge.className = "badge badge-mcq";
        optionsBox.style.display = "flex";
        saBox.style.display = "none";

        optionsBox.innerHTML = "";
        qData.options.forEach((optText, idx) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = `${idx + 1}. ${optText}`;
          btn.onclick = () => checkMCQAnswer(idx);
          optionsBox.appendChild(btn);
        });
      } else {
        badge.textContent = "단답식";
        badge.className = "badge badge-sa";
        optionsBox.style.display = "none";
        saBox.style.display = "flex";

        const saInput = document.getElementById("sa-input");
        saInput.value = "";
        setTimeout(() => saInput.focus(), 100);
      }
    }

    function checkMCQAnswer(selectedIdx) {
      const qData = quizQueue[currentIdx];
      if (selectedIdx === qData.ans) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function submitSAAnswer() {
      const qData = quizQueue[currentIdx];
      const userInput = document.getElementById("sa-input").value.trim().replace(/\s+/g, "");
      const targetAns = qData.ans.replace(/\s+/g, "");

      if (!userInput) {
        alert("정답을 입력해주세요.");
        return;
      }

      if (userInput === targetAns) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < 10) {
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function showWrongScreen(explanationText) {
      quizScreen.style.display = "none";
      wrongScreen.style.display = "block";
      document.getElementById("explanation-text").textContent = explanationText;
    }

    function returnToStart() {
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "none";
      startScreen.style.display = "block";
    }

    function finishQuiz() {
      const endTime = Date.now();
      const elapsedSeconds = Math.round((endTime - startTime) / 1000);

      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      const dateStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

      document.getElementById("result-name").textContent = userName;
      document.getElementById("result-time").textContent = `${elapsedSeconds}초`;
      document.getElementById("result-date").textContent = dateStr;

      quizScreen.style.display = "none";
      successScreen.style.display = "block";
    }
  </script>
</body>
</html>
