<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>초등학교 4학년 수학 퀴즈 프로그램</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      word-break: keep-all;
    }
    body {
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f0f4f8;
      margin: 0;
      padding: 12px;
    }
    .card {
      background: white;
      padding: 1.5rem 1.2rem;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 480px;
      text-align: center;
      max-height: 92vh;
      overflow-y: auto;
      position: relative;
    }
    .hidden { display: none !important; }
    
    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .btn-home {
      width: auto !important;
      padding: 6px 12px !important;
      margin: 0 !important;
      background: #eef2f7 !important;
      color: #2c3e50 !important;
      font-size: 0.85rem !important;
      border-radius: 8px !important;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      border: 1px solid #cbd5e1 !important;
      font-weight: bold;
      text-decoration: none;
    }
    .btn-home:active { background: #dbe3ed !important; }

    button {
      width: 100%;
      padding: 12px 10px;
      margin: 4px 0;
      border: none;
      border-radius: 12px;
      background: #4a90e2;
      color: white;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      touch-action: manipulation;
    }
    button:active { transform: scale(0.98); }
    button.btn-sub { background: #3498db; text-align: left; padding-left: 14px; font-weight: normal; }
    button.btn-total { background: #e67e22; text-align: left; padding-left: 14px; font-weight: 800; }
    button.btn-secondary { background: #95a5a6; margin-top: 10px; }
    button.btn-retry { background: #e74c3c; margin-top: 10px; }
    
    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 1.05rem;
      text-align: center;
      outline: none;
    }
    
    .grade-header {
      background: #2c3e50;
      color: white;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      margin: 16px 0 8px 0;
      text-align: left;
    }
    .chapter-title {
      margin: 10px 0 6px 0;
      text-align: left;
      color: #34495e;
      font-size: 0.95rem;
      border-bottom: 2px solid #eef2f7;
      padding-bottom: 4px;
      font-weight: bold;
    }
    
    .question-box {
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 10px 0 15px 0;
      gap: 10px;
    }
    .question-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      background: #e8f8f0; 
      color: #27ae60; 
      border: 1px solid #27ae60;
    }
    .question-main-text {
      font-size: 1.05rem;
      font-weight: 700;
      color: #2c3e50;
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .svg-container {
      width: 100%;
      max-width: 180px;
      height: 110px;
      margin: 5px 0;
    }

    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .options button {
      margin: 0;
      font-size: 0.95rem;
      padding: 10px 6px;
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff !important;
    }
    
    .options button .frac-container,
    .options button .whole,
    .options button .frac,
    .options button .num,
    .options button .den {
      color: #ffffff !important;
    }
    
    .progress-bar { background: #eee; height: 10px; border-radius: 5px; margin-bottom: 15px; overflow: hidden; }
    .progress-fill { background: #27ae60; height: 100%; width: 0%; transition: width 0.3s; }

    .frac-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      margin: 0 3px;
      color: inherit;
    }
    .whole {
      font-size: 1.25rem;
      font-weight: bold;
      margin-right: 3px;
      line-height: 1;
      color: inherit;
    }
    .frac {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      font-size: 0.9rem;
      font-weight: bold;
      line-height: 1.1;
      color: inherit;
    }
    .frac .num {
      border-bottom: 2px solid currentColor;
      padding: 0 3px 1px 3px;
      width: 100%;
      text-align: center;
      color: inherit;
    }
    .frac .den {
      padding: 1px 3px 0 3px;
      width: 100%;
      text-align: center;
      color: inherit;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      text-align: left;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-title { font-size: 1.1rem; font-weight: bold; color: #e74c3c; margin-bottom: 10px; }
    .modal-body {
      font-size: 0.95rem;
      color: #333;
      line-height: 1.5;
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
  </style>
</head>
<body>

<!-- 메인 화면 -->

<script>
let userName = "";
let selectedCategory = "";
let currentSubTitle = "";
let correctCount = 0;
let totalQuestions = 20;
let askedQuestionsHistory = [];
let startTime, endTime;
let qData = {};

function goHome() {
  window.location.href = "./index.html";
}

function showHomeScreen() {
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById('explanation-modal').classList.add('hidden');
  document.getElementById('home-screen').classList.remove('hidden');
}

function openSetup(catKey, subTitle) {
  selectedCategory = catKey;
  currentSubTitle = subTitle;
  
  if (selectedCategory.startsWith('4-') && selectedCategory !== '4-all') {
    totalQuestions = 10;
  } else {
    totalQuestions = 20;
  }

  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById('explanation-modal').classList.add('hidden');
  document.getElementById('setup-screen').classList.remove('hidden');
  document.getElementById('setup-title').innerText = subTitle;
  document.getElementById('setup-desc').innerText = `총 ${totalQuestions}문제를 맞히면 완주 성공입니다!`;
  document.getElementById('total-q-display').innerText = totalQuestions;
}

function startCountDown() {
  userName = document.getElementById("username").value.trim();
  if(!userName) { alert("이름을 입력해주세요!"); return; }
  
  correctCount = 0;
  askedQuestionsHistory = [];
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById("countdown-screen").classList.remove("hidden");
  
  let count = 3;
  document.getElementById("countdown-text").innerText = count;
  let timer = setInterval(() => {
    count--;
    if(count > 0) {
      document.getElementById("countdown-text").innerText = count;
    } else {
      clearInterval(timer);
      document.getElementById("countdown-screen").classList.add("hidden");
      document.getElementById("quiz-screen").classList.remove("hidden");
      startTime = new Date().getTime();
      loadNextQuestion();
    }
  }, 1000);
}

function getFracHTML(whole, num, den) {
  if (num === 0) return `<span>${whole}</span>`;
  let fracPart = `<div class="frac"><span class="num">${num}</span><span class="den">${den}</span></div>`;
  if (whole > 0) {
    return `<div class="frac-container"><span class="whole">${whole}</span>${fracPart}</div>`;
  }
  return `<div class="frac-container">${fracPart}</div>`;
}

function formatFracHTML(whole, num, den) {
  if (num === 0) return `<span>${whole}</span>`;
  if (whole === 0) {
    if (num >= den) {
      let q = Math.floor(num / den);
      let r = num % den;
      return r === 0 ? `<span>${q}</span>` : getFracHTML(q, r, den);
    }
    return getFracHTML(0, num, den);
  }
  if (num >= den) {
    let q = Math.floor(num / den);
    let r = num % den;
    whole += q;
    return r === 0 ? `<span>${whole}</span>` : getFracHTML(whole, r, den);
  }
  return getFracHTML(whole, num, den);
}

function getShapeSVG(type) {
  let svg = '<svg class="svg-container" viewBox="0 0 160 110" xmlns="http://www.w3.org/2000/svg">';
  if (type === '이등변삼각형') {
    svg += `<polygon points="80,15 35,95 125,95" fill="#e8f4fc" stroke="#3498db" stroke-width="3"/>`;
    svg += `<line x1="52" y1="50" x2="63" y2="57" stroke="#e74c3c" stroke-width="2"/>`;
    svg += `<line x1="108" y1="50" x2="97" y2="57" stroke="#e74c3c" stroke-width="2"/>`;
  } else if (type === '정삼각형') {
    svg += `<polygon points="80,15 30,97 130,97" fill="#eef9f1" stroke="#27ae60" stroke-width="3"/>`;
  } else if (type === '예각삼각형') {
    svg += `<polygon points="70,20 25,90 135,90" fill="#fef9e7" stroke="#f39c12" stroke-width="3"/>`;
  } else if (type === '둔각삼각형') {
    svg += `<polygon points="15,35 50,90 145,90" fill="#fdedec" stroke="#e74c3c" stroke-width="3"/>`;
  } else if (type === '사다리꼴') {
    svg += `<polygon points="50,25 110,25 140,90 20,90" fill="#f4ecf7" stroke="#9b59b6" stroke-width="3"/>`;
  } else if (type === '평행사변형') {
    svg += `<polygon points="50,25 145,25 110,90 15,90" fill="#e8f8f5" stroke="#1abc9c" stroke-width="3"/>`;
  } else if (type === '마름모') {
    svg += `<polygon points="80,15 135,55 80,95 25,55" fill="#fef5e7" stroke="#d35400" stroke-width="3"/>`;
  } else if (type === '정오각형') {
    svg += `<polygon points="80,15 135,50 114,98 46,98 25,50" fill="#eaeded" stroke="#7f8c8d" stroke-width="3"/>`;
  } else if (type === '정육각형') {
    svg += `<polygon points="80,15 125,40 125,85 80,105 35,85 35,40" fill="#ebf5fb" stroke="#2980b9" stroke-width="3"/>`;
  }
  svg += '</svg>';
  return svg;
}

function generateTriangleQuestion() {
  let qType = Math.floor(Math.random() * 12);
  let q = "", answer = "", options = [], exp = "", svg = "";

  switch(qType) {
    case 0: {
      let topA = [20, 30, 40, 50, 70, 80, 100, 110][Math.floor(Math.random()*8)];
      let baseA = (180 - topA) / 2;
      q = `이등변삼각형에서 길이가 같은 두 변 사이의 각이 <b>${topA}°</b>일 때, 나머지 한 밑각의 크기는?`;
      answer = `${baseA}°`;
      exp = `삼각형의 세 각의 합은 180°입니다. (180° - ${topA}°) ÷ 2 = ${baseA}°`;
      options = [`${baseA}°`, `${baseA + 10}°`, `${baseA - 10}°`, `${topA}°`].sort(() => Math.random() - 0.5);
      break;
    }
    case 1: {
      let bAngle = [35, 40, 45, 50, 55, 65, 70, 75][Math.floor(Math.random()*8)];
      let tAngle = 180 - (bAngle * 2);
      q = `이등변삼각형의 한 밑각의 크기가 <b>${bAngle}°</b>일 때, 다른 한 각(꼭짓점의 각)의 크기는?`;
      answer = `${tAngle}°`;
      exp = `이등변삼각형은 두 밑각의 크기가 같습니다. 180° - (${bAngle}° × 2) = ${tAngle}°`;
      options = [`${tAngle}°`, `${tAngle + 10}°`, `${tAngle - 10}°`, `${bAngle}°`].sort(() => Math.random() - 0.5);
      break;
    }
    case 2: {
      let a1 = [30, 40, 25, 35, 50][Math.floor(Math.random()*5)];
      let a2 = [40, 30, 35, 25, 30][Math.floor(Math.random()*5)];
      let a3 = 180 - a1 - a2;

      }
      else if (qType === 7) {
        let shapeList = ['사다리꼴', '평행사변형', '마름모'];
        let picked = shapeList[Math.floor(Math.random() * shapeList.length)];
        svg = getShapeSVG(picked);
        q = `그림에 제시된 도형의 알맞은 이름을 고르세요.`;
        answer = picked;
        exp = `제시된 그림은 변의 평행 관계와 길이 조건에 따라 <b>${picked}</b>입니다.`;
        options = ['사다리꼴', '평행사변형', '마름모', '직사각형'].sort(() => Math.random() - 0.5);
      }
    }

    else if (cat === '4-4') {
      let qType = Math.floor(Math.random() * 6);

      if (qType === 0) {
        let nList = [5, 6, 8];
        let n = nList[Math.floor(Math.random() * nList.length)];
        let names = {5:'정오각형', 6:'정육각형', 8:'정팔각형'};
        let side = Math.floor(Math.random() * 6) + 3;
        let peri = n * side;
        q = `한 변의 길이가 <b>${side}cm</b>인 <b>${names[n]}</b>의 둘레는 몇 cm일까요?`;
        answer = `${peri}cm`;
        exp = `${names[n]}은(는) 변이 ${n}개이고 길이가 모두 같으므로 ${side} × ${n} = ${peri}cm 입니다.`;
        options = [`${peri}cm`, `${side * (n-1)}cm`, `${peri + n}cm`, `${side * 4}cm`].sort(() => Math.random() - 0.5);
      }
      else if (qType === 1) {
        let nList = [5, 6, 8];
        let n = nList[Math.floor(Math.random() * nList.length)];
        let names = {5:'정오각형', 6:'정육각형', 8:'정팔각형'};
        let side = Math.floor(Math.random() * 6) + 3;
        let peri = n * side;
        q = `둘레가 <b>${peri}cm</b>인 <b>${names[n]}</b>의 한 변의 길이는 몇 cm일까요?`;
        answer = `${side}cm`;
        exp = `${names[n]}의 모든 변의 길이는 같으므로 ${peri} ÷ ${n} = ${side}cm 입니다.`;
        options = [`${side}cm`, `${side + 2}cm`, `${side - 1}cm`, `${Math.floor(peri/2)}cm`].sort(() => Math.random() - 0.5);
      }
      else if (qType === 2) {
        let n = Math.floor(Math.random() * 5) + 5;
        let names = {5:'오각형', 6:'육각형', 7:'칠각형', 8:'팔각형', 9:'구각형'};
        let isVertex = Math.random() > 0.5;
        let target = isVertex ? '꼭짓점' : '변';
        q = `<b>${names[n]}</b>의 ${target}은 모두 몇 개일까요?`;
        answer = `${n}개`;
        exp = `${names[n]}의 ${target} 개수는 ${n}개입니다.`;
        options = [`${n}개`, `${n-1}개`, `${n+1}개`, `${n+2}개`].sort(() => Math.random() - 0.5);
      }
      else if (qType === 3) {
        q = `<b>"모든 변의 길이가 같고 모든 각의 크기가 같은 다각형"</b>을 무엇이라고 할까요?`;
        answer = `정다각형`;
        exp = `변의 길이와 각의 크기가 모두 같은 다각형을 정다각형이라고 합니다.`;
        options = ['정다각형', '다각형', '평행사변형', '직다각형'].sort(() => Math.random() - 0.5);
      }
      else if (qType === 4) {
        let shapes = ['정오각형', '정육각형'];
        let picked = shapes[Math.floor(Math.random() * shapes.length)];
        svg = getShapeSVG(picked);
        q = `그림의 정다각형 이름을 고르세요.`;
        answer = picked;
        exp = `제시된 그림은 변과 각이 모두 같은 <b>${picked}</b>입니다.`;
        options = ['정오각형', '정육각형', '정팔각형', '정사각형'].sort(() => Math.random() - 0.5);
      }
      else if (qType === 5) {
        q = `정다각형에 대한 설명으로 <b>틀린 것</b>은 무엇일까요?`;
        answer = `변의 길이만 같으면 무조건 정다각형이다`;
        exp = `정다각형이 되려면 변의 길이뿐만 아니라 **모든 각의 크기**도 같아야 합니다. (예: 마름모는 네 변의 길이가 같지만 각이 달라 정다각형이 아닙니다.)`;
        options = [
          '변의 길이만 같으면 무조건 정다각형이다',
          '모든 변의 길이가 같다',
          '모든 각의 크기가 같다',
          '정삼각형과 정사각형도 정다각형이다'
        ].sort(() => Math.random() - 0.5);
      }
    }
  }

  options.sort(() => Math.random() - 0.5);

  return { q, answer, opts: options, exp, svg };
}

function generateQuestion(cat) {
  if (cat.endsWith('-all')) {
    if (cat === '4-all') {
      let r = Math.random();
      if (r < 0.5) return generateTriangleQuestion();
      else if (r < 0.75) return generateSingleQuestion('4-3');
      else return generateSingleQuestion('4-4');
    }
    let prefix = cat.split('-')[0];
    let subCount = prefix === '1' ? 5 : prefix === '2' ? 5 : 4;
    let rSub = Math.floor(Math.random() * subCount) + 1;
    return generateSingleQuestion(`${prefix}-${rSub}`);
  } else {
    return generateSingleQuestion(cat);
  }
}

function loadNextQuestion() {
  if (correctCount >= totalQuestions) {
    endTime = new Date().getTime();
    let totalTime = ((endTime - startTime) / 1000).toFixed(1);
    let now = new Date().toLocaleString('ko-KR');
    
    document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
    document.getElementById("result-screen").classList.remove("hidden");
    
    document.getElementById("result-text").innerHTML = `
      <b>[${currentSubTitle}]</b> 완주 성공!<br><br>
      👤 <b>이름:</b> ${userName}<br>
      ⏱️ <b>소요 시간:</b> <span style="color:#27ae60; font-size:1.3rem; font-weight:bold;">${totalTime}초</span><br>
      📅 <b>완료 시각:</b> <span style="font-size:0.85rem; color:#7f8c8d;">${now}</span>
    `;
    return;
  }
  
  document.getElementById("progress").innerText = correctCount;
  document.getElementById("progress-fill").style.width = (correctCount / totalQuestions * 100) + "%";
  
  let qObj;
  let attempts = 0;
  do {
    qObj = generateQuestion(selectedCategory);
    let qKey = qObj.q + "::" + qObj.answer;
    if (!askedQuestionsHistory.includes(qKey) || attempts > 80) {
      askedQuestionsHistory.push(qKey);
      qData = qObj;
      break;
    }
    attempts++;
  } while (attempts <= 80);

  document.getElementById("svg-box").innerHTML = qData.svg || "";
  document.getElementById("question-text").innerHTML = qData.q;
  
  let optsBox = document.getElementById("options-box");
  optsBox.innerHTML = "";
  qData.opts.forEach(val => {
    let btn = document.createElement("button");
    btn.innerHTML = val;
    btn.onclick = () => checkAnswer(val);
    optsBox.appendChild(btn);
  });
}

function checkAnswer(selected) {
  if (selected === qData.answer) {
    correctCount++;
    loadNextQuestion();
  } else {
    document.getElementById("explanation-text").innerHTML = `
      <div style="display:flex; align-items:center; gap:6px;">
        <b>💡 정답:</b> ${qData.answer}
      </div>
      <div>${qData.exp}</div>
    `;
    let nextBtn = document.getElementById("modal-next-btn");
    nextBtn.disabled = false;
    nextBtn.innerText = "다음";
    document.getElementById("explanation-modal").classList.remove("hidden");
  }
}

function triggerModalCountdown() {
  let nextBtn = document.getElementById("modal-next-btn");
  if(nextBtn.disabled) return;
  nextBtn.disabled = true;
  
  let count = 3;
  nextBtn.innerText = `3초 후 다음 문제... (${count})`;
  
  let timer = setInterval(() => {
    count--;
    if(count > 0) {
      nextBtn.innerText = `3초 후 다음 문제... (${count})`;
    } else {
      clearInterval(timer);
      document.getElementById("explanation-modal").classList.add("hidden");
      loadNextQuestion();
    }
  }, 1000);
}
</script>
