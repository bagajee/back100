<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>초등학교 4학년 수학 퀴즈 프로그램</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      word-break: keep-all;
    }
    body {
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f0f4f8;
      margin: 0;
      padding: 12px;
    }
    .card {
      background: white;
      padding: 1.5rem 1.2rem;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 480px;
      text-align: center;
      max-height: 92vh;
      overflow-y: auto;
      position: relative;
    }
    .hidden { display: none !important; }
    
    /* 상단 Header & 홈 버튼 */
    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .btn-home {
      width: auto !important;
      padding: 6px 12px !important;
      margin: 0 !important;
      background: #eef2f7 !important;
      color: #2c3e50 !important;
      font-size: 0.85rem !important;
      border-radius: 8px !important;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      border: 1px solid #cbd5e1 !important;
      font-weight: bold;
    }
    .btn-home:active { background: #dbe3ed !important; }

    button {
      width: 100%;
      padding: 12px 10px;
      margin: 4px 0;
      border: none;
      border-radius: 12px;
      background: #4a90e2;
      color: white;
      font-size: 0.95rem;
      font-weight: bold;

    button.btn-total { background: #e67e22; text-align: left; padding-left: 14px; font-weight: 800; }
    button.btn-secondary { background: #95a5a6; margin-top: 10px; }
    button.btn-retry { background: #e74c3c; margin-top: 10px; }

      flex-direction: column;
      align-items: center;
      justify-content: center;

    }
    .question-badge {
      display: inline-block;
      padding: 4px 12px;

      font-size: 0.85rem;
      font-weight: bold;
      background: #e8f8f0; 
      color: #27ae60; 
      border: 1px solid #27ae60;
    }
    .question-main-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: #2c3e50;
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .svg-container {
      width: 100%;
      max-width: 180px;
      height: 120px;
      margin: 5px 0;
    }

    /* 보기 버튼 레이아웃 */
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .options button {
      margin: 0;
      font-size: 1.05rem;
      padding: 10px 6px;
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff !important;
    }
    
    /* 분수 스타일링 (버튼 및 보기 내부 흰색 통일) */
    .options button .frac-container,
    .options button .whole,
    .options button .frac,
    .options button .num,
    .options button .den {
      color: #ffffff !important;
    }
    
    .progress-bar { background: #eee; height: 10px; border-radius: 5px; margin-bottom: 15px; overflow: hidden; }
    .progress-fill { background: #27ae60; height: 100%; width: 0%; transition: width 0.3s; }

    /* 정확한 세로 분수 CSS */
    .frac-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      margin: 0 3px;
      color: inherit;
    }
    .whole {
      font-size: 1.25rem;
      font-weight: bold;
      margin-right: 3px;
      line-height: 1;
      color: inherit;
    }
    .frac {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      font-size: 0.9rem;
      font-weight: bold;
      line-height: 1.1;

      width: 100%;
      text-align: center;
      color: inherit;
    }
    .frac .den {

      width: 100%;
      text-align: center;
      color: inherit;
    }

  </style>

<script>
let userName = "";
let selectedCategory = "";
let currentSubTitle = "";
let correctCount = 0;
const totalQuestions = 20;
let startTime, endTime;
let qData = {};

function goHome() {
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById('explanation-modal').classList.add('hidden');
  document.getElementById('home-screen').classList.remove('hidden');
}

function openSetup(catKey, subTitle) {
  selectedCategory = catKey;
  currentSubTitle = subTitle;
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById('explanation-modal').classList.add('hidden');
  document.getElementById('setup-screen').classList.remove('hidden');
  document.getElementById('setup-title').innerText = subTitle;
}

function startCountDown() {
  userName = document.getElementById("username").value.trim();
  if(!userName) { alert("이름을 입력해주세요!"); return; }
  
  correctCount = 0;
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById("countdown-screen").classList.remove("hidden");
  
  let count = 3;
  document.getElementById("countdown-text").innerText = count;
  let timer = setInterval(() => {
    count--;
    if(count > 0) {
      document.getElementById("countdown-text").innerText = count;
    } else {
      clearInterval(timer);
      document.getElementById("countdown-screen").classList.add("hidden");
      document.getElementById("quiz-screen").classList.remove("hidden");
      startTime = new Date().getTime();
      loadNextQuestion();
    }
  }, 1000);
}

/* === 세로형 정식 분수 HTML 생성 === */
function getFracHTML(whole, num, den) {
  if (num === 0) return `<span>${whole}</span>`;
  let fracPart = `<div class="frac"><span class="num">${num}</span><span class="den">${den}</span></div>`;
  if (whole > 0) {
    return `<div class="frac-container"><span class="whole">${whole}</span>${fracPart}</div>`;
  }
  return `<div class="frac-container">${fracPart}</div>`;
}

function formatFracHTML(whole, num, den) {
  if (num === 0) return `<span>${whole}</span>`;
  if (whole === 0) {
    if (num >= den) {
      let q = Math.floor(num / den);
      let r = num % den;
      return r === 0 ? `<span>${q}</span>` : getFracHTML(q, r, den);
    }
    return getFracHTML(0, num, den);
  }
  if (num >= den) {
    let q = Math.floor(num / den);
    let r = num % den;
    whole += q;
    return r === 0 ? `<span>${whole}</span>` : getFracHTML(whole, r, den);
  }
  return getFracHTML(whole, num, den);
}

/* === 도형 SVG 생성기 === */
function getShapeSVG(type) {
  let svg = '<svg class="svg-container" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg">';
  if (type === '이등변삼각형') {
    svg += `<polygon points="80,15 35,100 125,100" fill="#e8f4fc" stroke="#3498db" stroke-width="3"/>`;
    svg += `<line x1="52" y1="53" x2="63" y2="60" stroke="#e74c3c" stroke-width="2"/>`;
    svg += `<line x1="108" y1="53" x2="97" y2="60" stroke="#e74c3c" stroke-width="2"/>`;
  } else if (type === '정삼각형') {
    svg += `<polygon points="80,15 30,102 130,102" fill="#eef9f1" stroke="#27ae60" stroke-width="3"/>`;
  } else if (type === '예각삼각형') {
    svg += `<polygon points="70,20 25,95 135,95" fill="#fef9e7" stroke="#f39c12" stroke-width="3"/>`;
  } else if (type === '둔각삼각형') {
    svg += `<polygon points="30,30 15,95 145,95" fill="#fdedec" stroke="#e74c3c" stroke-width="3"/>`;
  } else if (type === '사다리꼴') {
    svg += `<polygon points="50,25 110,25 140,95 20,95" fill="#f4ecf7" stroke="#9b59b6" stroke-width="3"/>`;
  } else if (type === '평행사변형') {
    svg += `<polygon points="50,25 145,25 110,95 15,95" fill="#e8f8f5" stroke="#1abc9c" stroke-width="3"/>`;
  } else if (type === '마름모') {
    svg += `<polygon points="80,15 135,60 80,105 25,60" fill="#fef5e7" stroke="#d35400" stroke-width="3"/>`;
  } else if (type === '정오각형') {
    svg += `<polygon points="80,15 135,52 114,105 46,105 25,52" fill="#eaeded" stroke="#7f8c8d" stroke-width="3"/>`;
  } else if (type === '정육각형') {
    svg += `<polygon points="80,15 130,42 130,92 80,115 30,92 30,42" fill="#ebf5fb" stroke="#2980b9" stroke-width="3"/>`;
  }
  svg += '</svg>';
  return svg;
}

/* === 단원별 문제 생성기 === */
function generateSingleQuestion(cat) {
  let q = "", answer = "", options = [], exp = "", svg = "";

  // [4-1] 3. 곱셈과 나눗셈
  if (cat.startsWith('1-')) {
    if (cat === '1-1') {
      let a = Math.floor(Math.random() * 800) + 100;
      let b = (Math.floor(Math.random() * 8) + 1) * 10;
      q = `${a} × ${b} = ?`;
      answer = `${a * b}`;
      exp = `${a}에 ${b/10}을 곱한 뒤 0을 1개 붙입니다. (${a} × ${b/10} = ${a*(b/10)} ➡️ ${a*b})`;
    } else if (cat === '1-2') {
      let a = Math.floor(Math.random() * 400) + 100;
      let b = Math.floor(Math.random() * 80) + 11;
      q = `${a} × ${b} = ?`;
      answer = `${a * b}`;
      exp = `${a} × ${Math.floor(b/10)*10}값과 ${a} × ${b%10}값을 더해줍니다.`;
    } else if (cat === '1-3') {
      let b = (Math.floor(Math.random() * 8) + 2) * 10;
      let qVal = Math.floor(Math.random() * 8) + 2;
      let a = b * qVal;
      q = `${a} ÷ ${b} = ?`;
      answer = `${qVal}`;
      exp = `${a} ÷ ${b} = ${qVal} 입니다. (몇십 나누기 몇십)`;
    } else if (cat === '1-4') {
      let b = Math.floor(Math.random() * 30) + 12;
      let qVal = Math.floor(Math.random() * 8) + 2;
      let a = b * qVal;
      q = `${a} ÷ ${b} = ?`;
      answer = `${qVal}`;
      exp = `${b} × ${qVal} = ${a} 이므로 몫은 ${qVal} 입니다.`;
    } else if (cat === '1-5') {
      let b = Math.floor(Math.random() * 20) + 12;
      let qVal = Math.floor(Math.random() * 7) + 2;
      let r = Math.floor(Math.random() * (b - 1)) + 1;
      let a = b * qVal + r;
      q = `${a} ÷ ${b} 의 몫과 나머지는?`;
      answer = `몫: ${qVal}, 나머지: ${r}`;
      exp = `${a} ÷ ${b} = ${qVal} 나머지 ${r} (${b} × ${qVal} + ${r} = ${a})`;
    }

    options = [answer];
    while(options.length < 4) {
      let dummy = "";
      if (cat === '1-5') {
        let dq = Math.floor(Math.random() * 8) + 2;
        let dr = Math.floor(Math.random() * 10) + 1;
        dummy = `몫: ${dq}, 나머지: ${dr}`;
      } else {
        let rawAns = parseInt(answer);
        let offset = (Math.floor(Math.random() * 5) + 1) * (Math.random() > 0.5 ? 10 : -10);
        dummy = `${Math.max(1, rawAns + offset)}`;
      }
      if(!options.includes(dummy)) options.push(dummy);
    }
  }

  // [4-2] 1. 분수의 덧셈과 뺄셈
  else if (cat.startsWith('2-')) {
    let d = Math.floor(Math.random() * 6) + 5;
    if (cat === '2-1') {
      let n1 = Math.floor(Math.random() * (d - 2)) + 1;
      let n2 = Math.floor(Math.random() * (d - n1 - 1)) + 1;
      q = `${getFracHTML(0, n1, d)} + ${getFracHTML(0, n2, d)} = ?`;
      answer = formatFracHTML(0, n1 + n2, d);
      exp = `분모가 같으므로 분자끼리 더합니다. (${n1} + ${n2} = ${n1+n2})`;
    } else if (cat === '2-2') {
      let m1 = Math.floor(Math.random() * 2) + 1;
      let m2 = Math.floor(Math.random() * 2) + 1;
      let n1 = Math.floor(Math.random() * (d - 1)) + 1;
      let n2 = Math.floor(Math.random() * (d - 1)) + 1;
      q = `${getFracHTML(m1, n1, d)} + ${getFracHTML(m2, n2, d)} = ?`;
      answer = formatFracHTML(m1 + m2, n1 + n2, d);
      exp = `자연수는 자연수끼리, 분수는 분수끼리 더합니다.`;
    } else if (cat === '2-3') {
      let n1 = Math.floor(Math.random() * (d - 2)) + 2;
      let n2 = Math.floor(Math.random() * (n1 - 1)) + 1;
      q = `${getFracHTML(0, n1, d)} - ${getFracHTML(0, n2, d)} = ?`;
      answer = formatFracHTML(0, n1 - n2, d);
      exp = `분자끼리 뺍니다. (${n1} - ${n2} = ${n1-n2})`;
    } else if (cat === '2-4') {
      let m = Math.floor(Math.random() * 3) + 2;
      let n = Math.floor(Math.random() * (d - 1)) + 1;
      q = `<span>${m}</span> - ${getFracHTML(0, n, d)} = ?`;
      answer = formatFracHTML(m - 1, d - n, d);
      exp = `자연수 ${m}에서 1을 빌려와 ${m-1}과 ${d}/${d}로 바꾼 뒤 뺍니다.`;
    } else if (cat === '2-5') {
      let m1 = Math.floor(Math.random() * 3) + 3;
      let m2 = Math.floor(Math.random() * (m1 - 1)) + 1;
      let n1 = Math.floor(Math.random() * (d - 2)) + 1;
      let n2 = Math.floor(Math.random() * (d - 1)) + 1;
      if (n1 >= n2) {
        answer = formatFracHTML(m1 - m2, n1 - n2, d);
        exp = `자연수는 자연수끼리, 분수는 분수끼리 뺍니다.`;
      } else {
        answer = formatFracHTML(m1 - 1 - m2, n1 + d - n2, d);
        exp = `분수끼리 뺄 수 없어 자연수에서 1을 받아내림하여 계산합니다.`;
      }
      q = `${getFracHTML(m1, n1, d)} - ${getFracHTML(m2, n2, d)} = ?`;
    }

    options = [answer];
    while(options.length < 4) {
      let dummyM = Math.floor(Math.random() * 4);
      let dummyN = Math.floor(Math.random() * (d * 2)) + 1;
      let dummy = formatFracHTML(dummyM, dummyN, d);
      if(!options.includes(dummy)) options.push(dummy);
    }
  }

  // [4-2] 2. 소수의 덧셈과 뺄셈
  else if (cat.startsWith('3-')) {
    if (cat === '3-1') {
      let v1 = (Math.floor(Math.random() * 80) + 10) / 10;
      let v2 = (Math.floor(Math.random() * 80) + 10) / 10;
      q = `<span>${v1.toFixed(1)} + ${v2.toFixed(1)} = ?</span>`;
      answer = `<span>${(v1 + v2).toFixed(1)}</span>`;
      exp = `소수점을 맞춘 뒤 세로로 더합니다.`;
    } else if (cat === '3-2') {
      let v1 = (Math.floor(Math.random() * 500) + 100) / 100;
      let v2 = (Math.floor(Math.random() * 500) + 100) / 100;
      q = `<span>${v1.toFixed(2)} + ${v2.toFixed(2)} = ?</span>`;
      answer = `<span>${(v1 + v2).toFixed(2)}</span>`;
      exp = `소수점 자리를 맞춰 소수 둘째 자리부터 더합니다.`;
    } else if (cat === '3-3') {
      let v1 = (Math.floor(Math.random() * 80) + 20) / 10;
      let v2 = (Math.floor(Math.random() * 19) + 1) / 10;
      if (v1 < v2) { let t = v1; v1 = v2; v2 = t; }
      q = `<span>${v1.toFixed(1)} - ${v2.toFixed(1)} = ?</span>`;
      answer = `<span>${(v1 - v2).toFixed(1)}</span>`;
      exp = `소수점을 맞추고 자연수 뺄셈처럼 계산합니다.`;
    } else if (cat === '3-4') {
      let v1 = (Math.floor(Math.random() * 600) + 200) / 100;
      let v2 = (Math.floor(Math.random() * 190) + 10) / 100;
      if (v1 < v2) { let t = v1; v1 = v2; v2 = t; }
      q = `<span>${v1.toFixed(2)} - ${v2.toFixed(2)} = ?</span>`;
      answer = `<span>${(v1 - v2).toFixed(2)}</span>`;
      exp = `소수점 위치를 맞춰 차례대로 뺍니다.`;
    }

    options = [answer];
    let rawAns = parseFloat(answer.replace(/<[^>]*>/g, ''));
    let isOneDec = cat.endsWith('-1') || cat.endsWith('-3');
    while(options.length < 4) {
      let offset = (options.length % 2 === 1) ? options.length * 0.1 : -options.length * 0.1;
      let dummyVal = (rawAns + offset).toFixed(isOneDec ? 1 : 2);
      let dummy = `<span>${dummyVal}</span>`;
      if (parseFloat(dummyVal) >= 0 && !options.includes(dummy)) options.push(dummy);
    }
  }

  // [4-2] 3. 도형
  else if (cat.startsWith('4-')) {
    let shapeList = [];
    if (cat === '4-1') shapeList = ['이등변삼각형', '정삼각형'];
    else if (cat === '4-2') shapeList = ['예각삼각형', '둔각삼각형'];
    else if (cat === '4-3') shapeList = ['사다리꼴', '평행사변형', '마름모'];
    else if (cat === '4-4') shapeList = ['정오각형', '정육각형'];
    else shapeList = ['이등변삼각형', '정삼각형', '예각삼각형', '둔각삼각형', '사다리꼴', '평행사변형', '마름모', '정오각형', '정육각형'];

    let targetShape = shapeList[Math.floor(Math.random() * shapeList.length)];
    svg = getShapeSVG(targetShape);

    let mode = Math.random() > 0.5 ? 'name' : 'feature';
    if (mode === 'name') {
      q = `다음 그림에 해당하는 도형의 이름은 무엇일까요?`;
      answer = targetShape;
      exp = `그림의 도형은 <b>${targetShape}</b>입니다.`;
      
      let pool = ['이등변삼각형', '정삼각형', '예각삼각형', '둔각삼각형', '사다리꼴', '평행사변형', '마름모', '정오각형', '정육각형'];
      options = [answer];
      while(options.length < 4) {
        let rShape = pool[Math.floor(Math.random() * pool.length)];
        if(!options.includes(rShape)) options.push(rShape);
      }
    } else {
      q = `다음 그림의 <b>[${targetShape}]</b>에 대한 설명으로 올바른 것은?`;
      let features = {
        '이등변삼각형': '두 변의 길이가 같습니다.',
        '정삼각형': '세 변의 길이와 세 각의 크기가 모두 같습니다.',
        '예각삼각형': '세 각이 모두 예각(90°보다 작은 각)입니다.',
        '둔각삼각형': '한 각이 둔각(90°보다 큰 각)입니다.',
        '사다리꼴': '평행한 변이 한 쌍이라도 있습니다.',
        '평행사변형': '마주 보는 두 쌍의 변이 서로 평행합니다.',
        '마름모': '네 변의 길이가 모두 같습니다.',
        '정오각형': '다섯 변의 길이에 모두 같고 다섯 각의 크기가 같습니다.',
        '정육각형': '여섯 변의 길이가 모두 같고 여섯 각의 크기가 같습니다.'
      };
      answer = features[targetShape];
      exp = `<b>${targetShape}</b>: ${answer}`;

      let wrongFeatures = [
        '네 변의 길이가 모두 다릅니다.',
        '한 각이 직각입니다.',
        '평행한 변이 전혀 없습니다.',
        '세 변의 길이가 모두 다릅니다.',
        '마주 보는 변의 길이가 항상 다릅니다.'
      ];
      options = [answer];
      while(options.length < 4) {
        let wf = wrongFeatures[Math.floor(Math.random() * wrongFeatures.length)];
        if(!options.includes(wf)) options.push(wf);
      }
    }
  }

  options.sort(() => Math.random() - 0.5);
  return { q, answer, opts: options, exp, svg };
}

function generateQuestion(cat) {
  if (cat.endsWith('-all')) {
    let prefix = cat.split('-')[0];
    let subCount = prefix === '1' ? 5 : prefix === '2' ? 5 : prefix === '3' ? 4 : 4;
    let rSub = Math.floor(Math.random() * subCount) + 1;
    return generateSingleQuestion(`${prefix}-${rSub}`);
  } else {
    return generateSingleQuestion(cat);
  }
}

function loadNextQuestion() {
  if (correctCount >= totalQuestions) {
    endTime = new Date().getTime();
    let totalTime = ((endTime - startTime) / 1000).toFixed(1);
    let now = new Date().toLocaleString('ko-KR');
    
    document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
    document.getElementById("result-screen").classList.remove("hidden");
    
    document.getElementById("result-text").innerHTML = `
      <b>[${currentSubTitle}]</b> 완주 성공!<br><br>
      👤 <b>이름:</b> ${userName}<br>
      ⏱️ <b>소요 시간:</b> <span style="color:#27ae60; font-size:1.3rem; font-weight:bold;">${totalTime}초</span><br>
      📅 <b>완료 시각:</b> <span style="font-size:0.85rem; color:#7f8c8d;">${now}</span>
    `;
    return;
  }
  
  document.getElementById("progress").innerText = correctCount;
  document.getElementById("progress-fill").style.width = (correctCount / totalQuestions * 100) + "%";
  
  qData = generateQuestion(selectedCategory);
  
  // SVG 및 문제 출력
  document.getElementById("svg-box").innerHTML = qData.svg || "";
  document.getElementById("question-text").innerHTML = qData.q;
  
  let optsBox = document.getElementById("options-box");
  optsBox.innerHTML = "";
  qData.opts.forEach(val => {
    let btn = document.createElement("button");
    btn.innerHTML = val;
    btn.onclick = () => checkAnswer(val);
    optsBox.appendChild(btn);
  });
}

function checkAnswer(selected) {
  if (selected === qData.answer) {
    correctCount++;
    loadNextQuestion();
  } else {
    document.getElementById("explanation-text").innerHTML = `
      <div style="display:flex; align-items:center; gap:6px;">
        <b>💡 정답:</b> ${qData.answer}
      </div>
      <div>${qData.exp}</div>
    `;
    let nextBtn = document.getElementById("modal-next-btn");
    nextBtn.disabled = false;
    nextBtn.innerText = "다음";
    document.getElementById("explanation-modal").classList.remove("hidden");
  }
}

function triggerModalCountdown() {
  let nextBtn = document.getElementById("modal-next-btn");
  if(nextBtn.disabled) return;
  nextBtn.disabled = true;
  
  let count = 3;
  nextBtn.innerText = `3초 후 다음 문제... (${count})`;
  
  let timer = setInterval(() => {
    count--;
    if(count > 0) {
      nextBtn.innerText = `3초 후 다음 문제... (${count})`;
    } else {
      clearInterval(timer);
      document.getElementById("explanation-modal").classList.add("hidden");
      loadNextQuestion();
    }
  }, 1000);
}
</script>
