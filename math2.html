<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>초등 2학년 수학 퀴즈</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      word-break: keep-all;
    }
    body {
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #eef2f7;
      margin: 0;
      padding: 12px;
    }
    .card {
      background: white;
      padding: 1.5rem 1.2rem;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 480px;
      text-align: center;
      max-height: 92vh;
      overflow-y: auto;
      position: relative;
    }
    .hidden { display: none !important; }
    
    /* 상단 Header & 홈 버튼 */
    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .btn-home {
      width: auto !important;
      padding: 6px 14px !important;
      margin: 0 !important;
      background: #e2e8f0 !important;
      color: #2d3748 !important;
      font-size: 0.85rem !important;
      border-radius: 8px !important;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      border: 1px solid #cbd5e1 !important;
      font-weight: bold;
    }
    .btn-home:active { background: #cbd5e1 !important; }

    button {
      width: 100%;
      padding: 12px 10px;
      margin: 4px 0;
      border: none;
      border-radius: 12px;
      background: #3b82f6;
      color: white;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      touch-action: manipulation;
    }
    button:active { transform: scale(0.98); }
    button.btn-sub { background: #60a5fa; text-align: left; padding-left: 14px; font-weight: normal; }
    button.btn-total { background: #f59e0b; text-align: left; padding-left: 14px; font-weight: 800; }
    button.btn-secondary { background: #94a3b8; margin-top: 10px; }
    button.btn-retry { background: #ef4444; margin-top: 10px; }
    
    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1.05rem;
      text-align: center;
      outline: none;
    }
    input:focus { border-color: #3b82f6; }
    
    .semester-header {
      background: #0f172a;
      color: #f8fafc;
      padding: 10px;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: bold;
      margin: 18px 0 10px 0;
      text-align: center;
    }

    .chapter-header {
      background: #1e293b;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: bold;
      margin: 12px 0 6px 0;
      text-align: left;
    }

    /* 문제 영역 */
    .question-box {
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 10px 0 15px 0;
      gap: 10px;
      background: #f8fafc;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }
    .question-main-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* 보기 버튼 레이아웃 */
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .options button {
      margin: 0;
      font-size: 1rem;
      padding: 12px 6px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #3b82f6;
      color: #ffffff;
    }
    
    .progress-bar { background: #e2e8f0; height: 10px; border-radius: 5px; margin-bottom: 15px; overflow: hidden; }
    .progress-fill { background: #10b981; height: 100%; width: 0%; transition: width 0.3s; }

    /* 해설 모달 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      text-align: left;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-title { font-size: 1.1rem; font-weight: bold; color: #ef4444; margin-bottom: 10px; }
    .modal-body {
      font-size: 0.95rem;
      color: #333;
      line-height: 1.5;
      background: #f8fafc;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
  </style>
</head>
<body>

<!-- 1. 메인 화면 -->
<div class="card" id="home-screen">
  <div class="nav-header">
    <button class="btn-home" onclick="location.href='index.html'">🏠 홈으로</button>
  </div>
  <h2 style="margin-top:0; color:#1e293b;">📐 초등 2학년 수학 퀴즈</h2>
  <p style="color:#64748b; font-size: 0.85rem; margin-bottom:10px;">학습할 단원과 소단원을 선택하세요!</p>

  <!-- 2학년 1학기 -->

  <button class="btn-sub" onclick="openSetup('2_1_1_1', '1) (두 자리 수)+(두 자리 수)')">1) (두 자리 수)+(두 자리 수)</button>
  <button class="btn-sub" onclick="openSetup('2_1_1_2', '2) (두 자리 수)-(두 자리 수)')">2) (두 자리 수)-(두 자리 수)</button>
  <button class="btn-sub" onclick="openSetup('2_1_1_3', '3) 세 수의 덧셈과 뺄셈')">3) 세 수의 덧셈과 뺄셈</button>
  <button class="btn-total" onclick="openSetup('2_1_1_all', '🏆 [단원정리] 덧셈과 뺄셈 종합')">🏆 [단원정리] 덧셈과 뺄셈 종합</button>

  <div class="chapter-header">2. 곱셈</div>
  <button class="btn-sub" onclick="openSetup('2_1_2_1', '1) 더하기를 곱셈으로 나타내기')">1) 더하기를 곱셈으로 나타내기</button>


  <!-- 2학년 2학기 -->
  <div class="semester-header">📘 2학년 2학기</div>

  <div class="chapter-header">1. 네 자리 수</div>
  <button class="btn-sub" onclick="openSetup('2_2_1_1', '1) 각 자리의 숫자는 얼마')">1) 각 자리의 숫자는 얼마</button>
  <button class="btn-sub" onclick="openSetup('2_2_1_2', '2) 네 자리 수 크기 비교')">2) 네 자리 수 크기 비교</button>
  <button class="btn-total" onclick="openSetup('2_2_1_all', '🏆 [단원정리] 네 자리 수 종합')">🏆 [단원정리] 네 자리 수 종합</button>

  <div class="chapter-header">2. 곱셈구구</div>
  <button class="btn-sub" onclick="openSetup('2_2_2_2', '1) 2단')">1) 2단</button>
  <button class="btn-sub" onclick="openSetup('2_2_2_3', '2) 3단')">2) 3단</button>
  <button class="btn-sub" onclick="openSetup('2_2_2_4', '3) 4단')">3) 4단</button>
  <button class="btn-sub" onclick="openSetup('2_2_2_5', '4) 5단')">4) 5단</button>
  <button class="btn-sub" onclick="openSetup('2_2_2_6', '5) 6단')">5) 6단</button>
  <button class="btn-sub" onclick="openSetup('2_2_2_7', '6) 7단')">6) 7단</button>
  <button class="btn-sub" onclick="openSetup('2_2_2_8', '7) 8단')">7) 8단</button>
  <button class="btn-sub" onclick="openSetup('2_2_2_9', '8) 9단')">8) 9단</button>
  <button class="btn-total" onclick="openSetup('2_2_2_all', '🏆 [단원정리] 곱셈구구 종합')">🏆 [단원정리] 곱셈구구 종합</button>
</div>

<!-- 2. 문제 시작 설정 화면 -->
<div class="card hidden" id="setup-screen">
  <div class="nav-header">
    <button class="btn-home" onclick="location.href='index.html'">🏠 홈으로</button>
  </div>
  <h3 style="margin-top:10px; color:#1e293b;" id="setup-title">수학 퀴즈</h3>
  <p style="color:#64748b; font-size:0.9rem;">총 20문제를 맞히면 완주 성공입니다!</p>

<div class="card hidden" id="countdown-screen">
  <div class="nav-header">
    <button class="btn-home" onclick="location.href='index.html'">🏠 홈으로</button>
  </div>
  <p style="font-size:1.1rem; color:#64748b; margin-top:20px;">준비하세요! 잠시 후 시작됩니다.</p>

</div>

<!-- 4. 퀴즈 진행 화면 -->
<div class="card hidden" id="quiz-screen">
  <div class="nav-header">
    <button class="btn-home" onclick="location.href='index.html'">🏠 홈으로</button>
    <div style="font-size: 0.9rem; color: #64748b; font-weight: bold;"><span id="progress">0</span> / 20 문제 맞힘</div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  
  <div class="question-box">
    <div id="question-text" class="question-main-text">문제가 여기에 표시됩니다</div>
  </div>

  <div class="options" id="options-box"></div>

  <!-- 하단 재도전 버튼 -->
  <div style="margin-top: 20px; border-top: 1px solid #f1f5f9; padding-top: 10px;">
    <button class="btn-retry" onclick="openSetup(selectedCategory, currentSubTitle)">🔄 재도전 (시작 화면으로)</button>
  </div>
</div>

<!-- 5. 오답 해설 모달 -->
<div class="modal-overlay hidden" id="explanation-modal">
  <div class="modal-content">
    <div class="nav-header">
      <button class="btn-home" onclick="location.href='index.html'">🏠 홈으로</button>
    </div>
    <div class="modal-title">❌ 오답입니다! (카운트되지 않음)</div>
    <div class="modal-body" id="explanation-text">해설 내용이 여기에 들어갑니다.</div>

  </div>
</div>

<!-- 6. 성공 결과 화면 -->
<div class="card hidden" id="result-screen">
  <div class="nav-header">
    <button class="btn-home" onclick="location.href='index.html'">🏠 홈으로</button>
  </div>
  <h2>🎉 완주를 축하합니다!</h2>
  <div id="result-text" style="text-align: left; background:#f8fafc; padding:15px; border-radius:12px; margin: 15px 0; line-height: 1.8;"></div>
  <button onclick="openSetup(selectedCategory, currentSubTitle)">🔄 재도전</button>
  <button onclick="goHome()" class="btn-secondary">내용 선택</button>
</div>

<script>
let userName = "";
let selectedCategory = "";
let currentSubTitle = "";
let correctCount = 0;
const totalQuestions = 20;
let startTime, endTime;
let qData = {};

function goHome() {
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById('explanation-modal').classList.add('hidden');
  document.getElementById('home-screen').classList.remove('hidden');
}

function openSetup(catKey, subTitle) {
  selectedCategory = catKey;
  currentSubTitle = subTitle;
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById('explanation-modal').classList.add('hidden');
  document.getElementById('setup-screen').classList.remove('hidden');
  document.getElementById('setup-title').innerText = subTitle;
}

function startCountDown() {
  userName = document.getElementById("username").value.trim();
  if(!userName) { alert("이름을 입력해주세요!"); return; }
  
  correctCount = 0;
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById("countdown-screen").classList.remove("hidden");
  
  let count = 3;
  document.getElementById("countdown-text").innerText = count;
  let timer = setInterval(() => {
    count--;
    if(count > 0) {
      document.getElementById("countdown-text").innerText = count;
    } else {
      clearInterval(timer);
      document.getElementById("countdown-screen").classList.add("hidden");
      document.getElementById("quiz-screen").classList.remove("hidden");
      startTime = new Date().getTime();
      loadNextQuestion();
    }
  }, 1000);
}

function rand(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function shuffleAndPick(arr, correctAns, count = 4) {
  let filtered = arr.filter(item => item !== correctAns);
  filtered = [...new Set(filtered)];
  filtered.sort(() => Math.random() - 0.5);
  let result = [correctAns, ...filtered.slice(0, count - 1)];
  result.sort(() => Math.random() - 0.5);
  return result;
}

/* 2학년 문제 생성 엔진 */
function generateSingleQuestion(cat) {
  let q = "", answer = "", options = [], exp = "";

  // ===== 2학년 1학기 =====
  // 1단원 : 덧셈과 뺄셈
  if (cat === '2_1_1_1') { // (두 자리 수)+(두 자리 수)
    let n1 = rand(11, 89);
    let n2 = rand(11, 89);
    let ans = n1 + n2;
    q = `${n1} + ${n2} = ?`;
    answer = `${ans}`;
    exp = `각 자릿수를 맞춰서 더해줍니다. (${n1} + ${n2} = ${ans})`;
    options = shuffleAndPick([answer, `${ans+10}`, `${ans-10}`, `${ans+2}`], answer, 4);

  } else if (cat === '2_1_1_2') { // (두 자리 수)-(두 자리 수)
    let n1 = rand(25, 99);
    let n2 = rand(11, n1 - 5);
    let ans = n1 - n2;
    q = `${n1} - ${n2} = ?`;
    answer = `${ans}`;
    exp = `각 자릿수를 맞춰서 빼줍니다. (${n1} - ${n2} = ${ans})`;
    options = shuffleAndPick([answer, `${ans+10}`, `${ans-10}`, `${ans+2}`], answer, 4);

  } else if (cat === '2_1_1_3') { // 세 수의 덧셈과 뺄셈
    let type = rand(1, 4);
    let a, b, c, ans;
    if (type === 1) { // a + b + c
      a = rand(10, 30); b = rand(10, 30); c = rand(10, 30);
      ans = a + b + c;
      q = `${a} + ${b} + ${c} = ?`;
      exp = `앞에서부터 차례대로 더해줍니다. (${a} + ${b} = ${a+b}, ${a+b} + ${c} = ${ans})`;
    } else if (type === 2) { // a - b + c
      a = rand(40, 80); b = rand(10, a - 10); c = rand(10, 30);
      ans = a - b + c;
      q = `${a} - ${b} + ${c} = ?`;
      exp = `앞에서부터 차례대로 계산합니다. (${a} - ${b} = ${a-b}, ${a-b} + ${c} = ${ans})`;
    } else if (type === 3) { // a + b - c
      a = rand(15, 40); b = rand(15, 40); c = rand(10, a + b - 5);
      ans = a + b - c;
      q = `${a} + ${b} - ${c} = ?`;
      exp = `앞에서부터 차례대로 계산합니다. (${a} + ${b} = ${a+b}, ${a+b} - ${c} = ${ans})`;
    } else { // a - b - c
      a = rand(50, 90); b = rand(10, 25); c = rand(10, a - b - 5);
      ans = a - b - c;
      q = `${a} - ${b} - ${c} = ?`;
      exp = `앞에서부터 차례대로 빼줍니다. (${a} - ${b} = ${a-b}, ${a-b} - ${c} = ${ans})`;
    }
    answer = `${ans}`;
    options = shuffleAndPick([answer, `${ans+10}`, `${ans-10}`, `${ans+2}`], answer, 4);

  } else if (cat === '2_1_2_1') { // 더하기를 곱셈으로 나타내기
    let num = rand(2, 9);
    let count = rand(2, 8);
    let type = rand(1, 2);
    
    if (type === 1) {
      let addArr = Array(count).fill(num).join(" + ");
      q = `${addArr} 를 곱셈식으로 나타내면?`;
      answer = `${num} × ${count}`;
      exp = `${num}을(를) ${count}번 더한 것은 곱셈식으로 ${num} × ${count} 입니다.`;
      
      let o1 = answer;
      let o2 = `${num} + ${count}`;
      let o3 = `${num} × ${count + 1}`;
      let o4 = `${num + 1} × ${count}`;
      options = shuffleAndPick([o1, o2, o3, o4], answer, 4);
    } else {
      q = `${num}를 ${count}번 더한 것을 곱셈식으로 나타내면?`;
      answer = `${num} × ${count}`;
      exp = `${num}를 ${count}번 더한 것은 ${num} × ${count} 로 나타냅니다.`;
      
      let o1 = answer;
      let o2 = `${num} + ${count}`;
      let o3 = `${num} × ${count - 1 < 1 ? count + 2 : count - 1}`;
      let o4 = `${num} ÷ ${count}`;
      options = shuffleAndPick([o1, o2, o3, o4], answer, 4);
    }

  }
  // ===== 2학년 2학기 =====
  // 1단원 : 네 자리 수
  else if (cat === '2_2_1_1') { // 각 자리의 숫자는 얼마
    let thousand = rand(1, 9);
    let hundred = rand(0, 9);
    let ten = rand(0, 9);
    let one = rand(0, 9);
    let num = thousand * 1000 + hundred * 100 + ten * 10 + one;
    
    let target = rand(1, 2); // 1: 자릿수 숫자, 2: 숫자가 나타내는 값
    if (target === 1) {
      let posChoice = rand(1, 4);
      if (posChoice === 1) {
        q = `${num} 에서 <b>천의 자리</b> 숫자는 얼마일까요?`;
        answer = `${thousand}`;
        exp = `${num} 의 천의 자리 숫자는 ${thousand} 입니다.`;
      } else if (posChoice === 2) {
        q = `${num} 에서 <b>백의 자리</b> 숫자는 얼마일까요?`;
        answer = `${hundred}`;
        exp = `${num} 의 백의 자리 숫자는 ${hundred} 입니다.`;
      } else if (posChoice === 3) {
        q = `${num} 에서 <b>십의 자리</b> 숫자는 얼마일까요?`;
        answer = `${ten}`;
        exp = `${num} 의 십의 자리 숫자는 ${ten} 입니다.`;
      } else {
        q = `${num} 에서 <b>일의 자리</b> 숫자는 얼마일까요?`;
        answer = `${one}`;
        exp = `${num} 의 일의 자리 숫자는 ${one} 입니다.`;
      }
      options = shuffleAndPick([answer, `${(parseInt(answer)+1)%10}`, `${(parseInt(answer)+2)%10}`, `${(parseInt(answer)+3)%10}`], answer, 4);
    } else {
      let posChoice = rand(1, 3);
      if (posChoice === 1 && thousand > 0) {
        q = `${num} 에서 숫자 <b>${thousand}</b>가 나타내는 값은 얼마일까요?`;
        answer = `${thousand * 1000}`;
        exp = `천의 자리에 있는 숫자 ${thousand}는 ${thousand * 1000}을 나타냅니다.`;
      } else if (posChoice === 2 && hundred > 0) {
        q = `${num} 에서 숫자 <b>${hundred}</b>가 나타내는 값은 얼마일까요?`;
        answer = `${hundred * 100}`;
        exp = `백의 자리에 있는 숫자 ${hundred}는 ${hundred * 100}을 나타냅니다.`;
      } else {
        q = `${num} 에서 숫자 <b>${ten === 0 ? 5 : ten}</b>가 나타내는 값은 얼마일까요?`;
        if(ten === 0) ten = 5;
        num = thousand * 1000 + hundred * 100 + ten * 10 + one;
        q = `${num} 에서 숫자 <b>${ten}</b>가 나타내는 값은 얼마일까요?`;
        answer = `${ten * 10}`;
        exp = `십의 자리에 있는 숫자 ${ten}는 ${ten * 10}을 나타냅니다.`;
      }
      options = shuffleAndPick([answer, `${parseInt(answer)/10}`, `${parseInt(answer)*10}`, `${parseInt(answer)+10}`], answer, 4);
    }

  } else if (cat === '2_2_1_2') { // 네 자리 수 크기 비교
    let n1 = rand(1000, 9999);
    let n2 = rand(1000, 9999);
    while (n1 === n2) n2 = rand(1000, 9999);
    
    let isBig = rand(0, 1) === 1;
    let target = isBig ? Math.max(n1, n2) : Math.min(n1, n2);
    
    q = `두 수 (${n1}, ${n2}) 중 더 <b>${isBig ? '큰' : '작은'}</b> 수는?`;
    answer = `${target}`;
    exp = `천의 자리부터 차례로 비교합니다. (${n1}과 ${n2} 중 더 ${isBig ? '큰' : '작은'} 수는 ${target}입니다)`;
    options = shuffleAndPick([`${n1}`, `${n2}`], answer, 2);

  } else if (cat.startsWith('2_2_2_') && cat !== '2_2_2_all') { // 곱셈구구 개별 단 (2~9단)
    let dan = parseInt(cat.replace('2_2_2_', ''));
    let mul = rand(1, 9);
    let ans = dan * mul;
    q = `${dan} × ${mul} = ?`;
    answer = `${ans}`;
    exp = `${dan}의 단 곱셈구구: ${dan} × ${mul} = ${ans}`;
    
    let o1 = answer;
    let o2 = `${ans + dan}`;
    let o3 = `${ans - dan < 1 ? ans + 2 : ans - dan}`;
    let o4 = `${ans + 1}`;
    options = shuffleAndPick([o1, o2, o3, o4], answer, 4);

  }

  return { q, answer, opts: options, exp };
}

function generateQuestion(cat) {
  if (cat === '2_1_1_all') {
    let sub = rand(1, 3);
    return generateSingleQuestion(`2_1_1_${sub}`);
  }
  if (cat === '2_2_1_all') {
    let sub = rand(1, 2);
    return generateSingleQuestion(`2_2_1_${sub}`);
  }
  if (cat === '2_2_2_all') {
    let dan = rand(2, 9);
    return generateSingleQuestion(`2_2_2_${dan}`);
  }
  return generateSingleQuestion(cat);
}

function loadNextQuestion() {
  if (correctCount >= totalQuestions) {
    endTime = new Date().getTime();
    let totalTime = ((endTime - startTime) / 1000).toFixed(1);
    let now = new Date().toLocaleString('ko-KR');
    
    document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
    document.getElementById("result-screen").classList.remove("hidden");
    
    document.getElementById("result-text").innerHTML = `
      <b>[${currentSubTitle}]</b><br><br>
      👤 <b>이름:</b> ${userName}<br>
      ⏱️ <b>걸린 시간:</b> <span style="color:#10b981; font-size:1.2rem; font-weight:bold;">${totalTime}초</span><br>
      📅 <b>완료 시각:</b> <span style="font-size:0.85rem; color:#64748b;">${now}</span>
    `;
    return;
  }
  
  document.getElementById("progress").innerText = correctCount;
  document.getElementById("progress-fill").style.width = (correctCount / totalQuestions * 100) + "%";
  
  qData = generateQuestion(selectedCategory);
  
  document.getElementById("question-text").innerHTML = qData.q;
  
  let optsBox = document.getElementById("options-box");
  optsBox.innerHTML = "";
  optsBox.style.gridTemplateColumns = (qData.opts.length === 2) ? "1fr 1fr" : "1fr 1fr";
  
  qData.opts.forEach(val => {
    let btn = document.createElement("button");
    btn.innerHTML = val;
    btn.onclick = () => checkAnswer(val);
    optsBox.appendChild(btn);
  });
}

function checkAnswer(selected) {
  if (selected === qData.answer) {
    correctCount++;
    loadNextQuestion();
  } else {
    document.getElementById("explanation-text").innerHTML = `
      <div><b>💡 정답:</b> ${qData.answer}</div>
      <div style="margin-top:6px;">${qData.exp}</div>
    `;
    let nextBtn = document.getElementById("modal-next-btn");
    nextBtn.disabled = false;
    nextBtn.innerText = "다음";
    document.getElementById("explanation-modal").classList.remove("hidden");
  }
}

function triggerModalCountdown() {
  let nextBtn = document.getElementById("modal-next-btn");
  if(nextBtn.disabled) return;
  nextBtn.disabled = true;
  
  let count = 3;
  nextBtn.innerText = `3초 후 다음 문제... (${count})`;
  
  let timer = setInterval(() => {
    count--;
    if(count > 0) {
      nextBtn.innerText = `3초 후 다음 문제... (${count})`;
    } else {
      clearInterval(timer);
      document.getElementById("explanation-modal").classList.add("hidden");
      loadNextQuestion();
    }
  }, 1000);
}
</script>
