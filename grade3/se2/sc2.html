<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3학년 2학기 과학 - 지구와 바다 퀴즈</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #f0fdf4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
      color: #1e293b;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
      position: relative;
    }
    .top-nav {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #e2e8f0;
      color: #334155;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
    }
    .nav-btn:active {
      background-color: #cbd5e1;
    }
    h1 {
      font-size: 22px;
      color: #15803d;
      margin-bottom: 8px;
    }
    .sub-title {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #334155;
      font-size: 15px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #16a34a;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      box-sizing: border-box;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background-color: #16a34a;
      color: #ffffff;
    }
    .btn-secondary {
      background-color: #64748b;
      color: #ffffff;
    }
    .btn-success {
      background-color: #0284c7;
      color: #ffffff;
    }

    /* 퀴즈 진행 화면 */
    #quiz-screen {
      display: none;
      text-align: left;
    }
    .progress-bar-container {
      width: 100%;
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #16a34a;
      transition: width 0.3s ease;
    }
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 14px;
      font-weight: bold;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    .badge-mcq { background: #dcfce7; color: #15803d; }
    .badge-sa { background: #fef3c7; color: #92400e; }

    .question-box {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
      color: #0f172a;
      margin-bottom: 20px;
      min-height: 60px;
    }
    .question-box u {
      color: #dc2626;
      text-decoration-thickness: 2px;
    }
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      width: 100%;
      padding: 14px 16px;
      background-color: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      color: #334155;
      cursor: pointer;
      line-height: 1.4;
      transition: all 0.2s;
    }
    .option-btn:active {
      background-color: #dcfce7;
      border-color: #16a34a;
      color: #15803d;
    }

    .sa-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 오답 화면 */
    #wrong-screen {
      display: none;
      background-color: #fef2f2;
      border: 2px solid #fca5a5;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .wrong-title {
      color: #dc2626;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .explanation-box {
      background: #ffffff;
      padding: 15px;
      border-radius: 10px;
      border-left: 4px solid #dc2626;
      text-align: left;
      font-size: 14px;
      color: #334155;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    /* 성공 화면 */
    #success-screen {
      display: none;
    }
    .trophy {
      font-size: 60px;
      margin-bottom: 10px;
    }
    .success-title {
      font-size: 22px;
      color: #16a34a;
      font-weight: bold;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .result-info {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      margin-bottom: 20px;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .result-item:last-child {
      margin-bottom: 0;
    }
    .result-label {
      color: #475569;
      font-weight: bold;
    }
    .result-value {
      color: #166534;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- 1. 시작 화면 -->
    <div id="start-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>
      <h1>3학년 과학 퀴즈</h1>
      <p class="sub-title">2단원. 지구와 바다</p>

      <div class="input-group">
        <label for="userName">이름을 입력하세요</label>
        <input type="text" id="userName" placeholder="예: 홍길동" autocomplete="off">
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="startQuiz()">시작</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

    <!-- 2. 퀴즈 진행 화면 -->
    <div id="quiz-screen">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      
      <div class="quiz-header">
        <span id="question-number">문제 1 / 10</span>
        <span id="question-type-badge" class="badge badge-mcq">객관식</span>
      </div>

      <div class="question-box" id="question-text"></div>

      <!-- 객관식 영역 -->
      <div class="options-container" id="options-container"></div>

      <!-- 단답식 영역 -->
      <div class="sa-container" id="sa-container" style="display: none;">
        <input type="text" id="sa-input" placeholder="정답 입력" onkeydown="if(event.key==='Enter') submitSAAnswer()">
        <button class="btn btn-primary" onclick="submitSAAnswer()">정답 제출</button>
      </div>
    </div>

    <!-- 3. 오답 화면 -->
    <div id="wrong-screen">
      <div class="wrong-title">❌ 틀렸습니다!</div>
      <div class="explanation-box">
        <strong>💡 간단 해설:</strong>
        <p id="explanation-text" style="margin-top: 6px;"></p>
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="returnToStart()">계속</button>
    </div>

    <!-- 4. 성공 축하 화면 -->
    <div id="success-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>

      <div class="trophy">🎉</div>
      <div class="success-title">축하합니다!<br>10문제를 모두 맞추셨습니다!</div>
      
      <div class="result-info">
        <div class="result-item">
          <span class="result-label">이름</span>
          <span class="result-value" id="result-name">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">총 걸린시간</span>
          <span class="result-value" id="result-time">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">현재 시간</span>
          <span class="result-value" id="result-date">-</span>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-success" onclick="returnToStart()">재도전</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

  </div>

  <script>
    // ----------------------------------------------------
    // 단답식 문제 은행 (총 7개)
    // 정답 : 대기, 지구 표면, 빙하, 소금, 밀물, 썰물, 갯벌
    // ----------------------------------------------------
    const saBank = [
      {
        q: "지구를 둘러싼 기체를 무엇이라고 하나요?",
        ans: "대기",
        exp: "지구를 둘러싸고 있는 기체를 '대기'라고 합니다."
      },
      {
        q: "산, 들, 강, 바다, 호수, 계곡, 사막, 빙하 등 다양한 모습을 볼 수 있는 곳을 무엇이라고 하나요?",
        ans: "지구 표면",
        exp: "산, 들, 강, 바다, 사막 등이 펼쳐져 있는 곳은 '지구 표면'입니다."
      },
      {
        q: "육지의 물 중 가장 많은 양을 차지하며, 얼음 상태로 있는 것을 무엇이라고 하나요?",
        ans: "빙하",
        exp: "육지의 물은 '빙하'와 같이 얼음 상태로 있는 경우가 가장 많습니다."
      },
      {
        q: "바닷물에 녹아 있어 사람이 바로 마시기 적당하지 않게 만들며, 바닷물에서 얻을 수 있는 물질은 무엇인가요?",
        ans: "소금",
        exp: "바닷물에는 소금과 같은 물질이 녹아 있어 사람이 마시기에 적당하지 않으며, 바닷물에서 소금을 얻을 수 있습니다."
      },
      {
        q: "바닷물의 높이가 높아지면서 바닷물이 육지 쪽으로 밀려 들어오는 현상을 무엇이라고 하나요?",
        ans: "밀물",
        exp: "바닷물의 높이가 높아져 육지 쪽으로 밀려 들어오는 현상을 '밀물'이라고 합니다."
      },
      {
        q: "바닷물의 높이가 낮아지면서 바닷물이 바다 쪽으로 빠져나가는 현상을 무엇이라고 하나요?",
        ans: "썰물",
        exp: "바닷물의 높이가 낮아져 바다 쪽으로 빠져나가는 현상을 '썰물'이라고 합니다."
      },
      {
        q: "밀물일 때는 물에 잠기고 썰물일 때는 물 밖으로 드러나는 평평한 땅을 무엇이라고 하나요?",
        ans: "갯벌",
        exp: "밀물 때 물에 잠기고 썰물 때 드러나는 평평한 땅을 '갯벌'이라고 합니다."
      }
    ];

    // ----------------------------------------------------
    // 객관식 문제 은행 (총 23개)
    // ----------------------------------------------------
    const mcqBank = [
      {
        q: "다음 중 지구에 대기가 있어 나타나는 모습으로 <u>올바르지 않은</u> 것은 무엇인가요?",
        options: [
          "바닷물이 항상 같은 높이로 정지해 있는다.",
          "생물이 숨을 쉴 수 있다.",
          "구름이 생기고 비나 눈이 올 수 있다.",
          "동물과 식물이 살기에 알맞은 온도를 유지해 준다."
        ],
        ans: 0,
        exp: "바닷물의 높이가 밀물과 썰물로 변하는 것은 대기와 직접적인 관계가 없으며, 대기는 숨을 쉬게 하고 온도를 유지해 줍니다."
      },
      {
        q: "지구에 대기가 있어서 할 수 있는 활동으로 올바른 것은 무엇인가요?",
        options: [
          "풍력 발전을 하거나 연을 날릴 수 있다.",
          "육지의 넓이를 바다보다 넓게 만든다.",
          "바닷속 소금을 모두 없어지게 만든다.",
          "지구 표면의 모든 물을 얼음으로 만든다."
        ],
        ans: 0,
        exp: "대기(공기의 흐름)가 있어 풍력 발전을 하고 연을 날리거나 열기구를 탈 수 있습니다."
      },
      {
        q: "다음 중 지구 표면에서 볼 수 있는 지형이나 모습이 <u>아닌</u> 것은 무엇인가요?",
        options: [
          "우주선",
          "산과 들",
          "강과 바다",
          "호수와 계곡"
        ],
        ans: 0,
        exp: "지구 표면에서는 산, 들, 강, 바다, 호수, 계곡, 사막, 빙하 등을 볼 수 있습니다."
      },
      {
        q: "지구 표면의 육지와 바다에 대한 설명으로 올바른 것은 무엇인가요?",
        options: [
          "지구 표면에서 바다가 차지하는 면적이 육지보다 넓다.",
          "육지는 물로 덮여 있고 바다는 땅으로 이루어져 있다.",
          "지구 표면은 육지가 바다보다 넓다.",
          "육지와 바다가 차지하는 면적은 완전히 똑같다."
        ],
        ans: 0,
        exp: "지구 표면은 육지(땅)와 바다(물)로 나뉘며, 바다가 차지하는 면적이 육지보다 넓습니다."
      },
      {
        q: "지구본에 육지 붙임딱지 42개, 바다 붙임딱지 98개를 붙여 비교한 결과로 올바른 것은 무엇인가요?",
        options: [
          "지구 표면에서 바다가 차지하는 면적이 육지보다 넓다.",
          "지구 표면에서 육지가 차지하는 면적이 바다보다 넓다.",
          "지구 표면은 모두 육지로 이루어져 있다.",
          "지구본에는 바다 붙임딱지를 붙일 수 없다."
        ],
        ans: 0,
        exp: "바다 붙임딱지 수가 98개로 육지(42개)보다 많으므로 바다 면적이 더 넓습니다."
      },
      {
        q: "육지의 물에 대한 설명으로 올바른 것은 무엇인가요?",
        options: [
          "빙하와 같이 얼음 상태로 있는 경우가 가장 많다.",
          "바닷물보다 양이 훨씬 많다.",
          "육지에 사는 동물이 먹을 수 없다.",
          "소금이 많이 녹아 있어 바로 마시기 적당하지 않다."
        ],
        ans: 0,
        exp: "육지의 물은 빙하처럼 얼음 상태인 경우가 가장 많고, 육지에 사는 동물이 먹을 수 있습니다."
      },
      {
        q: "바닷물의 특징에 대한 설명으로 <u>옳지 않은</u> 것은 무엇인가요?",
        options: [
          "사람이 마시기에 매우 적당하다.",
          "소금과 같은 여러 가지 물질이 녹아 있다.",
          "바닷물에서 소금을 얻을 수 있다.",
          "육지의 물보다 양이 훨씬 많다."
        ],
        ans: 0,
        exp: "바닷물은 소금 등 여러 물질이 녹아 있어 사람이 마시기에 적당하지 않습니다."
      },
      {
        q: "다음 중 육지에 사는 동물이 먹을 수 있는 물은 무엇인가요?",
        options: [
          "육지의 물",
          "바닷물",
          "소금물",
          "오염물"
        ],
        ans: 0,
        exp: "강, 호수 등에 있는 육지의 물은 육지에 사는 동물이 먹을 수 있습니다."
      },
      {
        q: "다음 중 다양한 바닷가 지형에 해당하지 <u>않는</u> 것은 무엇인가요?",
        options: [
          "사막의 높은 모래산",
          "모래 해변",
          "절벽과 동굴",
          "갯벌"
        ],
        ans: 0,
        exp: "바닷가 지형에는 모래 해변, 절벽, 동굴, 갯벌 등이 있습니다."
      },
      {
        q: "바닷물의 높이가 높아지면서 바닷물이 육지 쪽으로 밀려 들어오는 현상은 무엇인가요?",
        options: [
          "밀물",
          "썰물",
          "가뭄",
          "폭설"
        ],
        ans: 0,
        exp: "바닷물의 높이가 높아지면서 육지 쪽으로 밀려드는 것은 밀물입니다."
      },
      {
        q: "바닷물의 높이가 낮아지면서 바닷물이 바다 쪽으로 빠져나가는 현상은 무엇인가요?",
        options: [
          "썰물",
          "밀물",
          "한파",
          "홍수"
        ],
        ans: 0,
        exp: "바닷물의 높이가 낮아지며 바다 쪽으로 빠져나가는 것은 썰물입니다."
      },
      {
        q: "갯벌에 대한 설명으로 <u>옳지 않은</u> 것은 무엇인가요?",
        options: [
          "밀물일 때 물 밖으로 드러나고 썰물일 때 잠긴다.",
          "밀물일 때는 물에 잠긴다.",
          "썰물일 때는 물 밖으로 드러나는 평평한 땅이다.",
          "서천, 신안, 보성·순천, 고창 등에 위치해 있다."
        ],
        ans: 0,
        exp: "갯벌은 '밀물일 때 물에 잠기고', '썰물일 때 물 밖으로 드러나는' 땅입니다."
      },
      {
        q: "다음 중 언급된 우리나라의 대표적인 갯벌 지역이 <u>아닌</u> 것은 무엇인가요?",

    // ----------------------------------------------------
    // 게임 상태 변수
    // ----------------------------------------------------
    let userName = "";
    let quizQueue = [];
    let currentIdx = 0;
    let startTime = null;

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const wrongScreen = document.getElementById("wrong-screen");
    const successScreen = document.getElementById("success-screen");

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startQuiz() {
      const nameInput = document.getElementById("userName").value.trim();
      if (!nameInput) {
        alert("이름을 입력해 주세요!");
        return;
      }
      userName = nameInput;

      // 1-7번: 객관식 7개 무작위 추출
      // 8-10번: 단답식 3개 무작위 추출
      const selectedMCQs = shuffle(mcqBank).slice(0, 7);
      const selectedSAs = shuffle(saBank).slice(0, 3);

      const formattedMCQs = selectedMCQs.map(item => {
        const correctText = item.options[item.ans];
        const shuffledOptions = shuffle(item.options);
        const newAnsIdx = shuffledOptions.indexOf(correctText);
        return {
          type: "MCQ",
          q: item.q,
          options: shuffledOptions,
          ans: newAnsIdx,
          exp: item.exp
        };
      });

      const formattedSAs = selectedSAs.map(item => ({
        type: "SA",
        q: item.q,
        ans: item.ans,
        exp: item.exp
      }));

      quizQueue = [...formattedMCQs, ...formattedSAs];
      currentIdx = 0;
      startTime = Date.now();

      startScreen.style.display = "none";
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "block";

      renderQuestion();
    }

    function renderQuestion() {
      const qData = quizQueue[currentIdx];
      
      const progressPercent = ((currentIdx + 1) / 10) * 100;
      document.getElementById("progress-bar").style.width = progressPercent + "%";
      document.getElementById("question-number").textContent = `문제 ${currentIdx + 1} / 10`;

      const badge = document.getElementById("question-type-badge");
      const optionsBox = document.getElementById("options-container");
      const saBox = document.getElementById("sa-container");

      document.getElementById("question-text").innerHTML = `${currentIdx + 1}. ${qData.q}`;

      if (qData.type === "MCQ") {
        badge.textContent = "객관식";
        badge.className = "badge badge-mcq";
        optionsBox.style.display = "flex";
        saBox.style.display = "none";

        optionsBox.innerHTML = "";
        qData.options.forEach((optText, idx) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = `${idx + 1}. ${optText}`;
          btn.onclick = () => checkMCQAnswer(idx);
          optionsBox.appendChild(btn);
        });
      } else {
        badge.textContent = "단답식";
        badge.className = "badge badge-sa";
        optionsBox.style.display = "none";
        saBox.style.display = "flex";

        const saInput = document.getElementById("sa-input");
        saInput.value = "";
        setTimeout(() => saInput.focus(), 100);
      }
    }

    function checkMCQAnswer(selectedIdx) {
      const qData = quizQueue[currentIdx];
      if (selectedIdx === qData.ans) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function submitSAAnswer() {
      const qData = quizQueue[currentIdx];
      const userInput = document.getElementById("sa-input").value.trim().replace(/\s+/g, "");
      const targetAns = qData.ans.replace(/\s+/g, "");

      if (!userInput) {
        alert("정답을 입력해주세요.");
        return;
      }

      if (userInput === targetAns) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < 10) {
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function showWrongScreen(explanationText) {
      quizScreen.style.display = "none";
      wrongScreen.style.display = "block";
      document.getElementById("explanation-text").textContent = explanationText;
    }

    function returnToStart() {
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "none";
      startScreen.style.display = "block";
    }

    function finishQuiz() {
      const endTime = Date.now();
      const elapsedSeconds = Math.round((endTime - startTime) / 1000);

      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      const dateStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

      document.getElementById("result-name").textContent = userName;
      document.getElementById("result-time").textContent = `${elapsedSeconds}초`;
      document.getElementById("result-date").textContent = dateStr;

      quizScreen.style.display = "none";
      successScreen.style.display = "block";
    }
  </script>
