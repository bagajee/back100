<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3학년 1학기 과학 - 1. 힘과 우리 생활</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #f0fdf4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
      color: #166534;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
      position: relative;
    }
    .top-nav {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #f1f5f9;
      color: #334155;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
      border: 1px solid #cbd5e1;
    }
    .nav-btn:active {
      background-color: #e2e8f0;
    }
    h1 {
      font-size: 22px;
      color: #15803d;
      margin-bottom: 8px;
    }
    .sub-title {
      font-size: 14px;
      color: #475569;
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #334155;
      font-size: 15px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #16a34a;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      box-sizing: border-box;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background-color: #16a34a;
      color: #ffffff;
    }
    .btn-secondary {
      background-color: #64748b;
      color: #ffffff;
    }

    /* 퀴즈 화면 */
    #quiz-screen {
      display: none;
      text-align: left;
    }
    .progress-bar-container {
      width: 100%;
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #16a34a;
      transition: width 0.3s ease;
    }
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 14px;
      font-weight: bold;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    .badge-mcq { background: #dcfce7; color: #15803d; }
    .badge-sa { background: #fef3c7; color: #92400e; }

    .question-box {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
      color: #0f172a;
      margin-bottom: 20px;
      min-height: 60px;
    }
    .question-box u {
      color: #dc2626;
      text-decoration-thickness: 2px;
    }
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      width: 100%;
      padding: 14px 16px;
      background-color: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      color: #334155;
      cursor: pointer;
      line-height: 1.4;
      transition: all 0.2s;
    }
    .option-btn:active {
      background-color: #dcfce7;
      border-color: #16a34a;
      color: #14532d;
    }

    .sa-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 오답 화면 */
    #wrong-screen {
      display: none;
      background-color: #fef2f2;
      border: 2px solid #fca5a5;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .wrong-title {
      color: #dc2626;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .explanation-box {
      background: #ffffff;
      padding: 15px;
      border-radius: 10px;
      border-left: 4px solid #dc2626;
      text-align: left;
      font-size: 14px;
      color: #334155;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    /* 성공 화면 */
    #success-screen {
      display: none;
    }
    .trophy {
      font-size: 60px;
      margin-bottom: 10px;
    }
    .success-title {
      font-size: 22px;
      color: #15803d;
      font-weight: bold;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .result-info {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      margin-bottom: 20px;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .result-item:last-child {
      margin-bottom: 0;
    }
    .result-label {
      color: #475569;
      font-weight: bold;
    }
    .result-value {
      color: #16a34a;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- 1. 시작 화면 -->
    <div id="start-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>
      <h1>3학년 과학 퀴즈</h1>
      <p class="sub-title">1. 힘과 우리 생활</p>

      <div class="input-group">
        <label for="userName">이름을 입력하세요</label>
        <input type="text" id="userName" placeholder="예: 홍길동" autocomplete="off">
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="startQuiz()">시작</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

    <!-- 2. 퀴즈 진행 화면 -->
    <div id="quiz-screen">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      
      <div class="quiz-header">
        <span id="question-number">문제 1 / 10</span>
        <span id="question-type-badge" class="badge badge-mcq">객관식</span>
      </div>

      <div class="question-box" id="question-text"></div>

      <!-- 객관식 영역 -->
      <div class="options-container" id="options-container"></div>

      <!-- 단답식 영역 -->
      <div class="sa-container" id="sa-container" style="display: none;">
        <input type="text" id="sa-input" placeholder="정답 입력" onkeydown="if(event.key==='Enter') submitSAAnswer()">
        <button class="btn btn-primary" onclick="submitSAAnswer()">정답 제출</button>
      </div>
    </div>

    <!-- 3. 오답 화면 -->
    <div id="wrong-screen">
      <div class="wrong-title">❌ 틀렸습니다!</div>
      <div class="explanation-box">
        <strong>💡 간단 해설:</strong>
        <p id="explanation-text" style="margin-top: 6px;"></p>
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="returnToStart()">계속</button>
    </div>

    <!-- 4. 성공 축하 화면 -->
    <div id="success-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>

      <div class="trophy">🏆</div>
      <div class="success-title">축하합니다!<br>10문제를 모두 맞추셨습니다!</div>
      
      <div class="result-info">
        <div class="result-item">
          <span class="result-label">이름</span>
          <span class="result-value" id="result-name">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">총 걸린시간</span>
          <span class="result-value" id="result-time">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">현재 시간</span>
          <span class="result-value" id="result-date">-</span>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="startQuiz()">재도전</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

  </div>

  <script>
    // ----------------------------------------------------
    // 단답식 문제 은행 (정답: 무게, 힘의 크기, 수평, 저울, 영점 조절, 지레, 빗면) - 총 10문제
    // ----------------------------------------------------
    const saBank = [
      {
        q: "물체가 가볍고 무거운 정도를 나타내는 말을 무엇이라고 하나요?",
        ans: "무게",
        exp: "물체가 가볍고 무거운 정도를 '무게'라고 합니다."
      },
      {
        q: "물체의 무게에 따라 물체를 밀거나 당겨서 움직일 때 드는 이것이 달라집니다. 이것은 무엇인가요?",
        ans: "힘의 크기",
        exp: "물체의 무게에 따라 밀거나 당겨서 움직일 때 드는 힘의 크기가 달라집니다."
      },
      {
        q: "수평 잡기 활동에서 어느 쪽으로도 기울지 않은 상태를 무엇이라고 하나요?",
        ans: "수평",
        exp: "어느 쪽으로도 기울지 않고 평평하게 유지되는 상태를 '수평'이라고 합니다."
      },
      {
        q: "물체의 무게를 정확하게 비교하고 측정할 때 사용하는 도구를 통틀어 무엇이라고 하나요?",
        ans: "저울",
        exp: "저울을 사용하면 물체의 무게를 정확하게 비교할 수 있습니다."
      },
      {
        q: "용수철저울로 물체의 무게를 재기 전에 표시 자가 눈금 '0'을 가리키도록 맞추는 과정을 무엇이라고 하나요?",
        ans: "영점 조절",
        exp: "용수철저울 사용 전 영점 조절 나사를 돌려 눈금을 '0'에 맞추는 과정은 영점 조절입니다."
      },
      {
        q: "가위, 병따개, 시소처럼 직접 들어 올리거나 자를 때보다 더 작은 힘이 들도록 돕는 도구의 원리는 무엇인가요?",
        ans: "지레",
        exp: "지레를 이용하면 물체를 직접 들거나 움직일 때보다 더 작은 힘이 듭니다."
      },
      {
        q: "사다리차, 경사로, 나사못처럼 물체를 높은 곳으로 올릴 때 더 작은 힘이 들도록 돕는 경사진 면의 원리는 무엇인가요?",
        ans: "빗면",
        exp: "빗면을 이용하면 물체를 높은 곳으로 직접 들어 올릴 때보다 더 작은 힘이 듭니다."
      },
      {
        q: "책이 들어 있는 책가방이 빈 책가방보다 가벼운 것이 아니라 더 무겁습니다. 이처럼 물체의 가벼우락무거운 정도를 무엇이라고 하나요?",
        ans: "무게",
        exp: "물체의 가볍고 무거운 정도는 무게입니다."
      },
      {
        q: "우편물을 보내거나 요리할 때 재료의 양을 정확하게 비교하기 위해 사용하는 도구는 무엇인가요?",
        ans: "저울",
        exp: "우편물 수송이나 요리 재료 측정에는 저울이 사용됩니다."
      },
      {
        q: "받침점으로부터 같은 거리에 있는 두 물체의 무게가 같으면 판이 이것을 이룹니다. 무엇인가요?",
        ans: "수평",
        exp: "같은 거리에 있는 두 물체의 무게가 같으면 판이 수평을 이룹니다."
      }
    ];

    // ----------------------------------------------------
    // 객관식 문제 은행 - 총 20문제
    // ----------------------------------------------------
    const mcqBank = [
      {
        q: "복사용지 묶음 4개가 든 상자와 1개가 든 상자를 밀 때의 설명으로 <u>옳지 않은 것</u>은 무엇인가요?",
        options: ["복사용지 묶음 4개가 든 상자를 밀 때 더 큰 힘이 든다.", "복사용지 묶음 1개가 든 상자를 밀 때 더 작은 힘이 든다.", "물체의 무게에 따라 밀 때 드는 힘의 크기가 달라진다.", "무거운 상자를 밀 때 더 작은 힘이 든다."],
        ans: 3,
        exp: "무거운 상자일수록 밀어서 움직일 때 더 큰 힘이 듭니다."
      },
      {
        q: "물체의 무게와 밀거나 당길 때 드는 힘의 관계에 대한 설명으로 <u>옳지 않은 것</u>은 무엇인가요?",
        options: ["가벼운 물체일수록 움직일 때 더 큰 힘이 든다.", "무거운 물체일수록 움직일 때 더 큰 힘이 든다.", "물체의 무게에 따라 드는 힘의 크기가 달라진다.", "무게가 가벼운 상자는 무거운 상자보다 당기기 쉽다."],
        ans: 0,
        exp: "무게가 가벼운 물체일수록 밀거나 당길 때 더 작은 힘이 듭니다."
      },
      {
        q: "수평 잡기 활동에서 두 물체가 받침점으로부터 같은 거리에 있을 때, 판이 한쪽으로 기울었습니다. 이에 대한 설명으로 알맞은 것은 무엇인가요?",
        options: ["기울어진 쪽의 물체가 더 무겁다.", "기울어진 쪽의 물체가 더 가볍다.", "두 물체의 무게는 서로 같다.", "받침점에 더 가까운 물체가 가볍다."],
        ans: 0,
        exp: "받침점으로부터 같은 거리에 있을 때, 판이 기울어지면 기울어진 쪽의 물체가 더 무겁습니다."
      },
      {
        q: "수평 잡기 활동에서 두 물체가 받침점으로부터 다른 거리에 있을 때, 판이 수평을 이루었습니다. 어느 쪽 물체가 더 무겁나요?",
        options: ["받침점에 더 가까운 물체", "받침점에서 더 먼 물체", "두 물체의 무게는 항상 똑같다.", "거리와 무게는 상관이 없다."],
        ans: 0,
        exp: "받침점으로부터 다른 거리에 있을 때 판이 수평을 이루면, 받침점에 더 가까운 물체가 더 무겁습니다."
      },
      {
        q: "일상생활에서 저울을 사용하는 예로 <u>옳지 않은 것</u>은 무엇인가요?",
        options: ["체중계로 몸무게 변화를 비교할 때", "공항에서 비행기를 타기 전 짐의 무게를 비교할 때", "우편물을 보낼 때 무게를 비교할 때", "자의 길이를 정확하게 측정할 때"],
        ans: 3,
        exp: "자의 길이는 저울이 아닌 줄자나 자를 이용하여 측정합니다."
      },
      {
        q: "용수철저울에서 물체의 무게를 재기 전에 표시 자가 눈금 '0'을 가리키도록 조절하는 부분의 이름은 무엇인가요?",
        options: ["영점 조절 나사", "표시 자", "고리", "손잡이"],
        ans: 0,
        exp: "영점 조절 나사는 표시 자가 눈금 '0'을 가리키도록 조절하는 나사입니다."
      },
      {
        q: "용수철저울의 각 부분과 역할이 올바르게 연결되지 <u>않은 것</u>은 무엇인가요?",
        options: ["손잡이 - 용수철저울을 잡거나 스탠드에 거는 부분", "용수철 - 물체를 매달면 늘어나는 부분", "고리 - 물체의 무게에 해당하는 숫자의 눈금을 가리키는 부분", "눈금 - 표시 자가 가리키는 부분으로 물체의 무게를 나타냄"],
        ans: 2,
        exp: "숫자의 눈금을 가리키는 부분은 '표시 자'이며, 고리는 '물체를 거는 부분'입니다."
      },
      {
        q: "용수철저울의 가장 아랫부분에 위치하며, 무게를 잴 물체를 걸어두는 부분은 어디인가요?",
        options: ["고리", "손잡이", "용수철", "표시 자"],
        ans: 0,
        exp: "고리는 용수철저울의 가장 아랫부분으로 물체를 거는 역할을 합니다."
      },
      {
        q: "용수철저울로 물체의 무게를 챌 때 주의할 점으로 <u>옳지 않은 것</u>은 무엇인가요?",
        options: ["표시 자와 눈높이를 맞추어 눈금을 읽는다.", "영점 조절 나사를 돌려 표시 자를 '0'에 맞춘다.", "물체가 흔들리고 있을 때 빠르게 눈금을 읽는다.", "물체를 고리에 걸고 표시 자가 움직이지 않을 때까지 기다린다."],
        ans: 2,
        exp: "물체를 고리에 걸고 표시 자가 움직이지 않을 때까지 기다린 후에 눈금을 읽어야 합니다."
      },
      {
        q: "용수철저울에서 큰 눈금 한 칸이 25 g을 나타낼 때, 작은 눈금 한 칸이 나타내는 무게는 얼마인가요?",
        options: ["5 g", "10 g", "15 g", "20 g"],
        ans: 0,
        exp: "용수철저울에서 큰 눈금 한 칸이 25 g일 때, 이를 5등분한 작은 눈금 한 칸은 5 g을 나타냅니다."
      },
      {
        q: "지레를 이용하여 물체를 들어 올릴 때의 특징으로 알맞은 것은 무엇인가요?",
        options: ["직접 들어 올릴 때보다 더 작은 힘이 든다.", "직접 들어 올릴 때보다 더 큰 힘이 든다.", "드는 힘의 크기가 항상 똑같다.", "물체의 무게가 늘어난다."],
        ans: 0,
        exp: "지레를 이용해 물체를 들어 올리면 직접 들어 올릴 때보다 더 작은 힘이 듭니다."
      },
      {
        q: "빗면을 이용하여 물체를 들어 올릴 때의 특징으로 알맞은 것은 무엇인가요?",
        options: ["직접 들어 올릴 때보다 더 작은 힘이 든다.", "직접 들어 올릴 때보다 더 큰 힘이 든다.", "물체의 무게가 실제로 줄어든다.", "힘이 두 배로 많이 든다."],
        ans: 0,
        exp: "빗면을 이용해 물체를 들어 올리면 직접 들어 올릴 때보다 더 작은 힘이 듭니다."
      },
      {
        q: "다음 중 지레를 이용하는 예가 <u>아닌 것</u>은 무엇인가요?",
        options: ["가위", "병따개", "시소", "경사로"],
        ans: 3,
        exp: "경사로는 빗면을 이용하는 예입니다."
      },
      {
        q: "다음 중 빗면을 이용하는 예가 <u>아닌 것</u>은 무엇인가요?",
        options: ["사다리차", "경사로", "나사못", "병따개"],
        ans: 3,
        exp: "병따개는 지레를 이용하는 예입니다."
      },
      {
        q: "가위를 사용할 때 지레의 원리를 이용하면 얻을 수 있는 장점은 무엇인가요?",
        options: ["직접 자를 때보다 더 작은 힘으로 물체를 자를 수 있다.", "물체의 가위질 속도가 자동으로 빨라진다.", "물체의 정확한 무게를 측정할 수 있다.", "자르는 물체의 재질이 부드러워진다."],
        ans: 0,
        exp: "가위를 사용하면 직접 자를 때보다 더 작은 힘으로 물체를 자를 수 있습니다."
      },
      {
        q: "몸무게 차이가 나는 두 친구가 시소를 탈 수 있는 까닭은 어떤 도구의 원리를 이용했기 때문인가요?",
        options: ["지레", "빗면", "바퀴", "자석"],
        ans: 0,
        exp: "시소는 지레의 원리를 이용하여 몸무게 차이가 나는 친구들도 함께 탈 수 있습니다."
      },
      {
        q: "작은 힘으로 나사못을 물체에 고정할 수 있는 까닭은 어떤 도구의 원리가 적용되었기 때문인가요?",
        options: ["빗면", "지레", "용수철", "수평"],
        ans: 0,
        exp: "나사못에는 빗면의 원리가 적용되어 있어 작은 힘으로도 물체에 고정할 수 있습니다."
      },
      {
        q: "요리할 때 재료의 양(무게)을 비교하기 위해 사용하는 도구는 무엇인가요?",
        options: ["저울", "자", "체온계", "돋보기"],
        ans: 0,
        exp: "요리할 때 재료의 양(무게)을 정확히 비교하기 위해 저울을 사용합니다."
      },
      {
        q: "용수철저울에서 물체를 매달았을 때 물체의 무게에 따라 늘어나는 부분은 무엇인가요?",
        options: ["용수철", "손잡이", "고리", "영점 조절 나사"],
        ans: 0,
        exp: "용수철은 물체를 매달면 무게에 따라 늘어나는 부분입니다."
      },
      {
        q: "사다리차가 물체를 높은 곳으로 올릴 때 직접 들어 올릴 때보다 더 작은 힘이 드는 원리는 무엇인가요?",
        options: ["빗면", "지레", "자전", "수평"],
        ans: 0,
        exp: "사다리차는 빗면의 원리를 이용하여 높은 곳으로 물체를 더 작은 힘으로 올립니다."
      }
    ];

    // ----------------------------------------------------
    // 게임 상태 변수
    // ----------------------------------------------------
    let userName = "";
    let quizQueue = [];
    let currentIdx = 0;
    let startTime = null;

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const wrongScreen = document.getElementById("wrong-screen");
    const successScreen = document.getElementById("success-screen");

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startQuiz() {
      const nameInput = document.getElementById("userName").value.trim();
      if (!nameInput) {
        alert("이름을 입력해 주세요!");
        return;
      }
      userName = nameInput;

      // 1-7번: 객관식 20개 중 7개 무작위 추출 및 보기 셔플
      // 8-10번: 단답식 10개 중 3개 무작위 추출
      const selectedMCQs = shuffle(mcqBank).slice(0, 7);
      const selectedSAs = shuffle(saBank).slice(0, 3);

      const formattedMCQs = selectedMCQs.map(item => {
        const correctText = item.options[item.ans];
        const shuffledOptions = shuffle(item.options);
        const newAnsIdx = shuffledOptions.indexOf(correctText);
        return {
          type: "MCQ",
          q: item.q,
          options: shuffledOptions,
          ans: newAnsIdx,
          exp: item.exp
        };
      });

      const formattedSAs = selectedSAs.map(item => ({
        type: "SA",
        q: item.q,
        ans: item.ans,
        exp: item.exp
      }));

      quizQueue = [...formattedMCQs, ...formattedSAs];
      currentIdx = 0;
      startTime = Date.now();

      startScreen.style.display = "none";
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "block";

      renderQuestion();
    }

    function renderQuestion() {
      const qData = quizQueue[currentIdx];
      
      const progressPercent = ((currentIdx + 1) / 10) * 100;
      document.getElementById("progress-bar").style.width = progressPercent + "%";
      document.getElementById("question-number").textContent = `문제 ${currentIdx + 1} / 10`;

      const badge = document.getElementById("question-type-badge");
      const optionsBox = document.getElementById("options-container");
      const saBox = document.getElementById("sa-container");

      document.getElementById("question-text").innerHTML = `${currentIdx + 1}. ${qData.q}`;

      if (qData.type === "MCQ") {
        badge.textContent = "객관식";
        badge.className = "badge badge-mcq";
        optionsBox.style.display = "flex";
        saBox.style.display = "none";

        optionsBox.innerHTML = "";
        qData.options.forEach((optText, idx) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = `${idx + 1}. ${optText}`;
          btn.onclick = () => checkMCQAnswer(idx);
          optionsBox.appendChild(btn);
        });
      } else {
        badge.textContent = "단답식";
        badge.className = "badge badge-sa";
        optionsBox.style.display = "none";
        saBox.style.display = "flex";

        const saInput = document.getElementById("sa-input");
        saInput.value = "";
        setTimeout(() => saInput.focus(), 100);
      }
    }

    function checkMCQAnswer(selectedIdx) {
      const qData = quizQueue[currentIdx];
      if (selectedIdx === qData.ans) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function submitSAAnswer() {
      const qData = quizQueue[currentIdx];
      const userInput = document.getElementById("sa-input").value.trim().replace(/\s+/g, "");
      const targetAns = qData.ans.replace(/\s+/g, "");

      if (!userInput) {
        alert("정답을 입력해주세요.");
        return;
      }

      if (userInput === targetAns) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < 10) {
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function showWrongScreen(explanationText) {
      quizScreen.style.display = "none";
      wrongScreen.style.display = "block";
      document.getElementById("explanation-text").textContent = explanationText;
    }

    function returnToStart() {
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "none";
      startScreen.style.display = "block";
    }

    function finishQuiz() {
      const endTime = Date.now();
      const elapsedSeconds = Math.round((endTime - startTime) / 1000);

      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      const dateStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

      document.getElementById("result-name").textContent = userName;
      document.getElementById("result-time").textContent = `${elapsedSeconds}초`;
      document.getElementById("result-date").textContent = dateStr;

      quizScreen.style.display = "none";
      successScreen.style.display = "block";
    }
  </script>
