<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3학년 1학기 과학 - 2. 동물의 생활</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #f0fdf4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
      color: #166534;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
      position: relative;
    }
    .top-nav {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #f1f5f9;
      color: #334155;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
      border: 1px solid #cbd5e1;
    }
    .nav-btn:active {
      background-color: #e2e8f0;
    }
    h1 {
      font-size: 22px;
      color: #15803d;
      margin-bottom: 8px;
    }
    .sub-title {
      font-size: 14px;
      color: #475569;
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #334155;
      font-size: 15px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #16a34a;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      box-sizing: border-box;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background-color: #16a34a;
      color: #ffffff;
    }
    .btn-secondary {
      background-color: #64748b;
      color: #ffffff;
    }

    /* 퀴즈 화면 */
    #quiz-screen {
      display: none;
      text-align: left;
    }
    .progress-bar-container {
      width: 100%;
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #16a34a;
      transition: width 0.3s ease;
    }
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 14px;
      font-weight: bold;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    .badge-mcq { background: #dcfce7; color: #15803d; }
    .badge-sa { background: #fef3c7; color: #92400e; }

    .question-box {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
      color: #0f172a;
      margin-bottom: 20px;
      min-height: 60px;
    }
    .question-box u {
      color: #dc2626;
      text-decoration-thickness: 2px;
    }
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      width: 100%;
      padding: 14px 16px;
      background-color: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      color: #334155;
      cursor: pointer;
      line-height: 1.4;
      transition: all 0.2s;
    }
    .option-btn:active {
      background-color: #dcfce7;
      border-color: #16a34a;
      color: #14532d;
    }

    .sa-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 오답 화면 */
    #wrong-screen {
      display: none;
      background-color: #fef2f2;
      border: 2px solid #fca5a5;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .wrong-title {
      color: #dc2626;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .explanation-box {
      background: #ffffff;
      padding: 15px;
      border-radius: 10px;
      border-left: 4px solid #dc2626;
      text-align: left;
      font-size: 14px;
      color: #334155;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    /* 성공 화면 */
    #success-screen {
      display: none;
    }
    .trophy {
      font-size: 60px;
      margin-bottom: 10px;
    }
    .success-title {
      font-size: 22px;
      color: #15803d;
      font-weight: bold;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .result-info {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      margin-bottom: 20px;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .result-item:last-child {
      margin-bottom: 0;
    }
    .result-label {
      color: #475569;
      font-weight: bold;
    }
    .result-value {
      color: #16a34a;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- 1. 시작 화면 -->
    <div id="start-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>
      <h1>3학년 과학 퀴즈</h1>
      <p class="sub-title">2. 동물의 생활</p>

      <div class="input-group">
        <label for="userName">이름을 입력하세요</label>
        <input type="text" id="userName" placeholder="예: 홍길동" autocomplete="off">
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="startQuiz()">시작</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

    <!-- 2. 퀴즈 진행 화면 -->
    <div id="quiz-screen">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      
      <div class="quiz-header">
        <span id="question-number">문제 1 / 10</span>
        <span id="question-type-badge" class="badge badge-mcq">객관식</span>
      </div>

      <div class="question-box" id="question-text"></div>

      <!-- 객관식 영역 -->
      <div class="options-container" id="options-container"></div>

      <!-- 단답식 영역 -->
      <div class="sa-container" id="sa-container" style="display: none;">
        <input type="text" id="sa-input" placeholder="정답 입력" onkeydown="if(event.key==='Enter') submitSAAnswer()">
        <button class="btn btn-primary" onclick="submitSAAnswer()">정답 제출</button>
      </div>
    </div>

    <!-- 3. 오답 화면 -->
    <div id="wrong-screen">
      <div class="wrong-title">❌ 틀렸습니다!</div>
      <div class="explanation-box">
        <strong>💡 간단 해설:</strong>
        <p id="explanation-text" style="margin-top: 6px;"></p>
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="returnToStart()">계속</button>
    </div>

    <!-- 4. 성공 축하 화면 -->
    <div id="success-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>

      <div class="trophy">🏆</div>
      <div class="success-title">축하합니다!<br>10문제를 모두 맞추셨습니다!</div>
      
      <div class="result-info">
        <div class="result-item">
          <span class="result-label">이름</span>
          <span class="result-value" id="result-name">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">총 걸린시간</span>
          <span class="result-value" id="result-time">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">현재 시간</span>
          <span class="result-value" id="result-date">-</span>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="startQuiz()">재도전</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

  </div>

  <script>
    // ----------------------------------------------------
    // 단답식 문제 은행 (정답: 기준, 물갈퀴, 극지방, 사막) - 총 10문제
    // ----------------------------------------------------
    const saBank = [
      {
        q: "동물을 분류할 때 날개가 있는가, 다리가 있는가처럼 객관적으로 정해야 하는 분류 조건을 무엇이라고 하나요?",
        ans: "기준",
        exp: "동물은 특징에 따라 여러 가지 분류 기준을 정해 분류할 수 있습니다."
      },
      {
        q: "개구리나 수달의 발가락 사이에 있으며, 물속에서 물을 더 많이 밀어내어 빠르게 움직일 수 있게 해주는 생김새는 무엇인가요?",
        ans: "물갈퀴",
        exp: "물갈퀴가 있으면 물을 더 많이 밀어내어 물속에서 빠르게 움직일 수 있습니다."
      },
      {
        q: "눈과 빙하로 덮여 있고 매우 추운 환경을 가진 곳은 어디인가요?",
        ans: "극지방",
        exp: "극지방은 눈과 빙하로 덮여 있고 매우 추운 환경입니다."
      },
      {
        q: "낮과 밤의 온도 차이가 크고 비가 적게 내려 건조한 환경을 가진 곳은 어디인가요?",
        ans: "사막",
        exp: "사막은 낮과 밤의 온도 차이가 크고 비가 적게 내려 건조한 환경입니다."
      },
      {
        q: "동물을 분류할 때 '생김새가 귀여운가?'처럼 사람마다 결과가 달라지지 않도록 정해야 하는 적절한 분류 (  )은 무엇인가요?",
        ans: "기준",
        exp: "사람마다 분류 결과가 달라지지 않도록 명확한 분류 기준을 정해야 합니다."
      },
      {
        q: "물놀이용 용품인 오리발은 개구리 발의 어떤 생김새 특징을 이용해 만든 것인가요?",
        ans: "물갈퀴",
        exp: "물놀이용 물갈퀴(오리발)는 헤엄을 잘 치는 개구리의 발을 이용해 만들어졌습니다."
      },
      {
        q: "북극곰, 순록, 하프물범처럼 촘촘한 털이나 두꺼운 지방을 가진 동물들이 살아가는 추운 환경은 어디인가요?",
        ans: "극지방",
        exp: "북극곰, 순록, 하프물범은 추운 극지방 환경에 적응하여 살아가고 있습니다."
      },
      {
        q: "낙타, 사막여우, 이집트땅거북처럼 모래바람을 막거나 큰 귀로 열을 내보내는 동물들이 사는 건조한 환경은 어디인가요?",
        ans: "사막",
        exp: "낙타, 사막여우, 이집트땅거북은 건조한 사막 환경에 알맞은 생김새를 가지고 있습니다."
      },
      {
        q: "동물을 특징에 따라 나눌 때 바탕이 되는 기준을 분류 (  )이라고 합니다. 공란에 들어갈 말은 무엇인가요?",
        ans: "기준",
        exp: "특정에 따라 동물을 나누는 근거를 분류 기준이라고 합니다."
      },
      {
        q: "물에 사는 동물 중 개구리나 수달이 발에 가지고 있어 물속에서 헤엄치기 좋게 해주는 부분은 무엇인가요?",
        ans: "물갈퀴",
        exp: "개구리와 수달은 물갈퀴가 있는 발로 물속에서 헤엄쳐 다닙니다."
      }
    ];

    // ----------------------------------------------------
    // 객관식 문제 은행 - 총 20문제
    // ----------------------------------------------------
    const mcqBank = [
      {
        q: "다음 중 사람마다 분류 결과가 달라질 수 있어 적절하지 않은 분류 기준은 무엇인가요?",
        options: ["'생김새가 귀여운가?'", "'날개가 있는가?'", "'다리가 있는가?'", "'더듬이가 있는가?'"],
        ans: 0,
        exp: "'생김새가 귀여운가?'는 주관적인 생각이 들어가므로 적절한 분류 기준이 아닙니다."
      },
      {
        q: "다음 중 적절한 분류 기준에 따라 동물을 나누었을 때, '날개가 있는가?'의 '그렇다'에 해당하는 동물은 무엇인가요?",
        options: ["제비", "토끼", "붕어", "고양이"],
        ans: 0,
        exp: "제비와 나비 등은 날개가 있는 동물에 해당합니다."
      },
      {
        q: "땅속에 사는 두더지의 생김새 특징으로 알맞은 것은 무엇인가요?",
        options: ["앞다리가 삽처럼 넓적하고 두꺼운 발톱이 있다.", "몸이 딱딱한 껍데기로만 덮여 있다.", "눈이 매우 크고 밝다.", "다리가 세 쌍이 있다."],
        ans: 0,
        exp: "두더지는 눈이 거의 보이지 않으며, 앞다리가 삽처럼 넓적하고 두꺼운 발톱이 있습니다."
      },
      {
        q: "다음 중 개미의 몸 구조와 생활 방식에 대한 설명으로 <u>옳지 않은 것</u>은 무엇인가요?",
        options: ["다리가 네 쌍이다.", "큰턱을 이용해 땅을 판다.", "몸은 머리, 가슴, 배로 구분된다.", "무리 지어 생활한다."],
        ans: 0,
        exp: "개미는 다리가 네 쌍이 아니라 '세 쌍'입니다."
      },
      {
        q: "땅속에 사는 지렁이의 이동 방식에 대한 설명으로 알맞은 것은 무엇인가요?",
        options: ["몸의 앞부분을 늘려 흙을 밀어낸 뒤 뒷부분을 끌어당기며 이동한다.", "넓적한 앞다리로 굴을 파서 빠르게 달린다.", "날개를 펼쳐 땅속을 날아다닌다.", "큰턱으로 땅을 파고 다리로 헤엄친다."],
        ans: 0,
        exp: "지렁이는 다리가 없으며 몸의 앞부분을 늘려 흙을 밀어낸 다음 뒷부분을 끌어당기며 이동합니다."
      },
      {
        q: "땅속에 사는 땅강아지에 대한 설명으로 알맞은 것은 무엇인가요?",
        options: ["넓적한 앞다리로 땅을 판다.", "다리가 전혀 없다.", "몸이 길고 원통 모양이다.", "나무뿌리의 즙을 빨아 먹는다."],
        ans: 0,
        exp: "땅강아지는 다리가 세 쌍이며, 넓적한 앞다리로 땅을 판다."
      },
      {
        q: "물에 사는 붕어, 고등어, 돌고래의 공통적인 생김새와 이동 방식 특징은 무엇인가요?",
        options: ["몸이 곡선 모양이고 지느러미로 헤엄쳐 다닌다.", "발에 물갈퀴가 있어 걸어 다닌다.", "몸이 딱딱한 껍데기로 싸여 기어다닌다.", "큰 귀로 물속의 열을 내보낸다."],
        ans: 0,
        exp: "붕어, 고등어, 돌고래 등은 몸이 곡선 모양이고 지느러미로 물속을 헤엄쳐 다닙니다."
      },
      {
        q: "다음 중 강이나 호수에 사는 동물이 <u>아닌 것</u>은 무엇인가요?",
        options: ["바다거북", "붕어", "미꾸라지", "다슬기"],
        ans: 0,
        exp: "바다거북은 갯벌과 바다에 사는 동물입니다."
      },
      {
        q: "다음 중 갯벌과 바다에 사는 동물로만 올바르게 짝지어진 것은 무엇인가요?",
        options: ["오징어, 돌고래, 꽃게", "붕어, 미꾸라지, 개구리", "수달, 피라미, 물방개", "매미 애벌레, 두더지, 개미"],
        ans: 0,
        exp: "오징어, 돌고래, 꽃게, 바다거북, 가오리 등은 갯벌과 바다에 사는 동물입니다."
      },
      {
        q: "다음 중 극지방의 환경 특징에 대한 설명으로 알맞은 것은 무엇인가요?",
        options: ["눈과 빙하로 덮여 있고 매우 추운 환경이다.", "낮과 밤의 온도 차이가 크고 비가 적게 내린다.", "항상 건조하고 모래바람이 많이 분다.", "날씨가 매우 따뜻하고 풀이 무성하다."],
        ans: 0,
        exp: "극지방은 눈과 빙하로 덮여 있으며 매우 추운 환경입니다."
      },
      {
        q: "다음 중 사막의 환경 특징에 대한 설명으로 알맞은 것은 무엇인가요?",
        options: ["낮과 밤의 온도 차이가 크고 비가 적게 내려 건조하다.", "눈과 빙하로 덮여 있어 항상 매우 춥다.", "물이 풍부하여 강과 호수가 많다.", "바다로 둘러싸여 습도가 매우 높다."],
        ans: 0,

      {

        options: ["촘촘하게 난 털과 두꺼운 지방", "넓적한 앞다리와 큰턱", "큰 귀와 혹은 지방 저장", "몸의 곡선 모양과 지느러미"],
        ans: 0,
        exp: "북극곰은 촘촘하게 난 털과 두꺼운 지방이 있어 극지방의 추위를 견딜 수 있습니다."
      },
      {
        q: "순록이 눈 위를 걸어갈 때 눈에 발이 잘 빠지지 않는 까닭은 무엇인가요?",
        options: ["발굽이 넓고 편평하기 때문에", "발에 물갈퀴가 있기 때문에", "다리가 세 쌍이기 때문에", "몸이 곡선 모양이기 때문에"],
        ans: 0,
        exp: "순록은 발굽이 넓고 편평하여 눈에 발이 잘 빠지지 않습니다."
      },
      {
        q: "사막여우가 사막 환경에서 몸속의 열을 잘 내보낼 수 있는 생김새 특징은 무엇인가요?",
        options: ["큰 귀", "두꺼운 지방", "넓적한 발굽", "지느러미"],
        ans: 0,
        exp: "사막여우는 큰 귀를 통해 몸속의 열을 밖으로 내보냅니다."
      },
      {
        q: "낙타가 사막의 모래바람으로부터 눈과 귀를 보호할 수 있는 생김새 특징은 무엇인가요?",
        options: ["눈썹과 귀 주위의 털이 길어서", "등의 혹에 지방이 있어서", "발가락 사이에 물갈퀴가 있어서", "피부에 작은 돌기가 있어서"],
        ans: 0,
        exp: "낙타는 눈썹과 귀 주위의 털이 길어 모래로부터 눈과 귀를 보호합니다."
      },
      {
        q: "다음 중 동물의 특징과 이를 활용한 생활용품의 연결이 <u>옳지 않은 것</u>은 무엇인가요?",
        options: ["굴착기 - 산양의 발굽", "흡착판 - 문어의 빨판", "등산화 - 산양의 발굽", "고속 열차 - 산천어의 곡선 모양"],
        ans: 0,
        exp: "굴착기는 앞다리로 땅을 잘 파는 '두더지'의 특징을 이용해 만든 생활용품입니다."
      },
      {
        q: "문어의 빨판처럼 다른 물체에 잘 붙는 특징을 활용하여 만든 생활용품은 무엇인가요?",
        options: ["흡착판", "등산화", "굴착기", "윙슈트"],
        ans: 0,
        exp: "다른 물체에 잘 붙는 문어의 빨판 특징을 활용하여 흡착판을 만들었습니다."
      },
      {
        q: "잘 미끄러지지 않는 산양의 발굽 특징을 활용하여 만든 생활용품은 무엇인가요?",
        options: ["등산화", "고속 열차", "전신 수영복", "접착테이프"],
        ans: 0,
        exp: "잘 미끄러지지 않는 산양의 발굽 특징을 활용하여 등산화를 만들었습니다."
      },
      {
        q: "부드러운 곡선 모양인 산천어의 특징을 이용해 만든 생활용품은 무엇인가요?",
        options: ["고속 열차", "집게 차", "굴착기", "탐색구조 로봇"],
        ans: 0,
        exp: "부드러운 곡선 모양인 산천어의 생김새를 이용해 고속 열차를 만들었습니다."
      },
      {
        q: "좁은 곳을 자유롭게 이동할 수 있는 뱀의 특징을 활용하여 만든 것은 무엇인가요?",
        options: ["탐색구조 로봇", "윙슈트", "접착테이프", "물놀이용 물갈퀴"],
        ans: 0,
        exp: "좁은 곳을 자유롭게 이동하는 뱀의 특징을 이용해 탐색구조 로봇을 만들었습니다."
      }
    ];

    // ----------------------------------------------------
    // 게임 상태 변수
    // ----------------------------------------------------
    let userName = "";
    let quizQueue = [];
    let currentIdx = 0;
    let startTime = null;

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const wrongScreen = document.getElementById("wrong-screen");
    const successScreen = document.getElementById("success-screen");

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startQuiz() {
      const nameInput = document.getElementById("userName").value.trim();
      if (!nameInput) {
        alert("이름을 입력해 주세요!");
        return;
      }
      userName = nameInput;

      // 1-7번: 객관식 20개 중 7개 무작위 추출 및 보기 셔플
      // 8-10번: 단답식 10개 중 3개 무작위 추출
      const selectedMCQs = shuffle(mcqBank).slice(0, 7);
      const selectedSAs = shuffle(saBank).slice(0, 3);

      const formattedMCQs = selectedMCQs.map(item => {
        const correctText = item.options[item.ans];
        const shuffledOptions = shuffle(item.options);
        const newAnsIdx = shuffledOptions.indexOf(correctText);
        return {
          type: "MCQ",
          q: item.q,
          options: shuffledOptions,
          ans: newAnsIdx,
          exp: item.exp
        };
      });

      const formattedSAs = selectedSAs.map(item => ({
        type: "SA",
        q: item.q,
        ans: item.ans,
        exp: item.exp
      }));

      quizQueue = [...formattedMCQs, ...formattedSAs];
      currentIdx = 0;
      startTime = Date.now();

      startScreen.style.display = "none";
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "block";

      renderQuestion();
    }

    function renderQuestion() {
      const qData = quizQueue[currentIdx];
      
      const progressPercent = ((currentIdx + 1) / 10) * 100;
      document.getElementById("progress-bar").style.width = progressPercent + "%";
      document.getElementById("question-number").textContent = `문제 ${currentIdx + 1} / 10`;

      const badge = document.getElementById("question-type-badge");
      const optionsBox = document.getElementById("options-container");
      const saBox = document.getElementById("sa-container");

      document.getElementById("question-text").innerHTML = `${currentIdx + 1}. ${qData.q}`;

      if (qData.type === "MCQ") {
        badge.textContent = "객관식";
        badge.className = "badge badge-mcq";
        optionsBox.style.display = "flex";
        saBox.style.display = "none";

        optionsBox.innerHTML = "";
        qData.options.forEach((optText, idx) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = `${idx + 1}. ${optText}`;
          btn.onclick = () => checkMCQAnswer(idx);
          optionsBox.appendChild(btn);
        });
      } else {
        badge.textContent = "단답식";
        badge.className = "badge badge-sa";
        optionsBox.style.display = "none";
        saBox.style.display = "flex";

        const saInput = document.getElementById("sa-input");
        saInput.value = "";
        setTimeout(() => saInput.focus(), 100);
      }
    }

    function checkMCQAnswer(selectedIdx) {
      const qData = quizQueue[currentIdx];
      if (selectedIdx === qData.ans) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function submitSAAnswer() {
      const qData = quizQueue[currentIdx];
      const userInput = document.getElementById("sa-input").value.trim().replace(/\s+/g, "");
      const targetAns = qData.ans.replace(/\s+/g, "");

      if (!userInput) {
        alert("정답을 입력해주세요.");
        return;
      }

      if (userInput === targetAns) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < 10) {
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function showWrongScreen(explanationText) {
      quizScreen.style.display = "none";
      wrongScreen.style.display = "block";
      document.getElementById("explanation-text").textContent = explanationText;
    }

    function returnToStart() {
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "none";
      startScreen.style.display = "block";
    }

    function finishQuiz() {
      const endTime = Date.now();
      const elapsedSeconds = Math.round((endTime - startTime) / 1000);

      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      const dateStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

      document.getElementById("result-name").textContent = userName;
      document.getElementById("result-time").textContent = `${elapsedSeconds}초`;
      document.getElementById("result-date").textContent = dateStr;

      quizScreen.style.display = "none";
      successScreen.style.display = "block";
    }
  </script>
