<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>5학년 1학기 과학 - 빛의 성질 퀴즈</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #f0f9ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
      color: #0369a1;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
      position: relative;
    }
    .top-nav {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #f1f5f9;
      color: #334155;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
      border: 1px solid #cbd5e1;
    }
    .nav-btn:active {
      background-color: #e2e8f0;
    }
    h1 {
      font-size: 22px;
      color: #0284c7;
      margin-bottom: 8px;
    }
    .sub-title {
      font-size: 14px;
      color: #4b5563;
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #374151;
      font-size: 15px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #0284c7;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      box-sizing: border-box;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background-color: #0284c7;
      color: #ffffff;
    }
    .btn-secondary {
      background-color: #64748b;
      color: #ffffff;
    }
    .btn-success {
      background-color: #059669;
      color: #ffffff;
    }

    /* 퀴즈 화면 */
    #quiz-screen {
      display: none;
      text-align: left;
    }
    .progress-bar-container {
      width: 100%;
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #0284c7;
      transition: width 0.3s ease;
    }
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 14px;
      font-weight: bold;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    .badge-mcq { background: #e0f2fe; color: #0369a1; }
    .badge-sa { background: #fef3c7; color: #92400e; }

    .question-box {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
      color: #0f172a;
      margin-bottom: 20px;
      min-height: 60px;
    }
    .question-box u {
      color: #dc2626;
      text-decoration-thickness: 2px;
    }
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      width: 100%;
      padding: 14px 16px;
      background-color: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      color: #334155;
      cursor: pointer;
      line-height: 1.4;
      transition: all 0.2s;
    }
    .option-btn:active {
      background-color: #e0f2fe;
      border-color: #0284c7;
      color: #0369a1;
    }

    .sa-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 오답 화면 */
    #wrong-screen {
      display: none;
      background-color: #fef2f2;
      border: 2px solid #fca5a5;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .wrong-title {
      color: #dc2626;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .explanation-box {
      background: #ffffff;
      padding: 15px;
      border-radius: 10px;
      border-left: 4px solid #dc2626;
      text-align: left;
      font-size: 14px;
      color: #334155;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    /* 성공 화면 */
    #success-screen {
      display: none;
    }
    .trophy {
      font-size: 60px;
      margin-bottom: 10px;
    }
    .success-title {
      font-size: 22px;
      color: #0284c7;
      font-weight: bold;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .result-info {
      background-color: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      margin-bottom: 20px;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .result-item:last-child {
      margin-bottom: 0;
    }
    .result-label {
      color: #475569;
      font-weight: bold;
    }
    .result-value {
      color: #0284c7;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- 1. 시작 화면 -->
    <div id="start-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>
      <h1>5학년 과학 퀴즈</h1>
      <p class="sub-title">2. 빛의 성질</p>

      <div class="input-group">
        <label for="userName">이름을 입력하세요</label>
        <input type="text" id="userName" placeholder="예: 홍길동" autocomplete="off">
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="startQuiz()">시작</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

    <!-- 2. 퀴즈 진행 화면 -->
    <div id="quiz-screen">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      
      <div class="quiz-header">
        <span id="question-number">문제 1 / 10</span>
        <span id="question-type-badge" class="badge badge-mcq">객관식</span>
      </div>

      <div class="question-box" id="question-text"></div>

      <!-- 객관식 영역 -->
      <div class="options-container" id="options-container"></div>

      <!-- 단답식 영역 -->
      <div class="sa-container" id="sa-container" style="display: none;">
        <input type="text" id="sa-input" placeholder="정답 입력" onkeydown="if(event.key==='Enter') submitSAAnswer()">
        <button class="btn btn-primary" onclick="submitSAAnswer()">정답 제출</button>
      </div>
    </div>

    <!-- 3. 오답 화면 -->
    <div id="wrong-screen">
      <div class="wrong-title">❌ 틀렸습니다!</div>
      <div class="explanation-box">
        <strong>💡 간단 해설:</strong>
        <p id="explanation-text" style="margin-top: 6px;"></p>
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="returnToStart()">계속</button>
    </div>

    <!-- 4. 성공 축하 화면 -->
    <div id="success-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>

      <div class="trophy">🏆</div>
      <div class="success-title">축하합니다!<br>10문제를 모두 맞추셨습니다!</div>
      
      <div class="result-info">
        <div class="result-item">
          <span class="result-label">이름</span>
          <span class="result-value" id="result-name">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">총 걸린시간</span>
          <span class="result-value" id="result-time">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">현재 시간</span>
          <span class="result-value" id="result-date">-</span>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-success" onclick="returnToStart()">재도전</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

  </div>

  <script>
    // ----------------------------------------------------
    // 단답식 문제 은행 (7개 지정 정답)
    // ----------------------------------------------------
    const saBank = [
      {
        q: "물체를 넣고 손전등을 켜거나 꺼서 물체가 보이는 조건과 상태를 관찰하는 실험 상자는 무엇인가요?",
        ans: "어둠상자",
        exp: "어둠상자 속에 물체를 넣고 손전등을 켰을 때 비로소 상자 속 물체가 밝게 보입니다."
      },
      {
        q: "낮에는 햇빛, 밤에는 전등처럼 물체를 보기 위해 반드시 있어야 하는 것은 무엇인가요?",
        ans: "빛",
        exp: "물체를 보기 위해서는 물체를 비추는 빛이 반드시 필요합니다."
      },
      {
        q: "햇빛이나 레이저 지시기의 빛처럼 빛이 곧게 나아가는 성질을 무엇이라고 하나요?",
        ans: "빛의 직진",
        exp: "빛이 곧게 나아가는 성질을 빛의 직진이라고 하며, 이 때문에 그림자가 생깁니다."
      },
      {
        q: "빛이 거울에 부딪쳐 나아가는 방향이 바뀌는 성질을 무엇이라고 하나요?",
        ans: "빛의 반사",
        exp: "빛이 거울 등에 부딪쳐 방향을 바꾸어 나아가는 현상을 빛의 반사라고 합니다."
      },
      {
        q: "가운데 부분이 볼록하고 가장자리로 갈수록 얇아지는 렌즈를 무엇이라고 하나요?",
        ans: "볼록 렌즈",
        exp: "가운데가 볼록하고 가장자리가 얇은 렌즈는 볼록 렌즈입니다."
      },
      {
        q: "가운데 부분이 오목하고 가장자리로 갈수록 두꺼워지는 렌즈를 무엇이라고 하나요?",
        ans: "오목 렌즈",
        exp: "가운데가 오목하고 가장자리가 두꺼운 렌즈는 오목 렌즈입니다."
      },
      {
        q: "빛이 직진하다가 서로 다른 물질의 경계에서 꺾여 나아가는 성질을 무엇이라고 하나요?",
        ans: "빛의 굴절",
        exp: "빛이 렌즈나 물을 통과하면서 경계에서 꺾이는 성질을 빛의 굴절이라고 합니다."
      }
    ];

    // ----------------------------------------------------
    // 객관식 문제 은행 (총 33개)
    // ----------------------------------------------------
    const mcqBank = [
      {
        q: "어둠상자 속에 물체를 넣고 손전등을 켜지 않았을 때 일어나는 현상으로 알맞은 것은 무엇인가요?",
        options: ["어둠상자 속이 어둡고 물체가 잘 보이지 않는다.", "어둠상자 속이 환해지며 물체가 또렷하게 보인다.", "손전등을 켜지 않아도 물체가 스스로 빛을 낸다.", "상자 속 물체가 투명하게 변한다."],
        ans: 0,
        exp: "손전등을 켜지 않아 빛이 없으면 어둠상자 속이 어둡고 물체가 잘 보이지 않습니다."
      },
      {
        q: "어둠상자 속에 물체를 넣고 손전등을 켰을 때 일어나는 현상으로 알맞은 것은 무엇인가요?",
        options: ["어둠상자 속이 밝아지고 물체가 잘 보인다.", "상자 속이 여전히 어두워 물체가 보이지 않는다.", "물체의 그림자가 완전히 사라진다.", "물체가 갑자기 사라진다."],
        ans: 0,
        exp: "손전등을 켜면 빛이 물체를 비추어 상자 속 물체가 잘 보이게 됩니다."
      },
      {
        q: "물체를 보기 위해 반드시 필요한 것은 무엇인가요?",
        options: ["빛", "소리", "바람", "자석"],
        ans: 0,
        exp: "물체를 보기 위해서는 물체를 비추어주는 빛이 있어야 합니다."
      },
      {
        q: "낮에 우리가 주변 물체들을 볼 수 있도록 빛을 내어 주는 것은 무엇인가요?",
        options: ["햇빛", "달빛", "별빛", "손전등"],
        ans: 0,
        exp: "낮에는 햇빛이 있어 물체들을 볼 수 있습니다."
      },
      {
        q: "밤에 물체를 볼 수 있도록 빛을 내는 도구로 <u>옳지 않은 것</u>은 무엇인가요?",
        options: ["평면거울", "손전등", "전등", "촛불"],
        ans: 0,
        exp: "거울은 스스로 빛을 내는 도구가 아니라 빛을 반사하는 도구입니다."
      },
      {
        q: "구멍 뚫린 검은색 도화지 아래에 검은색 도화지를 나란히 두었을 때 닿는 햇빛의 모양은 어떠한가요?",
        options: ["네모난 구멍의 모양과 같다.", "둥근 동그라미 모양이 된다.", "세모난 모양으로 변한다.", "빛이 도화지에 전혀 닿지 않는다."],
        ans: 0,
        exp: "햇빛은 직진하므로 구멍 뚫린 모양 그대로 아래 도화지에 비칩니다."
      },
      {
        q: "검은색 도화지의 구멍을 통과하는 햇빛을 관찰하여 알 수 있는 햇빛의 성질은 무엇인가요?",
        options: ["햇빛이 똑바로 나아간다.", "햇빛이 동그랗게 구부러져 나아간다.", "햇빛이 나아가다가 뒤로 되돌아온다.", "햇빛은 어두운 곳에서만 나아간다."],
        ans: 0,
        exp: "햇빛이 구멍을 통해 똑바로 나아감을 알 수 있습니다."
      },
      {
        q: "어두운 교실에서 레이저 지시기를 켜고 앞쪽에 분무기로 물을 뿌렸을 때 빛이 나아가는 모습은 어떠한가요?",
        options: ["공기 중을 곧게 나아간다.", "물방울을 만나 지그재그로 꺾인다.", "동그란 원을 그리며 나아간다.", "앞으로 나아가지 못하고 멈춘다."],
        ans: 0,
        exp: "분무기로 물을 뿌리면 레이저 지시기의 빛이 공기 중을 곧게 나아가는 것을 관찰할 수 있습니다."
      },
      {
        q: "빛이 나아가다가 불투명한 물체를 만나면 어떻게 되나요?",
        options: ["더 이상 나아가지 못해 그림자가 생긴다.", "물체를 통과하여 계속 곧게 나아간다.", "물체를 흡수하여 없애버린다.", "빛이 스스로 여러 갈래로 분해된다."],
        ans: 0,
        exp: "빛이 직진하다가 불투명한 물체를 만나면 더 이상 나아가지 못해 뒤쪽에 그림자가 생깁니다."
      },
      {
        q: "빛이 불투명한 물체를 만났을 때 물체 뒤쪽에 생기는 현상은 무엇인가요?",
        options: ["그림자", "무지개", "볼록 렌즈", "어둠상자"],
        ans: 0,
        exp: "빛의 직진 때문에 불투명한 물체 뒤에는 그림자가 형성됩니다."
      },
      {
        q: "레이저 지시기의 빛을 평면거울에 비추었을 때 일어나는 현상으로 알맞은 것은 무엇인가요?",
        options: ["평면거울에 부딪친 후 방향을 바꾸어 나간다.", "평면거울을 그대로 통과하여 나아간다.", "거울에 부딪쳐 빛이 완전히 사라진다.", "거울 표면에 흡수되어 멈춘다."],
        ans: 0,
        exp: "레이저 지시기의 빛은 평면거울에 부딪친 후 방향을 바꾸어 나아갑니다."
      },
      {
        q: "레이저 지시기의 빛을 모양판에 맞추기 위해 움직여야 하는 도구로 알맞은 것은 무엇인가요?",
        options: ["평면거울", "돋보기안경", "볼록 렌즈", "어둠상자"],
        ans: 0,
        exp: "레이저 지시기나 평면거울을 움직이면 빛의 반사 방향을 조절해 모양판에 맞출 수 있습니다."
      },
      {
        q: "우리가 스스로 빛을 내지 않는 물체를 볼 수 있는 까닭으로 알맞은 설명은 무엇인가요?",

    // ----------------------------------------------------
    // 게임 상태 변수
    // ----------------------------------------------------
    let userName = "";
    let quizQueue = [];
    let currentIdx = 0;
    let startTime = null;

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const wrongScreen = document.getElementById("wrong-screen");
    const successScreen = document.getElementById("success-screen");

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startQuiz() {
      const nameInput = document.getElementById("userName").value.trim();
      if (!nameInput) {
        alert("이름을 입력해 주세요!");
        return;
      }
      userName = nameInput;

      // 1-7번: 객관식 33개 중 7개 무작위 추출 및 보기 셔플
      // 8-10번: 단답식 7개 중 3개 무작위 추출
      const selectedMCQs = shuffle(mcqBank).slice(0, 7);
      const selectedSAs = shuffle(saBank).slice(0, 3);

      const formattedMCQs = selectedMCQs.map(item => {
        const correctText = item.options[item.ans];
        const shuffledOptions = shuffle(item.options);
        const newAnsIdx = shuffledOptions.indexOf(correctText);
        return {
          type: "MCQ",
          q: item.q,
          options: shuffledOptions,
          ans: newAnsIdx,
          exp: item.exp
        };
      });

      const formattedSAs = selectedSAs.map(item => ({
        type: "SA",
        q: item.q,
        ans: item.ans,
        exp: item.exp
      }));

      quizQueue = [...formattedMCQs, ...formattedSAs];
      currentIdx = 0;
      startTime = Date.now();

      startScreen.style.display = "none";
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "block";

      renderQuestion();
    }

    function renderQuestion() {
      const qData = quizQueue[currentIdx];
      
      const progressPercent = ((currentIdx + 1) / 10) * 100;
      document.getElementById("progress-bar").style.width = progressPercent + "%";
      document.getElementById("question-number").textContent = `문제 ${currentIdx + 1} / 10`;

      const badge = document.getElementById("question-type-badge");
      const optionsBox = document.getElementById("options-container");
      const saBox = document.getElementById("sa-container");

      document.getElementById("question-text").innerHTML = `${currentIdx + 1}. ${qData.q}`;

      if (qData.type === "MCQ") {
        badge.textContent = "객관식";
        badge.className = "badge badge-mcq";
        optionsBox.style.display = "flex";
        saBox.style.display = "none";

        optionsBox.innerHTML = "";
        qData.options.forEach((optText, idx) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = `${idx + 1}. ${optText}`;
          btn.onclick = () => checkMCQAnswer(idx);
          optionsBox.appendChild(btn);
        });
      } else {
        badge.textContent = "단답식";
        badge.className = "badge badge-sa";
        optionsBox.style.display = "none";
        saBox.style.display = "flex";

        const saInput = document.getElementById("sa-input");
        saInput.value = "";
        setTimeout(() => saInput.focus(), 100);
      }
    }

    function checkMCQAnswer(selectedIdx) {
      const qData = quizQueue[currentIdx];
      if (selectedIdx === qData.ans) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function submitSAAnswer() {
      const qData = quizQueue[currentIdx];
      const userInput = document.getElementById("sa-input").value.trim().replace(/\s+/g, "");
      const targetAns = qData.ans.replace(/\s+/g, "");

      if (!userInput) {
        alert("정답을 입력해주세요.");
        return;
      }

      if (userInput === targetAns) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < 10) {
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function showWrongScreen(explanationText) {
      quizScreen.style.display = "none";
      wrongScreen.style.display = "block";
      document.getElementById("explanation-text").textContent = explanationText;
    }

    function returnToStart() {
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "none";
      startScreen.style.display = "block";
    }

    function finishQuiz() {
      const endTime = Date.now();
      const elapsedSeconds = Math.round((endTime - startTime) / 1000);

      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      const dateStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

      document.getElementById("result-name").textContent = userName;
      document.getElementById("result-time").textContent = `${elapsedSeconds}초`;
      document.getElementById("result-date").textContent = dateStr;

      quizScreen.style.display = "none";
      successScreen.style.display = "block";
    }
