<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2fa">
<meta name="color-scheme" content="light">
<title>5학년 1학기 수학</title>
<style>
:root{
  --bg:#eaeff9;
  --grid:#dae2f2;
  --surface:#ffffff;
  --ink:#15233f;
  --muted:#6c7c9c;
  --line:#dee6f3;
  --brand:#2f57cf;
  --brand-ink:#1c3a9c;
  --brand-soft:#e8edff;
  --mint:#0f9d76;
  --mint-soft:#e2f6ef;
  --amber:#e08600;
  --amber-soft:#fdf0d9;
  --coral:#e03b3b;
  --coral-soft:#fdeaea;
  --radius:16px;
  --shadow:0 2px 0 rgba(21,35,63,.06), 0 12px 28px -18px rgba(21,35,63,.5);
  --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body.locked{overflow:hidden}
body{
  margin:0;
  min-height:100dvh;
  font-family:var(--font);
  color:var(--ink);
  background-color:var(--bg);
  /* 모눈종이 배경: 수학 공책 느낌 */
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
  font-size:16px;
  line-height:1.55;
  word-break:keep-all;
  overflow-wrap:anywhere;
}
.app{
  width:100%;
  max-width:520px;
  margin:0 auto;
  padding:
    max(14px, env(safe-area-inset-top))
    max(14px, env(safe-area-inset-left))
    calc(24px + env(safe-area-inset-bottom))
    max(14px, env(safe-area-inset-right));
}
.screen{display:none}
.screen.active{display:block}
.hidden{display:none !important}

/* ---------- 공통 요소 ---------- */
.bar{
  display:flex;align-items:center;gap:10px;
  margin-bottom:14px;
}
.bar .spacer{flex:1}
.chip-link,.chip-btn{
  display:inline-flex;align-items:center;gap:5px;
  min-height:40px;padding:0 13px;
  background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:11px;
  font:inherit;font-size:.86rem;font-weight:700;
  text-decoration:none;cursor:pointer;
}
.chip-btn:active,.chip-link:active{background:var(--brand-soft);border-color:#c6d3ff}

h1{font-size:1.6rem;line-height:1.25;letter-spacing:-.02em;margin:2px 0 6px;font-weight:800}
h2{font-size:1.22rem;line-height:1.3;letter-spacing:-.02em;margin:0 0 6px;font-weight:800}
.lede{color:var(--muted);font-size:.92rem;margin:0 0 18px}

.btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;min-height:54px;padding:14px 16px;
  border:none;border-radius:14px;
  background:var(--brand);color:#fff;
  font:inherit;font-size:1.02rem;font-weight:800;letter-spacing:-.01em;
  cursor:pointer;touch-action:manipulation;
  transition:transform .12s ease, background .15s ease;
}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.5;cursor:default;transform:none}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:700}
.btn.ghost:active{background:#f2f5fc}
.btn + .btn{margin-top:9px}
:focus-visible{outline:3px solid #90a8ff;outline-offset:2px}

/* ---------- 홈: 단원 아코디언 ---------- */
.hero{
  background:var(--surface);border:1px solid var(--line);border-radius:20px;
  padding:20px 18px;box-shadow:var(--shadow);margin-bottom:16px;
}
.hero .badge{
  display:inline-block;padding:3px 10px;border-radius:999px;
  background:var(--brand-soft);color:var(--brand-ink);
  font-size:.76rem;font-weight:800;margin-bottom:9px;
}
.hero p{margin:0;color:var(--muted);font-size:.92rem}

.chapter{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow);
}
.chapter summary{
  display:flex;align-items:center;gap:12px;
  padding:14px 15px;cursor:pointer;list-style:none;min-height:60px;
}
.chapter summary::-webkit-details-marker{display:none}
.num{
  flex:none;width:32px;height:32px;border-radius:10px;
  background:var(--brand-soft);color:var(--brand-ink);
  display:grid;place-items:center;font-weight:800;font-size:.98rem;
  font-variant-numeric:tabular-nums;
}
.chapter summary .t{flex:1;font-weight:700;letter-spacing:-.01em;font-size:1rem}
.chapter summary .arrow{flex:none;color:var(--muted);transition:transform .18s ease}
.chapter[open] summary .arrow{transform:rotate(90deg)}
.chapter[open] summary{border-bottom:1px solid var(--line)}
.sublist{padding:9px 12px 13px}
.sub{
  display:flex;align-items:center;gap:10px;width:100%;
  min-height:50px;padding:11px 12px;margin:0 0 7px;
  background:#fbfcff;border:1px solid var(--line);border-radius:12px;
  font:inherit;font-size:.95rem;font-weight:600;text-align:left;color:var(--ink);
  cursor:pointer;touch-action:manipulation;
}
.sub .dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--mint)}
.sub .sub-t{flex:1}
.sub .qn{
  flex:none;font-size:.78rem;font-weight:700;color:var(--muted);
  background:#eef2fa;border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums;
}
.sub.total .qn{background:#f6e3c0;color:#7a4a00}
.sub:active{background:var(--mint-soft);border-color:#b7e5d5}
.sub.total{
  background:var(--amber-soft);border-color:#f3ddb4;color:#7a4a00;font-weight:800;margin-bottom:0;
}
.sub.total .dot{background:var(--amber)}
.sub.total:active{background:#fbe6c2}

/* ---------- 퀴즈 ---------- */
.quizbar{padding:2px 0 4px;margin-bottom:2px}
.meter{display:flex;align-items:baseline;gap:6px;font-size:.86rem;color:var(--muted);font-weight:700}
.meter b{font-size:1.25rem;color:var(--brand-ink);font-variant-numeric:tabular-nums}
.track{height:8px;border-radius:99px;background:#d7e0f0;overflow:hidden;margin-top:8px}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--brand),#4a86ff);transition:width .35s cubic-bezier(.4,0,.2,1)}

.qcard{
  background:var(--surface);border:1px solid var(--line);border-radius:20px;
  box-shadow:var(--shadow);padding:22px 18px;margin:12px 0 14px;
  min-height:150px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;text-align:center;
}
.qtext{font-size:1.2rem;font-weight:700;line-height:1.6;width:100%}
.qtext b{font-weight:800}

.options{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.options.stack{grid-template-columns:1fr}
.opt{
  display:flex;align-items:center;justify-content:center;gap:4px;
  min-height:64px;padding:12px 10px;
  background:var(--surface);color:var(--ink);
  border:1.5px solid var(--line);border-radius:14px;
  font:inherit;font-size:1.06rem;font-weight:700;line-height:1.35;
  cursor:pointer;touch-action:manipulation;
  transition:transform .1s ease, background .15s ease, border-color .15s ease;
}
.options.stack .opt{min-height:54px;font-size:1rem}
.opt:active{transform:scale(.985);background:#f4f7ff}
.opt.is-right{background:var(--mint-soft);border-color:var(--mint);color:#0a6b51}
.opt.is-right::after{content:"✓";margin-left:2px;font-weight:800}
.opt.is-wrong{background:var(--coral-soft);border-color:var(--coral);color:#a51f1f}

.count-wrap{text-align:center;padding:48px 0 30px}
.count-num{
  font-size:6rem;line-height:1;font-weight:800;color:var(--brand);
  font-variant-numeric:tabular-nums;margin:18px 0;
  animation:pop .9s ease-out;
}
@keyframes pop{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- 해설 바텀시트 ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(21,35,63,.42);
  opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:20;
}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:21;
  margin:0 auto;max-width:520px;
  background:var(--surface);
  border-radius:22px 22px 0 0;
  border-top:4px solid var(--coral);
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -14px 40px -20px rgba(21,35,63,.6);
  transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  max-height:82dvh;overflow-y:auto;
}
.sheet.open{transform:translateY(0)}
.sheet h3{margin:0 0 12px;font-size:1.05rem;color:var(--coral);font-weight:800}
.answer-row{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:9px 12px;border-radius:11px;margin-bottom:7px;font-size:.98rem;
}
.answer-row .k{font-size:.82rem;font-weight:800;color:var(--muted);flex:none}
.answer-row.mine{background:var(--coral-soft)}
.answer-row.right{background:var(--mint-soft)}
.answer-row.right .k{color:#0a6b51}
.exp{
  border-top:1px dashed var(--line);margin-top:12px;padding-top:12px;
  font-size:.95rem;line-height:1.65;color:#2c3c5c;
}
.exp b{color:var(--brand-ink)}
.sheet .btn{margin-top:16px;background:var(--coral)}

/* ---------- 결과 ---------- */
.result-hero{
  background:linear-gradient(160deg,#0f9d76,#0b7f5f);color:#fff;
  border-radius:20px;padding:26px 20px;text-align:center;margin-bottom:14px;
}
.result-hero .big{font-size:2rem;font-weight:800;margin:6px 0 2px;letter-spacing:-.02em}
.result-hero p{margin:0;opacity:.9;font-size:.93rem}
.stats{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:6px 16px;margin-bottom:16px;box-shadow:var(--shadow);
}
.stat{display:flex;justify-content:space-between;gap:14px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:none}
.stat .k{color:var(--muted);font-size:.9rem;font-weight:600;flex:none}
.stat .v{font-weight:800;text-align:right}

/* ---------- 문제 내용 요소 ---------- */
.frac{
  display:inline-flex;flex-direction:column;vertical-align:middle;
  text-align:center;font-size:.94em;padding:0 4px;line-height:1.12;
}
.frac>span{display:block}
.frac .bottom{border-top:1.8px solid currentColor;padding-top:1px}
.eq{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap}
.relation-table{
  border-collapse:separate;border-spacing:0;width:100%;max-width:330px;
  margin:2px auto 10px;font-size:.95rem;
  border:1px solid var(--line);border-radius:10px;overflow:hidden;
  font-variant-numeric:tabular-nums;
}
.relation-table th,.relation-table td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 6px;text-align:center}
.relation-table tr:last-child th,.relation-table tr:last-child td{border-bottom:none}
.relation-table th:last-child,.relation-table td:last-child{border-right:none}
.relation-table th{background:#f3f6fd;font-weight:800}
.shape{display:block;margin:0 auto 6px;max-width:100%;height:auto}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
@media (max-width:360px){
  .qtext{font-size:1.1rem}
  .opt{font-size:1rem;min-height:58px}
}
</style>
</head>
<body>
<div class="app">

<!-- 홈 -->
<section class="screen active" id="screen-home">
  <div class="bar">
    <a href="../../index.html" class="chip-link">← 홈으로</a>
  </div>
  <div class="hero">
    <span class="badge">초등 5학년 1학기</span>
    <h1>수학 문제 풀기</h1>
    <p>단원을 열고 공부할 내용을 고르세요. 소단원은 10문제, 단원 전체 문제는 20문제입니다.</p>
  </div>
  <div id="chapter-list"></div>
</section>

<!-- 시작 -->
<section class="screen" id="screen-setup">
  <div class="bar">
    <button class="chip-btn" onclick="goHome()">← 단원 목록</button>
  </div>
  <div class="hero">
    <span class="badge" id="setup-chapter">단원</span>
    <h2 id="setup-title">수학 문제 풀기</h2>
    <p>이름을 쓰고 시작하세요. <span data-total>20</span>문제를 맞히면 완료됩니다.</p>
  </div>
  <label class="lede" for="username" style="display:block;margin:0 0 8px;font-weight:700;color:var(--ink)">이름</label>
  <input id="username" type="text" placeholder="이름을 입력하세요" autocomplete="off"
         autocapitalize="off" enterkeyhint="go" maxlength="20"
         style="width:100%;min-height:54px;padding:14px 16px;border:1.5px solid var(--line);
                border-radius:14px;font:inherit;font-size:1.05rem;background:var(--surface);color:var(--ink)">
  <p id="name-error" class="lede hidden" style="color:var(--coral);margin:8px 0 0;font-weight:700">이름을 먼저 입력하세요.</p>
  <div style="height:14px"></div>
  <button class="btn" onclick="startCountDown()">시작하기</button>
</section>

<!-- 카운트다운 -->
<section class="screen" id="screen-countdown">
  <div class="count-wrap">
    <h2>준비하세요</h2>
    <div class="count-num" id="countdown-text">3</div>
    <p class="lede" style="margin:0">곧 첫 문제가 나옵니다.</p>
  </div>
</section>

<!-- 퀴즈 -->
<section class="screen" id="screen-quiz">
  <div class="quizbar">
    <div class="bar" style="margin-bottom:8px">
      <button class="chip-btn" onclick="restartQuiz()">← 그만하기</button>
      <div class="spacer"></div>
      <div class="meter"><b id="progress">0</b> / <span id="progress-total">20</span> 맞힘</div>
    </div>
    <div class="track"><div class="fill" id="progress-fill"></div></div>
  </div>

  <div class="qcard">
    <div id="question-text" class="qtext">문제를 불러오는 중입니다.</div>
  </div>

  <div class="options" id="options-box"></div>
</section>

<!-- 결과 -->
<section class="screen" id="screen-result">
  <div class="result-hero">
    <p>모두 해냈어요</p>
    <div class="big"><span id="res-total">20</span>문제 완료</div>
    <p id="res-praise">끝까지 잘 풀었습니다.</p>
  </div>
  <div class="stats">
    <div class="stat"><span class="k">이름</span><span class="v" id="res-name">-</span></div>
    <div class="stat"><span class="k">단원</span><span class="v" id="res-title">-</span></div>
    <div class="stat"><span class="k">걸린 시간</span><span class="v" id="res-time" style="color:var(--amber)">-</span></div>
    <div class="stat"><span class="k">틀린 횟수</span><span class="v" id="res-wrong">-</span></div>
    <div class="stat"><span class="k">끝낸 시각</span><span class="v" id="res-date">-</span></div>
  </div>
  <button class="btn" onclick="retrySame()">같은 단원 한 번 더</button>
  <button class="btn ghost" onclick="goHome()">다른 단원 고르기</button>
</section>

</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <h3 id="sheet-title">아쉬워요, 다시 봅시다</h3>
  <div class="answer-row mine"><span class="k">내 답</span><span id="sheet-mine"></span></div>
  <div class="answer-row right"><span class="k">정답</span><span id="sheet-right"></span></div>
  <div class="exp" id="sheet-exp"></div>
  <button class="btn" id="btn-next" onclick="nextAfterExplanation()">다음 문제</button>
</div>

<script>
"use strict";

/* ===========================================================
   단원 데이터
   =========================================================== */
const CHAPTERS = [
  { n:1, title:"자연수의 혼합 계산", subs:[
    ["1-1","덧셈과 뺄셈의 혼합 계산"],
    ["1-2","곱셈과 나눗셈의 혼합 계산"],
    ["1-3","덧셈, 뺄셈, 곱셈의 혼합 계산"],
    ["1-4","덧셈, 뺄셈, 나눗셈의 혼합 계산"],
    ["1-5","덧셈, 뺄셈, 곱셈, 나눗셈의 혼합 계산"]
  ]},
  { n:2, title:"약수와 배수", subs:[
    ["2-1","약수"],["2-2","배수"],["2-3","공약수와 최대공약수"],["2-4","공배수와 최소공배수"]
  ]},
  { n:3, title:"규칙과 대응", subs:[
    ["3-1","두 양 사이의 대응 관계"],["3-2","대응 관계를 식으로 나타내기"],["3-3","생활 속 대응 관계와 식"]
  ]},
  { n:4, title:"약분과 통분", subs:[
    ["4-1","크기가 같은 분수"],["4-2","분수를 간단히 나타내기"],["4-3","분모가 같은 분수로 나타내기"],
    ["4-4","분수의 크기 비교"],["4-5","분수와 소수의 크기 비교"]
  ]},
  { n:5, title:"분수의 덧셈과 뺄셈", subs:[
    ["5-1","진분수의 덧셈"],["5-2","대분수의 덧셈"],["5-3","진분수의 뺄셈"],["5-4","대분수의 뺄셈"]
  ]},
  { n:6, title:"다각형의 둘레와 넓이", subs:[
    ["6-1","정다각형의 둘레"],["6-2","직사각형과 정사각형의 둘레와 넓이"],["6-3","평행사변형의 넓이"],
    ["6-4","삼각형의 넓이"],["6-5","마름모와 사다리꼴의 넓이"]
  ]}
];

const TOTAL_SUB = 10;    // 소단원
const TOTAL_ALL = 20;    // 단원 전체 문제
let TOTAL = TOTAL_ALL;
let userName = "";
let selectedCategory = "";
let currentSubTitle = "";
let currentChapterLabel = "";
let correctCount = 0;
let wrongCount = 0;
let startTime = 0;
let currentQData = null;
const timers = [];

/* ===========================================================
   화면 전환 · 타이머 정리
   =========================================================== */
function clearTimers(){ while(timers.length) clearInterval(timers.pop()); }

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0, 0);
}

function closeSheet(){
  document.getElementById("sheet").classList.remove("open");
  document.getElementById("scrim").classList.remove("open");
  document.body.classList.remove("locked");
}

function goHome(){
  clearTimers(); closeSheet();
  showScreen("screen-home");
}

function syncTotals(){
  document.getElementById("progress-total").textContent = TOTAL;
  document.getElementById("res-total").textContent = TOTAL;
  document.querySelectorAll("[data-total]").forEach(el => { el.textContent = TOTAL; });
}

function openSetup(cat, subTitle, chapterLabel){
  clearTimers(); closeSheet();
  selectedCategory = cat;
  TOTAL = cat.endsWith("-all") ? TOTAL_ALL : TOTAL_SUB;
  syncTotals();
  currentSubTitle = subTitle;
  currentChapterLabel = chapterLabel;
  document.getElementById("setup-title").innerText = subTitle;
  document.getElementById("setup-chapter").innerText = chapterLabel;
  document.getElementById("name-error").classList.add("hidden");
  const saved = localStorage.getItem("quiz_user_name");
  if (saved) document.getElementById("username").value = saved;
  showScreen("screen-setup");
}

/* 홈 화면 단원 목록 생성 */
(function buildHome(){
  const wrap = document.getElementById("chapter-list");
  CHAPTERS.forEach(ch => {
    const d = document.createElement("details");
    d.className = "chapter";
    d.setAttribute("name", "chapter");        // 한 번에 하나만 열림(지원 브라우저)
    const chapterLabel = ch.n + "단원 " + ch.title;

    const s = document.createElement("summary");
    s.innerHTML = '<span class="num">' + ch.n + '</span>' +
                  '<span class="t"></span>' +
                  '<span class="arrow" aria-hidden="true">›</span>';
    s.querySelector(".t").textContent = ch.title;
    d.appendChild(s);

    const list = document.createElement("div");
    list.className = "sublist";
    ch.subs.forEach(([cat, name], i) => {

/* ===========================================================
   숫자 · 분수 유틸
   =========================================================== */
function gcd(a, b){ return b === 0 ? a : gcd(b, a % b); }
function lcm(a, b){ return (a * b) / gcd(a, b); }
function randInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

/* Fisher-Yates (기존 sort(()=>Math.random()-0.5) 는 분포가 치우침) */
function shuffle(arr){
  for (let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* 오답 보기: 정답보다 크고 작은 값을 섞어서 만든다.
   (기존에는 항상 정답 + 양수 → 정답이 늘 최솟값이라 안 풀고도 맞힐 수 있었음) */
function numericOptions(ansVal, unit, step){
  step = Math.max(1, step || Math.max(1, Math.round(Math.abs(ansVal) / 8)));
  const below = [], above = [];
  for (let i = 1; i <= 12; i++){
    const lo = ansVal - i * step, hi = ansVal + i * step;
    if (lo > 0 && Number.isInteger(lo)) below.push(lo);
    if (Number.isInteger(hi)) above.push(hi);
  }
  shuffle(below); shuffle(above);

  /* 정답보다 작은 보기를 0~3개 중 무작위로 뽑는다.
     → 정답이 늘 최솟값이거나 늘 가운데 오는 규칙이 생기지 않는다. */
  let wantBelow = Math.min(3, below.length, randInt(0, 3));
  const wantAbove = Math.min(3 - wantBelow, above.length);
  wantBelow = Math.min(below.length, 3 - wantAbove);

  const vals = [ansVal]
    .concat(below.slice(0, wantBelow))
    .concat(above.slice(0, wantAbove));

  let e = 13;
  while (vals.length < 4){
    const v = ansVal + step * e++;
    if (!vals.includes(v)) vals.push(v);
  }
  return vals.map(v => v + (unit || ""));
}

/* 분수 보기: 자주 하는 실수(분모끼리 더하기 등)를 먼저 쓰고,
   정답보다 작은 값과 큰 값이 모두 들어가도록 만든다. */
function fracOptions(num, den, mistakes){
  const answer = formatFracObj(num, den);
  const ansVal = num / den;
  const seen = { [answer]: true };
  const smaller = [], larger = [];

  const add = (n, d, prio) => {
    if (!(n > 0) || !(d > 0) || !Number.isInteger(n) || !Number.isInteger(d)) return;
    const s = formatFracObj(n, d);
    if (seen[s]) return;
    seen[s] = true;
    (n / d < ansVal ? smaller : larger).push({ s, prio });
  };

  (mistakes || []).forEach(p => add(p[0], p[1], 0));      // 실수하기 쉬운 답을 우선 배치
  for (let i = 1; i <= 8; i++){ add(num - i, den, 1); add(num + i, den, 1); }
  add(num, den + 1, 1); add(num, den + 2, 1); add(num, den + 3, 1);

  const order = a => shuffle(a).sort((x, y) => x.prio - y.prio);
  const sm = order(smaller), lg = order(larger);

  let wantBelow = Math.min(3, sm.length, randInt(0, 3));
  const wantAbove = Math.min(3 - wantBelow, lg.length);
  wantBelow = Math.min(sm.length, 3 - wantAbove);

  const list = [answer]
    .concat(sm.slice(0, wantBelow).map(o => o.s))
    .concat(lg.slice(0, wantAbove).map(o => o.s));

  let e = 9;
  while (list.length < 4){
    const s = formatFracObj(num + e++, den);
    if (!seen[s]){ seen[s] = true; list.push(s); }
  }
  return { answer, options: list };
}

/* 후보들 중에서 정답보다 작은 보기 개수를 무작위로 정해 4개를 고른다.
   cands: [{ s: 보기문자열, val: 크기 }] */
function chooseOptions(answer, ansVal, cands){
  const seen = { [answer]: true };
  const smaller = [], larger = [];
  for (const c of cands){
    if (seen[c.s]) continue;
    seen[c.s] = true;
    (c.val < ansVal ? smaller : larger).push(c.s);
  }
  shuffle(smaller); shuffle(larger);
  let wantBelow = Math.min(3, smaller.length, randInt(0, 3));
  const wantAbove = Math.min(3 - wantBelow, larger.length);
  wantBelow = Math.min(smaller.length, 3 - wantAbove);
  return [answer].concat(smaller.slice(0, wantBelow)).concat(larger.slice(0, wantAbove));
}

/* 부등호는 innerHTML 로 넣으므로 반드시 이스케이프한다 */
function escSym(s){ return s === "<" ? "&lt;" : s === ">" ? "&gt;" : s; }

function formatFracObj(num, denom){
  const g = gcd(Math.abs(num), Math.abs(denom)) || 1;
  num /= g; denom /= g;
  if (denom === 1) return String(num);
  if (Math.abs(num) > denom){
    const m = Math.floor(Math.abs(num) / denom);
    const r = Math.abs(num) % denom;
    const sign = num < 0 ? "-" : "";
    if (r === 0) return sign + m;
    return sign + m + "과 " + r + "/" + denom;
  }
  return num + "/" + denom;
}

function renderFracHTML(m, n, d){
  const frac = '<span class="frac"><span>' + n + '</span><span class="bottom">' + d + '</span></span>';
  return m > 0 ? '<span>' + m + '</span>' + frac : frac;
}

function formatOptionToHTML(text){
  if (typeof text !== "string") return text;
  if (text === "<" || text === ">") return escSym(text);
  if (text.indexOf('class="frac"') !== -1 || text.indexOf("<svg") !== -1) return text;
  text = text.replace(/(\d+)\s*과\s*(\d+)\/(\d+)/g, (m, a, b, c) => renderFracHTML(+a, +b, +c));
  text = text.replace(/(\d+)\/(\d+)/g, (m, a, b) => renderFracHTML(0, +a, +b));
  return text;
}

/* ===========================================================
   도형 SVG — 실제 수치 비율을 반영해서 그린다
   =========================================================== */
const SHAPE_FILL = "#e8eeff", SHAPE_LINE = "#2f57cf", SHAPE_TEXT = "#15233f",
      MARK_RED = "#e03b3b", MARK_GREEN = "#0f9d76";

function svgWrap(inner, h){
  return '<svg class="shape" width="230" height="' + h + '" viewBox="0 0 230 ' + h +
         '" xmlns="http://www.w3.org/2000/svg" role="img">' + inner + '</svg>';
}
function label(x, y, txt, color, anchor){
  return '<text x="' + x + '" y="' + y + '" font-size="13" font-weight="700" font-family="sans-serif" fill="' +
         (color || SHAPE_TEXT) + '" text-anchor="' + (anchor || "middle") + '">' + txt + '</text>';
}

function getPolygonSVG(n, len){
  const cx = 115, cy = 62, r = 46;
  /* 짝수 각형은 회전을 보정해야 정사각형이 마름모로 보이지 않는다 */
  const rot = -Math.PI / 2 + (n % 2 === 0 ? Math.PI / n : 0);
  const pts = [];
  for (let i = 0; i < n; i++){
    const a = i * 2 * Math.PI / n + rot;
    pts.push((cx + r * Math.cos(a)).toFixed(1) + "," + (cy + r * Math.sin(a)).toFixed(1));
  }
  return svgWrap(
    '<polygon points="' + pts.join(" ") + '" fill="' + SHAPE_FILL + '" stroke="' + SHAPE_LINE + '" stroke-width="2.5" stroke-linejoin="round"/>' +
    label(115, 130, "한 변 " + len + "cm"), 140);
}

function scaleFor(w, h, maxW, maxH){
  return Math.min(maxW / w, maxH / h);
}

function getRectSVG(w, h){
  const s = scaleFor(w, h, 150, 80);
  const rw = w * s, rh = h * s;
  const x = 115 - rw / 2, y = 16;
  return svgWrap(
    '<rect x="' + x.toFixed(1) + '" y="' + y + '" width="' + rw.toFixed(1) + '" height="' + rh.toFixed(1) +
    '" fill="' + SHAPE_FILL + '" stroke="' + SHAPE_LINE + '" stroke-width="2.5"/>' +
    label(115, y + rh + 19, w + "cm") +
    label(x + rw + 7, y + rh / 2 + 5, h + "cm", SHAPE_TEXT, "start"), 130);
}

function getParallelogramSVG(b, h){
  const s = scaleFor(b, h, 130, 74);
  const bw = b * s, bh = h * s, slant = 26;
  const x0 = 115 - (bw + slant) / 2, yTop = 16, yBot = yTop + bh;
  const pts = [
    (x0 + slant) + "," + yTop, (x0 + slant + bw) + "," + yTop,
    (x0 + bw) + "," + yBot, x0 + "," + yBot
  ].join(" ");
  return svgWrap(
    '<polygon points="' + pts + '" fill="' + SHAPE_FILL + '" stroke="' + SHAPE_LINE + '" stroke-width="2.5" stroke-linejoin="round"/>' +
    '<line x1="' + (x0 + slant) + '" y1="' + yTop + '" x2="' + (x0 + slant) + '" y2="' + yBot +
    '" stroke="' + MARK_RED + '" stroke-width="2" stroke-dasharray="4 4"/>' +
    label(x0 + slant - 6, (yTop + yBot) / 2 + 5, h + "cm", MARK_RED, "end") +
    label(x0 + bw / 2, yBot + 19, b + "cm"), 130);
}

function getTriangleSVG(b, h){
  const s = scaleFor(b, h, 150, 74);
  const bw = b * s, bh = h * s;
  const x0 = 115 - bw / 2, yBot = 16 + bh, apexX = x0 + bw * 0.62;
  return svgWrap(
    '<polygon points="' + x0 + ',' + yBot + ' ' + (x0 + bw) + ',' + yBot + ' ' + apexX + ',16" fill="' +
    SHAPE_FILL + '" stroke="' + SHAPE_LINE + '" stroke-width="2.5" stroke-linejoin="round"/>' +
    '<line x1="' + apexX + '" y1="16" x2="' + apexX + '" y2="' + yBot + '" stroke="' + MARK_RED +
    '" stroke-width="2" stroke-dasharray="4 4"/>' +
    label(apexX + 6, (16 + yBot) / 2 + 5, h + "cm", MARK_RED, "start") +
    label(115, yBot + 19, b + "cm"), 130);
}

function getRhombusSVG(d1, d2){
  const s = scaleFor(d1, d2, 140, 84);
  const w = d1 * s, hh = d2 * s;
  const cx = 115, cy = 16 + hh / 2;
  const pts = cx + ",16 " + (cx + w / 2) + "," + cy + " " + cx + "," + (16 + hh) + " " + (cx - w / 2) + "," + cy;
  return svgWrap(
    '<polygon points="' + pts + '" fill="' + SHAPE_FILL + '" stroke="' + SHAPE_LINE + '" stroke-width="2.5" stroke-linejoin="round"/>' +
    '<line x1="' + (cx - w / 2) + '" y1="' + cy + '" x2="' + (cx + w / 2) + '" y2="' + cy +
    '" stroke="' + MARK_RED + '" stroke-width="1.8" stroke-dasharray="3 3"/>' +
    '<line x1="' + cx + '" y1="16" x2="' + cx + '" y2="' + (16 + hh) +
    '" stroke="' + MARK_GREEN + '" stroke-width="1.8" stroke-dasharray="3 3"/>' +
    label(cx, cy - 7, d1 + "cm", MARK_RED) +
    label(cx + 7, cy + hh / 4 + 5, d2 + "cm", MARK_GREEN, "start"), 130);
}

function getTrapezoidSVG(top, bottom, h){
  const s = scaleFor(bottom, h, 150, 66);
  const tw = top * s, bw = bottom * s, hh = h * s;
  const yTop = 26, yBot = yTop + hh;
  const bx = 115 - bw / 2, tx = 115 - tw / 2;
  const pts = tx + "," + yTop + " " + (tx + tw) + "," + yTop + " " + (bx + bw) + "," + yBot + " " + bx + "," + yBot;
  return svgWrap(
    '<polygon points="' + pts + '" fill="' + SHAPE_FILL + '" stroke="' + SHAPE_LINE + '" stroke-width="2.5" stroke-linejoin="round"/>' +
    '<line x1="' + tx + '" y1="' + yTop + '" x2="' + tx + '" y2="' + yBot +
    '" stroke="' + MARK_RED + '" stroke-width="2" stroke-dasharray="4 4"/>' +
    label(115, yTop - 8, top + "cm") +
    label(tx - 6, (yTop + yBot) / 2 + 5, h + "cm", MARK_RED, "end") +
    label(115, yBot + 19, bottom + "cm"), 130);
}

/* ===========================================================
   문제 생성
   =========================================================== */
function generateSingleQuestion(cat){
  let q = "", answer = "", exp = "", options = [];

  /* ---------- 1단원 ---------- */
  if (cat.startsWith("1-")){
    let ansVal = 0;
    if (cat === "1-1"){
      const type = randInt(0, 2);
      if (type === 0){
        const a = randInt(10, 39), b = randInt(10, 39), c = randInt(1, a + b - 5);
        q = "<b>" + a + " + " + b + " - " + c + " = ?</b>";
        ansVal = a + b - c;
        exp = "앞에서부터 차례로 계산합니다.<br>1) " + a + " + " + b + " = " + (a + b) +
              "<br>2) " + (a + b) + " - " + c + " = <b>" + ansVal + "</b>";
      } else if (type === 1){
        const b = randInt(5, 19), c = randInt(5, 19), a = b + c + randInt(5, 24);
        q = "<b>" + a + " - (" + b + " + " + c + ") = ?</b>";
        ansVal = a - (b + c);
        exp = "괄호 안을 먼저 계산합니다.<br>1) " + b + " + " + c + " = " + (b + c) +
              "<br>2) " + a + " - " + (b + c) + " = <b>" + ansVal + "</b>";
      } else {
        const b = randInt(5, 24), a = b + randInt(5, 24), c = randInt(5, 24);
        q = "<b>(" + a + " - " + b + ") + " + c + " = ?</b>";
        ansVal = (a - b) + c;
        exp = "괄호 안을 먼저 계산합니다.<br>1) " + a + " - " + b + " = " + (a - b) +
              "<br>2) " + (a - b) + " + " + c + " = <b>" + ansVal + "</b>";
      }
    } else if (cat === "1-2"){
      if (Math.random() < 0.5){
        const a = randInt(2, 9), b = randInt(2, 6);
        const divisors = [];
        for (let c = 2; c <= 6; c++) if ((a * b) % c === 0) divisors.push(c);
        const c = pick(divisors);
        ansVal = (a * b) / c;
        q = "<b>" + a + " × " + b + " ÷ " + c + " = ?</b>";
        exp = "앞에서부터 차례로 계산합니다.<br>1) " + a + " × " + b + " = " + (a * b) +
              "<br>2) " + (a * b) + " ÷ " + c + " = <b>" + ansVal + "</b>";
      } else {
        const b = randInt(2, 5), c = randInt(2, 5);
        ansVal = randInt(2, 9);
        const a = b * c * ansVal;
        q = "<b>" + a + " ÷ (" + b + " × " + c + ") = ?</b>";
        exp = "괄호 안을 먼저 계산합니다.<br>1) " + b + " × " + c + " = " + (b * c) +
              "<br>2) " + a + " ÷ " + (b * c) + " = <b>" + ansVal + "</b>";
      }
    } else if (cat === "1-3"){
      const b = randInt(2, 7), c = randInt(2, 7), a = randInt(10, 29);
      const d = randInt(1, Math.min(15, a + b * c - 1));
      ansVal = a + b * c - d;
      q = "<b>" + a + " + " + b + " × " + c + " - " + d + " = ?</b>";
      exp = "곱셈을 먼저 계산합니다.<br>1) " + b + " × " + c + " = " + (b * c) +
            "<br>2) " + a + " + " + (b * c) + " = " + (a + b * c) +
            "<br>3) " + (a + b * c) + " - " + d + " = <b>" + ansVal + "</b>";
    } else if (cat === "1-4"){
      const c = randInt(2, 6), b = c * randInt(2, 7), a = randInt(10, 29);
      const d = randInt(1, Math.min(10, a + b / c - 1));
      ansVal = a + b / c - d;
      q = "<b>" + a + " + " + b + " ÷ " + c + " - " + d + " = ?</b>";
      exp = "나눗셈을 먼저 계산합니다.<br>1) " + b + " ÷ " + c + " = " + (b / c) +
            "<br>2) " + a + " + " + (b / c) + " = " + (a + b / c) +
            "<br>3) " + (a + b / c) + " - " + d + " = <b>" + ansVal + "</b>";
    } else if (cat === "1-5"){
      const e = randInt(2, 5), d = e * randInt(1, 4);
      const b = randInt(2, 6), c = randInt(2, 6), a = randInt(10, 24);
      const divVal = d / e, multVal = b * c;
      ansVal = a + multVal - divVal;
      q = "<b>" + a + " + " + b + " × " + c + " - " + d + " ÷ " + e + " = ?</b>";
      exp = "곱셈과 나눗셈을 먼저 하고, 덧셈과 뺄셈을 앞에서부터 합니다.<br>1) " +
            b + " × " + c + " = " + multVal + ", " + d + " ÷ " + e + " = " + divVal +
            "<br>2) " + a + " + " + multVal + " - " + divVal + " = <b>" + ansVal + "</b>";
    }
    answer = String(ansVal);
    options = numericOptions(ansVal, "", 1);
  }

  /* ---------- 2단원 ---------- */
  else if (cat.startsWith("2-")){
    if (cat === "2-1"){
      const target = pick([12, 16, 18, 20, 24, 30, 36]);
      const divisors = [];
      for (let i = 1; i <= target; i++) if (target % i === 0) divisors.push(i);
      answer = divisors.join(", ");
      q = "<b>" + target + "</b>의 약수를 모두 바르게 늘어놓은 것은?";
      exp = target + "을(를) 나누어떨어지게 하는 수는 <b>" + answer + "</b>입니다.";

      options = [answer];
      const makers = [
        () => { const f = divisors.slice(); f.splice(1, 1); return f; },              // 하나 빠뜨림
        () => divisors.slice().concat(target + 2).sort((x, y) => x - y),              // 약수가 아닌 수 추가
        () => { const f = divisors.slice(); f[f.length - 1] = target - 1; return f; }, // 마지막을 바꿔치기
        () => divisors.slice(1),                                                      // 1을 빠뜨림
        () => divisors.slice().concat(target - 1).sort((x, y) => x - y)
      ];
      for (const m of makers){
        if (options.length >= 4) break;
        const s = m().join(", ");
        if (!options.includes(s)) options.push(s);
      }
    } else if (cat === "2-2"){
      const base = randInt(3, 9);
      const k = randInt(2, 6);
      const ansVal = base * k + randInt(1, base - 1);   // 배수가 아닌 수
      answer = String(ansVal);
      q = "다음 중 <b>" + base + "</b>의 배수가 <b>아닌</b> 것은?";
      exp = base + "의 배수는 " + base + ", " + base * 2 + ", " + base * 3 + " …입니다. <b>" +
            ansVal + "</b>은(는) " + base + "로 나누어떨어지지 않습니다.";
      const pool = [];   // 오답은 반드시 base 의 배수여야 한다
      for (let i = 1; i <= 14; i++) pool.push({ s: String(base * i), val: base * i });
      options = chooseOptions(answer, ansVal, pool);
    } else if (cat === "2-3"){
      const p = pick([[12, 18], [16, 24], [20, 30], [18, 27], [24, 36], [15, 25]]);
      const g = gcd(p[0], p[1]);
      answer = String(g);
      q = "<b>" + p[0] + "</b>과(와) <b>" + p[1] + "</b>의 최대공약수는?";
      exp = p[0] + "과(와) " + p[1] + "의 공약수 중 가장 큰 수는 <b>" + g + "</b>입니다.";
      options = numericOptions(g, "", 1);
    } else if (cat === "2-4"){
      const p = pick([[4, 6], [6, 8], [8, 12], [6, 9], [10, 15], [9, 12]]);
      const l = lcm(p[0], p[1]);
      answer = String(l);
      q = "<b>" + p[0] + "</b>과(와) <b>" + p[1] + "</b>의 최소공배수는?";
      exp = p[0] + "과(와) " + p[1] + "의 공배수 중 가장 작은 수는 <b>" + l + "</b>입니다.";
      options = numericOptions(l, "", 2);
    }
  }

  /* ---------- 3단원 ---------- */
  else if (cat.startsWith("3-")){
    if (cat === "3-1"){
      const type = randInt(0, 2);
      if (type === 0){
        const diff = randInt(2, 6), start = randInt(1, 5);
        let t = '<table class="relation-table"><tr><th>◆</th>';
        for (let i = 0; i < 5; i++) t += "<td>" + (start + i) + "</td>";
        t += "</tr><tr><th>○</th>";
        for (let i = 0; i < 5; i++) t += "<td>" + (start + i + diff) + "</td>";
        t += "</tr></table>";
        q = t + "◆와 ○ 사이의 대응 관계입니다. 빈칸에 알맞은 수는?<br><b>◆는 ○보다 [ ? ] 작습니다.</b>";
        answer = String(diff);
        exp = "○에서 ◆를 빼면 항상 " + diff + "입니다. 그래서 ◆는 ○보다 <b>" + diff + "</b> 작습니다.";
        options = numericOptions(diff, "", 1);
      } else if (type === 1){
        const mult = randInt(2, 4);
        let t = '<table class="relation-table"><tr><th>■</th>';
        for (let i = 1; i <= 5; i++) t += "<td>" + i + "</td>";
        t += "</tr><tr><th>△</th>";
        for (let i = 1; i <= 5; i++) t += "<td>" + i * mult + "</td>";
        t += "</tr></table>";
        q = t + "■와 △ 사이의 대응 관계를 <b>△ = ■ × [ ? ]</b> 로 나타낼 때, 빈칸에 알맞은 수는?";
        answer = String(mult);
        exp = "△는 ■의 " + mult + "배입니다. 그래서 <b>△ = ■ × " + mult + "</b>입니다.";
        options = numericOptions(mult, "", 1);
      } else {
        const t = '<table class="relation-table"><tr><th>◉</th><td>6</td><td>9</td><td>12</td><td>15</td><td>18</td></tr>' +
                  '<tr><th>◆</th><td>2</td><td>3</td><td>4</td><td>?</td><td>6</td></tr></table>';
        q = t + "◉가 15일 때 <b>◆에 알맞은 수</b>는?";
        answer = "5";
        exp = "◉를 3으로 나누면 ◆가 됩니다. 15 ÷ 3 = <b>5</b>";
        options = numericOptions(5, "", 1);
      }
    } else if (cat === "3-2"){
      const type = randInt(0, 2);
      if (type === 0){
        const t = '<table class="relation-table"><tr><th>♠</th><td>1</td><td>2</td><td>3</td><td>4</td></tr>' +
                  '<tr><th>♤</th><td>14</td><td>13</td><td>12</td><td>11</td></tr></table>';
        q = t + "♠와 ♤ 사이의 대응 관계를 바르게 나타낸 식은?";
        answer = "♤ = 15 - ♠";
        exp = "♠와 ♤를 더하면 항상 15입니다. 그래서 <b>♤ = 15 - ♠</b>입니다.";
        options = ["♤ = 15 - ♠", "♤ = ♠ + 15", "♤ = ♠ × 15", "♤ = ♠ ÷ 15"];
      } else if (type === 1){
        q = "자동차 한 대에 바퀴가 4개씩 있습니다. 자동차의 수를 <b>◎</b>, 바퀴의 수를 <b>■</b>라고 할 때 알맞은 식은?";
        answer = "■ = ◎ × 4";
        exp = "바퀴의 수는 자동차의 수의 4배입니다. 그래서 <b>■ = ◎ × 4</b>입니다.";
        options = ["■ = ◎ × 4", "■ = ◎ + 4", "■ = ◎ ÷ 4", "◎ = ■ × 4"];
      } else {
        q = "성냥개비 5개로 한 층을 쌓습니다. 층수를 <b>○</b>, 성냥개비의 수를 <b>◆</b>라고 할 때 알맞은 식은?";
        answer = "◆ = ○ × 5";
        exp = "성냥개비의 수는 층수의 5배입니다. 그래서 <b>◆ = ○ × 5</b>입니다.";
        options = ["◆ = ○ × 5", "◆ = ○ + 5", "○ = ◆ × 5", "◆ = ○ ÷ 5"];
      }
    } else if (cat === "3-3"){
      const type = randInt(0, 2);
      if (type === 0){
        const count = randInt(3, 5);
        q = "사과가 한 봉지에 <b>" + count + "개</b>씩 들어 있습니다. 봉지의 수를 <b>★</b>, 사과의 수를 <b>△</b>라고 할 때 <b>★ × [ ? ] = △</b> 의 빈칸에 알맞은 수는?";
        answer = String(count);
        exp = "사과의 수는 봉지의 수의 " + count + "배이므로 빈칸은 <b>" + count + "</b>입니다.";
        options = numericOptions(count, "", 1);
      } else if (type === 1){
        const pizza = randInt(3, 6), eggs = pizza * 5;
        q = "피자 한 판을 만드는 데 달걀 5개가 필요합니다. 피자 <b>" + pizza + "판</b>을 만들려면 달걀이 몇 개 필요할까요?";
        answer = eggs + "개";
        exp = "(달걀의 수) = (피자의 수) × 5 이므로 " + pizza + " × 5 = <b>" + eggs + "개</b>입니다.";
        options = numericOptions(eggs, "개", 5);
      } else {
        const chair = randInt(4, 8), legs = chair * 4;
        q = "의자 한 개에 다리가 4개씩 있습니다. 의자가 <b>" + chair + "개</b>이면 다리는 모두 몇 개일까요?";
        answer = legs + "개";
        exp = "(다리의 수) = (의자의 수) × 4 이므로 " + chair + " × 4 = <b>" + legs + "개</b>입니다.";
        options = numericOptions(legs, "개", 4);
      }
    }
  }

  /* ---------- 4단원 ---------- */
  else if (cat.startsWith("4-")){
    if (cat === "4-1"){
      /* 기약분수에서 출발해야 "크기가 같은 분수"의 정답이 문제와 겹치지 않는다 */
      let n = randInt(1, 4), d = randInt(n + 1, n + 5);
      while (gcd(n, d) > 1) d++;
      const mult = randInt(2, 4);
      q = '<span class="eq">' + renderFracHTML(0, n, d) + "<span>와(과) 크기가 같은 분수는?</span></span>";
      answer = (n * mult) + "/" + (d * mult);
      exp = "분모와 분자에 같은 수 " + mult + "를 곱하면 크기가 같은 분수가 됩니다.<br>" +
            n + "/" + d + " = <b>" + answer + "</b>";
      const AN = n * mult, AD = d * mult, cands = [];
      for (let k = 1; k <= 6; k++){
        if (AN - k > 0) cands.push({ s: (AN - k) + "/" + AD, val: (AN - k) / AD });
        if (AN + k < AD) cands.push({ s: (AN + k) + "/" + AD, val: (AN + k) / AD });
        if (AD - k > AN) cands.push({ s: AN + "/" + (AD - k), val: AN / (AD - k) });   // 분모를 바꾼 오답
        cands.push({ s: AN + "/" + (AD + k), val: AN / (AD + k) });
      }
      options = chooseOptions(answer, n / d, cands);
    } else if (cat === "4-2"){
      let nSimple = randInt(1, 4), dSimple = randInt(nSimple + 1, nSimple + 5);
      while (gcd(nSimple, dSimple) > 1) dSimple++;
      const g = randInt(2, 5);
      const n = nSimple * g, d = dSimple * g;
      q = '<span class="eq">' + renderFracHTML(0, n, d) + "<span>을(를) 기약분수로 나타내면?</span></span>";
      answer = nSimple + "/" + dSimple;
      exp = "분모와 분자를 최대공약수 " + g + "(으)로 나누어 약분하면 <b>" + answer + "</b>입니다.";
      const cands = [];
      for (let k = 1; k <= 5; k++){
        if (nSimple - k > 0) cands.push({ s: (nSimple - k) + "/" + dSimple, val: (nSimple - k) / dSimple });
        if (nSimple + k < dSimple) cands.push({ s: (nSimple + k) + "/" + dSimple, val: (nSimple + k) / dSimple });
        if (dSimple - k > nSimple) cands.push({ s: nSimple + "/" + (dSimple - k), val: nSimple / (dSimple - k) });
        cands.push({ s: nSimple + "/" + (dSimple + k), val: nSimple / (dSimple + k) });
      }
      options = chooseOptions(answer, nSimple / dSimple, cands);
    } else if (cat === "4-3"){
      const d1 = randInt(2, 5);
      let d2 = randInt(2, 5);
      while (d1 === d2) d2 = randInt(2, 5);
      const l = lcm(d1, d2);
      q = '<span class="eq">' + renderFracHTML(0, 1, d1) + "<span>와(과)</span>" + renderFracHTML(0, 1, d2) +
          "<span>을(를) 통분할 때, 공통분모가 될 수 있는 가장 작은 수는?</span></span>";
      answer = String(l);
      exp = "두 분모 " + d1 + "과(와) " + d2 + "의 최소공배수인 <b>" + l + "</b>이 가장 작은 공통분모입니다.";
      options = numericOptions(l, "", 1);
    } else if (cat === "4-4"){
      const d1 = randInt(3, 7), n1 = randInt(1, d1 - 1);
      let d2 = randInt(3, 7), n2 = randInt(1, d2 - 1);
      let guard = 0;
      while (n1 * d2 === n2 * d1 && guard++ < 40){ d2 = randInt(3, 7); n2 = randInt(1, d2 - 1); }
      const symbol = n1 * d2 > n2 * d1 ? ">" : "<";
      q = '<span class="eq">' + renderFracHTML(0, n1, d1) + "<span>[ ? ]</span>" + renderFracHTML(0, n2, d2) +
          "</span><span>빈칸에 알맞은 기호는?</span>";
      answer = symbol;
      exp = "통분하면 " + (n1 * d2) + "/" + (d1 * d2) + " 와(과) " + (n2 * d1) + "/" + (d1 * d2) +
            " 이므로 <b>" + escSym(symbol) + "</b>가 알맞습니다.";
      options = [">", "<", "="];
    } else if (cat === "4-5"){
      const d = 5, n = randInt(1, 4);
      const fracTenths = n * 2;                       // 정수로 계산해 소수 오차를 없앤다
      let decTenths = randInt(1, 8);
      if (decTenths === fracTenths) decTenths = decTenths === 8 ? 7 : decTenths + 1;
      const symbol = fracTenths > decTenths ? ">" : "<";
      q = '<span class="eq">' + renderFracHTML(0, n, d) + "<span>[ ? ] " + (decTenths / 10).toFixed(1) +
          "</span></span><span>빈칸에 알맞은 기호는?</span>";
      answer = symbol;
      exp = n + "/" + d + "를 소수로 고치면 " + (fracTenths / 10).toFixed(1) +
            "입니다. 그래서 <b>" + escSym(symbol) + "</b>가 알맞습니다.";
      options = [">", "<", "="];
    }
  }

  /* ---------- 5단원 ---------- */
  else if (cat.startsWith("5-")){
    if (cat === "5-1"){
      const d1 = randInt(2, 6), n1 = randInt(1, d1 - 1);
      let d2 = randInt(2, 6);
      while (d1 === d2) d2 = randInt(2, 6);
      const n2 = randInt(1, d2 - 1);
      const totalN = n1 * d2 + n2 * d1, totalD = d1 * d2;
      q = '<span class="eq">' + renderFracHTML(0, n1, d1) + "<span>+</span>" + renderFracHTML(0, n2, d2) + "<span>= ?</span></span>";
      const fo = fracOptions(totalN, totalD, [
        [n1 + n2, d1 + d2],          // 분모끼리 더한 실수
        [n1 + n2, d1 * d2],
        [totalN, d1 + d2]
      ]);
      answer = fo.answer; options = fo.options;
      exp = "통분해서 계산합니다.<br>" + n1 + "/" + d1 + " + " + n2 + "/" + d2 + " = " +
            (n1 * d2) + "/" + totalD + " + " + (n2 * d1) + "/" + totalD + " = <b>" + answer + "</b>";
    } else if (cat === "5-2"){
      const m1 = randInt(1, 2), d1 = randInt(2, 5), n1 = randInt(1, d1 - 1);
      const m2 = randInt(1, 2), d2 = randInt(2, 5), n2 = randInt(1, d2 - 1);
      const totalN = (m1 * d1 + n1) * d2 + (m2 * d2 + n2) * d1, totalD = d1 * d2;
      q = '<span class="eq">' + renderFracHTML(m1, n1, d1) + "<span>+</span>" + renderFracHTML(m2, n2, d2) + "<span>= ?</span></span>";
      const fo = fracOptions(totalN, totalD, [
        [(m1 + m2) * (d1 + d2) + (n1 + n2), d1 + d2],   // 분모끼리 더한 실수
        [(m1 + m2) * totalD, totalD]                     // 분수 부분을 빠뜨린 실수
      ]);
      answer = fo.answer; options = fo.options;
      exp = "자연수는 자연수끼리 더하고, 분수는 통분해서 더합니다.<br>계산 결과는 <b>" + answer + "</b>입니다.";
    } else if (cat === "5-3"){
      let d1, n1, d2, n2, guard = 0;
      do {
        d1 = randInt(3, 6); n1 = randInt(1, d1 - 1);
        d2 = randInt(2, 5); n2 = randInt(1, d2 - 1);
      } while (n1 * d2 <= n2 * d1 && guard++ < 200);
      if (n1 * d2 <= n2 * d1){ d1 = 6; n1 = 5; d2 = 2; n2 = 1; }   // 안전장치
      const totalN = n1 * d2 - n2 * d1, totalD = d1 * d2;
      q = '<span class="eq">' + renderFracHTML(0, n1, d1) + "<span>-</span>" + renderFracHTML(0, n2, d2) + "<span>= ?</span></span>";
      const fo = fracOptions(totalN, totalD, [
        [n1 - n2, d1 - d2],          // 분모끼리 뺀 실수
        [n1 - n2, d1 * d2],
        [totalN, d1 + d2]
      ]);
      answer = fo.answer; options = fo.options;
      exp = "통분한 뒤 분자끼리 뺍니다.<br>" + n1 + "/" + d1 + " - " + n2 + "/" + d2 + " = " +
            (n1 * d2) + "/" + totalD + " - " + (n2 * d1) + "/" + totalD + " = <b>" + answer + "</b>";
    } else if (cat === "5-4"){
      const m1 = randInt(3, 4), d1 = randInt(2, 4), n1 = 1;
      const m2 = randInt(1, 2), d2 = randInt(2, 4), n2 = d2 - 1;
      const totalN = (m1 * d1 + n1) * d2 - (m2 * d2 + n2) * d1, totalD = d1 * d2;
      q = '<span class="eq">' + renderFracHTML(m1, n1, d1) + "<span>-</span>" + renderFracHTML(m2, n2, d2) + "<span>= ?</span></span>";
      const fo = fracOptions(totalN, totalD, [
        [(m1 - m2) * totalD + (n2 * d1 - n1 * d2), totalD],   // 분수를 거꾸로 뺀 실수
        [(m1 - m2) * totalD, totalD]                           // 분수 부분을 빠뜨린 실수
      ]);
      answer = fo.answer; options = fo.options;
      exp = "통분한 뒤 분수끼리 뺄 수 없으면 자연수에서 1을 받아내림해서 뺍니다.<br>계산 결과는 <b>" + answer + "</b>입니다.";
    }
  }

  /* ---------- 6단원 ---------- */
  else if (cat.startsWith("6-")){
    if (cat === "6-1"){
      const n = pick([3, 4, 5, 6, 8]);
      const len = randInt(3, 11);
      const names = { 3: "정삼각형", 4: "정사각형", 5: "정오각형", 6: "정육각형", 8: "정팔각형" };
      const ansVal = len * n;
      q = getPolygonSVG(n, len) + "이 <b>" + names[n] + "</b>의 둘레는 몇 cm일까요?";
      answer = ansVal + "cm";
      exp = "정다각형의 둘레 = (한 변의 길이) × (변의 수)<br>" + len + " × " + n + " = <b>" + ansVal + "cm</b>";
      options = numericOptions(ansVal, "cm", n);
    } else if (cat === "6-2"){
      const w = randInt(4, 11), h = randInt(3, 8);
      const svg = getRectSVG(w, h);
      if (Math.random() < 0.5){
        const ansVal = w * h;
        q = svg + "이 직사각형의 <b>넓이</b>는 몇 cm²일까요?";
        answer = ansVal + "cm²";
        exp = "직사각형의 넓이 = 가로 × 세로<br>" + w + " × " + h + " = <b>" + ansVal + "cm²</b>";
        options = numericOptions(ansVal, "cm²", Math.max(2, Math.min(w, h)));
      } else {
        const ansVal = (w + h) * 2;
        q = svg + "이 직사각형의 <b>둘레</b>는 몇 cm일까요?";
        answer = ansVal + "cm";
        exp = "직사각형의 둘레 = (가로 + 세로) × 2<br>(" + w + " + " + h + ") × 2 = <b>" + ansVal + "cm</b>";
        options = numericOptions(ansVal, "cm", 2);
      }
    } else if (cat === "6-3"){
      const b = randInt(4, 12), h = randInt(3, 10);
      const ansVal = b * h;
      q = getParallelogramSVG(b, h) + "이 평행사변형의 <b>넓이</b>는 몇 cm²일까요?";
      answer = ansVal + "cm²";
      exp = "평행사변형의 넓이 = 밑변 × 높이<br>" + b + " × " + h + " = <b>" + ansVal + "cm²</b>";
      options = numericOptions(ansVal, "cm²", Math.max(2, Math.min(b, h)));
    } else if (cat === "6-4"){
      const b = randInt(2, 6) * 2, h = randInt(3, 10);
      const ansVal = b * h / 2;
      q = getTriangleSVG(b, h) + "이 삼각형의 <b>넓이</b>는 몇 cm²일까요?";
      answer = ansVal + "cm²";
      exp = "삼각형의 넓이 = 밑변 × 높이 ÷ 2<br>" + b + " × " + h + " ÷ 2 = <b>" + ansVal + "cm²</b>";
      options = numericOptions(ansVal, "cm²", Math.max(2, h));
    } else if (cat === "6-5"){
      if (Math.random() < 0.5){
        const d1 = randInt(2, 5) * 2, d2 = randInt(3, 8);
        const ansVal = d1 * d2 / 2;
        q = getRhombusSVG(d1, d2) + "이 마름모의 <b>넓이</b>는 몇 cm²일까요?";
        answer = ansVal + "cm²";
        exp = "마름모의 넓이 = 한 대각선 × 다른 대각선 ÷ 2<br>" + d1 + " × " + d2 + " ÷ 2 = <b>" + ansVal + "cm²</b>";
        options = numericOptions(ansVal, "cm²", Math.max(2, d2));
      } else {
        const top = randInt(2, 6), bottom = randInt(7, 11), h = randInt(2, 5) * 2;
        const ansVal = (top + bottom) * h / 2;
        q = getTrapezoidSVG(top, bottom, h) + "이 사다리꼴의 <b>넓이</b>는 몇 cm²일까요?";
        answer = ansVal + "cm²";
        exp = "사다리꼴의 넓이 = (윗변 + 아랫변) × 높이 ÷ 2<br>(" + top + " + " + bottom + ") × " + h +
              " ÷ 2 = <b>" + ansVal + "cm²</b>";
        options = numericOptions(ansVal, "cm²", Math.max(2, h));
      }
    }
  }

  /* 어떤 분기에도 걸리지 않았을 때의 안전장치 */
  if (!answer || options.length < 2){
    const a = randInt(10, 40), b = randInt(1, 9);
    answer = String(a + b);
    q = "<b>" + a + " + " + b + " = ?</b>";
    exp = a + " + " + b + " = <b>" + (a + b) + "</b>";
    options = numericOptions(a + b, "", 1);
  }

  return { q, answer, exp, opts: shuffle(options) };
}

function generateQuestion(cat){
  const map = {
    "1-all": ["1-1","1-2","1-3","1-4","1-5"],
    "2-all": ["2-1","2-2","2-3","2-4"],
    "3-all": ["3-1","3-2","3-3"],
    "4-all": ["4-1","4-2","4-3","4-4","4-5"],
    "5-all": ["5-1","5-2","5-3","5-4"],
    "6-all": ["6-1","6-2","6-3","6-4","6-5"]
  };
  return generateSingleQuestion(map[cat] ? pick(map[cat]) : cat);
}

  document.getElementById("progress").innerText = correctCount;
  document.getElementById("progress-fill").style.width = (correctCount / TOTAL * 100) + "%";
}

  closeSheet();
  updateProgress();

  currentQData = generateQuestion(selectedCategory);
  document.getElementById("question-text").innerHTML = formatOptionToHTML(currentQData.q);

  const box = document.getElementById("options-box");
  box.innerHTML = "";
  /* 보기가 길면 2열에서 글자가 넘치므로 1열로 바꾼다 (예: 약수 나열) */
  const longest = Math.max.apply(null, currentQData.opts.map(o => String(o).length));
  box.classList.toggle("stack", longest > 9);

  currentQData.opts.forEach(val => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "opt";
    btn.innerHTML = formatOptionToHTML(val);
    btn.dataset.value = val;
    btn.onclick = () => checkAnswer(val, btn);
    box.appendChild(btn);
  });
}

let locked = false;

function checkAnswer(selected, btn){
  if (locked || document.getElementById("sheet").classList.contains("open")) return;

  if (selected === currentQData.answer){
    locked = true;
    btn.classList.add("is-right");
    correctCount++;
    updateProgress();
    setTimeout(() => {
      locked = false;
      if (correctCount >= TOTAL) showSuccessScreen();
      else loadNextQuestion();
    }, 260);   // 맞았다는 표시를 잠깐 보여 준다
    return;
  }

  wrongCount++;
  btn.classList.add("is-wrong");
  document.querySelectorAll(".opt").forEach(b => {
    if (b.dataset.value === currentQData.answer) b.classList.add("is-right");
  });

  document.getElementById("sheet-mine").innerHTML = formatOptionToHTML(selected);
  document.getElementById("sheet-right").innerHTML = formatOptionToHTML(currentQData.answer);
  document.getElementById("sheet-exp").innerHTML = formatOptionToHTML(currentQData.exp);
  document.getElementById("sheet").classList.add("open");
  document.getElementById("scrim").classList.add("open");
  document.body.classList.add("locked");

  /* 해설을 읽을 시간을 주려고 3초 동안 버튼을 잠근다 */
  const next = document.getElementById("btn-next");
  let count = 3;
  next.disabled = true;
  next.innerText = "다음 문제 (" + count + ")";
  const timer = setInterval(() => {
    count--;
    if (count > 0){
      next.innerText = "다음 문제 (" + count + ")";
    } else {
      clearInterval(timer);
      next.disabled = false;
      next.innerText = "다음 문제";
    }
  }, 1000);
  timers.push(timer);
}

function nextAfterExplanation(){
  clearTimers();
  loadNextQuestion();
}

function showSuccessScreen(){
  clearTimers(); closeSheet();
  const totalSec = Math.round((Date.now() - startTime) / 1000);
  const min = Math.floor(totalSec / 60), sec = totalSec % 60;

  document.getElementById("res-name").innerText = userName;
  document.getElementById("res-title").innerText = currentChapterLabel + " · " + currentSubTitle;
  document.getElementById("res-time").innerText = min > 0 ? min + "분 " + sec + "초" : sec + "초";
  document.getElementById("res-wrong").innerText = wrongCount + "번";
  document.getElementById("res-date").innerText = new Date().toLocaleString("ko-KR", {
    year: "numeric", month: "long", day: "numeric", hour: "2-digit", minute: "2-digit"
  });
  document.getElementById("res-praise").innerText =
    wrongCount === 0 ? "한 번도 틀리지 않았습니다." :
    wrongCount <= 3 ? "거의 다 맞혔습니다." : "끝까지 포기하지 않았습니다.";

  showScreen("screen-result");
}
</script>
