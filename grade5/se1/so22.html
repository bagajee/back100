<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>5학년 1학기 사회 - 우리나라의 인구 분포 퀴즈</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #f0fdf4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
      color: #1e293b;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
      position: relative;
    }
    .top-nav {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #e2e8f0;
      color: #334155;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
    }
    .nav-btn:active {
      background-color: #cbd5e1;
    }
    h1 {
      font-size: 22px;
      color: #15803d;
      margin-bottom: 8px;
    }
    .sub-title {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #334155;
      font-size: 15px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #16a34a;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      box-sizing: border-box;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background-color: #16a34a;
      color: #ffffff;
    }
    .btn-secondary {
      background-color: #64748b;
      color: #ffffff;
    }
    .btn-success {
      background-color: #0284c7;
      color: #ffffff;
    }

    /* 퀴즈 진행 화면 */
    #quiz-screen {
      display: none;
      text-align: left;
    }
    .progress-bar-container {
      width: 100%;
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #16a34a;
      transition: width 0.3s ease;
    }
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 14px;
      font-weight: bold;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    .badge-mcq { background: #dcfce7; color: #15803d; }
    .badge-sa { background: #fef3c7; color: #92400e; }

    .question-box {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
      color: #0f172a;
      margin-bottom: 20px;
      min-height: 60px;
    }
    .question-box u {
      color: #dc2626;
      text-decoration-thickness: 2px;
    }
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      width: 100%;
      padding: 14px 16px;
      background-color: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      color: #334155;
      cursor: pointer;
      line-height: 1.4;
      transition: all 0.2s;
    }
    .option-btn:active {
      background-color: #dcfce7;
      border-color: #16a34a;
      color: #15803d;
    }

    .sa-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 오답 화면 */
    #wrong-screen {
      display: none;
      background-color: #fef2f2;
      border: 2px solid #fca5a5;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .wrong-title {
      color: #dc2626;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .explanation-box {
      background: #ffffff;
      padding: 15px;
      border-radius: 10px;
      border-left: 4px solid #dc2626;
      text-align: left;
      font-size: 14px;
      color: #334155;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    /* 성공 화면 */
    #success-screen {
      display: none;
    }
    .trophy {
      font-size: 60px;
      margin-bottom: 10px;
    }
    .success-title {
      font-size: 22px;
      color: #16a34a;
      font-weight: bold;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .result-info {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      margin-bottom: 20px;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .result-item:last-child {
      margin-bottom: 0;
    }
    .result-label {
      color: #475569;
      font-weight: bold;
    }
    .result-value {
      color: #166534;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- 1. 시작 화면 -->
    <div id="start-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>
      <h1>5학년 사회 퀴즈</h1>
      <p class="sub-title">2. 우리나라 지리 탐구 - (2) 우리나라의 인구 분포</p>

      <div class="input-group">
        <label for="userName">이름을 입력하세요</label>
        <input type="text" id="userName" placeholder="예: 홍길동" autocomplete="off">
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="startQuiz()">시작</button>
        <a href="social.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

    <!-- 2. 퀴즈 진행 화면 -->
    <div id="quiz-screen">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      
      <div class="quiz-header">
        <span id="question-number">문제 1 / 10</span>
        <span id="question-type-badge" class="badge badge-mcq">객관식</span>
      </div>

      <div class="question-box" id="question-text"></div>

      <!-- 객관식 영역 -->
      <div class="options-container" id="options-container"></div>

      <!-- 단답식 영역 -->
      <div class="sa-container" id="sa-container" style="display: none;">
        <input type="text" id="sa-input" placeholder="정답 입력" onkeydown="if(event.key==='Enter') submitSAAnswer()">
        <button class="btn btn-primary" onclick="submitSAAnswer()">정답 제출</button>
      </div>
    </div>

    <!-- 3. 오답 화면 -->
    <div id="wrong-screen">
      <div class="wrong-title">❌ 틀렸습니다!</div>
      <div class="explanation-box">
        <strong>💡 간단 해설:</strong>
        <p id="explanation-text" style="margin-top: 6px;"></p>
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="returnToStart()">계속</button>
    </div>

    <!-- 4. 성공 축하 화면 -->
    <div id="success-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>

      <div class="trophy">🎉</div>
      <div class="success-title">축하합니다!<br>10문제를 모두 맞추셨습니다!</div>
      
      <div class="result-info">
        <div class="result-item">
          <span class="result-label">이름</span>
          <span class="result-value" id="result-name">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">총 걸린시간</span>
          <span class="result-value" id="result-time">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">현재 시간</span>
          <span class="result-value" id="result-date">-</span>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-success" onclick="returnToStart()">재도전</button>
        <a href="social.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

  </div>

  <script>
    // ----------------------------------------------------
    // 단답식 문제 은행 (지정된 단답식 정답에 맞춘 7개 문제)
    // ----------------------------------------------------
    const saBank = [
      {
        q: "일정한 지역에 살고 있는 사람의 수인 인구가 모이거나 흩어져 있는 정도를 무엇이라고 하나요?",
        ans: "인구 분포",
        exp: "인구 분포는 일정한 지역에 살고 있는 사람의 수인 인구가 모이거나 흩어져 있는 정도를 뜻합니다."
      },
      {
        q: "기후, 지형 등과 같이 인구 분포에 영향을 주는 환경을 무엇이라고 하나요?",
        ans: "자연 환경",
        exp: "기후, 지형 등은 인구 분포에 영향을 주는 대표적인 자연 환경입니다."
      },
      {
        q: "교통, 일자리, 교육 등과 같이 인구 분포에 영향을 주는 환경을 무엇이라고 하나요?",
        ans: "인문 환경",
        exp: "교통, 일자리, 교육 등은 인구 분포에 영향을 주는 대표적인 인문 환경입니다."
      },
      {
        q: "일정한 넓이(1㎢) 안에 사는 사람의 수로, 인구가 모여 있는 정도를 나타내는 말은 무엇인가요?",
        ans: "인구 밀도",
        exp: "인구 밀도는 일정한 넓이(1㎢) 안에 사는 사람의 수로, 인구가 모여 있는 정도를 나타냅니다."
      },
      {
        q: "오늘날 우리나라 인구의 절반 정도가 집중되어 살고 있는 지역을 무엇이라고 하나요?",
        ans: "수도권",
        exp: "오늘날 우리나라 인구의 절반 정도가 수도권에 살고 있습니다."
      },
      {
        q: "수도권으로의 인구 집중 현상으로 인해 인구 분포의 ( )이/가 심해지고 있습니다. 빈칸에 들어갈 3글자 단어는 무엇인가요?",
        ans: "불균형",
        exp: "수도권으로 많은 인구가 모여들면서 수도권과 비수도권 간 인구 분포의 불균형이 심해집니다."
      },
      {
        q: "지역마다 다른 이 현상은 각 지역의 인구 밀도를 살펴보면 알 수 있습니다. 일정 지역에 인구가 모이거나 흩어진 정도를 뜻하는 말은 무엇인가요?",
        ans: "인구 분포",
        exp: "지역마다 다른 인구 분포는 각 지역의 인구 밀도를 살펴보면 알 수 있습니다."
      }
    ];

    // ----------------------------------------------------
    // 객관식 문제 은행 (총 33개 - 전체 40개 문제 풀 구성)
    // ----------------------------------------------------
    const mcqBank = [
      {
        q: "다음 중 인구 분포에 영향을 주는 '자연 환경'에 해당하는 것으로 올바른 것은 무엇인가요?",
        options: ["기후, 지형", "교통 시설", "일자리", "교육 환경"],
        ans: 0,
        exp: "기후와 지형 등은 인구 분포에 영향을 주는 자연 환경입니다."
      },
      {
        q: "다음 중 인구 분포에 영향을 주는 '인문 환경'에 해당하지 <u>않는</u> 것은 무엇인가요?",
        options: ["기후 및 지형", "교통", "일자리", "교육"],
        ans: 0,
        exp: "기후와 지형은 자연 환경에 해당합니다."
      },
      {
        q: "일정한 넓이(1㎢) 안에 사는 사람의 수로, 인구가 모여 있는 정도를 나타내는 용어는 무엇인가요?",
        options: ["인구 밀도", "인구 구조", "자연 환경", "로컬 브랜딩"],
        ans: 0,
        exp: "일정한 넓이(1㎢) 안에 사는 사람의 수로 인구가 모인 정도를 나타낸 것은 인구 밀도입니다."
      },
      {
        q: "인구 밀도와 인구 분포에 대한 설명으로 <u>옳지 않은</u> 것은 무엇인가요?",
        options: [
          "대체로 촌락이 도시보다 인구 밀도가 높게 나타난다.",

          "지역마다 다른 인구 분포는 각 지역의 인구 밀도를 보면 알 수 있다.",

      {
        q: "과거 우리나라의 인구 분포 특징에 대한 설명으로 올바른 것은 무엇인가요?",
        options: [
          "농업 사회라 자연 환경의 영향을 많이 받았다.",
          "공업과 산업화의 영향만을 받았다.",
          "도시 지역으로만 인구가 집중되었다.",

        ],
        ans: 0,
        exp: "과거 우리나라는 농업 사회였기 때문에 자연 환경의 영향을 많이 받았습니다."
      },
      {
        q: "과거 우리나라에서 인구가 주로 분포했던 지역의 특징으로 올바른 것은 무엇인가요?",
        options: [
          "기후가 온화하고 평야가 발달한 지역",
          "연평균 기온이 낮고 산지가 많은 지역",
          "대규모 공장과 지하철이 많은 지역",
          "교통과 일자리가 집중된 수도권 지역"
        ],
        ans: 0,
        exp: "과거에는 기후가 온화하고 평야가 발달한 지역에 인구가 주로 분포했습니다."
      },
      {
        q: "과거 우리나라에서 인구 밀도가 낮았던 지역의 특징으로 올바른 것은 무엇인가요?",
        options: [
          "연평균 기온이 낮고 산지가 많은 지역",
          "기후가 온화하고 평야가 발달한 지역",
          "농업 생산량이 매우 높은 평야 지역",
          "남쪽 해안가의 평야 지대"
        ],
        ans: 0,
        exp: "과거 연평균 기온이 낮고 산지가 많은 지역은 인구 밀도가 낮았습니다."
      },
      {
        q: "1960년대 이후 오늘날 우리나라 인구 분포에 크게 영향을 미치게 된 요인은 무엇인가요?",
        options: [
          "산업화로 도시가 발달하면서 나타난 인문 환경",
          "평야 지대와 온화한 기후 등의 자연 환경",
          "산지의 수와 지형 지물",
          "연평균 기온의 하락"
        ],
        ans: 0,
        exp: "1960년대 이후 산업화로 도시가 발달하면서 일자리, 교통 등 인문 환경의 영향을 크게 받게 되었습니다."
      },
      {
        q: "1960년대 이후 나타난 인구 이동의 특징으로 올바른 것은 무엇인가요?",

          "많은 사람이 촌락에서 도시로 이동했다.",

        ],
        ans: 0,
        exp: "산업화로 많은 사람이 촌락에서 도시로 이동하였습니다."
      },
      {
        q: "1960년대 이후 촌락 지역의 인구 변화로 올바른 것은 무엇인가요?",

          "촌락 지역은 인구가 줄었다.",

          "수도권 인구가 촌락으로 대거 이동했다."

        ans: 0,
        exp: "많은 사람이 촌락에서 도시로 이동하면서 촌락 지역은 인구가 줄었습니다."
      },
      {
        q: "2020년대 이후 오늘날 우리나라 인구 분포의 특징으로 올바른 것은 무엇인가요?",
        options: [
          "인구가 수도권으로 집중해 절반 정도가 수도권에 살고 있다.",
          "인구가 전국에 균등하게 나누어져 살고 있다.",
          "촌락 지역의 인구 비율이 도시보다 높다.",
          "비수도권에 전국 인구의 80% 이상이 살고 있다."

    // ----------------------------------------------------
    // 게임 상태 변수
    // ----------------------------------------------------
    let userName = "";
    let quizQueue = [];
    let currentIdx = 0;
    let startTime = null;

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const wrongScreen = document.getElementById("wrong-screen");
    const successScreen = document.getElementById("success-screen");

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startQuiz() {
      const nameInput = document.getElementById("userName").value.trim();
      if (!nameInput) {
        alert("이름을 입력해 주세요!");
        return;
      }
      userName = nameInput;

      // 1-7번: 객관식 33개 중 7개 무작위 추출 및 보기 셔플
      // 8-10번: 단답식 7개 중 3개 무작위 추출
      const selectedMCQs = shuffle(mcqBank).slice(0, 7);
      const selectedSAs = shuffle(saBank).slice(0, 3);

      const formattedMCQs = selectedMCQs.map(item => {
        const correctText = item.options[item.ans];
        const shuffledOptions = shuffle(item.options);
        const newAnsIdx = shuffledOptions.indexOf(correctText);
        return {
          type: "MCQ",
          q: item.q,
          options: shuffledOptions,
          ans: newAnsIdx,
          exp: item.exp
        };
      });

      const formattedSAs = selectedSAs.map(item => ({
        type: "SA",
        q: item.q,
        ans: item.ans,
        exp: item.exp
      }));

      quizQueue = [...formattedMCQs, ...formattedSAs];
      currentIdx = 0;
      startTime = Date.now();

      startScreen.style.display = "none";
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "block";

      renderQuestion();
    }

    function renderQuestion() {
      const qData = quizQueue[currentIdx];
      
      const progressPercent = ((currentIdx + 1) / 10) * 100;
      document.getElementById("progress-bar").style.width = progressPercent + "%";
      document.getElementById("question-number").textContent = `문제 ${currentIdx + 1} / 10`;

      const badge = document.getElementById("question-type-badge");
      const optionsBox = document.getElementById("options-container");
      const saBox = document.getElementById("sa-container");

      document.getElementById("question-text").innerHTML = `${currentIdx + 1}. ${qData.q}`;

      if (qData.type === "MCQ") {
        badge.textContent = "객관식";
        badge.className = "badge badge-mcq";
        optionsBox.style.display = "flex";
        saBox.style.display = "none";

        optionsBox.innerHTML = "";
        qData.options.forEach((optText, idx) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = `${idx + 1}. ${optText}`;
          btn.onclick = () => checkMCQAnswer(idx);
          optionsBox.appendChild(btn);
        });
      } else {
        badge.textContent = "단답식";
        badge.className = "badge badge-sa";
        optionsBox.style.display = "none";
        saBox.style.display = "flex";

        const saInput = document.getElementById("sa-input");
        saInput.value = "";
        setTimeout(() => saInput.focus(), 100);
      }
    }

    function checkMCQAnswer(selectedIdx) {
      const qData = quizQueue[currentIdx];
      if (selectedIdx === qData.ans) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function submitSAAnswer() {
      const qData = quizQueue[currentIdx];
      const userInput = document.getElementById("sa-input").value.trim().replace(/\s+/g, "");
      const targetAns = qData.ans.replace(/\s+/g, "");

      if (!userInput) {
        alert("정답을 입력해주세요.");
        return;
      }

      if (userInput === targetAns) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < 10) {
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function showWrongScreen(explanationText) {
      quizScreen.style.display = "none";
      wrongScreen.style.display = "block";
      document.getElementById("explanation-text").textContent = explanationText;
    }

    function returnToStart() {
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "none";
      startScreen.style.display = "block";
    }

    function finishQuiz() {
      const endTime = Date.now();
      const elapsedSeconds = Math.round((endTime - startTime) / 1000);

      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      const dateStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

      document.getElementById("result-name").textContent = userName;
      document.getElementById("result-time").textContent = `${elapsedSeconds}초`;
      document.getElementById("result-date").textContent = dateStr;

      quizScreen.style.display = "none";
      successScreen.style.display = "block";
    }
