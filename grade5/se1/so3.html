<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>5학년 1학기 사회 - 법과 인권의 보장 퀴즈</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #f0f9ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
      color: #1e293b;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
      position: relative;
    }
    .top-nav {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #e2e8f0;
      color: #334155;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
    }
    .nav-btn:active {
      background-color: #cbd5e1;
    }
    h1 {
      font-size: 22px;
      color: #0284c7;
      margin-bottom: 8px;
    }
    .sub-title {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #334155;
      font-size: 15px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #0284c7;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      box-sizing: border-box;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background-color: #0284c7;
      color: #ffffff;
    }
    .btn-secondary {
      background-color: #64748b;
      color: #ffffff;
    }
    .btn-success {
      background-color: #16a34a;
      color: #ffffff;
    }

    /* 퀴즈 화면 */
    #quiz-screen {
      display: none;
      text-align: left;
    }
    .progress-bar-container {
      width: 100%;
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #0284c7;
      transition: width 0.3s ease;
    }
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 14px;
      font-weight: bold;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    .badge-mcq { background: #e0f2fe; color: #0369a1; }
    .badge-sa { background: #fef3c7; color: #92400e; }

    .question-box {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
      color: #0f172a;
      margin-bottom: 20px;
      min-height: 60px;
    }
    .question-box u {
      color: #dc2626;
      text-decoration-thickness: 2px;
    }
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      width: 100%;
      padding: 14px 16px;
      background-color: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      color: #334155;
      cursor: pointer;
      line-height: 1.4;
      transition: all 0.2s;
    }
    .option-btn:active {
      background-color: #e0f2fe;
      border-color: #0284c7;
      color: #0369a1;
    }

    .sa-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 오답 화면 */
    #wrong-screen {
      display: none;
      background-color: #fef2f2;
      border: 2px solid #fca5a5;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .wrong-title {
      color: #dc2626;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .explanation-box {
      background: #ffffff;
      padding: 15px;
      border-radius: 10px;
      border-left: 4px solid #dc2626;
      text-align: left;
      font-size: 14px;
      color: #334155;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    /* 성공 화면 */
    #success-screen {
      display: none;
    }
    .trophy {
      font-size: 60px;
      margin-bottom: 10px;
    }
    .success-title {
      font-size: 22px;
      color: #0284c7;
      font-weight: bold;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .result-info {
      background-color: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      margin-bottom: 20px;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .result-item:last-child {
      margin-bottom: 0;
    }
    .result-label {
      color: #475569;
      font-weight: bold;
    }
    .result-value {
      color: #0369a1;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- 1. 시작 화면 -->
    <div id="start-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>
      <h1>5학년 사회 퀴즈</h1>
      <p class="sub-title">3. 법과 인권의 보장</p>

      <div class="input-group">
        <label for="userName">이름을 입력하세요</label>
        <input type="text" id="userName" placeholder="예: 홍길동" autocomplete="off">
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="startQuiz()">시작</button>
        <a href="social.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

    <!-- 2. 퀴즈 진행 화면 -->
    <div id="quiz-screen">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      
      <div class="quiz-header">
        <span id="question-number">문제 1 / 10</span>
        <span id="question-type-badge" class="badge badge-mcq">객관식</span>
      </div>

      <div class="question-box" id="question-text"></div>

      <!-- 객관식 영역 -->
      <div class="options-container" id="options-container"></div>

      <!-- 단답식 영역 -->
      <div class="sa-container" id="sa-container" style="display: none;">
        <input type="text" id="sa-input" placeholder="정답 입력" onkeydown="if(event.key==='Enter') submitSAAnswer()">
        <button class="btn btn-primary" onclick="submitSAAnswer()">정답 제출</button>
      </div>
    </div>

    <!-- 3. 오답 화면 -->
    <div id="wrong-screen">
      <div class="wrong-title">❌ 틀렸습니다!</div>
      <div class="explanation-box">
        <strong>💡 간단 해설:</strong>
        <p id="explanation-text" style="margin-top: 6px;"></p>
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="returnToStart()">계속</button>
    </div>

    <!-- 4. 성공 축하 화면 -->
    <div id="success-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>

      <div class="trophy">🎉</div>
      <div class="success-title">축하합니다!<br>10문제를 모두 맞추셨습니다!</div>
      
      <div class="result-info">
        <div class="result-item">
          <span class="result-label">이름</span>
          <span class="result-value" id="result-name">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">총 걸린시간</span>
          <span class="result-value" id="result-time">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">현재 시간</span>
          <span class="result-value" id="result-date">-</span>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-success" onclick="returnToStart()">재도전</button>
        <a href="social.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

  </div>

  <script>
    // ----------------------------------------------------
    // 단답식 문제 은행 (지정된 단답식 정답 9개)
    // ----------------------------------------------------
    const saBank = [
      {
        q: "사회 구성원이 반드시 지켜야 하는 강제성이 있는 규범을 무엇이라고 하나요?",
        ans: "법",
        exp: "법은 사회 구성원이 반드시 지켜야 하는 강제성이 있는 규범입니다."
      },
      {
        q: "학생들이 안전하게 등교할 수 있도록 보호하기 위한 법의 명칭은 무엇인가요?",
        ans: "도로 교통법",
        exp: "「도로 교통법」은 안전하게 등교할 수 있도록 돕는 법입니다."
      },
      {
        q: "법은 사람들 사이의 갈등이나 다툼을 해결하는 ( )이/가 됩니다. 빈칸에 들어갈 알맞은 단어는 무엇인가요?",
        ans: "기준",
        exp: "법은 사람들 사이의 갈등이나 다툼을 해결하는 기준이 됩니다."
      },
      {
        q: "개인 사이에 분쟁이 생겼을 때 개인의 생명, 재산, 개인 정보 등을 보호하는 법의 역할을 개인의 ( ) (이)라고 합니다.",
        ans: "권리 보호",
        exp: "법은 개인의 생명, 재산, 개인 정보를 보호하는 '개인의 권리 보호' 역할을 합니다."
      },
      {
        q: "범죄나 사고를 예방하여 국민을 안전하게 보호하고 사회 혼란을 막는 법의 역할을 사회 ( ) (이)라고 합니다.",
        ans: "질서 유지",
        exp: "법은 범죄나 사고를 예방하여 사회 혼란을 막는 '사회 질서 유지' 역할을 합니다."
      },
      {
        q: "사람이 태어나면서 당연히 가지는 권리로, 사람이라면 누구나 누려야 할 기본적 권리를 무엇이라고 하나요?",
        ans: "인권",
        exp: "인권은 사람이라면 누구나 누려야 할 기본적 권리입니다."
      },
      {
        q: "모든 국민이 인간으로서의 존엄과 가치를 가지고 행복을 추구할 수 있도록 인권을 보장하는 우리나라 최고의 법은 무엇인가요?",
        ans: "헌법",
        exp: "헌법은 모든 국민이 인간으로서의 존엄과 가치를 지니고 행복을 추구할 수 있도록 인권을 보장합니다."
      },
      {
        q: "성별, 나이, 신체적 특징, 종교, 국적 등으로 인권을 보호받지 못하는 것을 무엇이라고 하나요?",
        ans: "인권 침해",
        exp: "성별, 나이, 신체적 특징 등으로 인권을 보호받지 못하는 것을 인권 침해라고 합니다."
      },
      {
        q: "인권 사진전 개최, 인권 포스터 제작, 손수 제작물(UCC) 제작 등을 통해 실천하려는 활동은 무엇인가요?",
        ans: "인권 보호",
        exp: "사진전, 포스터, UCC 제작 등은 인권 보호를 실천하는 대표적인 방법입니다."
      }
    ];

    // ----------------------------------------------------
    // 객관식 문제 은행 (총 31개)
    // ----------------------------------------------------
    const mcqBank = [
      {
        q: "법의 특징으로 올바른 것은 무엇인가요?",
        options: ["법을 지키지 않으면 국가로부터 제재를 받는다.", "지키지 않아도 아무런 제재가 없다.", "마음에 드는 사람만 지키면 된다.", "강제성이 전혀 없다."],
        ans: 0,
        exp: "법은 강제성이 있는 규범으로 지키지 않으면 국가로부터 제재를 받습니다."
      },
      {
        q: "학교에서 공부할 수 있도록 보호해 주는 법은 무엇인가요?",
        options: ["「초·중등 교육법」", "「식품안전기본법」", "「건축법」", "「소방기본법」"],
        ans: 0,
        exp: "학교에서 공부할 수 있도록 보호하는 법은 「초·중등 교육법」입니다."
      },
      {
        q: "학교에서 영양가 있고 안전한 급식을 먹을 수 있도록 보호해 주는 법은 무엇인가요?",
        options: ["「학교 급식 법」", "「소비자기본법」", "「의료법」", "「저작권법」"],
        ans: 0,
        exp: "영양가 있고 안전한 급식을 먹을 수 있도록 보장하는 법은 「학교 급식 법」입니다."
      },
      {
        q: "안전한 놀이터를 이용할 수 있도록 보호해 주는 법은 무엇인가요?",
        options: ["「어린이 놀이 시설 안전 관리법」", "「경찰관 직무집행법」", "「건축법」", "「도로교통법」"],
        ans: 0,
        exp: "안전한 놀이터를 이용할 수 있도록 돕는 법은 「어린이 놀이 시설 안전 관리법」입니다."
      },
      {
        q: "저작물을 창작한 사람의 권리를 보호하기 위한 법은 무엇인가요?",
        options: ["「저작권법」", "「소비자기본법」", "「의료법」", "「자연환경보전법」"],
        ans: 0,
        exp: "저작물을 창작한 사람의 권리를 보호하는 법은 「저작권법」입니다."
      },
      {
        q: "국민을 보호하기 위한 경찰관의 직무 수행에 관한 법은 무엇인가요?",
        options: ["「경찰관 직무집행법」", "「건축법」", "「소방기본법」", "「도로교통법」"],
        ans: 0,
        exp: "국민을 보호하기 위한 경찰관의 직무 수행에 관한 법은 「경찰관 직무집행법」입니다."
      },
      {
        q: "안전하고 살기 좋은 건물을 짓기 위한 법은 무엇인가요?",
        options: ["「건축법」", "「소방기본법」", "「의료법」", "「저작권법」"],
        ans: 0,
        exp: "안전하고 살기 좋은 건물을 짓기 위한 법은 「건축법」입니다."
      },
      {
        q: "생태계와 자연환경을 보호하고 국민이 건강한 생활을 하기 위한 법은 무엇인가요?",
        options: ["「자연환경보전법」", "「식품안전기본법」", "「소비자기본법」", "「초·중등 교육법」"],
        ans: 0,
        exp: "생태계와 자연환경을 보호하기 위한 법은 「자연환경보전법」입니다."
      },
      {
        q: "화재나 재난, 재해로부터 국민의 생명과 재산을 보호하기 위한 법은 무엇인가요?",
        options: ["「소방기본법」", "「도로교통법」", "「의료법」", "「건축법」"],
        ans: 0,
        exp: "화재나 재난, 재해로부터 국민을 보호하는 법은 「소방기본법」입니다."
      },
      {
        q: "안전하고 원활한 교통을 확보하기 위한 법은 무엇인가요?",
        options: ["「도로교통법」", "「소비자기본법」", "「저작권법」", "「식품안전기본법」"],
        ans: 0,
        exp: "안전하고 원활한 교통을 확보하기 위한 법은 「도로교통법」입니다."
      },
      {
        q: "소비자의 권리와 책임을 규정한 법은 무엇인가요?",
        options: ["「소비자기본법」", "「의료법」", "「경찰관 직무집행법」", "「건축법」"],
        ans: 0,
        exp: "소비자의 권리와 책임을 규정한 법은 「소비자기본법」입니다."
      },
      {
        q: "건강하고 안전한 식생활을 보장하기 위한 법은 무엇인가요?",
        options: ["「식품안전기본법」", "「자연환경보전법」", "「학교 급식 법」", "「저작권법」"],
        ans: 0,
        exp: "건강하고 안전한 식생활을 보장하는 법은 「식품안전기본법」입니다."
      },
      {
        q: "국민의 건강을 지키기 위한 법은 무엇인가요?",
        options: ["「의료법」", "「소방기본법」", "「건축법」", "「도로교통법」"],
        ans: 0,
        exp: "국민의 건강을 지키기 위한 법은 「의료법」입니다."

    // ----------------------------------------------------
    // 게임 상태 변수
    // ----------------------------------------------------
    let userName = "";
    let quizQueue = [];
    let currentIdx = 0;
    let startTime = null;

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const wrongScreen = document.getElementById("wrong-screen");
    const successScreen = document.getElementById("success-screen");

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startQuiz() {
      const nameInput = document.getElementById("userName").value.trim();
      if (!nameInput) {
        alert("이름을 입력해 주세요!");
        return;
      }
      userName = nameInput;

      // 1-7번: 객관식 31개 중 7개 무작위 추출 및 보기 셔플
      // 8-10번: 단답식 9개 중 3개 무작위 추출
      const selectedMCQs = shuffle(mcqBank).slice(0, 7);
      const selectedSAs = shuffle(saBank).slice(0, 3);

      const formattedMCQs = selectedMCQs.map(item => {
        const correctText = item.options[item.ans];
        const shuffledOptions = shuffle(item.options);
        const newAnsIdx = shuffledOptions.indexOf(correctText);
        return {
          type: "MCQ",
          q: item.q,
          options: shuffledOptions,
          ans: newAnsIdx,
          exp: item.exp
        };
      });

      const formattedSAs = selectedSAs.map(item => ({
        type: "SA",
        q: item.q,
        ans: item.ans,
        exp: item.exp
      }));

      quizQueue = [...formattedMCQs, ...formattedSAs];
      currentIdx = 0;
      startTime = Date.now();

      startScreen.style.display = "none";
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "block";

      renderQuestion();
    }

    function renderQuestion() {
      const qData = quizQueue[currentIdx];
      
      const progressPercent = ((currentIdx + 1) / 10) * 100;
      document.getElementById("progress-bar").style.width = progressPercent + "%";
      document.getElementById("question-number").textContent = `문제 ${currentIdx + 1} / 10`;

      const badge = document.getElementById("question-type-badge");
      const optionsBox = document.getElementById("options-container");
      const saBox = document.getElementById("sa-container");

      document.getElementById("question-text").innerHTML = `${currentIdx + 1}. ${qData.q}`;

      if (qData.type === "MCQ") {
        badge.textContent = "객관식";
        badge.className = "badge badge-mcq";
        optionsBox.style.display = "flex";
        saBox.style.display = "none";

        optionsBox.innerHTML = "";
        qData.options.forEach((optText, idx) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = `${idx + 1}. ${optText}`;
          btn.onclick = () => checkMCQAnswer(idx);
          optionsBox.appendChild(btn);
        });
      } else {
        badge.textContent = "단답식";
        badge.className = "badge badge-sa";
        optionsBox.style.display = "none";
        saBox.style.display = "flex";

        const saInput = document.getElementById("sa-input");
        saInput.value = "";
        setTimeout(() => saInput.focus(), 100);
      }
    }

    function checkMCQAnswer(selectedIdx) {
      const qData = quizQueue[currentIdx];
      if (selectedIdx === qData.ans) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function submitSAAnswer() {
      const qData = quizQueue[currentIdx];
      const userInput = document.getElementById("sa-input").value.trim().replace(/\s+/g, "");
      const targetAns = qData.ans.replace(/\s+/g, "");

      if (!userInput) {
        alert("정답을 입력해주세요.");
        return;
      }

      if (userInput === targetAns) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < 10) {
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function showWrongScreen(explanationText) {
      quizScreen.style.display = "none";
      wrongScreen.style.display = "block";
      document.getElementById("explanation-text").textContent = explanationText;
    }

    function returnToStart() {
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "none";
      startScreen.style.display = "block";
    }

    function finishQuiz() {
      const endTime = Date.now();
      const elapsedSeconds = Math.round((endTime - startTime) / 1000);

      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      const dateStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

      document.getElementById("result-name").textContent = userName;
      document.getElementById("result-time").textContent = `${elapsedSeconds}초`;
      document.getElementById("result-date").textContent = dateStr;

      quizScreen.style.display = "none";
      successScreen.style.display = "block";
    }
  </script>
