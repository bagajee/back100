<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>5학년 1학기 사회 - 우리나라의 기후 퀴즈</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #f0fdf4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
      color: #1e293b;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
      position: relative;
    }
    .top-nav {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #e2e8f0;
      color: #334155;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
    }
    .nav-btn:active {
      background-color: #cbd5e1;
    }
    h1 {
      font-size: 22px;
      color: #15803d;
      margin-bottom: 8px;
    }
    .sub-title {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #334155;
      font-size: 15px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #16a34a;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      box-sizing: border-box;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background-color: #16a34a;
      color: #ffffff;
    }
    .btn-secondary {
      background-color: #64748b;
      color: #ffffff;
    }
    .btn-success {
      background-color: #0284c7;
      color: #ffffff;
    }

    /* 퀴즈 진행 화면 */
    #quiz-screen {
      display: none;
      text-align: left;
    }
    .progress-bar-container {
      width: 100%;
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #16a34a;
      transition: width 0.3s ease;
    }
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 14px;
      font-weight: bold;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    .badge-mcq { background: #dcfce7; color: #15803d; }
    .badge-sa { background: #fef3c7; color: #92400e; }

    .question-box {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
      color: #0f172a;
      margin-bottom: 20px;
      min-height: 60px;
    }
    .question-box u {
      color: #dc2626;
      text-decoration-thickness: 2px;
    }
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      width: 100%;
      padding: 14px 16px;
      background-color: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      color: #334155;
      cursor: pointer;
      line-height: 1.4;
      transition: all 0.2s;
    }
    .option-btn:active {
      background-color: #dcfce7;
      border-color: #16a34a;
      color: #15803d;
    }

    .sa-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 오답 화면 */
    #wrong-screen {
      display: none;
      background-color: #fef2f2;
      border: 2px solid #fca5a5;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .wrong-title {
      color: #dc2626;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .explanation-box {
      background: #ffffff;
      padding: 15px;
      border-radius: 10px;
      border-left: 4px solid #dc2626;
      text-align: left;
      font-size: 14px;
      color: #334155;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    /* 성공 화면 */
    #success-screen {
      display: none;
    }
    .trophy {
      font-size: 60px;
      margin-bottom: 10px;
    }
    .success-title {
      font-size: 22px;
      color: #16a34a;
      font-weight: bold;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .result-info {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      margin-bottom: 20px;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .result-item:last-child {
      margin-bottom: 0;
    }
    .result-label {
      color: #475569;
      font-weight: bold;
    }
    .result-value {
      color: #166534;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- 1. 시작 화면 -->
    <div id="start-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>
      <h1>5학년 사회 퀴즈</h1>
      <p class="sub-title">2. 우리나라 지리 탐구 - (1) 우리나라의 기후</p>

      <div class="input-group">
        <label for="userName">이름을 입력하세요</label>
        <input type="text" id="userName" placeholder="예: 홍길동" autocomplete="off">
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="startQuiz()">시작</button>
        <a href="social.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

    <!-- 2. 퀴즈 진행 화면 -->
    <div id="quiz-screen">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      
      <div class="quiz-header">
        <span id="question-number">문제 1 / 10</span>
        <span id="question-type-badge" class="badge badge-mcq">객관식</span>
      </div>

      <div class="question-box" id="question-text"></div>

      <!-- 객관식 영역 -->
      <div class="options-container" id="options-container"></div>

      <!-- 단답식 영역 -->
      <div class="sa-container" id="sa-container" style="display: none;">
        <input type="text" id="sa-input" placeholder="정답 입력" onkeydown="if(event.key==='Enter') submitSAAnswer()">
        <button class="btn btn-primary" onclick="submitSAAnswer()">정답 제출</button>
      </div>
    </div>

    <!-- 3. 오답 화면 -->
    <div id="wrong-screen">
      <div class="wrong-title">❌ 틀렸습니다!</div>
      <div class="explanation-box">
        <strong>💡 간단 해설:</strong>
        <p id="explanation-text" style="margin-top: 6px;"></p>
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="returnToStart()">계속</button>
    </div>

    <!-- 4. 성공 축하 화면 -->
    <div id="success-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>

      <div class="trophy">🎉</div>
      <div class="success-title">축하합니다!<br>10문제를 모두 맞추셨습니다!</div>
      
      <div class="result-info">
        <div class="result-item">
          <span class="result-label">이름</span>
          <span class="result-value" id="result-name">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">총 걸린시간</span>
          <span class="result-value" id="result-time">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">현재 시간</span>
          <span class="result-value" id="result-date">-</span>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-success" onclick="returnToStart()">재도전</button>
        <a href="social.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

  </div>

  <script>
    // ----------------------------------------------------
    // 단답식 문제 은행 (총 9개 - 요구된 지정 단답식 정답 100% 매칭)
    // ----------------------------------------------------
    const saBank = [
      {
        q: "오랜 기간 한 지역에서 나타나는 평균적이며 종합적인 대기 상태를 무엇이라고 하나요?",
        ans: "기후",
        exp: "오랜 기간 한 지역에서 나타나는 평균적이며 종합적인 대기 상태를 '기후'라고 합니다."
      },
      {
        q: "기후변화의 영향으로 연평균 기온이 올라가면서 계절의 길이가 달라져 짧아지고 있는 계절은 무엇인가요?",
        ans: "겨울",
        exp: "기후변화로 인해 연평균 기온이 올라가면서 여름은 길어지고 '겨울'은 짧아지고 있습니다."
      },
      {
        q: "우리나라에서 연 강수량의 절반 이상이 내릴 만큼 비가 집중되는 계절은 무엇인가요?",
        ans: "여름",
        exp: "우리나라에서는 '여름'에 연 강수량의 절반 이상이 내릴 만큼 비가 많이 내립니다."
      },
      {
        q: "우리나라에서 북쪽에서 남쪽으로 갈수록 대체로 많아지며, 지형과 바람의 영향으로 지역별 차이가 나타나는 이것은 무엇인가요?",
        ans: "강수량",
        exp: "우리나라의 '강수량'은 북쪽에서 남쪽으로 갈수록 많아지며, 바람과 지형의 영향을 받습니다."
      },
      {
        q: "우리나라 겨울철에 북서쪽 육지에서 차갑고 건조하게 불어오는 기후 요소 중 하나는 무엇인가요?",
        ans: "바람",
        exp: "겨울철에는 북서쪽 육지에서 차갑고 건조한 '바람'이 불어와 날씨가 추워집니다."
      },
      {
        q: "홍수, 태풍, 한파 등 피할 수 없는 자연 현상으로 사람들이 입는 생명이나 재산상의 피해를 무엇이라고 하나요?",
        ans: "자연재해",
        exp: "피할 수 없는 자연 현상으로 사람들이 입는 생명이나 재산상의 피해를 '자연재해'라고 합니다."
      },
      {
        q: "여름과 가을에 주로 우리나라 남서쪽에서 북동쪽으로 진행하며 많은 비와 강한 바람을 몰고 오는 자연재해는 무엇인가요?",
        ans: "태풍",
        exp: "여름과 가을에 많은 비와 강한 바람을 몰고 오는 대표적인 자연재해는 '태풍'입니다."
      },
      {
        q: "인간 활동으로 심해져 전 세계적으로 기후변화를 일으키는 주요 원인은 무엇인가요?",
        ans: "지구 온난화",
        exp: "인간 활동으로 '지구 온난화'가 심해져 전 세계적으로 기후변화가 나타나고 있습니다."
      },
      {
        q: "일상생활에서 에너지 절약하기, 친환경·재활용 제품 쓰기 등 기후변화를 막으려는 모든 노력을 무엇이라고 하나요?",
        ans: "기후 행동",
        exp: "기후변화를 막으려는 모든 노력을 '기후 행동'이라고 합니다."
      }
    ];

    // ----------------------------------------------------
    // 객관식 문제 은행 (총 31개 - 단답식 9개 포함 총 40개 문제 은행)
    // ----------------------------------------------------
    const mcqBank = [
      {
        q: "우리나라의 기후를 알 수 있는 요소로 <u>옳지 않은</u> 것은 무엇인가요?",
        options: ["지진", "기온", "강수", "바람"],
        ans: 0,
        exp: "기후는 여러 해에 걸쳐 나타난 기온, 강수, 바람 등으로 알 수 있습니다."
      },
      {
        q: "우리나라의 계절별 바람 특징에 대한 설명으로 올바른 것은 무엇인가요?",
        options: [
          "겨울에는 북서쪽 육지에서 차갑고 건조한 바람이 불어온다.",
          "여름에는 북쪽 육지에서 뜨겁고 건조한 바람이 불어온다.",
          "겨울에는 남쪽 바다에서 따뜻하고 습한 바람이 불어온다.",
          "여름에는 동쪽 바다에서 차갑고 습한 바람이 불어온다."
        ],
        ans: 0,
        exp: "겨울에는 북서쪽(육지)에서 차갑고 건조한 바람이 불고, 여름에는 남쪽(바다)에서 뜨겁고 습한 바람이 불어옵니다."
      },
      {
        q: "우리나라 여름철 기후 특징으로 <u>옳지 않은</u> 것은 무엇인가요?",
        options: [
          "대체로 차갑고 건조한 바람이 분다.",
          "기온이 올라 덥다.",
          "비가 자주 온다.",
          "남쪽 바다에서 뜨겁고 습한 바람이 불어온다."
        ],
        ans: 0,
        exp: "차갑고 건조한 바람은 겨울철 기후 특징입니다."
      },
      {
        q: "우리나라의 기온 특징에 대한 설명으로 올바른 것은 무엇인가요?",
        options: [
          "남쪽으로 갈수록 기온이 높아진다.",
          "북쪽으로 갈수록 기온이 높아진다.",
          "바다나 산 등의 영향에 상관없이 모든 지역의 기온이 같다.",
          "겨울에는 전국 어디나 평균 기온이 동일하다."
        ],
        ans: 0,
        exp: "우리나라는 남쪽으로 갈수록 기온이 높아지고, 북쪽으로 갈수록 기온이 낮아집니다."
      },
      {
        q: "우리나라 계절별 강수량 특징에 대한 설명으로 <u>옳지 않은</u> 것은 무엇인가요?",
        options: [
          "겨울에 연 강수량의 절반 이상이 내린다.",
          "여름에는 연 강수량의 절반 이상이 내린다.",
          "겨울에는 대체로 강수량이 적다.",
          "북쪽에서 남쪽으로 갈수록 강수량이 많아진다."
        ],
        ans: 0,
        exp: "연 강수량의 절반 이상이 내릴 만큼 비가 집중되는 계절은 여름입니다."
      },
      {
        q: "강수량에 차이를 만드는 영향 요소로 언급된 두 가지는 무엇인가요?",
        options: [
          "바람의 방향과 지형",
          "건물 높이와 인구",
          "도로 길이와 교통량",
          "지하수 깊이와 갯벌"
        ],
        ans: 0,
        exp: "바람의 방향과 지형의 영향으로 지역별로 강수량에 차이가 납니다."
      },
      {
        q: "우리나라 봄철 기후 특징으로 올바른 것은 무엇인가요?",
        options: [
          "대체로 온화하고 건조하지만 날씨의 변화가 심하다.",
          "매일 단풍놀이를 즐기며 곡식을 거둔다.",
          "춥고 건조하여 눈이 내린다.",
          "덥고 비가 자주 내려 피서를 간다."
        ],
        ans: 0,
        exp: "봄은 대체로 온화하고 건조하지만 날씨 변화가 심하며 농사를 시작합니다."
      },
      {
        q: "우리나라 가을철 기후 특징으로 <u>옳지 않은</u> 것은 무엇인가요?",
        options: [
          "비가 자주 오고 더위를 피해 바다나 숲을 찾는다.",
          "맑고 건조한 날씨가 나타난다.",
          "단풍놀이를 즐긴다.",
          "잘 익은 곡식을 거둔다."
        ],
        ans: 0,
        exp: "비가 자주 오고 더위를 피해 피서를 가는 것은 여름철 기후 특징입니다."
      },
      {
        q: "우리나라 겨울철 기후 및 생활 특징으로 올바른 것은 무엇인가요?",
        options: [
          "춥고 건조하며, 눈이 내리기도 한다.",
          "온화하며 농사를 시작한다.",
          "비가 자주 내리고 더위가 심하다.",
          "단풍놀이를 즐기며 곡식을 거둔다."
        ],
        ans: 0,
        exp: "겨울은 춥고 건조하며 눈이 내리기도 하여 따뜻한 옷을 입고 겨울 스포츠를 즐깁니다."

    // ----------------------------------------------------
    // 게임 상태 변수
    // ----------------------------------------------------
    let userName = "";
    let quizQueue = [];
    let currentIdx = 0;
    let startTime = null;

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const wrongScreen = document.getElementById("wrong-screen");
    const successScreen = document.getElementById("success-screen");

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startQuiz() {
      const nameInput = document.getElementById("userName").value.trim();
      if (!nameInput) {
        alert("이름을 입력해 주세요!");
        return;
      }
      userName = nameInput;

      // 1-7번: 객관식 31개 중 7개 무작위 추출 및 보기 셔플
      // 8-10번: 단답식 9개 중 3개 무작위 추출
      const selectedMCQs = shuffle(mcqBank).slice(0, 7);
      const selectedSAs = shuffle(saBank).slice(0, 3);

      const formattedMCQs = selectedMCQs.map(item => {
        const correctText = item.options[item.ans];
        const shuffledOptions = shuffle(item.options);
        const newAnsIdx = shuffledOptions.indexOf(correctText);
        return {
          type: "MCQ",
          q: item.q,
          options: shuffledOptions,
          ans: newAnsIdx,
          exp: item.exp
        };
      });

      const formattedSAs = selectedSAs.map(item => ({
        type: "SA",
        q: item.q,
        ans: item.ans,
        exp: item.exp
      }));

      quizQueue = [...formattedMCQs, ...formattedSAs];
      currentIdx = 0;
      startTime = Date.now();

      startScreen.style.display = "none";
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "block";

      renderQuestion();
    }

    function renderQuestion() {
      const qData = quizQueue[currentIdx];
      
      const progressPercent = ((currentIdx + 1) / 10) * 100;
      document.getElementById("progress-bar").style.width = progressPercent + "%";
      document.getElementById("question-number").textContent = `문제 ${currentIdx + 1} / 10`;

      const badge = document.getElementById("question-type-badge");
      const optionsBox = document.getElementById("options-container");
      const saBox = document.getElementById("sa-container");

      document.getElementById("question-text").innerHTML = `${currentIdx + 1}. ${qData.q}`;

      if (qData.type === "MCQ") {
        badge.textContent = "객관식";
        badge.className = "badge badge-mcq";
        optionsBox.style.display = "flex";
        saBox.style.display = "none";

        optionsBox.innerHTML = "";
        qData.options.forEach((optText, idx) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = `${idx + 1}. ${optText}`;
          btn.onclick = () => checkMCQAnswer(idx);
          optionsBox.appendChild(btn);
        });
      } else {
        badge.textContent = "단답식";
        badge.className = "badge badge-sa";
        optionsBox.style.display = "none";
        saBox.style.display = "flex";

        const saInput = document.getElementById("sa-input");
        saInput.value = "";
        setTimeout(() => saInput.focus(), 100);
      }
    }

    function checkMCQAnswer(selectedIdx) {
      const qData = quizQueue[currentIdx];
      if (selectedIdx === qData.ans) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function submitSAAnswer() {
      const qData = quizQueue[currentIdx];
      const userInput = document.getElementById("sa-input").value.trim().replace(/\s+/g, "");
      const targetAns = qData.ans.replace(/\s+/g, "");

      if (!userInput) {
        alert("정답을 입력해주세요.");
        return;
      }

      if (userInput === targetAns) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < 10) {
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function showWrongScreen(explanationText) {
      quizScreen.style.display = "none";
      wrongScreen.style.display = "block";
      document.getElementById("explanation-text").textContent = explanationText;
    }

    function returnToStart() {
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "none";
      startScreen.style.display = "block";
    }

    function finishQuiz() {
      const endTime = Date.now();
      const elapsedSeconds = Math.round((endTime - startTime) / 1000);

      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      const dateStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

      document.getElementById("result-name").textContent = userName;
      document.getElementById("result-time").textContent = `${elapsedSeconds}초`;
      document.getElementById("result-date").textContent = dateStr;

      quizScreen.style.display = "none";
      successScreen.style.display = "block";
    }
