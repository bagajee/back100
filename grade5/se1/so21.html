<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>초등 사회 5-2 스피드 퀴즈 - 조선</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      padding: 32px 24px;
      text-align: center;
      position: relative;
    }

    .top-nav {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 16px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background-color: #f1f5f9;
      color: #475569;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      background-color: #e2e8f0;
      color: #0f172a;
    }

    h1 {
      font-size: 22px;
      color: #1e293b;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    .badge {
      display: inline-block;
      background-color: #e0f2fe;
      color: #0369a1;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: all 0.2s ease;
      background-color: #fff;
    }

    input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .btn-primary:hover {
      background-color: #0369a1;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    .hidden {
      display: none !important;
    }

    #countdown-screen h2 {
      font-size: 84px;
      color: #0284c7;
      margin: 30px 0;
      font-weight: 800;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 16px;
      font-weight: 600;
    }

    .question-box {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      margin: 20px 0 24px 0;
      word-break: keep-all;
      line-height: 1.6;
      text-align: left;
      background-color: #f8fafc;
      padding: 20px;
      border-radius: 14px;
      border-left: 5px solid #0284c7;
      min-height: 110px;
      display: flex;
      align-items: center;
    }

    .explanation-box {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 20px;
      margin: 20px 0;
      text-align: left;
      font-size: 15px;
    }

    .explanation-box p {
      margin-bottom: 8px;
    }

    .explanation-box p:last-child {
      margin-bottom: 0;
    }

    .result-card {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 20px;
      margin: 24px 0;
      text-align: left;
    }

    .result-card p {
      font-size: 15px;
      color: #334155;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }

    .result-card p:last-child {
      margin-bottom: 0;
    }

    .result-card strong {
      color: #0f172a;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 1. 시작 화면 -->
    <div id="start-screen">
      <div class="top-nav">
        <a href="social.html" class="nav-btn">📚 단원선택</a>
      </div>
      <div class="badge">[초등 사회 5-2]</div>
      <h1>조선 전기 핵심 개념<br>스피드 퀴즈</h1>
      <div class="form-group">
        <label for="user-name">도전자 이름</label>
        <input type="text" id="user-name" placeholder="이름을 입력하세요" autocomplete="off">
      </div>
      <button class="btn-primary" onclick="prepareQuiz()">시작하기</button>
    </div>

    <!-- 2. 카운트다운 화면 (단원선택 버튼 제외) -->
    <div id="countdown-screen" class="hidden">
      <p style="font-size: 18px; color: #64748b; font-weight: 600; margin-top: 20px;">준비하세요!</p>
      <h2 id="countdown-number">3</h2>
    </div>

    <!-- 3. 퀴즈 실행 화면 -->
    <div id="quiz-screen" class="hidden">
      <div class="quiz-header">
        <a href="social.html" class="nav-btn">📚 단원선택</a>
        <span id="progress-display">1 / 10</span>
      </div>
      <div class="question-box" id="question-text"></div>
      <div class="form-group">
        <input type="text" id="user-answer" placeholder="정답을 입력하세요" autocomplete="off">
      </div>
      <button class="btn-primary" onclick="submitAnswer()">정답 제출</button>
    </div>

    <!-- 4. 해설 화면 (오답 발생 시) -->
    <div id="explanation-screen" class="hidden">
      <div class="top-nav">
        <a href="social.html" class="nav-btn">📚 단원선택</a>
      </div>
      <h2 style="color: #e11d48; margin-bottom: 12px; font-size: 20px;">❌ 틀렸습니다!</h2>
      <div class="explanation-box">
        <p><strong>내가 입력한 답:</strong> <span id="exp-user-ans" style="color: #e11d48;"></span></p>
        <p><strong>정답:</strong> <span id="exp-correct-ans" style="color: #16a34a; font-weight: bold;"></span></p>
        <hr style="margin: 12px 0; border: none; border-top: 1px dashed #cbd5e1;">
        <p><strong>💡 [간단 해설]</strong></p>
        <p id="exp-text" style="margin-top: 6px; line-height: 1.5; color: #475569;"></p>
      </div>
      <button class="btn-primary" onclick="resetQuiz()">계속</button>
    </div>

    <!-- 5. 성공 결과 화면 -->
    <div id="result-screen" class="hidden">
      <div class="top-nav">
        <a href="social.html" class="nav-btn">📚 단원선택</a>
      </div>
      <h1 style="color: #16a34a; margin-bottom: 8px;">🎉 미션 성공! 🎉</h1>
      <p style="color: #64748b; font-size: 15px;">10문제를 모두 올바르게 맞추셨습니다!</p>
      
      <div class="result-card">
        <p><strong>도전자:</strong> <span id="res-name"></span></p>
        <p><strong>완료한 시각:</strong> <span id="res-date"></span></p>
        <p><strong>걸린 시간:</strong> <span id="res-time"></span>초</p>
      </div>

      <div class="btn-group">
        <button class="btn-primary" onclick="resetQuiz()">🔄 다시 도전하기</button>
      </div>
    </div>
  </div>

  <script>
    const quizData = [

            "answer": [

            ],
            "explanation": "고려 말 외적 침입과 지배층 횡포, 불교 부패를 해결하고자 이성계와 신진 사대부가 조선을 건국했습니다."

      },
      {
            "question": "조선 시대 한양에 설치된 최고 유교 교육 기관은 어디인가요?",

      },
      {

            "answer": [

      },

      },
      {

            ],

            "answer": [

            ],
            "explanation": "천민은 대다수가 노비로 개인이나 관청에 속해 허드렛일을 담당했습니다."
      },
      {
            "question": "조선 전기에는 아들과 딸이 균등하게 물려받았던 것은 무엇인가요?",
            "answer": [

            ],

      },
      {
            "question": "조선 후기 여성에게 강요된 규범으로 아버지, 남편, 아들의 뜻을 따라야 한다는 가르침은 무엇인가요?",

      },
      {
            "question": "세종 대에 조선의 환경에 맞는 농사법을 정리하여 펴낸 책은 무엇인가요?",

      },
      {

      },
      {
            "question": "세종 대에 제작된 물시계의 이름은 무엇인가요?",

                  "이순신"
            ],
            "explanation": "이순신 장군은 학익진 등 뛰어난 전술로 바다에서 왜군을 크게 무찔렀습니다."
      },
      {
            "question": "여진족이 청으로 나라 이름을 바꾼 뒤 조선에 요구한 관계는 무엇인가요?",
            "answer": [
                  "군신 관계",
                  "군신관계",
                  "임금과 신하의 관계",
                  "임금과 신하의 관계 (군신 관계)",
                  "임금과신하의관계"
            ],
            "explanation": "여진족이 세운 청나라는 힘이 강해진 후 조선에 군신 관계를 요구했습니다."
      },
      {
            "question": "병자호란 당시 인조가 피신하여 청군에 저항했던 성은 어디인가요?",
            "answer": [
                  "남한산성"
            ],
            "explanation": "인조는 청나라의 갑작스러운 침략을 피해 남한산성으로 들어가 항전했습니다."
      },
      {
            "question": "병자호란의 결과 조선은 명나라 대신 어느 나라의 영향을 받게 되었나요?",
            "answer": [
                  "청"
            ],
            "explanation": "병자호란에서 항복한 이후 조선은 명나라 대신 청나라의 영향권 아래 놓이게 되었습니다."
      }
    ];

    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let userName = "";
    let startTime = 0;
    let countdownTimer = null;

    window.onload = function() {
      document.getElementById('user-answer').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') submitAnswer();
      });
      
      document.getElementById('user-name').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') prepareQuiz();
      });
    };

    function prepareQuiz() {
      userName = document.getElementById('user-name').value.trim();

      if (!userName) {
        alert("이름을 입력해주세요.");
        return;
      }

      if (!quizData || quizData.length < 10) {
        alert("문제가 부족합니다. (최소 10문제 필요)");
        return;
      }

      // 시작 위치 및 간격을 지정하여 10문제 추출
      const startIndex = Math.floor(Math.random() * quizData.length);
      const step = Math.floor(Math.random() * 6) + 5;

      currentQuestions = [];
      for (let i = 0; i < 10; i++) {
        const idx = (startIndex + i * step) % quizData.length;
        currentQuestions.push(quizData[idx]);
      }

      currentQuestionIndex = 0;

      showScreen('countdown-screen');
      startCountdown();
    }

    function startCountdown() {
      let count = 3;
      const countEl = document.getElementById('countdown-number');
      countEl.textContent = count;

      if (countdownTimer) clearInterval(countdownTimer);

      countdownTimer = setInterval(() => {
        count--;
        if (count > 0) {
          countEl.textContent = count;
        } else {
          clearInterval(countdownTimer);
          startQuiz();
        }
      }, 1000);
    }

    function startQuiz() {
      showScreen('quiz-screen');
      startTime = new Date().getTime();
      loadQuestion();
    }

    function loadQuestion() {
      const q = currentQuestions[currentQuestionIndex];
      document.getElementById('progress-display').textContent = `${currentQuestionIndex + 1} / 10`;
      document.getElementById('question-text').textContent = q.question;
      
      const inputEl = document.getElementById('user-answer');
      inputEl.value = "";
      inputEl.focus();
    }

    function normalize(str) {
      return str.toString().replace(/\s+/g, '').toLowerCase();
    }

    function submitAnswer() {
      const inputEl = document.getElementById('user-answer');
      const userAns = normalize(inputEl.value);

      if (!userAns) {
        alert("정답을 입력해주세요.");
        return;
      }

      const q = currentQuestions[currentQuestionIndex];

      let isCorrect = false;
      if (Array.isArray(q.answer)) {
        isCorrect = q.answer.some(ans => normalize(ans) === userAns);
      } else {
        isCorrect = normalize(q.answer) === userAns;
      }

      if (isCorrect) {
        currentQuestionIndex++;
        if (currentQuestionIndex < 10) {
          loadQuestion();
        } else {
          showSuccess();
        }
      } else {
        // 오답 발생 시 해설 화면으로 이동
        const correctStr = Array.isArray(q.answer) ? q.answer.join(" 또는 ") : q.answer;
        document.getElementById('exp-user-ans').textContent = inputEl.value;
        document.getElementById('exp-correct-ans').textContent = correctStr;
        document.getElementById('exp-text').textContent = q.explanation || "해설이 없습니다.";
        
        showScreen('explanation-screen');
      }
    }

    function showSuccess() {
      const endTime = new Date().getTime();
      const timeTaken = ((endTime - startTime) / 1000).toFixed(1);
      const now = new Date();
      
      const timeString = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

      document.getElementById('res-name').textContent = userName;
      document.getElementById('res-date').textContent = timeString;
      document.getElementById('res-time').textContent = timeTaken;

      showScreen('result-screen');
    }

    function resetQuiz() {
      if (countdownTimer) clearInterval(countdownTimer);
      document.getElementById('user-answer').value = "";
      showScreen('start-screen');
    }

    function showScreen(screenId) {
      const screens = ['start-screen', 'countdown-screen', 'quiz-screen', 'explanation-screen', 'result-screen'];
      screens.forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(screenId).classList.remove('hidden');
    }
  </script>
</body>
</html>
