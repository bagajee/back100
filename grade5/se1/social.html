<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5학년 1학기 사회 교실</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .menu-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 480px;
            padding: 30px 24px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .top-nav {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 16px;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background-color: #f1f5f9;
            color: #475569;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background-color: #e2e8f0;
            color: #0f172a;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.6rem;
            color: #1b4332;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 0.9rem;
            color: #888888;
        }

        .unit-group {
            margin-bottom: 24px;
        }

        .unit-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #495057;
            margin-bottom: 12px;
        }

        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sub-btn {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 14px 18px;
            background: linear-gradient(135deg, #2ea055 0%, #27ae60 100%);
            color: #ffffff;
            border: none;
            border-radius: 30px;
            font-size: 0.98rem;
            font-weight: 700;
            cursor: pointer;
            text-align: left;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.25);
        }

        .sub-btn::before {
            content: '';
            display: inline-block;
            width: 14px;
            height: 14px;
            background-color: #a8e6cf;
            border-radius: 50%;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .sub-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(39, 174, 96, 0.35);
        }

        .sub-btn:active {
            transform: translateY(0);
        }

        /* 스크롤바 디자인 */
        .menu-card::-webkit-scrollbar {
            width: 6px;
        }
        .menu-card::-webkit-scrollbar-thumb {
            background-color: #cccccc;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="menu-card">
    <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
    </div>

    <div class="header">
        <h1>🎓 5학년 1학기 사회 교실</h1>
        <p>학습할 세부 단원을 선택하세요!</p>
    </div>

    <!-- 1. 우리나라 국토 -->
    <div class="unit-group">
        <div class="unit-title">1. 우리나라 국토</div>
        <div class="btn-list">
            <button class="sub-btn" onclick="selectChapter('so1.html')">1. 우리나라 국토</button>
        </div>
    </div>

    <!-- 2. 우리나라 지리 -->
    <div class="unit-group">
        <div class="unit-title">2. 우리나라 지리</div>
        <div class="btn-list">
            <button class="sub-btn" onclick="selectChapter('so21.html')">1) 우리나라 기후</button>
            <button class="sub-btn" onclick="selectChapter('so22.html')">2) 우리나라 인구</button>
        </div>
    </div>

    <!-- 3. 법과 인권의 보장 -->
    <div class="unit-group">
        <div class="unit-title">3. 법과 인권의 보장</div>
        <div class="btn-list">
            <button class="sub-btn" onclick="selectChapter('so3.html')">3. 법과 인권의 보장</button>
        </div>
    </div>
</div>

<script>
function selectChapter(targetFile) {
    if (targetFile) {
        location.href = encodeURI(targetFile);
    } else {
        alert("연결된 파일이 없습니다.");
    }
}
</script>

</body>
</html>
