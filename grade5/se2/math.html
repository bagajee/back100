<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>5학년 2학기 수학</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      word-break: keep-all;
    }
    body {
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #eef2f7;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: white;
      padding: 1.8rem 1.5rem;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 480px;
      text-align: center;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }
    .hidden { display: none !important; }
    
    /* 상단 네비게이션 헤더 */
    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .btn-home {
      width: auto !important;
      padding: 6px 12px !important;
      margin: 0 !important;
      background: #eef2f7 !important;
      color: #2c3e50 !important;
      font-size: 0.85rem !important;
      border-radius: 8px !important;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      border: 1px solid #cbd5e1 !important;
      font-weight: bold;
    }
    .btn-home:active { background: #dbe3ed !important; }

    button {
      width: 100%;
      padding: 12px 10px;
      margin: 4px 0;
      border: none;
      border-radius: 10px;
      background: #4a90e2;
      color: white;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      touch-action: manipulation;
    }
    button:active { transform: scale(0.98); }
    button.btn-sub { background: #27ae60; text-align: left; padding-left: 14px; }
    button.btn-total { background: #e67e22; text-align: left; padding-left: 14px; font-weight: 800; }
    button.btn-secondary { background: #95a5a6; margin-top: 10px; }
    button.btn-retry { background: #e74c3c; margin-top: 15px; }
    
    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 1.05rem;
      text-align: center;
      outline: none;
    }
    
    .chapter-title {
      margin: 18px 0 6px 0;
      text-align: left;
      color: #2c3e50;
      font-size: 1.05rem;
      border-bottom: 2px solid #eef2f7;
      padding-bottom: 4px;
    }
    
    .question-box {
      min-height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 15px 0 20px 0;
      gap: 8px;
    }
    .question-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      background: #e8f8f0; 
      color: #27ae60; 
      border: 1px solid #27ae60;
    }
    
    .question-main-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: #2c3e50;
      line-height: 1.5;
    }
    
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .options button {
      margin: 0;
      font-size: 1.1rem;
      padding: 16px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    
    .progress-bar { background: #eee; height: 10px; border-radius: 5px; margin-bottom: 15px; overflow: hidden; }
    .progress-fill { background: #4a90e2; height: 100%; width: 0%; transition: width 0.3s; }
    
    .explanation-card {
      background: #fdf2e9;
      border: 1px solid #f5c6cb;
      border-radius: 12px;
      padding: 15px;
      text-align: left;
      margin: 15px 0;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #721c24;
    }

    .frac {
      display: inline-block;
      vertical-align: middle;
      text-align: center;
      font-size: 0.95em;
      padding: 0 2px;
    }
    .frac > span { display: block; line-height: 1.1; }
    .frac span.bottom { border-top: 1.5px solid white; }
    .question-box .frac span.bottom, .explanation-card .frac span.bottom { border-top-color: #2c3e50; }
  </style>
</head>
<body>

<!-- 1. 메인 홈 화면 -->
<div class="card" id="home-screen">
  <div class="nav-header">
    <button class="btn-home" onclick="location.href='../../index.html'">🏠 홈으로</button>
  </div>
  <h2 style="margin-top:0; color:#2c3e50;">🎓 5학년 2학기 수학</h2>
  <p style="color:#7f8c8d; font-size: 0.88rem; margin-bottom:15px;">학습할 세부 단원을 선택하세요! (총 20문제 완성)</p>
  
  <div class="chapter-title">1. 수의 범위와 어림하기</div>
  <button class="btn-sub" onclick="openSetup('1-1', '1) 이상과 이하, 초과와 미만')">🟢 1) 이상·이하, 초과·미만, 수의 범위</button>
  <button class="btn-sub" onclick="openSetup('1-2', '2) 올림, 버림, 반올림')">🟢 2) 올림, 버림, 반올림</button>
  <button class="btn-total" onclick="openSetup('1-all', '🏆 1단원 종합 테스트')">🏆 [단원정리] 1. 수의 범위와 어림하기</button>

  <div class="chapter-title">2. 분수의 곱셈</div>
  <button class="btn-sub" onclick="openSetup('2-1', '1) (진분수) × (자연수)')">🟢 1) (진분수) × (자연수)</button>
  <button class="btn-sub" onclick="openSetup('2-2', '2) (대분수) × (자연수)')">🟢 2) (대분수) × (자연수)</button>
  <button class="btn-sub" onclick="openSetup('2-3', '3) (자연수) × (진분수)')">🟢 3) (자연수) × (진분수)</button>
  <button class="btn-sub" onclick="openSetup('2-4', '4) (자연수) × (대분수)')">🟢 4) (자연수) × (대분수)</button>
  <button class="btn-sub" onclick="openSetup('2-5', '5) (진분수) × (진분수)')">🟢 5) (진분수) × (진분수)</button>
  <button class="btn-sub" onclick="openSetup('2-6', '6) (대분수) × (대분수)')">🟢 6) (대분수) × (대분수)</button>
  <button class="btn-total" onclick="openSetup('2-all', '🏆 2단원 종합 테스트')">🏆 [단원정리] 2. 분수의 곱셈</button>

  <div class="chapter-title">4. 소수의 곱셈</div>
  <button class="btn-sub" onclick="openSetup('4-1', '1) (소수) × (자연수)')">🟢 1) (소수) × (자연수)</button>
  <button class="btn-sub" onclick="openSetup('4-2', '2) (자연수) × (소수)')">🟢 2) (자연수) × (소수)</button>
  <button class="btn-sub" onclick="openSetup('4-3', '3) (소수) × (소수)')">🟢 3) (소수) × (소수)</button>
  <button class="btn-sub" onclick="openSetup('4-4', '4) 곱의 소수점 위치')">🟢 4) 곱의 소수점 위치</button>
  <button class="btn-total" onclick="openSetup('4-all', '🏆 4단원 종합 테스트')">🏆 [단원정리] 4. 소수의 곱셈</button>
</div>

<!-- 2. 게임 설정/시작 화면 -->
<div class="card hidden" id="setup-screen">
  <div class="nav-header">
    <button class="btn-home" onclick="location.href='../../index.html'">🏠 홈으로</button>
  </div>
  <h3 style="margin-top:0; color:#333;" id="setup-title">수학 퀴즈</h3>
  <p style="color:#777; font-size:0.9rem;">20문제를 맞혀야 성공합니다!</p>
  <input type="text" id="username" placeholder="이름을 입력하세요" autocomplete="off">
  <button onclick="startCountDown()">게임 시작</button>
  <button onclick="goHome()" class="btn-secondary">내용 선택</button>
</div>

<!-- 3. 게임 시작 전 3초 카운트다운 화면 -->
<div class="card hidden" id="countdown-screen">
  <div class="nav-header">
    <button class="btn-home" onclick="location.href='../../index.html'">🏠 홈으로</button>
  </div>
  <p style="font-size:1.1rem; color:#555; margin-top:20px;">잠시 후 퀴즈가 시작됩니다!</p>
  <h1 id="countdown-text" style="font-size: 4.5rem; color:#4a90e2; margin: 20px 0;">3</h1>
</div>

<!-- 4. 퀴즈 진행 화면 -->
<div class="card hidden" id="quiz-screen">
  <div class="nav-header">
    <button class="btn-home" onclick="location.href='../../index.html'">🏠 홈으로</button>
    <div style="font-size: 0.9rem; color: #777; font-weight:bold;">성공: <span id="progress" style="color:#27ae60;">0</span> / 20</div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  
  <div class="question-box">
    <div class="question-badge">[올바른 정답 찾기]</div>
    <div id="question-text" class="question-main-text">문제가 여기에 표시됩니다</div>
  </div>

  <div class="options" id="options-box"></div>

  <!-- 하단 재도전 버튼 (퀴즈 시작 화면으로 이동) -->
  <div style="margin-top: 25px; border-top: 1px solid #eee; padding-top: 12px;">
    <button class="btn-retry" onclick="openSetup(selectedCategory, currentSubTitle)">🔄 재도전 (시작 화면으로)</button>
  </div>
</div>

<!-- 5. 해설 화면 (틀렸을 때) -->
<div class="card hidden" id="explanation-screen">
  <div class="nav-header">
    <button class="btn-home" onclick="location.href='../../index.html'">🏠 홈으로</button>
  </div>
  <h3 style="color:#e74c3c; margin-top:10px;">❌ 틀렸습니다! (카운팅 되지 않음)</h3>
  <div class="explanation-card" id="explanation-content"></div>
  <button onclick="startWrongCountdown()">다음 문제 (3초 후 시작)</button>
</div>

<!-- 6. 오답 후 3초 대기 화면 -->
<div class="card hidden" id="wrong-countdown-screen">
  <div class="nav-header">
    <button class="btn-home" onclick="location.href='../../index.html'">🏠 홈으로</button>
  </div>
  <p style="font-size:1.1rem; color:#555; margin-top:20px;">새로운 문제를 준비하고 있습니다...</p>
  <h1 id="wrong-countdown-text" style="font-size: 4.5rem; color:#e67e22; margin: 20px 0;">3</h1>
</div>

<!-- 7. 성공 결과 화면 -->
<div class="card hidden" id="result-screen">
  <div class="nav-header">
    <button class="btn-home" onclick="location.href='../../index.html'">🏠 홈으로</button>
  </div>
  <h2 style="color:#27ae60; margin-top:10px;">🎉 축하합니다! Success!</h2>
  <div id="result-text" style="margin:20px 0; text-align:center; line-height:1.7;"></div>
  <button onclick="openSetup(selectedCategory, currentSubTitle)">🔄 재도전</button>
</div>

<script>
let userName = "";
let selectedCategory = "";
let currentSubTitle = "";
let solvedCount = 0; // 맞힌 문제 수 (20개 달성 목표)
const totalQuestions = 20;
let startTime, endTime;
let qData = {};

function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

function goHome() {
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById('home-screen').classList.remove('hidden');
}

function openSetup(catKey, subTitle) {
  selectedCategory = catKey;
  currentSubTitle = subTitle;
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById('setup-screen').classList.remove('hidden');
  document.getElementById('setup-title').innerText = subTitle;
}

function startCountDown() {
  userName = document.getElementById("username").value.trim();
  if(!userName) { alert("이름을 입력해주세요!"); return; }
  
  solvedCount = 0;
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById("countdown-screen").classList.remove("hidden");
  
  let count = 3;
  document.getElementById("countdown-text").innerText = count;
  let timer = setInterval(() => {
    count--;
    if(count > 0) {
      document.getElementById("countdown-text").innerText = count;
    } else {
      clearInterval(timer);
      document.getElementById("countdown-screen").classList.add("hidden");
      document.getElementById("quiz-screen").classList.remove("hidden");
      startTime = new Date().getTime();
      loadQuestion();
    }
  }, 1000);
}

// HTML 표시용 분수 UI 태그 생성
function renderFracHTML(m, n, d) {
  let fracPart = `<div class="frac"><span>${n}</span><span class="bottom">${d}</span></div>`;
  if (m > 0) return `<span>${m}</span>` + fracPart;
  return fracPart;
}

// 분수 객체 -> HTML 구조 분수 표기로 변환 (약분 및 대분수 변환)
function formatFracObj(num, denom) {
  let g = gcd(num, denom);
  num /= g; denom /= g;
  if (denom === 1) return `${num}`;
  if (num > denom) {
    let m = Math.floor(num / denom);
    let r = num % denom;
    return renderFracHTML(m, r, denom);
  }
  return renderFracHTML(0, num, denom);
}

// 무작위 소수 생성 함수
function getRandomDecimal(digits) {
  if (digits === 1) {
    return (Math.floor(Math.random() * 89 + 11) / 10).toFixed(1);
  } else {
    return (Math.floor(Math.random() * 899 + 101) / 100).toFixed(2);
  }
}

// 개별 문제 및 해설 생성 로직
function generateSingleQuestion(cat) {
  let q = "", answer = "", options = [], exp = "";
  
  if (cat === '1-1') {
    let min = Math.floor(Math.random() * 20) + 10;
    let max = min + Math.floor(Math.random() * 10) + 5;
    let t1 = Math.random() < 0.5 ? "이상" : "초과";
    let t2 = Math.random() < 0.5 ? "이하" : "미만";
    q = `<b>${min} ${t1}</b>, <b>${max} ${t2}</b>인 수에 해당하는 값은?`;
    
    let isInside = (n) => (t1 === "이상" ? n >= min : n > min) && (t2 === "이하" ? n <= max : n < max);
    let valid = [];
    for (let i = min - 2; i <= max + 2; i++) if (isInside(i)) valid.push(i);
    let ans = valid[Math.floor(Math.random() * valid.length)];
    answer = ans.toString();
    options = [answer];
    while (options.length < 4) {
      let w = Math.floor(Math.random() * (max + 6 - (min - 6))) + (min - 6);
      if (!isInside(w) && !options.includes(w.toString()) && w > 0) options.push(w.toString());
    }
    exp = `<b>이상/이하</b>는 해당 수를 포함하고, <b>초과/미만</b>은 포함하지 않습니다.<br>조건 범위 <b>(${min} ${t1}, ${max} ${t2})</b>에 만족하는 정답은 <b>${answer}</b>입니다.`;
  } 
  else if (cat === '1-2') {
    let mList = ["올림", "버림", "반올림"];
    let m = mList[Math.floor(Math.random() * 3)];
    let isDecimal = Math.random() < 0.2;

    if (isDecimal) {
      let uList = [
        { name: "소수 첫째 자리", factor: 10 },
        { name: "소수 둘째 자리", factor: 100 }
      ];
      let u = uList[Math.floor(Math.random() * 2)];
      let rawInt = Math.floor(Math.random() * 8999) + 1001;
      let target = rawInt / 1000;
      
      let ansVal = 0;
      if (u.factor === 10) {
        if (m === "올림") ansVal = Math.ceil(target * 10) / 10;
        else if (m === "버림") ansVal = Math.floor(target * 10) / 10;
        else if (m === "반올림") ansVal = Math.round(target * 10) / 10;
      } else {
        if (m === "올림") ansVal = Math.ceil(target * 100) / 100;
        else if (m === "버림") ansVal = Math.floor(target * 100) / 100;
        else if (m === "반올림") ansVal = Math.round(target * 100) / 100;
      }

      q = `<b>${target}</b>을(를) <b>${m}</b>하여<br><b>${u.name}까지</b> 나타낸 값은?`;
      let decDigits = u.factor === 10 ? 1 : 2;
      answer = ansVal.toFixed(decDigits);
      options = [answer];

      let step = u.factor === 10 ? 0.1 : 0.01;
      let wCandidates = [
        (ansVal + step).toFixed(decDigits),
        (ansVal - step).toFixed(decDigits),
        (target).toString()
      ];

      for (let w of wCandidates) {
        if (parseFloat(w) > 0 && !options.includes(w)) options.push(w);
      }
      while (options.length < 4) {
        let dummy = (ansVal + (Math.floor(Math.random() * 5) - 2) * step).toFixed(decDigits);
        if (parseFloat(dummy) > 0 && !options.includes(dummy)) options.push(dummy);
      }
      exp = `<b>${target}</b>을(를) <b>${m}</b>하여 <b>${u.name}까지</b> 정확히 나타내면 정답은 <b>${answer}</b>입니다.`;
    } else {
      let uList = [{n: "십의 자리", d: 10}, {n: "백의 자리", d: 100}];
      let u = uList[Math.floor(Math.random() * 2)];
      let base = (Math.floor(Math.random() * 70) + 10) * u.d;
      let target = base + Math.floor(Math.random() * (u.d - 1)) + 1;
      
      let rem = target % u.d;
      let ansVal = target;
      if (m === "올림") ansVal = rem === 0 ? target : target - rem + u.d;
      else if (m === "버림") ansVal = target - rem;
      else if (m === "반올림") ansVal = rem >= (u.d/2) ? target - rem + u.d : target - rem;
      
      q = `<b>${target}</b>을(를) <b>${m}</b>하여<br><b>${u.n}까지</b> 나타낸 값은?`;
      answer = ansVal.toString();
      options = [answer];
      
      let wCandidates = [ansVal + u.d, ansVal - u.d, target];
      for (let w of wCandidates) if (w > 0 && !options.includes(w.toString())) options.push(w.toString());
      while (options.length < 4) {
        let r = ansVal + (Math.floor(Math.random()*5)-2)*u.d;
        if (r > 0 && !options.includes(r.toString())) options.push(r.toString());
      }
      exp = `<b>${target}</b>을(를) <b>${m}</b> 규칙에 맞춰 <b>${u.n}까지</b> 계산하면 정답은 <b>${answer}</b>입니다.`;
    }
  }
  else if (cat.startsWith('2-')) {
    let n1, d1, m1=0, n2, d2, m2=0;
    
    if (cat === '2-1') {
      d1 = Math.floor(Math.random()*8)+3; n1 = Math.floor(Math.random()*(d1-1))+1;
      let k = Math.floor(Math.random()*6)+2;
      q = `<div style="display:flex;align-items:center;justify-content:center;gap:4px;">${renderFracHTML(0,n1,d1)} <span>× ${k} = ?</span></div>`;
      answer = formatFracObj(n1*k, d1);
    } else if (cat === '2-2') {
      d1 = Math.floor(Math.random()*5)+3; n1 = Math.floor(Math.random()*(d1-1))+1; m1 = Math.floor(Math.random()*2)+1;
      let k = Math.floor(Math.random()*5)+2;
      q = `<div style="display:flex;align-items:center;justify-content:center;gap:4px;">${renderFracHTML(m1,n1,d1)} <span>× ${k} = ?</span></div>`;
      answer = formatFracObj((m1*d1+n1)*k, d1);
    } else if (cat === '2-3') {
      d2 = Math.floor(Math.random()*8)+3; n2 = Math.floor(Math.random()*(d2-1))+1;
      let k = Math.floor(Math.random()*6)+2;
      q = `<div style="display:flex;align-items:center;justify-content:center;gap:4px;"><span>${k} × </span> ${renderFracHTML(0,n2,d2)} <span>= ?</span></div>`;
      answer = formatFracObj(k*n2, d2);
    } else if (cat === '2-4') {
      d2 = Math.floor(Math.random()*5)+3; n2 = Math.floor(Math.random()*(d2-1))+1; m2 = Math.floor(Math.random()*2)+1;
      let k = Math.floor(Math.random()*5)+2;
      q = `<div style="display:flex;align-items:center;justify-content:center;gap:4px;"><span>${k} × </span> ${renderFracHTML(m2,n2,d2)} <span>= ?</span></div>`;
      answer = formatFracObj(k*(m2*d2+n2), d2);
    } else if (cat === '2-5') {
      d1 = Math.floor(Math.random()*6)+3; n1 = Math.floor(Math.random()*(d1-1))+1;
      d2 = Math.floor(Math.random()*6)+3; n2 = Math.floor(Math.random()*(d2-1))+1;
      q = `<div style="display:flex;align-items:center;justify-content:center;gap:4px;">${renderFracHTML(0,n1,d1)} <span>×</span> ${renderFracHTML(0,n2,d2)} <span>= ?</span></div>`;
      answer = formatFracObj(n1*n2, d1*d2);
    } else if (cat === '2-6') {
      d1 = Math.floor(Math.random()*4)+2; n1 = Math.floor(Math.random()*(d1-1))+1; m1 = Math.floor(Math.random()*2)+1;
      d2 = Math.floor(Math.random()*4)+2; n2 = Math.floor(Math.random()*(d2-1))+1; m2 = Math.floor(Math.random()*2)+1;
      q = `<div style="display:flex;align-items:center;justify-content:center;gap:4px;">${renderFracHTML(m1,n1,d1)} <span>×</span> ${renderFracHTML(m2,n2,d2)} <span>= ?</span></div>`;
      answer = formatFracObj((m1*d1+n1)*(m2*d2+n2), d1*d2);
    }
    
    options = [answer];
    let dummyCount = 1;
    while(options.length < 4) {
      let dummy = formatFracObj((n1||1)*(n2||1) + dummyCount*2, (d1||3)*(d2||1));
      if (!options.includes(dummy)) options.push(dummy);
      dummyCount++;
    }
    exp = `분수의 곱셈은 (분자×분자), (분모×분모)를 계산한 후, 기약분수 또는 대분수로 나타냅니다.<br>올바른 계산 결과는 <b>${answer}</b>입니다.`;
  }
  else if (cat.startsWith('4-')) {
    if (cat === '4-1') {
      let digits = Math.random() < 0.5 ? 1 : 2;
      let dec = getRandomDecimal(digits);
      let k = Math.floor(Math.random()*8)+2;
      q = `<b>${dec} × ${k}</b> 계산 결과는?`;
      let rawVal = (parseFloat(dec) * k).toFixed(digits);
      answer = Number(rawVal).toString();
    } else if (cat === '4-2') {
      let digits = Math.random() < 0.5 ? 1 : 2;
      let dec = getRandomDecimal(digits);
      let k = Math.floor(Math.random()*8)+2;
      q = `<b>${k} × ${dec}</b> 계산 결과는?`;
      let rawVal = (k * parseFloat(dec)).toFixed(digits);
      answer = Number(rawVal).toString();
    } else if (cat === '4-3') {
      let d1Digits = Math.random() < 0.5 ? 1 : 2;
      let d2Digits = Math.random() < 0.5 ? 1 : 2;
      let d1 = getRandomDecimal(d1Digits);
      let d2 = getRandomDecimal(d2Digits);
      q = `<b>${d1} × ${d2}</b> 계산 결과는?`;
      let totalDigits = d1Digits + d2Digits;
      let rawVal = (parseFloat(d1) * parseFloat(d2)).toFixed(totalDigits);
      answer = Number(rawVal).toString();
    } else if (cat === '4-4') {
      let baseA = Math.floor(Math.random()*35)+12;
      let baseB = Math.floor(Math.random()*25)+3;
      let baseProd = baseA * baseB;
      let shift1 = Math.floor(Math.random()*2)+1;
      let shift2 = Math.floor(Math.random()*2)+1;
      
      let dec1 = (baseA / Math.pow(10, shift1)).toFixed(shift1);
      let dec2 = (baseB / Math.pow(10, shift2)).toFixed(shift2);
      let totalShift = shift1 + shift2;
      
      q = `<b>${baseA} × ${baseB} = ${baseProd}</b>일 때,<br><b>${dec1} × ${dec2}</b>의 값은?`;
      answer = Number((baseProd / Math.pow(10, totalShift)).toFixed(totalShift)).toString();
    }
    
    options = [answer];
    let numAns = parseFloat(answer);
    let offsetStep = numAns < 1 ? 0.05 : (numAns < 10 ? 0.2 : 1.5);
    
    while(options.length < 4) {
      let multiplier = (options.length % 2 === 1) ? options.length : -options.length;
      let wVal = numAns + (multiplier * offsetStep);
      let w = Number(wVal.toFixed(4)).toString();
      if (parseFloat(w) > 0 && !options.includes(w)) {
        options.push(w);
      } else {
        let alt = Number((numAns + (options.length * 0.11)).toFixed(4)).toString();
        if (!options.includes(alt)) options.push(alt);
      }
    }
    exp = `소수의 곱셈은 자연수 곱셈을 한 뒤, 곱하는 두 소수의 소수점 아래 자릿수의 합만큼 소수점을 옮겨 찍습니다.<br>정답은 <b>${answer}</b>입니다.`;
  }

  options.sort(() => Math.random() - 0.5);
  return { q, answer, opts: options, exp };
}

// 메인 문제 생성기
function generateQuestion(cat) {
  if (cat === '1-all') {
    let subCats = ['1-1', '1-2'];
    let picked = subCats[Math.floor(Math.random() * subCats.length)];
    return generateSingleQuestion(picked);
  } else if (cat === '2-all') {
    let subCats = ['2-1', '2-2', '2-3', '2-4', '2-5', '2-6'];
    let picked = subCats[Math.floor(Math.random() * subCats.length)];
    return generateSingleQuestion(picked);
  } else if (cat === '4-all') {
    let subCats = ['4-1', '4-2', '4-3', '4-4'];
    let picked = subCats[Math.floor(Math.random() * subCats.length)];
    return generateSingleQuestion(picked);
  } else {
    return generateSingleQuestion(cat);
  }
}

function loadQuestion() {
  document.getElementById("progress").innerText = solvedCount;
  document.getElementById("progress-fill").style.width = (solvedCount / totalQuestions * 100) + "%";
  
  qData = generateQuestion(selectedCategory);
  document.getElementById("question-text").innerHTML = qData.q;
  
  let optsBox = document.getElementById("options-box");
  optsBox.innerHTML = "";
  qData.opts.forEach(val => {
    let btn = document.createElement("button");
    btn.innerHTML = val;
    btn.onclick = () => checkAnswer(val);
    optsBox.appendChild(btn);
  });
}

function checkAnswer(selected) {
  if (selected === qData.answer) {
    solvedCount++;
    if (solvedCount >= totalQuestions) {
      showSuccessScreen();
    } else {
      loadQuestion();
    }
  } else {
    // 틀렸을 경우 카운팅 되지 않고 해설창 표시
    document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
    document.getElementById("explanation-content").innerHTML = `<b>💡 정답: ${qData.answer}</b><br><br>${qData.exp}`;
    document.getElementById("explanation-screen").classList.remove("hidden");
  }
}

function startWrongCountdown() {
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById("wrong-countdown-screen").classList.remove("hidden");
  
  let count = 3;
  document.getElementById("wrong-countdown-text").innerText = count;
  let timer = setInterval(() => {
    count--;
    if(count > 0) {
      document.getElementById("wrong-countdown-text").innerText = count;
    } else {
      clearInterval(timer);
      document.getElementById("wrong-countdown-screen").classList.add("hidden");
      document.getElementById("quiz-screen").classList.remove("hidden");
      loadQuestion();
    }
  }, 1000);
}

function showSuccessScreen() {
  endTime = new Date().getTime();
  let totalTime = ((endTime - startTime) / 1000).toFixed(1);
  let now = new Date().toLocaleString('ko-KR');
  
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById("result-screen").classList.remove("hidden");
  
  document.getElementById("result-text").innerHTML = `
    <div style="font-size:1.1rem; margin-bottom:10px;"><b>[ ${currentSubTitle} ]</b></div>
    <div style="font-size:1.2rem; color:#2c3e50;">학생 이름: <b>${userName}</b></div>
    <div style="font-size:2rem; color:#27ae60; font-weight:bold; margin:15px 0;">걸린 시간: ${totalTime}초</div>
    <div style="font-size:0.85rem; color:#7f8c8d;">완료한 시각: ${now}</div>
    <p style="margin-top:15px; color:#555;">20문제를 뛰어난 실력으로 모두 완주했습니다!</p>
  `;
}
