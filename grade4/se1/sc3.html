<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>4학년 1학기 과학 - 3. 땅의 변화</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #f0fdf4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
      color: #166534;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
      position: relative;
    }
    .top-nav {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #f1f5f9;
      color: #334155;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
      border: 1px solid #cbd5e1;
    }
    .nav-btn:active {
      background-color: #e2e8f0;
    }
    h1 {
      font-size: 22px;
      color: #15803d;
      margin-bottom: 8px;
    }
    .sub-title {
      font-size: 14px;
      color: #475569;
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #334155;
      font-size: 15px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #15803d;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      box-sizing: border-box;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background-color: #15803d;
      color: #ffffff;
    }
    .btn-secondary {
      background-color: #64748b;
      color: #ffffff;
    }

    /* 퀴즈 진행 화면 */
    #quiz-screen {
      display: none;
      text-align: left;
    }
    .progress-bar-container {
      width: 100%;
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #15803d;
      transition: width 0.3s ease;
    }
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 14px;
      font-weight: bold;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    .badge-mcq { background: #dcfce7; color: #15803d; }
    .badge-sa { background: #fef3c7; color: #92400e; }

    .question-box {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
      color: #0f172a;
      margin-bottom: 20px;
      min-height: 60px;
    }
    .question-box u {
      color: #dc2626;
      text-decoration-thickness: 2px;
    }
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      width: 100%;
      padding: 14px 16px;
      background-color: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      color: #334155;
      cursor: pointer;
      line-height: 1.4;
      transition: all 0.2s;
    }
    .option-btn:active {
      background-color: #dcfce7;
      border-color: #15803d;
      color: #14532d;
    }

    .sa-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 오답 화면 */
    #wrong-screen {
      display: none;
      background-color: #fef2f2;
      border: 2px solid #fca5a5;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .wrong-title {
      color: #dc2626;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .explanation-box {
      background: #ffffff;
      padding: 15px;
      border-radius: 10px;
      border-left: 4px solid #dc2626;
      text-align: left;
      font-size: 14px;
      color: #334155;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    /* 성공 화면 */
    #success-screen {
      display: none;
    }
    .trophy {
      font-size: 60px;
      margin-bottom: 10px;
    }
    .success-title {
      font-size: 22px;
      color: #15803d;
      font-weight: bold;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .result-info {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      margin-bottom: 20px;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .result-item:last-child {
      margin-bottom: 0;
    }
    .result-label {
      color: #475569;
      font-weight: bold;
    }
    .result-value {
      color: #15803d;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- 1. 시작 화면 -->
    <div id="start-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>
      <h1>4학년 과학 퀴즈</h1>
      <p class="sub-title">3. 땅의 변화</p>

      <div class="input-group">
        <label for="userName">이름을 입력하세요</label>
        <input type="text" id="userName" placeholder="예: 홍길동" autocomplete="off">
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="startQuiz()">시작</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

    <!-- 2. 퀴즈 진행 화면 -->
    <div id="quiz-screen">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      
      <div class="quiz-header">
        <span id="question-number">문제 1 / 10</span>
        <span id="question-type-badge" class="badge badge-mcq">객관식</span>
      </div>

      <div class="question-box" id="question-text"></div>

      <!-- 객관식 영역 -->
      <div class="options-container" id="options-container"></div>

      <!-- 단답식 영역 -->
      <div class="sa-container" id="sa-container" style="display: none;">
        <input type="text" id="sa-input" placeholder="정답 입력" onkeydown="if(event.key==='Enter') submitSAAnswer()">
        <button class="btn btn-primary" onclick="submitSAAnswer()">정답 제출</button>
      </div>
    </div>

    <!-- 3. 오답 화면 -->
    <div id="wrong-screen">
      <div class="wrong-title">❌ 틀렸습니다!</div>
      <div class="explanation-box">
        <strong>💡 간단 해설:</strong>
        <p id="explanation-text" style="margin-top: 6px;"></p>
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="returnToStart()">계속</button>
    </div>

    <!-- 4. 성공 축하 화면 -->
    <div id="success-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>

      <div class="trophy">🏆</div>
      <div class="success-title">축하합니다!<br>10문제를 모두 맞추셨습니다!</div>
      
      <div class="result-info">
        <div class="result-item">
          <span class="result-label">이름</span>
          <span class="result-value" id="result-name">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">총 걸린시간</span>
          <span class="result-value" id="result-time">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">현재 시간</span>
          <span class="result-value" id="result-date">-</span>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="startQuiz()">재도전</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

  </div>

  <script>
    // ----------------------------------------------------
    // 단답식 문제 은행 (지정 정답 10개 완벽 반영)
    // 정답: 침식, 운반, 퇴적, 강 하류, 화산, 분화구, 용암, 화강암, 현무암, 지진
    // ----------------------------------------------------
    const saBank = [
      {
        q: "흐르는 물이 바위나 돌, 흙 등을 깎아 내는 작용을 무엇이라고 하나요?",
        ans: ["침식", "침식작용", "침식 작용"],
        exp: "흐르는 물이 바위나 돌, 흙을 깎아 내는 것을 '침식' 작용이라고 합니다."
      },
      {
        q: "흐르는 물이 깎인 돌과 흙 등을 다른 곳으로 이동시키는 작용을 무엇이라고 하나요?",
        ans: ["운반", "운반작용", "운반 작용"],
        exp: "깎인 돌과 흙을 다른 곳으로 옮기는 것을 '운반' 작용이라고 합니다."
      },
      {
        q: "흐르는 물에 의해 운반된 돌이나 흙이 쌓이는 작용을 무엇이라고 하나요?",
        ans: ["퇴적", "퇴적작용", "퇴적 작용"],
        exp: "운반된 돌이나 흙이 흘러가다가 쌓이는 것을 '퇴적' 작용이라고 합니다."
      },
      {
        q: "강 상류와 강 하류 중 강폭이 넓고 경사가 완만하며, 퇴적 작용이 침식 작용보다 활발하게 일어나는 곳은 어디인가요?",
        ans: ["강 하류", "강하류"],
        exp: "강 하류는 물이 느리게 흘러 퇴적 작용이 침식 작용보다 활발하게 일어납니다."
      },
      {
        q: "땅속의 마그마가 지표면의 약한 부분을 뚫고 나오는 활동으로 만들어진 지형을 무엇이라고 하나요?",
        ans: ["화산"],
        exp: "마그마가 지표면을 뚫고 나오는 화산 활동으로 만들어진 지형을 '화산'이라고 합니다."
      },
      {
        q: "화산 꼭대기에 움푹 파여 있는 구멍으로, 물이 고여 호수가 생기도 하는 이곳은 무엇인가요?",
        ans: ["분화구"],
        exp: "화산 꼭대기 움푹 파인 부분을 '분화구'라고 합니다."
      },
      {
        q: "마그마가 땅 위로 흘러나온 액체 상태의 물질로, 지표면을 흐르다 굳어 암석이 되는 것을 무엇이라고 하나요?",
        ans: ["용암"],
        exp: "마그마가 지표면 밖으로 흘러나온 액체 상태의 물질을 '용암'이라고 합니다."
      },
      {
        q: "마그마가 땅속 깊은 곳에서 식어 만들어지며, 색깔이 밝고 알갱이의 크기가 큰 화성암은 무엇인가요?",
        ans: ["화강암"],
        exp: "마그마가 땅속 깊은 곳에서 천천히 식으면 알갱이가 크고 밝은 '화강암'이 됩니다."
      },
      {
        q: "마그마가 지표 가까이에서 식어 만들어지며, 색깔이 어둡고 표면에 구멍이 있기도 한 화성암은 무엇인가요?",
        ans: ["현무암"],
        exp: "마그마가 지표 가까이에서 빠르게 식으면 알갱이가 작고 어두운 '현무암'이 됩니다."
      },
      {
        q: "땅이 흔들리거나 갈라지고 건물이 무너지며, 세기를 '규모'로 나타내는 지각 변동 현상은 무엇인가요?",
        ans: ["지진"],
        exp: "땅이 흔들리거나 갈라지는 현상을 '지진'이라고 하며 세기는 규모로 나타냅니다."
      }
    ];

    // ----------------------------------------------------
    // 객관식 문제 은행 (총 20문제)
    // ----------------------------------------------------
    const mcqBank = [
      {
        q: "흐르는 물에 의한 흙 언덕의 모습 변화로 알맞은 설명은 무엇인가요?",
        options: [
          "위쪽의 흙을 깎아 아래쪽에 쌓이게 한다.",
          "아래쪽의 흙을 깎아 위쪽에 쌓이게 한다.",
          "흙 언덕 전체의 흙이 그대로 유지된다.",
          "위쪽과 아래쪽 모두 흙이 계속 쌓이기만 한다."
        ],
        ans: 0,
        exp: "흐르는 물은 흙 언덕 위쪽의 흙을 깎고 운반하여 아래쪽에 쌓이게 합니다."
      },
      {
        q: "강 상류 지형의 특징으로 <u>옳지 않은 것</u>은 무엇인가요?",
        options: [
          "강폭이 넓고 경사가 완만하다.",
          "강폭이 좁다.",
          "강의 경사가 급하다.",
          "강물의 흐름이 빠르다."
        ],
        ans: 0,
        exp: "강 상류는 강폭이 좁고 경사가 급하며, 강폭이 넓고 완만한 곳은 강 하류입니다."
      },
      {
        q: "강 하류에서 볼 수 있는 지형이나 지물의 특징으로 알맞은 것은 무엇인가요?",
        options: [
          "고운 모래, 흙, 넓고 평평한 땅",
          "커다란 바위와 높은 폭포",
          "깊고 험준한 계곡",
          "경사가 매우 급하고 좁은 강폭"
        ],
        ans: 0,
        exp: "강 하류에서는 고운 모래, 흙, 넓고 평평한 땅을 볼 수 있습니다."
      },
      {
        q: "강 상류에서 더 활발하게 일어나는 작용은 무엇인가요?",
        options: [
          "침식 작용",
          "퇴적 작용",
          "증발 작용",
          "응결 작용"
        ],
        ans: 0,
        exp: "강 상류는 물이 빠르고 세게 흘러 침식 작용이 퇴적 작용보다 활발하게 일어납니다."
      },
      {
        q: "다음 중 화산 활동으로 나오는 물질 중 기체 상태에 해당하는 것은 무엇인가요?",
        options: [
          "화산 가스",
          "용암",
          "화산재",
          "화산 암석 조각"
        ],
        ans: 0,
        exp: "화산 가스는 기체, 용암은 액체, 화산재와 화산 암석 조각은 고체 상태입니다."
      },
      {
        q: "화산 분출물 중 대부분 수증기이며 여러 가지 기체가 섞여 있는 것은 무엇인가요?",
        options: [
          "화산 가스",
          "화산재",
          "용암",
          "마그마"
        ],
        ans: 0,
        exp: "화산 가스는 대부분 수증기이며 여러 기체가 섞여 있습니다."
      },
      {
        q: "화산 활동으로 나오는 고체 물질 중 크기가 매우 작은 물질은 무엇인가요?",
        options: [
          "화산재",
          "용암",
          "화산 가스",
          "마시멜로"
        ],
        ans: 0,
        exp: "화산재는 화산 활동으로 나오는 크기가 매우 작은 고체 물질입니다."
      },
      {
        q: "화산 활동 모형 실험에서 '흐르는 마시멜로'가 나타내는 실제 화산 분출물은 무엇인가요?",
        options: [
          "용암",
          "화산 가스",
          "화산재",
          "마그마"
        ],
        ans: 0,
        exp: "모형에서 흘러내리는 마시멜로는 실제 화산의 '용암'을 나타냅니다."
      },
      {
        q: "실제 화산 활동과 화산 활동 모형의 차이점으로 알맞은 것은 무엇인가요?",
        options: [
          "실제 화산은 모형보다 크기가 더 크다.",
          "모형에서만 연기가 나온다.",
          "실제 화산에서는 액체 물질이 나오지 않는다.",
          "모형이 실제 화산보다 다양한 상태의 물질을 내보낸다."
        ],
        ans: 0,
        exp: "실제 화산은 모형보다 크기가 훨씬 크고, 다양한 상태의 물질이 나옵니다."
      },
      {
        q: "마그마가 식어 만들어진 암석을 통틀어 무엇이라고 하나요?",
        options: [
          "화성암",
          "퇴적암",
          "변성암",
          "석회암"
        ],
        ans: 0,
        exp: "마그마가 식어 만들어진 암석을 '화성암'이라고 하며, 화강암과 현무암이 있습니다."
      },
      {
        q: "화강암에 대한 설명으로 <u>옳지 않은 것</u>은 무엇인가요?",
        options: [
          "마그마가 지표 가까이에서 식어 만들어진다.",

    // ----------------------------------------------------
    // 앱 상태 변수
    // ----------------------------------------------------
    let userName = "";
    let quizQueue = [];
    let currentIdx = 0;
    let startTime = null;

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const wrongScreen = document.getElementById("wrong-screen");
    const successScreen = document.getElementById("success-screen");

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startQuiz() {
      const nameInput = document.getElementById("userName").value.trim();
      if (!nameInput) {
        alert("이름을 입력해 주세요!");
        return;
      }
      userName = nameInput;

      // 1-7번: 객관식 20개 중 7개 무작위 추출 및 보기 셔플
      // 8-10번: 단답식 10개 중 3개 무작위 추출
      const selectedMCQs = shuffle(mcqBank).slice(0, 7);
      const selectedSAs = shuffle(saBank).slice(0, 3);

      const formattedMCQs = selectedMCQs.map(item => {
        const correctText = item.options[item.ans];
        const shuffledOptions = shuffle(item.options);
        const newAnsIdx = shuffledOptions.indexOf(correctText);
        return {
          type: "MCQ",
          q: item.q,
          options: shuffledOptions,
          ans: newAnsIdx,
          exp: item.exp
        };
      });

      const formattedSAs = selectedSAs.map(item => ({
        type: "SA",
        q: item.q,
        ans: item.ans,
        exp: item.exp
      }));

      quizQueue = [...formattedMCQs, ...formattedSAs];
      currentIdx = 0;
      startTime = Date.now();

      startScreen.style.display = "none";
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "block";

      renderQuestion();
    }

    function renderQuestion() {
      const qData = quizQueue[currentIdx];
      
      const progressPercent = ((currentIdx + 1) / 10) * 100;
      document.getElementById("progress-bar").style.width = progressPercent + "%";
      document.getElementById("question-number").textContent = `문제 ${currentIdx + 1} / 10`;

      const badge = document.getElementById("question-type-badge");
      const optionsBox = document.getElementById("options-container");
      const saBox = document.getElementById("sa-container");

      document.getElementById("question-text").innerHTML = `${currentIdx + 1}. ${qData.q}`;

      if (qData.type === "MCQ") {
        badge.textContent = "객관식";
        badge.className = "badge badge-mcq";
        optionsBox.style.display = "flex";
        saBox.style.display = "none";

        optionsBox.innerHTML = "";
        qData.options.forEach((optText, idx) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = `${idx + 1}. ${optText}`;
          btn.onclick = () => checkMCQAnswer(idx);
          optionsBox.appendChild(btn);
        });
      } else {
        badge.textContent = "단답식";
        badge.className = "badge badge-sa";
        optionsBox.style.display = "none";
        saBox.style.display = "flex";

        const saInput = document.getElementById("sa-input");
        saInput.value = "";
        setTimeout(() => saInput.focus(), 100);
      }
    }

    function checkMCQAnswer(selectedIdx) {
      const qData = quizQueue[currentIdx];
      if (selectedIdx === qData.ans) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function submitSAAnswer() {
      const qData = quizQueue[currentIdx];
      const userInput = document.getElementById("sa-input").value.trim().replace(/\s+/g, "");

      if (!userInput) {
        alert("정답을 입력해주세요.");
        return;
      }

      // 허용 정답 목록과 비교 (공백 제거 비교)
      const isCorrect = qData.ans.some(target => target.replace(/\s+/g, "") === userInput);

      if (isCorrect) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < 10) {
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function showWrongScreen(explanationText) {
      quizScreen.style.display = "none";
      wrongScreen.style.display = "block";
      document.getElementById("explanation-text").textContent = explanationText;
    }

    function returnToStart() {
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "none";
      startScreen.style.display = "block";
    }

    function finishQuiz() {
      const endTime = Date.now();
      const elapsedSeconds = Math.round((endTime - startTime) / 1000);

      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      const dateStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

      document.getElementById("result-name").textContent = userName;
      document.getElementById("result-time").textContent = `${elapsedSeconds}초`;
      document.getElementById("result-date").textContent = dateStr;

      quizScreen.style.display = "none";
      successScreen.style.display = "block";
    }
  </script>
