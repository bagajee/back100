<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>4학년 1학기 과학 - 4. 다양한 생물과 우리 생활</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #f0fdf4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
      color: #166534;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
      position: relative;
    }
    .top-nav {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #f1f5f9;
      color: #334155;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
      border: 1px solid #cbd5e1;
    }
    .nav-btn:active {
      background-color: #e2e8f0;
    }
    h1 {
      font-size: 22px;
      color: #15803d;
      margin-bottom: 8px;
    }
    .sub-title {
      font-size: 14px;
      color: #475569;
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #334155;
      font-size: 15px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #15803d;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      box-sizing: border-box;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background-color: #15803d;
      color: #ffffff;
    }
    .btn-secondary {
      background-color: #64748b;
      color: #ffffff;
    }

    /* 퀴즈 진행 화면 */
    #quiz-screen {
      display: none;
      text-align: left;
    }
    .progress-bar-container {
      width: 100%;
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #15803d;
      transition: width 0.3s ease;
    }
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 14px;
      font-weight: bold;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    .badge-mcq { background: #dcfce7; color: #15803d; }
    .badge-sa { background: #fef3c7; color: #92400e; }

    .question-box {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
      color: #0f172a;
      margin-bottom: 20px;
      min-height: 60px;
    }
    .question-box u {
      color: #dc2626;
      text-decoration-thickness: 2px;
    }
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      width: 100%;
      padding: 14px 16px;
      background-color: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      color: #334155;
      cursor: pointer;
      line-height: 1.4;
      transition: all 0.2s;
    }
    .option-btn:active {
      background-color: #dcfce7;
      border-color: #15803d;
      color: #14532d;
    }

    .sa-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 오답 화면 */
    #wrong-screen {
      display: none;
      background-color: #fef2f2;
      border: 2px solid #fca5a5;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .wrong-title {
      color: #dc2626;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .explanation-box {
      background: #ffffff;
      padding: 15px;
      border-radius: 10px;
      border-left: 4px solid #dc2626;
      text-align: left;
      font-size: 14px;
      color: #334155;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    /* 성공 화면 */
    #success-screen {
      display: none;
    }
    .trophy {
      font-size: 60px;
      margin-bottom: 10px;
    }
    .success-title {
      font-size: 22px;
      color: #15803d;
      font-weight: bold;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .result-info {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      margin-bottom: 20px;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .result-item:last-child {
      margin-bottom: 0;
    }
    .result-label {
      color: #475569;
      font-weight: bold;
    }
    .result-value {
      color: #15803d;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- 1. 시작 화면 -->
    <div id="start-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>
      <h1>4학년 과학 퀴즈</h1>
      <p class="sub-title">4. 다양한 생물과 우리 생활</p>

      <div class="input-group">
        <label for="userName">이름을 입력하세요</label>
        <input type="text" id="userName" placeholder="예: 홍길동" autocomplete="off">
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="startQuiz()">시작</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

    <!-- 2. 퀴즈 진행 화면 -->
    <div id="quiz-screen">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      
      <div class="quiz-header">
        <span id="question-number">문제 1 / 10</span>
        <span id="question-type-badge" class="badge badge-mcq">객관식</span>
      </div>

      <div class="question-box" id="question-text"></div>

      <!-- 객관식 영역 -->
      <div class="options-container" id="options-container"></div>

      <!-- 단답식 영역 -->
      <div class="sa-container" id="sa-container" style="display: none;">
        <input type="text" id="sa-input" placeholder="정답 입력" onkeydown="if(event.key==='Enter') submitSAAnswer()">
        <button class="btn btn-primary" onclick="submitSAAnswer()">정답 제출</button>
      </div>
    </div>

    <!-- 3. 오답 화면 -->
    <div id="wrong-screen">
      <div class="wrong-title">❌ 틀렸습니다!</div>
      <div class="explanation-box">
        <strong>💡 간단 해설:</strong>
        <p id="explanation-text" style="margin-top: 6px;"></p>
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="returnToStart()">계속</button>
    </div>

    <!-- 4. 성공 축하 화면 -->
    <div id="success-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>

      <div class="trophy">🏆</div>
      <div class="success-title">축하합니다!<br>10문제를 모두 맞추셨습니다!</div>
      
      <div class="result-info">
        <div class="result-item">
          <span class="result-label">이름</span>
          <span class="result-value" id="result-name">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">총 걸린시간</span>
          <span class="result-value" id="result-time">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">현재 시간</span>
          <span class="result-value" id="result-date">-</span>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="startQuiz()">재도전</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

  </div>

  <script>
    // ----------------------------------------------------
    // 단답식 문제 은행 (지정 정답 7개 완벽 반영)
    // 정답: 버섯, 곰팡이, 균류, 해캄, 짚신벌레, 원생생물, 세균
    // ----------------------------------------------------
    const saBank = [
      {
        q: "윗부분은 우산처럼 생기고 안쪽에 주름이 있으며, 아랫부분은 막대처럼 생긴 균류 생물은 무엇인가요?",
        ans: ["버섯"],
        exp: "버섯은 우산처럼 생긴 윗부분 안쪽에 주름이 있고 막대처럼 생긴 아랫부분을 가진 균류입니다."
      },
      {
        q: "솜털 같은 것이 많이 보이고 그 끝부분에 둥근 알갱이가 달려 있으며, 실체 현미경으로 보면 가늘고 긴 가닥이 보이는 균류 생물은 무엇인가요?",
        ans: ["곰팡이"],
        exp: "곰팡이는 솜털 같은 가닥 끝에 둥근 알갱이가 달린 모양을 한 균류입니다."
      },
      {
        q: "버섯과 곰팡이처럼 균사로 이루어져 있고 포자로 번식하며, 스스로 양분을 만들지 못하는 생물 무리를 무엇이라고 하나요?",
        ans: ["균류"],
        exp: "버섯과 곰팡이 같은 생물을 균류라고 합니다."
      },
      {
        q: "초록색의 실처럼 가는 나선 가닥이 여러 개 보이고 대나무처럼 마디로 나누어져 있는 원생생물은 무엇인가요?",
        ans: ["해캄"],
        exp: "해캄은 초록색 나선 가닥이 있고 마디로 나누어져 있는 원생생물입니다."
      },
      {
        q: "길쭉한 둥근 모양이고 바깥쪽에 가는 털이 있어 움직이는 원생생물은 무엇인가요?",
        ans: ["짚신벌레"],
        exp: "짚신벌레는 길쭉한 둥근 모양이며 바깥쪽에 가는 털이 있습니다."
      },
      {
        q: "해캄, 짚신벌레, 종벌레, 유글레나, 미역, 김 등과 같이 동물, 식물, 균류와 다른 생물 무리를 무엇이라고 하나요?",
        ans: ["원생생물"],
        exp: "해캄과 짚신벌레 같은 생물을 원생생물이라고 합니다."
      },
      {
        q: "크기가 매우 작아 맨눈으로 볼 수 없으며, 공 모양, 막대 모양, 나선 모양 등이 있고 우리 주변 곳곳에 사는 생물 무리를 무엇이라고 하나요?",
        ans: ["세균"],
        exp: "크기가 매우 작고 구조가 단순하며 빠르게 번식하는 생물을 세균이라고 합니다."
      }
    ];

    // ----------------------------------------------------
    // 객관식 문제 은행 (총 23문제)
    // ----------------------------------------------------
    const mcqBank = [
      {
        q: "실체 현미경에서 상의 초점을 맞출 때 사용하는 나사의 이름은 무엇인가요?",
        options: ["초점 조절 나사", "조명 조절 나사", "재물대 나사", "회전판 나사"],
        ans: 0,
        exp: "상의 초점을 맞출 때 사용하는 부분은 초점 조절 나사입니다."
      },
      {
        q: "실체 현미경에서 조명을 켜고 끄며 빛의 밝기를 조절하는 부분은 무엇인가요?",
        options: ["조명 조절 나사", "초점 조절 나사", "대물렌즈", "접안렌즈"],
        ans: 0,
        exp: "조명을 켜고 끄며 밝기를 조절하는 나사는 조명 조절 나사입니다."
      },
      {
        q: "실체 현미경에서 관찰 대상을 올려놓는 부위의 이름은 무엇인가요?",
        options: ["재물대", "회전판", "접안렌즈", "초점 조절 나사"],
        ans: 0,
        exp: "관찰 대상을 올려놓는 곳은 재물대입니다."
      },
      {
        q: "실체 현미경에서 대물렌즈의 배율을 조절하기 위해 돌리는 부분은 무엇인가요?",
        options: ["회전판", "재물대", "조명 조절 나사", "접안렌즈"],
        ans: 0,
        exp: "대물렌즈의 배율을 조절하는 나사는 회전판입니다."
      },
      {
        q: "실체 현미경을 처음 사용할 때 대물렌즈의 배율을 어떻게 설정해야 하나요?",
        options: ["가장 낮게 설정한다.", "가장 높게 설정한다.", "중간 배율로 설정한다.", "배율은 상관없다."],
        ans: 0,
        exp: "실체 현미경을 사용할 때는 먼저 회전판을 돌려 대물렌즈의 배율을 가장 낮게 설정해야 합니다."
      },
      {
        q: "실체 현미경의 올바른 사용 방법으로 <u>옳지 않은 것</u>은 무엇인가요?",
        options: [
          "접안렌즈를 보면서 초점 조절 나사로 대물렌즈를 관찰 대상에 바짝 내린다.",
          "옆에서 보면서 초점 조절 나사로 대물렌즈를 관찰 대상에 가깝게 내린다.",
          "접안렌즈로 보면서 대물렌즈를 천천히 올려 초점을 맞춘다.",
          "전원을 켜고 조명 조절 나사로 빛의 밝기를 조절한다."
        ],
        ans: 0,
        exp: "대물렌즈를 내릴 때는 렌즈와 관찰 대상이 부딪히지 않도록 옆에서 보면서 내려야 합니다."
      },
      {
        q: "균류에 대한 설명으로 <u>옳지 않은 것</u>은 무엇인가요?",
        options: [
          "햇빛을 받아 스스로 양분을 만든다.",
          "버섯과 곰팡이가 균류에 해당한다.",
          "균사로 이루어져 있다.",
          "포자를 이용해 번식한다."
        ],
        ans: 0,
        exp: "균류는 스스로 양분을 만들지 못하고 죽은 생물이나 다른 생물에서 양분을 얻습니다."
      },
      {
        q: "균류가 번식할 때 이용하는 것은 무엇인가요?",
        options: ["포자", "씨앗", "알", "뿌리"],
        ans: 0,
        exp: "균류는 포자를 이용해 번식합니다."
      },
      {
        q: "균류가 잘 자라는 환경 조건으로 알맞은 것은 무엇인가요?",
        options: [
          "따뜻하고 습한 곳",
          "춥고 건조한 곳",
          "햇빛이 강하고 건조한 곳",
          "얼음이 어는 매우 차가운 곳"
        ],
        ans: 0,
        exp: "균류는 따뜻하고 습한 곳에서 잘 자랍니다."
      },
      {
        q: "곰팡이를 실체 현미경으로 관찰했을 때 볼 수 있는 특징은 무엇인가요?",
        options: [
          "실처럼 가늘고 긴 가닥 끝에 둥근 알갱이가 많이 달려 있다.",
          "우산 모양의 주름이 촘촘히 있다.",
          "대나무처럼 마디가 나뉘어 있다.",
          "몸 바깥쪽에 가는 털이 덮여 있다."
        ],
        ans: 0,
        exp: "곰팡이는 실체 현미경으로 보면 실처럼 가늘고 긴 가닥이 많고 끝에 둥근 알갱이가 달려 있습니다."
      },
      {
        q: "해캄을 영구 표본으로 관찰했을 때 볼 수 있는 특징으로 알맞은 것은 무엇인가요?",
        options: [
          "초록색의 실처럼 가는 나선 가닥이 보인다.",
          "바깥쪽에 가는 털이 많이 달려 있다.",
          "우산 모양의 윗부분과 막대 모양 아랫부분이 있다.",
          "공 모양의 단단한 껍데기로 싸여 있다."
        ],
        ans: 0,
        exp: "해캄은 초록색의 실처럼 가는 나선 가닥이 보이고 대나무처럼 마디로 나누어져 있습니다."
      },
      {
        q: "짚신벌레의 생김새 특징으로 알맞은 것은 무엇인가요?",
        options: [
          "길쭉한 둥근 모양이고 바깥쪽에 가는 털이 있다.",
          "초록색 나선 가닥이 여러 개 들어 있다.",
          "균사로 이루어져 있고 포자를 만든다.",
          "대나무처럼 마디마디 나누어져 있다."
        ],
        ans: 0,
        exp: "짚신벌레는 길쭉한 둥근 모양이고 바깥쪽에 가는 털이 있습니다."
      },
      {

        options: ["별 모양", "공 모양", "막대 모양", "나선 모양"],
        ans: 0,

      },
      {

        ],

      {

        ans: 0,
        exp: "세균을 자라지 못하게 하는 균류를 이용하여 질병 치료 약을 만듭니다."

        ans: 0,
        exp: "곤충을 죽게 하는 균류는 생물 농약으로 이용됩니다."

        q: "기름 성분이 있는 원생생물을 활용하여 만드는 것은 무엇인가요?",
        options: ["생물 연료", "질병 치료 약", "생물 농약", "하수 처리"],
        ans: 0,
        exp: "기름 성분이 있는 원생생물은 생물 연료로 활용됩니다."
      },
      {
        q: "오염 물질을 분해하는 세균의 성질을 이용하는 예는 무엇인가요?",
        options: ["하수 처리", "건강식품 생산", "생물 농약 제조", "적조 예방"],
        ans: 0,
        exp: "오염 물질을 분해하는 세균은 하수 처리에 이용됩니다."
      },
      {
        q: "다양한 생물이 우리 생활에 미치는 해로운 영향으로 알맞은 것은 무엇인가요?",
        options: [
          "균류와 세균이 음식이나 물건을 상하게 한다.",
          "균류와 세균이 죽은 생물을 분해한다.",
          "원생생물이 다른 생물의 먹이가 된다.",
          "원생생물이 산소를 만든다."
        ],
        ans: 0,
        exp: "균류와 세균이 음식이나 물건을 상하게 하는 것은 해로운 영향입니다."
      }
    ];

    // ----------------------------------------------------
    // 앱 상태 변수
    // ----------------------------------------------------
    let userName = "";
    let quizQueue = [];
    let currentIdx = 0;
    let startTime = null;

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const wrongScreen = document.getElementById("wrong-screen");
    const successScreen = document.getElementById("success-screen");

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startQuiz() {
      const nameInput = document.getElementById("userName").value.trim();
      if (!nameInput) {
        alert("이름을 입력해 주세요!");
        return;
      }
      userName = nameInput;

      // 1-7번: 객관식 23개 중 7개 무작위 추출 및 보기 셔플
      // 8-10번: 단답식 7개 중 3개 무작위 추출
      const selectedMCQs = shuffle(mcqBank).slice(0, 7);
      const selectedSAs = shuffle(saBank).slice(0, 3);

      const formattedMCQs = selectedMCQs.map(item => {
        const correctText = item.options[item.ans];
        const shuffledOptions = shuffle(item.options);
        const newAnsIdx = shuffledOptions.indexOf(correctText);
        return {
          type: "MCQ",
          q: item.q,
          options: shuffledOptions,
          ans: newAnsIdx,
          exp: item.exp
        };
      });

      const formattedSAs = selectedSAs.map(item => ({
        type: "SA",
        q: item.q,
        ans: item.ans,
        exp: item.exp
      }));

      quizQueue = [...formattedMCQs, ...formattedSAs];
      currentIdx = 0;
      startTime = Date.now();

      startScreen.style.display = "none";
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "block";

      renderQuestion();
    }

    function renderQuestion() {
      const qData = quizQueue[currentIdx];
      
      const progressPercent = ((currentIdx + 1) / 10) * 100;
      document.getElementById("progress-bar").style.width = progressPercent + "%";
      document.getElementById("question-number").textContent = `문제 ${currentIdx + 1} / 10`;

      const badge = document.getElementById("question-type-badge");
      const optionsBox = document.getElementById("options-container");
      const saBox = document.getElementById("sa-container");

      document.getElementById("question-text").innerHTML = `${currentIdx + 1}. ${qData.q}`;

      if (qData.type === "MCQ") {
        badge.textContent = "객관식";
        badge.className = "badge badge-mcq";
        optionsBox.style.display = "flex";
        saBox.style.display = "none";

        optionsBox.innerHTML = "";
        qData.options.forEach((optText, idx) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = `${idx + 1}. ${optText}`;
          btn.onclick = () => checkMCQAnswer(idx);
          optionsBox.appendChild(btn);
        });
      } else {
        badge.textContent = "단답식";
        badge.className = "badge badge-sa";
        optionsBox.style.display = "none";
        saBox.style.display = "flex";

        const saInput = document.getElementById("sa-input");
        saInput.value = "";
        setTimeout(() => saInput.focus(), 100);
      }
    }

    function checkMCQAnswer(selectedIdx) {
      const qData = quizQueue[currentIdx];
      if (selectedIdx === qData.ans) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function submitSAAnswer() {
      const qData = quizQueue[currentIdx];
      const userInput = document.getElementById("sa-input").value.trim().replace(/\s+/g, "");

      if (!userInput) {
        alert("정답을 입력해주세요.");
        return;
      }

      // 정답 비교 (공백 제거 후 일치 여부 확인)
      const isCorrect = qData.ans.some(target => target.replace(/\s+/g, "") === userInput);

      if (isCorrect) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < 10) {
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function showWrongScreen(explanationText) {
      quizScreen.style.display = "none";
      wrongScreen.style.display = "block";
      document.getElementById("explanation-text").textContent = explanationText;
    }

    function returnToStart() {
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "none";
      startScreen.style.display = "block";
    }

    function finishQuiz() {
      const endTime = Date.now();
      const elapsedSeconds = Math.round((endTime - startTime) / 1000);

      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      const dateStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

      document.getElementById("result-name").textContent = userName;
      document.getElementById("result-time").textContent = `${elapsedSeconds}초`;
      document.getElementById("result-date").textContent = dateStr;

      quizScreen.style.display = "none";
      successScreen.style.display = "block";
    }
  </script>
