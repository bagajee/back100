<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>4학년 1학기 과학 - 1. 자석의 이용</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #f0f9ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
      color: #0369a1;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
      position: relative;
    }
    .top-nav {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #f1f5f9;
      color: #334155;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
      border: 1px solid #cbd5e1;
    }
    .nav-btn:active {
      background-color: #e2e8f0;
    }
    h1 {
      font-size: 22px;
      color: #0284c7;
      margin-bottom: 8px;
    }
    .sub-title {
      font-size: 14px;
      color: #475569;
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #334155;
      font-size: 15px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #0284c7;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      box-sizing: border-box;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background-color: #0284c7;
      color: #ffffff;
    }
    .btn-secondary {
      background-color: #64748b;
      color: #ffffff;
    }

    /* 퀴즈 화면 */
    #quiz-screen {
      display: none;
      text-align: left;
    }
    .progress-bar-container {
      width: 100%;
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #0284c7;
      transition: width 0.3s ease;
    }
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 14px;
      font-weight: bold;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    .badge-mcq { background: #e0f2fe; color: #0369a1; }
    .badge-sa { background: #fef3c7; color: #92400e; }

    .question-box {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
      color: #0f172a;
      margin-bottom: 20px;
      min-height: 60px;
    }
    .question-box u {
      color: #dc2626;
      text-decoration-thickness: 2px;
    }
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      width: 100%;
      padding: 14px 16px;
      background-color: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      color: #334155;
      cursor: pointer;
      line-height: 1.4;
      transition: all 0.2s;
    }
    .option-btn:active {
      background-color: #e0f2fe;
      border-color: #0284c7;
      color: #0369a1;
    }

    .sa-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 오답 화면 */
    #wrong-screen {
      display: none;
      background-color: #fef2f2;
      border: 2px solid #fca5a5;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .wrong-title {
      color: #dc2626;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .explanation-box {
      background: #ffffff;
      padding: 15px;
      border-radius: 10px;
      border-left: 4px solid #dc2626;
      text-align: left;
      font-size: 14px;
      color: #334155;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    /* 성공 화면 */
    #success-screen {
      display: none;
    }
    .trophy {
      font-size: 60px;
      margin-bottom: 10px;
    }
    .success-title {
      font-size: 22px;
      color: #0284c7;
      font-weight: bold;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .result-info {
      background-color: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      margin-bottom: 20px;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .result-item:last-child {
      margin-bottom: 0;
    }
    .result-label {
      color: #475569;
      font-weight: bold;
    }
    .result-value {
      color: #0284c7;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- 1. 시작 화면 -->
    <div id="start-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>
      <h1>4학년 과학 퀴즈</h1>
      <p class="sub-title">1. 자석의 이용</p>

      <div class="input-group">
        <label for="userName">이름을 입력하세요</label>
        <input type="text" id="userName" placeholder="예: 홍길동" autocomplete="off">
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="startQuiz()">시작</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

    <!-- 2. 퀴즈 진행 화면 -->
    <div id="quiz-screen">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      
      <div class="quiz-header">
        <span id="question-number">문제 1 / 10</span>
        <span id="question-type-badge" class="badge badge-mcq">객관식</span>
      </div>

      <div class="question-box" id="question-text"></div>

      <!-- 객관식 영역 -->
      <div class="options-container" id="options-container"></div>

      <!-- 단답식 영역 -->
      <div class="sa-container" id="sa-container" style="display: none;">
        <input type="text" id="sa-input" placeholder="정답 입력" onkeydown="if(event.key==='Enter') submitSAAnswer()">
        <button class="btn btn-primary" onclick="submitSAAnswer()">정답 제출</button>
      </div>
    </div>

    <!-- 3. 오답 화면 -->
    <div id="wrong-screen">
      <div class="wrong-title">❌ 틀렸습니다!</div>
      <div class="explanation-box">
        <strong>💡 간단 해설:</strong>
        <p id="explanation-text" style="margin-top: 6px;"></p>
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="returnToStart()">계속</button>
    </div>

    <!-- 4. 성공 축하 화면 -->
    <div id="success-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>

      <div class="trophy">🏆</div>
      <div class="success-title">축하합니다!<br>10문제를 모두 맞추셨습니다!</div>
      
      <div class="result-info">
        <div class="result-item">
          <span class="result-label">이름</span>
          <span class="result-value" id="result-name">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">총 걸린시간</span>
          <span class="result-value" id="result-time">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">현재 시간</span>
          <span class="result-value" id="result-date">-</span>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="startQuiz()">재도전</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

  </div>

  <script>
    // ----------------------------------------------------
    // 단답식 문제 은행 (지정 정답: 자석, 철, 자석의 극, 밀어 내는, 끌어 당기는) - 총 10문제
    // ----------------------------------------------------
    const saBank = [
      {
        q: "철 클립, 철 집게, 빵 끈처럼 자석에 붙는 물체들은 모두 어떤 물질로 만들어졌나요?",
        ans: ["철"],
        exp: "자석에 붙는 물체는 모두 철로 만들어졌습니다."
      },
      {
        q: "자석에서 철로 만든 물체가 가장 많이 붙는 부분을 무엇이라고 하나요?",
        ans: ["자석의 극", "자석의극"],
        exp: "자석에서 철로 만든 물체가 가장 많이 붙는 부분을 '자석의 극'이라고 합니다."
      },
      {
        q: "자석과 자석의 같은 극끼리 가까이 할 때 두 자석 사이에 작용하는 서로 떼어내려는 힘은 어떤 힘인가요?",
        ans: ["밀어 내는", "밀어내는", "밀어 내는 힘", "밀어내는 힘"],
        exp: "자석의 같은 극끼리는 서로 밀어 내는 힘이 작용합니다."
      },
      {
        q: "자석과 자석의 다른 극끼리 가까이 할 때 두 자석 사이에 작용하는 서로 끌어붙으려는 힘은 어떤 힘인가요?",
        ans: ["끌어 당기는", "끌어당기는", "끌어 당기는 힘", "끌어당기는 힘"],
        exp: "자석의 다른 극끼리는 서로 끌어 당기는 힘이 작용합니다."
      },
      {
        q: "가방의 단추, 책갈피, 스마트 기기 덮개 등에 사용되어 물건을 쉽게 붙였다 뗄 수 있게 해주는 도구는 무엇인가요?",
        ans: ["자석"],
        exp: "자석을 이용하면 물건을 쉽게 붙였다 뗄 수 있어 여러 생활용품에 활용됩니다."
      },
      {
        q: "가위에서 자석에 붙는 부분은 가위의 어떤 재질로 된 부분인가요?",
        ans: ["철"],
        exp: "가위처럼 여러 물질로 된 물체는 철로 만들어진 부분만 자석에 붙습니다."
      },
      {
        q: "막대자석의 양쪽 끝부분처럼 철로 만든 물체가 가장 세게 달라붙는 지점 두 곳을 통틀어 무엇이라고 하나요?",
        ans: ["자석의 극", "자석의극"],
        exp: "자석에서 철이 가장 많이 붙는 부분을 자석의 극(N극, S극)이라고 합니다."
      },
      {
        q: "막대자석의 N극과 다른 막대자석의 N극을 서로 가까이 가져갈 때 작동하는 힘을 무엇이라고 하나요?",
        ans: ["밀어 내는", "밀어내는", "밀어 내는 힘", "밀어내는 힘"],
        exp: "N극과 N극처럼 같은 극끼리는 서로 밀어 내는 힘이 작용합니다."
      },
      {
        q: "자석과 철로 만든 물체 사이에 작용하는 서로 끌어오는 힘은 어떤 힘인가요?",
        ans: ["끌어 당기는", "끌어당기는", "끌어 당기는 힘", "끌어당기는 힘"],
        exp: "자석과 철로 만든 물체 사이에는 항상 서로 끌어 당기는 힘이 작용합니다."
      },
      {
        q: "손이 닿지 않는 유리창의 바깥면을 청소하는 도구나 신발 끈 매듭기 등에 들어있는 핵심 부품은 무엇인가요?",
        ans: ["자석"],
        exp: "유리창 청소 도구, 신발 끈 매듭기 등은 자석의 성질을 이용한 물건입니다."
      }
    ];

    // ----------------------------------------------------
    // 객관식 문제 은행 - 총 20문제
    // ----------------------------------------------------
    const mcqBank = [
      {
        q: "다음 중 자석에 붙는 물체로만 올바르게 짝지어진 것은 무엇인가요?",
        options: ["철 클립, 철 집게, 빵 끈", "종이, 나무젓가락, 고무줄", "플라스틱 컵, 알루미늄캔, 유리병", "나무 블록, 고무장갑, 지우개"],
        ans: 0,
        exp: "철 클립, 철 집게, 철사, 빵 끈 등 철로 만들어진 물체는 자석에 붙습니다."
      },
      {
        q: "다음 중 자석에 붙지 <u>않는</u> 물체는 무엇인가요?",
        options: ["알루미늄캔", "철 집게", "철 클립", "철사"],
        ans: 0,
        exp: "알루미늄, 종이, 플라스틱, 나무, 고무 등으로 만들어진 물체는 자석에 붙지 않습니다."
      },
      {
        q: "가위를 자석에 대어 보았을 때 일어나는 현상으로 알맞은 것은 무엇인가요?",
        options: ["가위의 철 부분만 자석에 붙는다.", "가위의 플라스틱 손잡이 부분만 자석에 붙는다.", "가위의 모든 부분이 자석에 붙는다.", "가위는 자석에 전혀 붙지 않는다."],
        ans: 0,
        exp: "여러 가지 물질로 만들어진 물체는 철로 만들어진 부분만 자석에 붙습니다."
      },
      {
        q: "자석과 철로 만든 물체 사이에 작용하는 힘의 특징으로 <u>옳지 않은 것</u>은 무엇인가요?",
        options: [
          "자석과 철 사이에 종이가 있으면 서로 끌어당기지 못한다.",
          "자석과 철로 만든 물체 사이에는 서로 끌어당기는 힘이 작용한다.",
          "자석과 철로 만든 물체는 약간 떨어져 있어도 끌어당긴다.",
          "자석과 철 사이에 자석에 붙지 않는 다른 물체가 있어도 끌어당긴다."
        ],
        ans: 0,
        exp: "자석과 철로 만든 물체 사이에 자석에 붙지 않는 다른 물체(종이 등)가 있어도 서로 끌어당깁니다."
      },
      {
        q: "자석의 극에 대한 설명으로 알맞은 것은 무엇인가요?",
        options: [
          "자석에서 철로 만든 물체가 가장 많이 붙는 부분이다.",
          "자석의 가장 가운데 부분을 의미한다.",
          "자석에는 항상 극이 1개만 존재한다.",
          "자석에서 철로 만든 물체가 전혀 붙지 않는 부분이다."
        ],
        ans: 0,
        exp: "자석에서 철로 만든 물체가 가장 많이 붙는 부분을 자석의 극이라고 합니다."
      },
      {
        q: "자석의 극의 종류를 나타내는 기호로 알맞은 것은 무엇인가요?",
        options: ["N극과 S극", "A극과 B극", "+극과 -극", "X극과 Y극"],
        ans: 0,
        exp: "자석의 극은 N극과 S극 두 종류로 나타냅니다."
      },
      {
        q: "고리 자석과 동전 모양 자석의 극은 어디에 위치하나요?",
        options: ["자석의 앞면과 뒷면", "자석의 양쪽 끝부분", "자석의 가운데 지점", "자석의 둥근 테두리 선"],
        ans: 0,
        exp: "고리 자석과 동전 모양 자석의 극은 앞면과 뒷면에 위치합니다."
      },
      {
        q: "막대자석과 둥근기둥 모양 자석의 극은 어디에 위치하나요?",
        options: ["자석의 양쪽 끝부분", "자석의 앞면과 뒷면", "자석의 정확한 중앙점", "자석의 표면 전체"],
        ans: 0,
        exp: "막대자석과 둥근기둥 모양 자석의 극은 자석의 양쪽 끝부분에 위치합니다."
      },
      {
        q: "자석과 자석 사이에 작용하는 힘에 대한 설명으로 <u>옳지 않은 것</u>은 무엇인가요?",
        options: [
          "다른 극끼리 가까이 하면 서로 밀어내는 힘이 작용한다.",
          "같은 극끼리 가까이 하면 서로 밀어내는 힘이 작용한다.",
          "N극과 S극을 가까이 하면 서로 끌어당긴다.",
          "S극과 S극을 가까이 하면 서로 밀어낸다."
        ],
        ans: 0,
        exp: "자석의 다른 극(N극과 S극)끼리 가까이 하면 서로 끌어당기는 힘이 작용합니다."
      },
      {
        q: "막대자석의 N극을 나침반에 가까이 했을 때 일어나는 현상으로 알맞은 것은 무엇인가요?",
        options: [
          "나침반 바늘의 빨간색 부분이 막대자석의 반대쪽을 가리킨다.",
          "나침반 바늘의 빨간색 부분이 막대자석 쪽을 가리킨다.",

    // ----------------------------------------------------
    // 게임 상태 변수
    // ----------------------------------------------------
    let userName = "";
    let quizQueue = [];
    let currentIdx = 0;
    let startTime = null;

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const wrongScreen = document.getElementById("wrong-screen");
    const successScreen = document.getElementById("success-screen");

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startQuiz() {
      const nameInput = document.getElementById("userName").value.trim();
      if (!nameInput) {
        alert("이름을 입력해 주세요!");
        return;
      }
      userName = nameInput;

      // 1-7번: 객관식 20개 중 7개 무작위 추출 및 보기 셔플
      // 8-10번: 단답식 10개 중 3개 무작위 추출
      const selectedMCQs = shuffle(mcqBank).slice(0, 7);
      const selectedSAs = shuffle(saBank).slice(0, 3);

      const formattedMCQs = selectedMCQs.map(item => {
        const correctText = item.options[item.ans];
        const shuffledOptions = shuffle(item.options);
        const newAnsIdx = shuffledOptions.indexOf(correctText);
        return {
          type: "MCQ",
          q: item.q,
          options: shuffledOptions,
          ans: newAnsIdx,
          exp: item.exp
        };
      });

      const formattedSAs = selectedSAs.map(item => ({
        type: "SA",
        q: item.q,
        ans: item.ans,
        exp: item.exp
      }));

      quizQueue = [...formattedMCQs, ...formattedSAs];
      currentIdx = 0;
      startTime = Date.now();

      startScreen.style.display = "none";
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "block";

      renderQuestion();
    }

    function renderQuestion() {
      const qData = quizQueue[currentIdx];
      
      const progressPercent = ((currentIdx + 1) / 10) * 100;
      document.getElementById("progress-bar").style.width = progressPercent + "%";
      document.getElementById("question-number").textContent = `문제 ${currentIdx + 1} / 10`;

      const badge = document.getElementById("question-type-badge");
      const optionsBox = document.getElementById("options-container");
      const saBox = document.getElementById("sa-container");

      document.getElementById("question-text").innerHTML = `${currentIdx + 1}. ${qData.q}`;

      if (qData.type === "MCQ") {
        badge.textContent = "객관식";
        badge.className = "badge badge-mcq";
        optionsBox.style.display = "flex";
        saBox.style.display = "none";

        optionsBox.innerHTML = "";
        qData.options.forEach((optText, idx) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = `${idx + 1}. ${optText}`;
          btn.onclick = () => checkMCQAnswer(idx);
          optionsBox.appendChild(btn);
        });
      } else {
        badge.textContent = "단답식";
        badge.className = "badge badge-sa";
        optionsBox.style.display = "none";
        saBox.style.display = "flex";

        const saInput = document.getElementById("sa-input");
        saInput.value = "";
        setTimeout(() => saInput.focus(), 100);
      }
    }

    function checkMCQAnswer(selectedIdx) {
      const qData = quizQueue[currentIdx];
      if (selectedIdx === qData.ans) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function submitSAAnswer() {
      const qData = quizQueue[currentIdx];
      const userInput = document.getElementById("sa-input").value.trim().replace(/\s+/g, "");

      if (!userInput) {
        alert("정답을 입력해주세요.");
        return;
      }

      // 허용 정답 목록과 비교 (공백 제거 후 비교)
      const isCorrect = qData.ans.some(target => target.replace(/\s+/g, "") === userInput);

      if (isCorrect) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < 10) {
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function showWrongScreen(explanationText) {
      quizScreen.style.display = "none";
      wrongScreen.style.display = "block";
      document.getElementById("explanation-text").textContent = explanationText;
    }

    function returnToStart() {
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "none";
      startScreen.style.display = "block";
    }

    function finishQuiz() {
      const endTime = Date.now();
      const elapsedSeconds = Math.round((endTime - startTime) / 1000);

      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      const dateStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

      document.getElementById("result-name").textContent = userName;
      document.getElementById("result-time").textContent = `${elapsedSeconds}초`;
      document.getElementById("result-date").textContent = dateStr;

      quizScreen.style.display = "none";
      successScreen.style.display = "block";
    }
  </script>
