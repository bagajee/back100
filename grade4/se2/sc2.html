<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>4학년 2학기 과학 - 생물과 환경 퀴즈</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
      color: #1e293b;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
      position: relative;
    }
    .top-nav {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #e2e8f0;
      color: #334155;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
    }
    .nav-btn:active {
      background-color: #cbd5e1;
    }
    h1 {
      font-size: 22px;
      color: #166534;
      margin-bottom: 8px;
    }
    .sub-title {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #334155;
      font-size: 15px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #16a34a;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      box-sizing: border-box;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background-color: #16a34a;
      color: #ffffff;
    }
    .btn-secondary {
      background-color: #64748b;
      color: #ffffff;
    }
    .btn-success {
      background-color: #0284c7;
      color: #ffffff;
    }

    /* 퀴즈 진행 화면 */
    #quiz-screen {
      display: none;
      text-align: left;
    }
    .progress-bar-container {
      width: 100%;
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #16a34a;
      transition: width 0.3s ease;
    }
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 14px;
      font-weight: bold;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    .badge-mcq { background: #dcfce7; color: #15803d; }
    .badge-sa { background: #fef3c7; color: #92400e; }

    .question-box {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
      color: #0f172a;
      margin-bottom: 20px;
      min-height: 60px;
    }
    .question-box u {
      color: #dc2626;
      text-decoration-thickness: 2px;
    }
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      width: 100%;
      padding: 14px 16px;
      background-color: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      color: #334155;
      cursor: pointer;
      line-height: 1.4;
      transition: all 0.2s;
    }
    .option-btn:active {
      background-color: #dcfce7;
      border-color: #16a34a;
      color: #15803d;
    }

    .sa-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 오답 화면 */
    #wrong-screen {
      display: none;
      background-color: #fef2f2;
      border: 2px solid #fca5a5;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .wrong-title {
      color: #dc2626;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .explanation-box {
      background: #ffffff;
      padding: 15px;
      border-radius: 10px;
      border-left: 4px solid #dc2626;
      text-align: left;
      font-size: 14px;
      color: #334155;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    /* 성공 화면 */
    #success-screen {
      display: none;
    }
    .trophy {
      font-size: 60px;
      margin-bottom: 10px;
    }
    .success-title {
      font-size: 22px;
      color: #16a34a;
      font-weight: bold;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .result-info {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      margin-bottom: 20px;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .result-item:last-child {
      margin-bottom: 0;
    }
    .result-label {
      color: #475569;
      font-weight: bold;
    }
    .result-value {
      color: #166534;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- 1. 시작 화면 -->
    <div id="start-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>
      <h1>4학년 과학 퀴즈</h1>
      <p class="sub-title">2단원. 생물과 환경</p>

      <div class="input-group">
        <label for="userName">이름을 입력하세요</label>
        <input type="text" id="userName" placeholder="예: 홍길동" autocomplete="off">
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="startQuiz()">시작</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

    <!-- 2. 퀴즈 진행 화면 -->
    <div id="quiz-screen">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      
      <div class="quiz-header">
        <span id="question-number">문제 1 / 10</span>
        <span id="question-type-badge" class="badge badge-mcq">객관식</span>
      </div>

      <div class="question-box" id="question-text"></div>

      <!-- 객관식 영역 -->
      <div class="options-container" id="options-container"></div>

      <!-- 단답식 영역 -->
      <div class="sa-container" id="sa-container" style="display: none;">
        <input type="text" id="sa-input" placeholder="정답 입력" onkeydown="if(event.key==='Enter') submitSAAnswer()">
        <button class="btn btn-primary" onclick="submitSAAnswer()">정답 제출</button>
      </div>
    </div>

    <!-- 3. 오답 화면 -->
    <div id="wrong-screen">
      <div class="wrong-title">❌ 틀렸습니다!</div>
      <div class="explanation-box">
        <strong>💡 간단 해설:</strong>
        <p id="explanation-text" style="margin-top: 6px;"></p>
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="returnToStart()">계속</button>
    </div>

    <!-- 4. 성공 축하 화면 -->
    <div id="success-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>

      <div class="trophy">🎉</div>
      <div class="success-title">축하합니다!<br>10문제를 모두 맞추셨습니다!</div>
      
      <div class="result-info">
        <div class="result-item">
          <span class="result-label">이름</span>
          <span class="result-value" id="result-name">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">총 걸린시간</span>
          <span class="result-value" id="result-time">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">현재 시간</span>
          <span class="result-value" id="result-date">-</span>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-success" onclick="returnToStart()">재도전</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

  </div>

  <script>
    // ----------------------------------------------------
    // 단답식 문제 은행 (총 9개)
    // 정답 : 생물 요소, 비생물 요소, 생태계, 생산자, 소비자, 분해자, 먹이사슬, 먹이그물, 환경오염
    // ----------------------------------------------------
    const saBank = [
      {
        q: "자연에서 동물이나 식물 등과 같이 살아 있는 것을 무엇이라고 하나요?",
        ans: "생물 요소",
        exp: "자연에서 동물, 식물 등 살아 있는 요소를 '생물 요소'라고 합니다."
      },
      {
        q: "자연에서 햇빛, 물, 공기, 흙 등과 같이 살아 있지 않은 것을 무엇이라고 하나요?",
        ans: "비생물 요소",
        exp: "햇빛, 물, 공기, 흙처럼 살아 있지 않은 요소를 '비생물 요소'라고 합니다."
      },
      {
        q: "한 지역에서 서로 영향을 주고받는 생물 요소와 비생물 요소를 통틀어 무엇이라고 하나요?",
        ans: "생태계",
        exp: "생물 요소와 비생물 요소가 서로 영향을 주고받는 환경 전체를 '생태계'라고 합니다."
      },
      {
        q: "햇빛 등을 이용해 스스로 양분을 만드는 생물 요소를 무엇이라고 하나요?",
        ans: "생산자",
        exp: "소나무, 괭이밥, 개망초처럼 스스로 양분을 만드는 생물을 '생산자'라고 합니다."
      },
      {
        q: "다른 생물을 먹이로 하여 살아가는 생물 요소를 무엇이라고 하나요?",
        ans: "소비자",
        exp: "토끼, 박새, 애벌레처럼 다른 생물을 먹이로 삼는 생물을 '소비자'라고 합니다."
      },
      {
        q: "주로 죽은 생물체나 배출물을 분해해 양분을 얻고 다른 생물이 이용할 수 있게 하는 생물 요소를 무엇이라고 하나요?",
        ans: "분해자",
        exp: "버섯, 곰팡이, 일부 세균 등은 배출물이나 죽은 생물을 분해하는 '분해자'입니다."
      },
      {
        q: "생물이 서로 먹고 먹히는 관계가 사슬처럼 연결된 것을 무엇이라고 하나요?",
        ans: "먹이사슬",
        exp: "생물 간에 먹고 먹히는 관계가 한 줄의 사슬처럼 연결된 것을 '먹이사슬'이라고 합니다."
      },
      {
        q: "여러 개의 먹이사슬이 그물처럼 복잡하게 얽혀 있는 것을 무엇이라고 하나요?",
        ans: "먹이그물",
        exp: "여러 먹이사슬이 그물망처럼 복잡하게 연결된 것을 '먹이그물'이라고 합니다."
      },
      {
        q: "인간의 활동으로 환경이 더러워지거나 훼손되는 현상을 무엇이라고 하나요?",
        ans: "환경오염",
        exp: "인간의 활동에 의해 공기, 물, 흙 등의 환경이 훼손되는 것을 '환경오염'이라고 합니다."
      }
    ];

    // ----------------------------------------------------
    // 객관식 문제 은행 (총 31개)
    // ----------------------------------------------------
    const mcqBank = [
      {
        q: "다음 중 생물 요소에 해당하는 것은 무엇인가요?",
        options: ["다람쥐", "햇빛", "공기", "흙"],
        ans: 0,
        exp: "다람쥐는 살아 있는 생물이므로 생물 요소입니다. 햇빛, 공기, 흙은 비생물 요소입니다."
      },
      {
        q: "다음 중 비생물 요소에 해당하는 것은 무엇인가요?",
        options: ["물", "상수리나무", "뱀", "곰팡이"],
        ans: 0,
        exp: "물은 살아 있지 않으므로 비생물 요소에 해당합니다."
      },
      {
        q: "숲 생태계의 비생물 요소로 올바른 것은 무엇인가요?",
        options: ["햇빛", "사슴벌레", "버섯", "직박구리"],
        ans: 0,
        exp: "햇빛, 공기, 흙 등은 숲 생태계의 비생물 요소입니다."
      },
      {
        q: "강 생태계를 구성하는 생물 요소가 <u>아닌 것</u>은 무엇인가요?",
        options: ["흙", "부들", "오리", "붕어마름"],
        ans: 0,
        exp: "흙은 살아 있지 않은 비생물 요소에 해당합니다."
      },
      {
        q: "바다 생태계의 요소에 대한 설명으로 <u>옳지 않은 것</u>은 무엇인가요?",
        options: [
          "햇빛과 공기는 생물 요소이다.",
          "돌고래는 생물 요소이다.",
          "바다거북과 산호는 생물 요소이다.",
          "미역과 톳은 생물 요소이다."
        ],
        ans: 0,
        exp: "햇빛과 공기는 살아 있지 않은 '비생물 요소'입니다."
      },
      {
        q: "다음 중 크기가 비교적 작은 생태계에 해당하지 <u>않는 것</u>은 무엇인가요?",
        options: ["바다 생태계", "화단 생태계", "연못 생태계", "공원 생태계"],
        ans: 0,
        exp: "화단, 연못, 공원 생태계는 크기가 비교적 작은 생태계입니다."
      },
      {
        q: "다음 중 스스로 양분을 만드는 '생산자'에 해당하는 생물은 무엇인가요?",
        options: ["소나무", "토끼", "버섯", "박새"],
        ans: 0,
        exp: "소나무, 괭이밥, 개망초 등 식물은 스스로 양분을 만드는 생산자입니다."
      },
      {
        q: "다음 중 생산자에 해당하는 식물로 올바르게 짝지어진 것은 무엇인가요?",
        options: [
          "괭이밥, 개망초",
          "토끼, 박새",
          "버섯, 곰팡이",
          "애벌레, 뱀"
        ],
        ans: 0,
        exp: "괭이밥과 개망초는 생산자, 토끼/박새/애벌레는 소비자, 버섯/곰팡이는 분해자입니다."
      },
      {
        q: "다른 생물을 먹이로 하여 살아가는 '소비자'에 해당하는 생물은 무엇인가요?",
        options: ["박새", "개망초", "소나무", "세균"],
        ans: 0,
        exp: "박새, 토끼, 애벌레 등은 다른 생물을 먹이로 하는 소비자입니다."
      },
      {
        q: "다음 중 생태계에서 '소비자'의 예시로 올바른 것은 무엇인가요?",
        options: ["애벌레", "괭이밥", "버섯", "곰팡이"],
        ans: 0,
        exp: "애벌레는 다른 식물을 먹고 사는 소비자입니다."
      },
      {
        q: "죽은 생물체나 배출물을 분해해 양분을 얻는 '분해자'에 해당하는 것은 무엇인가요?",
        options: [
          "버섯과 곰팡이",
          "소나무와 개망초",
          "토끼와 박새",
          "매와 개구리"
        ],
        ans: 0,
        exp: "버섯, 곰팡이, 일부 세균은 죽은 생물이나 배출물을 분해하는 분해자입니다."
      },
      {
        q: "생태계에서 분해자의 역할에 대한 설명으로 올바른 것은 무엇인가요?",
        options: [
          "주로 죽은 생물체나 배출물을 분해해 다른 생물이 이용할 수 있게 한다.",
          "햇빛을 이용하여 스스로 양분을 만든다.",
          "다른 살아있는 생물만을 먹이로 하여 살아간다.",
          "비생물 요소로서 물과 공기를 제공한다."
        ],
        ans: 0,
        exp: "분해자는 죽은 생물체나 배출물을 분해하여 양분을 얻고 타 생물이 이용 가능하게 돕습니다."
      },
      {
        q: "생태계에서 생물 요소들이 서로 관계를 맺는 방식으로 올바른 것은 무엇인가요?",
        options: [
          "서로 먹고 먹히는 관계에 있다.",
          "서로 아무런 영향을 주고받지 않는다.",
          "비생물 요소만 먹고 살아간다.",
          "스스로 빛을 차단하며 살아간다."

    // ----------------------------------------------------

    let userName = "";
    let quizQueue = [];
    let currentIdx = 0;
    let startTime = null;

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const wrongScreen = document.getElementById("wrong-screen");
    const successScreen = document.getElementById("success-screen");

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startQuiz() {
      const nameInput = document.getElementById("userName").value.trim();
      if (!nameInput) {
        alert("이름을 입력해 주세요!");
        return;
      }
      userName = nameInput;

      // 1-7번: 객관식 7개 무작위 추출
      // 8-10번: 단답식 3개 무작위 추출
      const selectedMCQs = shuffle(mcqBank).slice(0, 7);
      const selectedSAs = shuffle(saBank).slice(0, 3);

      const formattedMCQs = selectedMCQs.map(item => {
        const correctText = item.options[item.ans];
        const shuffledOptions = shuffle(item.options);
        const newAnsIdx = shuffledOptions.indexOf(correctText);
        return {
          type: "MCQ",
          q: item.q,
          options: shuffledOptions,
          ans: newAnsIdx,
          exp: item.exp
        };
      });

      const formattedSAs = selectedSAs.map(item => ({
        type: "SA",
        q: item.q,
        ans: item.ans,
        exp: item.exp
      }));

      quizQueue = [...formattedMCQs, ...formattedSAs];
      currentIdx = 0;
      startTime = Date.now();

      startScreen.style.display = "none";
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "block";

      renderQuestion();
    }

    function renderQuestion() {
      const qData = quizQueue[currentIdx];
      
      const progressPercent = ((currentIdx + 1) / 10) * 100;
      document.getElementById("progress-bar").style.width = progressPercent + "%";
      document.getElementById("question-number").textContent = `문제 ${currentIdx + 1} / 10`;

      const badge = document.getElementById("question-type-badge");
      const optionsBox = document.getElementById("options-container");
      const saBox = document.getElementById("sa-container");

      document.getElementById("question-text").innerHTML = `${currentIdx + 1}. ${qData.q}`;

      if (qData.type === "MCQ") {
        badge.textContent = "객관식";
        badge.className = "badge badge-mcq";
        optionsBox.style.display = "flex";
        saBox.style.display = "none";

        optionsBox.innerHTML = "";
        qData.options.forEach((optText, idx) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = `${idx + 1}. ${optText}`;
          btn.onclick = () => checkMCQAnswer(idx);
          optionsBox.appendChild(btn);
        });
      } else {
        badge.textContent = "단답식";
        badge.className = "badge badge-sa";
        optionsBox.style.display = "none";
        saBox.style.display = "flex";

        const saInput = document.getElementById("sa-input");
        saInput.value = "";
        setTimeout(() => saInput.focus(), 100);
      }
    }

    function checkMCQAnswer(selectedIdx) {
      const qData = quizQueue[currentIdx];
      if (selectedIdx === qData.ans) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function submitSAAnswer() {
      const qData = quizQueue[currentIdx];
      const userInput = document.getElementById("sa-input").value.trim().replace(/\s+/g, "");
      const targetAns = qData.ans.replace(/\s+/g, "");

      if (!userInput) {
        alert("정답을 입력해주세요.");
        return;
      }

      if (userInput === targetAns) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < 10) {
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function showWrongScreen(explanationText) {
      quizScreen.style.display = "none";
      wrongScreen.style.display = "block";
      document.getElementById("explanation-text").textContent = explanationText;
    }

    function returnToStart() {
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "none";
      startScreen.style.display = "block";
    }

    function finishQuiz() {
      const endTime = Date.now();
      const elapsedSeconds = Math.round((endTime - startTime) / 1000);

      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      const dateStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

      document.getElementById("result-name").textContent = userName;
      document.getElementById("result-time").textContent = `${elapsedSeconds}초`;
      document.getElementById("result-date").textContent = dateStr;

      quizScreen.style.display = "none";
      successScreen.style.display = "block";
    }
