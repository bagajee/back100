<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>4학년 2학기 과학 - 밤하늘 관찰 퀴즈</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
      color: #1e293b;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
      position: relative;
    }
    .top-nav {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #e2e8f0;
      color: #334155;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
    }
    .nav-btn:active {
      background-color: #cbd5e1;
    }
    h1 {
      font-size: 22px;
      color: #1e3a8a;
      margin-bottom: 8px;
    }
    .sub-title {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #334155;
      font-size: 15px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #2563eb;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      box-sizing: border-box;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
    }
    .btn-secondary {
      background-color: #64748b;
      color: #ffffff;
    }
    .btn-success {
      background-color: #16a34a;
      color: #ffffff;
    }

    /* 퀴즈 진행 화면 */
    #quiz-screen {
      display: none;
      text-align: left;
    }
    .progress-bar-container {
      width: 100%;
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #2563eb;
      transition: width 0.3s ease;
    }
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 14px;
      font-weight: bold;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    .badge-mcq { background: #dbeafe; color: #1e40af; }
    .badge-sa { background: #fef3c7; color: #92400e; }

    .question-box {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
      color: #0f172a;
      margin-bottom: 20px;
      min-height: 60px;
    }
    .question-box u {
      color: #dc2626;
      text-decoration-thickness: 2px;
    }
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      width: 100%;
      padding: 14px 16px;
      background-color: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      color: #334155;
      cursor: pointer;
      line-height: 1.4;
      transition: all 0.2s;
    }
    .option-btn:active {
      background-color: #dbeafe;
      border-color: #2563eb;
      color: #1e40af;
    }

    .sa-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 오답 화면 */
    #wrong-screen {
      display: none;
      background-color: #fef2f2;
      border: 2px solid #fca5a5;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .wrong-title {
      color: #dc2626;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .explanation-box {
      background: #ffffff;
      padding: 15px;
      border-radius: 10px;
      border-left: 4px solid #dc2626;
      text-align: left;
      font-size: 14px;
      color: #334155;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    /* 성공 화면 */
    #success-screen {
      display: none;
    }
    .trophy {
      font-size: 60px;
      margin-bottom: 10px;
    }
    .success-title {
      font-size: 22px;
      color: #16a34a;
      font-weight: bold;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .result-info {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      margin-bottom: 20px;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .result-item:last-child {
      margin-bottom: 0;
    }
    .result-label {
      color: #475569;
      font-weight: bold;
    }
    .result-value {
      color: #166534;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- 1. 시작 화면 -->
    <div id="start-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>
      <h1>4학년 과학 퀴즈</h1>
      <p class="sub-title">1단원. 밤하늘 관찰</p>

      <div class="input-group">
        <label for="userName">이름을 입력하세요</label>
        <input type="text" id="userName" placeholder="예: 홍길동" autocomplete="off">
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="startQuiz()">시작</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

    <!-- 2. 퀴즈 진행 화면 -->
    <div id="quiz-screen">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      
      <div class="quiz-header">
        <span id="question-number">문제 1 / 10</span>
        <span id="question-type-badge" class="badge badge-mcq">객관식</span>
      </div>

      <div class="question-box" id="question-text"></div>

      <!-- 객관식 영역 -->
      <div class="options-container" id="options-container"></div>

      <!-- 단답식 영역 -->
      <div class="sa-container" id="sa-container" style="display: none;">
        <input type="text" id="sa-input" placeholder="정답 입력" onkeydown="if(event.key==='Enter') submitSAAnswer()">
        <button class="btn btn-primary" onclick="submitSAAnswer()">정답 제출</button>
      </div>
    </div>

    <!-- 3. 오답 화면 -->
    <div id="wrong-screen">
      <div class="wrong-title">❌ 틀렸습니다!</div>
      <div class="explanation-box">
        <strong>💡 간단 해설:</strong>
        <p id="explanation-text" style="margin-top: 6px;"></p>
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="returnToStart()">계속</button>
    </div>

    <!-- 4. 성공 축하 화면 -->
    <div id="success-screen">
      <div class="top-nav">
        <a href="../../index.html" class="nav-btn">🏠 홈으로</a>
      </div>

      <div class="trophy">🎉</div>
      <div class="success-title">축하합니다!<br>10문제를 모두 맞추셨습니다!</div>
      
      <div class="result-info">
        <div class="result-item">
          <span class="result-label">이름</span>
          <span class="result-value" id="result-name">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">총 걸린시간</span>
          <span class="result-value" id="result-time">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">현재 시간</span>
          <span class="result-value" id="result-date">-</span>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-success" onclick="returnToStart()">재도전</button>
        <a href="science.html" class="btn btn-secondary">단원선택</a>
      </div>
    </div>

  </div>

  <script>
    // ----------------------------------------------------
    // 단답식 문제 은행 (총 11개)
    // 지정 정답: 달, 달의 바다, 보름달, 초승달, 30일, 태양계, 행성, 별, 북극성, 큰곰자리, 작은곰자리
    // ----------------------------------------------------
    const saBank = [
      {
        q: "지구 주변을 도는 둥근 공 모양의 천체로, 표면에 충돌 구덩이가 많은 천체는 무엇인가요?",
        ans: "달",
        exp: "달은 둥근 공 모양이며, 표면이 크고 작은 충돌 구덩이로 울퉁불퉁합니다."
      },
      {
        q: "달의 표면에서 어둡게 보이는 곳을 무엇이라고 하나요?",
        ans: "달의 바다",
        exp: "달의 표면에서 어둡게 보이는 곳을 '달의 바다'라고 합니다."
      },
      {
        q: "음력 15일 무렵 밤하늘에서 볼 수 있는 둥근 원 모양의 달을 무엇이라고 하나요?",
        ans: "보름달",
        exp: "음력 15일 무렵에는 둥근 원 모양의 '보름달'을 관찰할 수 있습니다."
      },
      {
        q: "음력 3일~4일 무렵 밤하늘에서 볼 수 있는 눈썹 모양의 달을 무엇이라고 하나요?",
        ans: "초승달",
        exp: "음력 3일~4일 무렵에는 오른쪽이 밝은 눈썹 모양의 '초승달'이 보입니다."
      },
      {
        q: "달의 모양 변화가 반복되는 주기는 약 며칠인가요? (숫자와 '일'을 함께 쓰세요)",
        ans: "30일",
        exp: "달의 모양 변화는 약 30일 주기로 반복됩니다."
      },
      {
        q: "태양을 중심으로 태양의 영향을 받는 천체와 태양의 영향이 미치는 공간을 무엇이라고 하나요?",
        ans: "태양계",
        exp: "태양을 중심으로 태양, 행성, 위성, 혜성, 소행성 등이 모여 있는 곳을 '태양계'라고 합니다."
      },
      {
        q: "수성, 금성, 지구, 화성, 목성, 토성, 천왕성, 해왕성처럼 태양 주위를 도는 천체를 무엇이라고 하나요?",
        ans: "행성",
        exp: "태양 주변을 도는 수성, 금성, 지구, 화성, 목성, 토성, 천왕성, 해왕성을 '행성'이라고 합니다."
      },
      {
        q: "태양처럼 스스로 빛을 내는 천체를 무엇이라고 하나요?",
        ans: "별",
        exp: "태양과 같이 스스로 빛을 내는 천체를 '별'이라고 합니다."
      },
      {
        q: "북쪽 하늘에서 거의 움직이지 않는 별은 무엇인가요?",
        ans: "북극성",
        exp: "북극성은 북쪽 하늘에서 거의 움직이지 않는 대표적인 별입니다."
      },
      {
        q: "국자처럼 보이는 북두칠성을 포함하고 있는 별자리는 무엇인가요?",
        ans: "큰곰자리",
        exp: "큰곰자리는 국자 모양의 북두칠성을 포함하고 있습니다."
      },
      {
        q: "북극성을 포함하고 있는 별자리는 무엇인가요?",
        ans: "작은곰자리",
        exp: "작은곰자리는 북극성을 포함하고 있는 별자리입니다."
      }
    ];

    // ----------------------------------------------------
    // 객관식 문제 은행 (총 29개)
    // ----------------------------------------------------
    const mcqBank = [
      {
        q: "달의 모양과 표면 특징에 대한 설명으로 올바른 것은 무엇인가요?",
        options: [
          "달의 표면은 크고 작은 충돌 구덩이가 많아 울퉁불퉁하다.",
          "달은 네모난 상자 모양이다.",
          "달의 표면 전체는 항상 눈부시게 동일한 밝기로 빛난다.",
          "달에는 충돌 구덩이가 전혀 없다."
        ],
        ans: 0,
        exp: "달은 둥근 공 모양이며 표면에 크고 작은 충돌 구덩이가 많아 울퉁불퉁합니다."
      },
      {
        q: "달의 표면에 대한 설명으로 <u>옳지 않은</u> 것은 무엇인가요?",
        options: [
          "어둡게 보이는 곳을 '달의 바다'라고 부른다.",
          "달에는 물이 가득 찬 실제 바다가 존재한다.",
          "밝게 보이는 곳과 어둡게 보이는 곳이 구분된다.",
          "크고 작은 충돌 구덩이가 많이 존재한다."
        ],
        ans: 1,
        exp: "달의 표면에서 어둡게 보이는 지형을 '달의 바다'라고 부르지만, 실제로 물이 가득 차 있는 바다는 아닙니다."
      },
      {
        q: "음력 7일~8일 무렵 밤하늘에서 관찰할 수 있는 달의 모양은 무엇인가요?",
        options: [
          "상현달",
          "초승달",
          "보름달",
          "그믐달"
        ],
        ans: 0,
        exp: "음력 7일~8일 무렵에는 오른쪽 반쪽이 밝은 '상현달'이 보입니다."
      },
      {
        q: "음력 22일~23일 무렵 밤하늘에서 관찰할 수 있는 달의 모양은 무엇인가요?",
        options: [
          "하현달",
          "상현달",
          "초승달",
          "보름달"
        ],
        ans: 0,
        exp: "음력 22일~23일 무렵에는 왼쪽 반쪽이 밝은 '하현달'이 보입니다."
      },
      {
        q: "음력 27일~28일 무렵 밤하늘에서 관찰할 수 있는 달의 모양은 무엇인가요?",
        options: [
          "그믐달",
          "보름달",
          "상현달",
          "초승달"
        ],
        ans: 0,
        exp: "음력 27일~28일 무렵에는 왼쪽이 가느다랗게 빛나는 '그믐달'이 보입니다."
      },
      {
        q: "여러 날 동안 달의 모양이 변화하는 올바른 순서는 무엇인가요?",
        options: [
          "초승달 ➔ 상현달 ➔ 보름달 ➔ 하현달 ➔ 그믐달",
          "보름달 ➔ 초승달 ➔ 하현달 ➔ 상현달 ➔ 그믐달",
          "그믐달 ➔ 보름달 ➔ 초승달 ➔ 상현달 ➔ 하현달",
          "상현달 ➔ 하현달 ➔ 초승달 ➔ 보름달 ➔ 그믐달"
        ],
        ans: 0,
        exp: "달은 초승달 ➔ 상현달 ➔ 보름달 ➔ 하현달 ➔ 그믐달 순으로 모양이 변합니다."
      },
      {
        q: "여러 날 동안 보이는 달의 모양 변화 특징으로 올바른 것은 무엇인가요?",
        options: [
          "밝게 보이는 부분이 오른쪽으로 커지며 둥근 원이 되었다가, 다시 오른쪽부터 밝은 부분이 작아진다.",
          "달의 모양은 매일 밤 항상 동일하다.",
          "달은 하루에 세 번씩 완전히 모양이 바뀐다.",
          "달의 밝은 부분은 항상 왼쪽에서만 시작되어 계속 커지기만 한다."
        ],
        ans: 0,
        exp: "달은 밝은 부분이 오른쪽으로 점점 커지면서 둥근 보름달이 되었다가, 다시 오른쪽부터 밝은 부분이 작아집니다."
      },
      {
        q: "다음 중 태양계의 구성원에 해당하지 <u>않는</u> 것은 무엇인가요?",
        options: [
          "인공위성을 조종하는 우주비행사",
          "태양",
          "행성 및 위성",
          "혜성 및 소행성"
        ],
        ans: 0,
        exp: "태양계 구성원으로는 태양, 행성, 위성, 혜성, 소행성 등이 있습니다."
      },
      {
        q: "태양계에서 유일하게 스스로 빛을 내는 천체는 무엇인가요?",
        options: [
          "태양",
          "지구",
          "목성",
          "달"
        ],
        ans: 0,
        exp: "태양은 태양계 중심에 위치하며 유일하게 스스로 빛을 내는 천체입니다."
      },
      {
        q: "태양에 대한 설명으로 <u>옳지 않은</u> 것은 무엇인가요?",
        options: [
          "태양계에서 스스로 빛을 내지 못하고 지구의 빛을 반사한다.",
          "태양계의 중심에 위치한다.",
          "태양계에서 유일하게 스스로 빛을 낸다.",
          "태양계의 모든 천체에 영향을 준다."

    // ----------------------------------------------------

    let userName = "";
    let quizQueue = [];
    let currentIdx = 0;
    let startTime = null;

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const wrongScreen = document.getElementById("wrong-screen");
    const successScreen = document.getElementById("success-screen");

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startQuiz() {
      const nameInput = document.getElementById("userName").value.trim();
      if (!nameInput) {
        alert("이름을 입력해 주세요!");
        return;
      }
      userName = nameInput;

      // 1-7번: 객관식 7개 무작위 추출
      // 8-10번: 단답식 3개 무작위 추출
      const selectedMCQs = shuffle(mcqBank).slice(0, 7);
      const selectedSAs = shuffle(saBank).slice(0, 3);

      const formattedMCQs = selectedMCQs.map(item => {
        const correctText = item.options[item.ans];
        const shuffledOptions = shuffle(item.options);
        const newAnsIdx = shuffledOptions.indexOf(correctText);
        return {
          type: "MCQ",
          q: item.q,
          options: shuffledOptions,
          ans: newAnsIdx,
          exp: item.exp
        };
      });

      const formattedSAs = selectedSAs.map(item => ({
        type: "SA",
        q: item.q,
        ans: item.ans,
        exp: item.exp
      }));

      quizQueue = [...formattedMCQs, ...formattedSAs];
      currentIdx = 0;
      startTime = Date.now();

      startScreen.style.display = "none";
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "block";

      renderQuestion();
    }

    function renderQuestion() {
      const qData = quizQueue[currentIdx];
      
      const progressPercent = ((currentIdx + 1) / 10) * 100;
      document.getElementById("progress-bar").style.width = progressPercent + "%";
      document.getElementById("question-number").textContent = `문제 ${currentIdx + 1} / 10`;

      const badge = document.getElementById("question-type-badge");
      const optionsBox = document.getElementById("options-container");
      const saBox = document.getElementById("sa-container");

      document.getElementById("question-text").innerHTML = `${currentIdx + 1}. ${qData.q}`;

      if (qData.type === "MCQ") {
        badge.textContent = "객관식";
        badge.className = "badge badge-mcq";
        optionsBox.style.display = "flex";
        saBox.style.display = "none";

        optionsBox.innerHTML = "";
        qData.options.forEach((optText, idx) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = `${idx + 1}. ${optText}`;
          btn.onclick = () => checkMCQAnswer(idx);
          optionsBox.appendChild(btn);
        });
      } else {
        badge.textContent = "단답식";
        badge.className = "badge badge-sa";
        optionsBox.style.display = "none";
        saBox.style.display = "flex";

        const saInput = document.getElementById("sa-input");
        saInput.value = "";
        setTimeout(() => saInput.focus(), 100);
      }
    }

    function checkMCQAnswer(selectedIdx) {
      const qData = quizQueue[currentIdx];
      if (selectedIdx === qData.ans) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function submitSAAnswer() {
      const qData = quizQueue[currentIdx];
      const userInput = document.getElementById("sa-input").value.trim().replace(/\s+/g, "");
      const targetAns = qData.ans.replace(/\s+/g, "");

      if (!userInput) {
        alert("정답을 입력해주세요.");
        return;
      }

      if (userInput === targetAns) {
        nextQuestion();
      } else {
        showWrongScreen(qData.exp);
      }
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < 10) {
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function showWrongScreen(explanationText) {
      quizScreen.style.display = "none";
      wrongScreen.style.display = "block";
      document.getElementById("explanation-text").textContent = explanationText;
    }

    function returnToStart() {
      wrongScreen.style.display = "none";
      successScreen.style.display = "none";
      quizScreen.style.display = "none";
      startScreen.style.display = "block";
    }

    function finishQuiz() {
      const endTime = Date.now();
      const elapsedSeconds = Math.round((endTime - startTime) / 1000);

      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      const dateStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

      document.getElementById("result-name").textContent = userName;
      document.getElementById("result-time").textContent = `${elapsedSeconds}초`;
      document.getElementById("result-date").textContent = dateStr;

      quizScreen.style.display = "none";
      successScreen.style.display = "block";
    }
