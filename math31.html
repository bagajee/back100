<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>초등 3학년 1학기 수학 퀴즈</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      word-break: keep-all;
    }
    body {
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #eef2f7;
      margin: 0;
      padding: 12px;
    }
    .card {
      background: white;
      padding: 1.5rem 1.2rem;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 480px;
      text-align: center;
      max-height: 92vh;
      overflow-y: auto;
      position: relative;
    }
    .hidden { display: none !important; }
    
    /* 상단 Header & 홈 버튼 */
    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .btn-home {
      width: auto !important;
      padding: 6px 14px !important;
      margin: 0 !important;
      background: #e2e8f0 !important;
      color: #2d3748 !important;
      font-size: 0.85rem !important;
      border-radius: 8px !important;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      border: 1px solid #cbd5e1 !important;
      font-weight: bold;
    }
    .btn-home:active { background: #cbd5e1 !important; }

    button {
      width: 100%;
      padding: 12px 10px;
      margin: 4px 0;
      border: none;
      border-radius: 12px;
      background: #3b82f6;
      color: white;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      touch-action: manipulation;
    }
    button:active { transform: scale(0.98); }
    button.btn-sub { background: #60a5fa; text-align: left; padding-left: 14px; font-weight: normal; }
    button.btn-total { background: #f59e0b; text-align: left; padding-left: 14px; font-weight: 800; }
    button.btn-secondary { background: #94a3b8; margin-top: 10px; }
    button.btn-retry { background: #ef4444; margin-top: 10px; }
    
    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1.05rem;
      text-align: center;
      outline: none;
    }
    input:focus { border-color: #3b82f6; }
    
    .chapter-header {
      background: #1e293b;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      margin: 16px 0 8px 0;
      text-align: left;
    }
    
    /* 초등학생용 분수 표기 스타일링 (구분선 색상을 글자색과 통일) */
    .frac {
      display: inline-flex;
      flex-direction: column;
      vertical-align: middle;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      font-size: 1.1em;
      font-weight: bold;
      line-height: 1;
    }
    .frac .num {
      border-bottom: 2px solid currentColor; /* 글자색에 맞춰 선 색상이 자동 변경됨 */
      padding: 0 4px 2px 4px;
    }
    .frac .den {
      padding: 2px 4px 0 4px;
    }

    /* 문제 영역 및 시각자료 */
    .question-box {
      min-height: 130px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 10px 0 15px 0;
      gap: 10px;
      background: #f8fafc;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }
    .question-main-text {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* 보기 버튼 레이아웃 */
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .options button {
      margin: 0;
      font-size: 1rem;
      padding: 12px 6px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #3b82f6;
      color: #ffffff;
    }
    
    .progress-bar { background: #e2e8f0; height: 10px; border-radius: 5px; margin-bottom: 15px; overflow: hidden; }
    .progress-fill { background: #10b981; height: 100%; width: 0%; transition: width 0.3s; }

    /* 해설 모달 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      text-align: left;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-title { font-size: 1.1rem; font-weight: bold; color: #ef4444; margin-bottom: 10px; }
    .modal-body {
      font-size: 0.95rem;
      color: #333;
      line-height: 1.5;
      background: #f8fafc;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
  </style>
</head>

<script>
let userName = "";
let selectedCategory = "";
let currentSubTitle = "";
let correctCount = 0;
const totalQuestions = 20;
let startTime, endTime;
let qData = {};

function goHome() {
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById('explanation-modal').classList.add('hidden');
  document.getElementById('home-screen').classList.remove('hidden');
}

function openSetup(catKey, subTitle) {
  selectedCategory = catKey;
  currentSubTitle = subTitle;
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById('explanation-modal').classList.add('hidden');
  document.getElementById('setup-screen').classList.remove('hidden');
  document.getElementById('setup-title').innerText = subTitle;
}

function startCountDown() {
  userName = document.getElementById("username").value.trim();
  if(!userName) { alert("이름을 입력해주세요!"); return; }
  
  correctCount = 0;
  document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
  document.getElementById("countdown-screen").classList.remove("hidden");
  
  let count = 3;
  document.getElementById("countdown-text").innerText = count;
  let timer = setInterval(() => {
    count--;
    if(count > 0) {
      document.getElementById("countdown-text").innerText = count;
    } else {
      clearInterval(timer);
      document.getElementById("countdown-screen").classList.add("hidden");
      document.getElementById("quiz-screen").classList.remove("hidden");
      startTime = new Date().getTime();
      loadNextQuestion();
    }
  }, 1000);
}

/* 랜덤 정수 생성 */
function rand(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

/* 초등학생용 분수 HTML 표기 생성 함수 */
function makeFracHTML(num, den) {
  return `<span class="frac"><span class="num">${num}</span><span class="den">${den}</span></span>`;
}

/* 보기 섞기 함수 */
function shuffleAndPick(arr, correctAns, count = 4) {
  let filtered = arr.filter(item => item !== correctAns);
  filtered = [...new Set(filtered)]; // 중복 제거
  filtered.sort(() => Math.random() - 0.5);
  let result = [correctAns, ...filtered.slice(0, count - 1)];
  result.sort(() => Math.random() - 0.5);
  return result;
}

/* 3학년 1학기 수학 문제 생성 엔진 */
function generateSingleQuestion(cat) {
  let q = "", answer = "", options = [], exp = "", svg = "";

  // ----- 1단원 : 덧셈과 뺄셈 -----
  if (cat === '1-1') { // 세 자리 수 덧셈 (받아올림 없음)
    let a1 = rand(1,8), a2 = rand(1, 9-a1);
    let b1 = rand(1,8), b2 = rand(0, 9-b1);
    let c1 = rand(1,8), c2 = rand(1, 9-c1);
    let n1 = a1*100 + b1*10 + c1;
    let n2 = a2*100 + b2*10 + c2;
    let ans = n1 + n2;
    q = `${n1} + ${n2} = ?`;
    answer = `${ans}`;
    exp = `각 자릿수끼리 받아올림 없이 더합니다. (${n1} + ${n2} = ${ans})`;
    options = shuffleAndPick([answer, `${ans+10}`, `${ans-10}`, `${ans+2}`], answer, 4);

  } else if (cat === '1-2') { // 세 자리 수 덧셈 (받아올림 1회)
    let pos = rand(1, 3); // 1:일, 2:십, 3:백의 자리 받아올림
    let c1 = rand(1,8), c2 = rand(1,8), b1 = rand(1,8), b2 = rand(1,8), a1 = rand(1,4), a2 = rand(1,4);
    if(pos === 1) { c1 = rand(5,9); c2 = rand(10-c1, 9); b1 = rand(1,4); b2 = rand(1,4); }
    else if(pos === 2) { b1 = rand(5,9); b2 = rand(10-b1, 9); c1 = rand(1,4); c2 = rand(1,4); }
    else { a1 = rand(5,8); a2 = rand(10-a1, 9); b1 = rand(1,4); b2 = rand(1,4); c1 = rand(1,4); c2 = rand(1,4); }
    let n1 = a1*100 + b1*10 + c1;
    let n2 = a2*100 + b2*10 + c2;
    let ans = n1 + n2;
    q = `${n1} + ${n2} = ?`;
    answer = `${ans}`;
    exp = `받아올림이 1번 발생하는 덧셈입니다. (${n1} + ${n2} = ${ans})`;
    options = shuffleAndPick([answer, `${ans+10}`, `${ans-10}`, `${ans+100}`], answer, 4);

  } else if (cat === '1-3') { // 세 자리 수 덧셈 (받아올림 여러번)
    let c1 = rand(5,9), c2 = rand(10-c1, 9);
    let b1 = rand(5,9), b2 = rand(10-b1, 9);
    let a1 = rand(2,5), a2 = rand(2,4);
    let n1 = a1*100 + b1*10 + c1;
    let n2 = a2*100 + b2*10 + c2;
    let ans = n1 + n2;
    q = `${n1} + ${n2} = ?`;
    answer = `${ans}`;
    exp = `일의 자리와 십의 자리 등에서 받아올림을 차례대로 계산합니다. (${n1} + ${n2} = ${ans})`;
    options = shuffleAndPick([answer, `${ans+10}`, `${ans-100}`, `${ans-10}`], answer, 4);

  } else if (cat === '1-4') { // 세 자리 수 뺄셈 (받아내림 없음)
    let a1 = rand(3,9), a2 = rand(1, a1);
    let b1 = rand(2,9), b2 = rand(0, b1);
    let c1 = rand(2,9), c2 = rand(1, c1);
    let n1 = a1*100 + b1*10 + c1;
    let n2 = a2*100 + b2*10 + c2;
    let ans = n1 - n2;
    q = `${n1} - ${n2} = ?`;
    answer = `${ans}`;
    exp = `받아내림 없이 각 자릿수끼리 빼줍니다. (${n1} - ${n2} = ${ans})`;
    options = shuffleAndPick([answer, `${ans+10}`, `${ans-10}`, `${ans+100}`], answer, 4);

  } else if (cat === '1-5') { // 세 자리 수 뺄셈 (받아내림 1회)
    let c1 = rand(0,4), c2 = rand(c1+1, 9);
    let b1 = rand(3,8), b2 = rand(1, b1-1);
    let a1 = rand(3,9), a2 = rand(1, a1-1);
    let n1 = a1*100 + b1*10 + c1;
    let n2 = a2*100 + b2*10 + c2;
    let ans = n1 - n2;
    q = `${n1} - ${n2} = ?`;
    answer = `${ans}`;
    exp = `윗자리에서 10을 받아내려 빼줍니다. (${n1} - ${n2} = ${ans})`;
    options = shuffleAndPick([answer, `${ans+10}`, `${ans-10}`, `${ans+100}`], answer, 4);

  } else if (cat === '1-6') { // 세 자리 수 뺄셈 (받아내림 2회)
    let c1 = rand(0,4), c2 = rand(c1+1, 9);
    let b1 = rand(0,3), b2 = rand(b1+1, 8);
    let a1 = rand(4,9), a2 = rand(1, a1-2);
    let n1 = a1*100 + b1*10 + c1;
    let n2 = a2*100 + b2*10 + c2;
    let ans = n1 - n2;
    q = `${n1} - ${n2} = ?`;
    answer = `${ans}`;
    exp = `일의 자리와 십의 자리에서 연속으로 받아내려 계산합니다. (${n1} - ${n2} = ${ans})`;
    options = shuffleAndPick([answer, `${ans+10}`, `${ans-10}`, `${ans+100}`], answer, 4);

  } 
  // ----- 2단원 : 곱셈 -----
  else if (cat === '2-1') { // (몇십)×(몇)
    let n1 = rand(1, 9) * 10;
    let n2 = rand(2, 9);
    let ans = n1 * n2;
    q = `${n1} × ${n2} = ?`;
    answer = `${ans}`;
    exp = `${n1/10} × ${n2} = ${ans/10}에 0을 붙여 ${ans}가 됩니다.`;
    options = shuffleAndPick([answer, `${ans+10}`, `${ans-10}`, `${(n1/10)*n2}`], answer, 4);

  } else if (cat === '2-2') { // (몇십몇)×(몇) - 올림 없음
    let a = rand(1, 4), b = rand(1, 4);
    let c = rand(2, 2);
    if(a*c < 10 && b*c < 10) { } else { a=1; b=2; c=3; }
    let n1 = a*10 + b;
    let ans = n1 * c;
    q = `${n1} × ${c} = ?`;
    answer = `${ans}`;
    exp = `각 자릿수에 ${c}를 곱해 올림 없이 계산합니다. (${n1} × ${c} = ${ans})`;
    options = shuffleAndPick([answer, `${ans+10}`, `${ans-2}`, `${ans+2}`], answer, 4);

  } else if (cat === '2-3') { // (몇십몇)×(몇) - 십의 자리 올림
    let a = rand(4, 9), b = rand(1, 4), c = rand(2, 3);
    while (b*c >= 10 || a*c < 10) { a = rand(4, 9); b = rand(1, 3); c = rand(2, 4); }
    let n1 = a*10 + b;
    let ans = n1 * c;
    q = `${n1} × ${c} = ?`;
    answer = `${ans}`;
    exp = `십의 자리 곱하기 결과가 10 이상으로 백의 자리로 올려줍니다. (${n1} × ${c} = ${ans})`;
    options = shuffleAndPick([answer, `${ans+10}`, `${ans-10}`, `${ans+20}`], answer, 4);

  } else if (cat === '2-4') { // (몇십몇)×(몇) - 일의 자리 올림
    let a = rand(1, 3), b = rand(5, 9), c = rand(2, 3);
    while (b*c < 10 || (a*c + Math.floor(b*c/10)) >= 10) { a = rand(1, 2); b = rand(5, 9); c = rand(2, 4); }
    let n1 = a*10 + b;
    let ans = n1 * c;
    q = `${n1} × ${c} = ?`;
    answer = `${ans}`;
    exp = `일의 자리 곱에서 발생한 올림을 십의 자리 곱에 더해줍니다. (${n1} × ${c} = ${ans})`;
    options = shuffleAndPick([answer, `${ans+10}`, `${ans-10}`, `${ans-2}`], answer, 4);

  } else if (cat === '2-5') { // (몇십몇)×(몇) - 올림 2번
    let a = rand(4, 9), b = rand(5, 9), c = rand(3, 9);
    let n1 = a*10 + b;
    let ans = n1 * c;
    q = `${n1} × ${c} = ?`;
    answer = `${ans}`;
    exp = `일의 자리와 십의 자리에서 모두 올림이 발생합니다. (${n1} × ${c} = ${ans})`;
    options = shuffleAndPick([answer, `${ans+10}`, `${ans-10}`, `${ans+100}`], answer, 4);

  }
  // ----- 3단원 : 시간 -----
  else if (cat === '3-1') { // 시간의 뺄셈
    let h1 = rand(3, 8), m1 = rand(10, 25);
    let h2 = rand(1, h1-1), m2 = rand(30, 50);
    let ansH = (h1 - 1) - h2;
    let ansM = (m1 + 60) - m2;
    q = `${h1}시간 ${m1}분 - ${h2}시간 ${m2}분 = ?`;
    if (ansH === 0) answer = `${ansM}분`;
    else answer = `${ansH}시간 ${ansM}분`;
    exp = `분이 모자라므로 1시간을 60분으로 받아내려 계산합니다.`;
    
    let opt1 = answer;
    let opt2 = `${ansH+1}시간 ${ansM}분`;
    let opt3 = (ansH === 0) ? `${ansM+10}분` : `${ansH}시간 ${(ansM+10)%60}분`;
    let opt4 = `${h1-h2}시간 ${Math.abs(m1-m2)}분`;
    options = shuffleAndPick([opt1, opt2, opt3, opt4], answer, 4);

  } else if (cat === '3-2') { // 시간의 덧셈
    let h1 = rand(1, 4), m1 = rand(30, 50);
    let h2 = rand(1, 3), m2 = rand(30, 50);
    let totalM = m1 + m2;
    let ansH = h1 + h2 + Math.floor(totalM / 60);
    let ansM = totalM % 60;
    q = `${h1}시간 ${m1}분 + ${h2}시간 ${m2}분 = ?`;
    if(ansM === 0) answer = `${ansH}시간`;
    else answer = `${ansH}시간 ${ansM}분`;
    exp = `60분이 넘으면 1시간으로 받아올려 줍니다. (${m1}+${m2}=${totalM}분 ➔ ${Math.floor(totalM/60)}시간 ${ansM}분)`;
    
    let opt1 = answer;
    let opt2 = `${h1+h2}시간 ${totalM}분`;
    let opt3 = `${ansH}시간 ${ansM+10}분`;
    let opt4 = `${ansH+1}시간 ${ansM}분`;
    options = shuffleAndPick([opt1, opt2, opt3, opt4], answer, 4);

  }
  // ----- 4단원 : 분수와 소수 -----
  else if (cat === '4-1') { // 그림을 분수로 나타내기
    let den = rand(3, 8);
    let num = rand(1, den - 1);
    
    let svgWidth = 240, svgHeight = 40;
    let pieceWidth = svgWidth / den;
    let rects = "";
    for(let i=0; i<den; i++) {
      let fill = (i < num) ? "#3b82f6" : "#ffffff";
      rects += `<rect x="${i*pieceWidth}" y="0" width="${pieceWidth}" height="${svgHeight}" fill="${fill}" stroke="#1e293b" stroke-width="2"/>`;
    }
    svg = `<svg width="${svgWidth}" height="${svgHeight}" viewBox="0 0 ${svgWidth} ${svgHeight}">${rects}</svg>`;
    
    q = `색칠한 부분을 분수로 나타내면?`;
    answer = makeFracHTML(num, den);
    exp = `전체를 똑같이 ${den}으로 나눈 것 중 ${num}이므로 ${makeFracHTML(num, den)}입니다.`;
    
    options = [
      answer,
      makeFracHTML(den - num, den),
      makeFracHTML(num, den + 1 > 8 ? den - 1 : den + 1),
      makeFracHTML(1, den)
    ];
    options = shuffleAndPick(options, answer, 4);

  } else if (cat === '4-2') { // 분수의 크기 비교
    let mode = rand(1, 2);
    if(mode === 1) { // 분모가 같은 분수
      let den = rand(4, 9);
      let n1 = rand(1, den-1), n2 = rand(1, den-1);
      while(n1 === n2) n2 = rand(1, den-1);
      let bigNum = Math.max(n1, n2);
      q = `다음 중 더 큰 분수는 어느 것일까요? (${makeFracHTML(n1, den)}, ${makeFracHTML(n2, den)})`;
      answer = makeFracHTML(bigNum, den);
      exp = `분모가 같을 때는 분수가 더 큰 쪽이 더 큽니다.`;
      options = shuffleAndPick([makeFracHTML(n1, den), makeFracHTML(n2, den)], answer, 2);
    } else { // 단위분수
      let d1 = rand(2, 6), d2 = rand(7, 9);
      q = `다음 중 더 큰 분수는 어느 것일까요? (${makeFracHTML(1, d1)}, ${makeFracHTML(1, d2)})`;
      answer = makeFracHTML(1, d1);
      exp = `분자가 1인 단위분수는 분모가 작을수록 더 큰 수가 됩니다.`;
      options = shuffleAndPick([makeFracHTML(1, d1), makeFracHTML(1, d2)], answer, 2);
    }

  } else if (cat === '4-3') { // 소수의 크기 비교
    let n1 = (rand(1, 9) / 10).toFixed(1);
    let n2 = (rand(1, 9) / 10).toFixed(1);
    while(n1 === n2) n2 = (rand(1, 9) / 10).toFixed(1);
    
    let isBig = rand(0, 1) === 1;
    let target = isBig ? Math.max(parseFloat(n1), parseFloat(n2)).toFixed(1) : Math.min(parseFloat(n1), parseFloat(n2)).toFixed(1);
    
    q = `두 소수 (${n1}, ${n2}) 중 더 <b>${isBig ? '큰' : '작은'}</b> 소수는?`;
    answer = `${target}`;
    exp = `소수 첫째 자리의 숫자를 비교하여 크기를 판단합니다.`;
    options = shuffleAndPick([`${n1}`, `${n2}`], answer, 2);
  }

  return { q, answer, opts: options, exp, svg };
}

function generateQuestion(cat) {
  if (cat === '1-all') return generateSingleQuestion(`1-${rand(1,6)}`);
  if (cat === '2-all') return generateSingleQuestion(`2-${rand(1,5)}`);
  if (cat === '3-all') return generateSingleQuestion(`3-${rand(1,2)}`);
  if (cat === '4-all') return generateSingleQuestion(`4-${rand(1,3)}`);
  return generateSingleQuestion(cat);
}

function loadNextQuestion() {
  if (correctCount >= totalQuestions) {
    endTime = new Date().getTime();
    let totalTime = ((endTime - startTime) / 1000).toFixed(1);
    let now = new Date().toLocaleString('ko-KR');
    
    document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
    document.getElementById("result-screen").classList.remove("hidden");
    
    document.getElementById("result-text").innerHTML = `
      <b>[${currentSubTitle}]</b><br><br>
      👤 <b>이름:</b> ${userName}<br>
      ⏱️ <b>걸린 시간:</b> <span style="color:#10b981; font-size:1.2rem; font-weight:bold;">${totalTime}초</span><br>
      📅 <b>완료 시각:</b> <span style="font-size:0.85rem; color:#64748b;">${now}</span>
    `;
    return;
  }
  
  document.getElementById("progress").innerText = correctCount;
  document.getElementById("progress-fill").style.width = (correctCount / totalQuestions * 100) + "%";
  
  qData = generateQuestion(selectedCategory);
  
  document.getElementById("svg-box").innerHTML = qData.svg || "";
  document.getElementById("question-text").innerHTML = qData.q;
  
  let optsBox = document.getElementById("options-box");
  optsBox.innerHTML = "";
  optsBox.style.gridTemplateColumns = (qData.opts.length === 2) ? "1fr 1fr" : "1fr 1fr";
  
  qData.opts.forEach(val => {
    let btn = document.createElement("button");
    btn.innerHTML = val;
    btn.onclick = () => checkAnswer(val);
    optsBox.appendChild(btn);
  });
}

function checkAnswer(selected) {
  if (selected === qData.answer) {
    correctCount++;
    loadNextQuestion();
  } else {
    document.getElementById("explanation-text").innerHTML = `
      <div><b>💡 정답:</b> ${qData.answer}</div>
      <div style="margin-top:6px;">${qData.exp}</div>
    `;
    let nextBtn = document.getElementById("modal-next-btn");
    nextBtn.disabled = false;
    nextBtn.innerText = "다음";
    document.getElementById("explanation-modal").classList.remove("hidden");
  }
}

function triggerModalCountdown() {
  let nextBtn = document.getElementById("modal-next-btn");
  if(nextBtn.disabled) return;
  nextBtn.disabled = true;
  
  let count = 3;
  nextBtn.innerText = `3초 후 다음 문제... (${count})`;
  
  let timer = setInterval(() => {
    count--;
    if(count > 0) {
      nextBtn.innerText = `3초 후 다음 문제... (${count})`;
    } else {
      clearInterval(timer);
      document.getElementById("explanation-modal").classList.add("hidden");
      loadNextQuestion();
    }
  }, 1000);
}
</script>
